# Generated from src/threefold/web/openapi.json, which is the document the deployment serves.
# Edit that file and run scripts/generate_openapi_yaml.py; do not edit this one by hand.
openapi: 3.1.0
info:
  title: Threefold Governance Sidecar API
  version: 1.0.0
  description: >-
    Autonomous coding agent governance sidecar and cost circuit-breaker. Deterministic code decides: it scans arguments
    for credential shapes, refuses writes that cross a Clean Architecture boundary, halts a session that repeats
    a cycle of tool calls, and caps projected spend. Amazon Bedrock (Claude Haiku 4.5) only phrases the verdict,
    and every response says which of the two produced the sentence it carries, in explanation_source. Certificates
    are SHA-256 fingerprints over a session's verdicts: they detect corruption, not an adversary, because nothing
    signs them.
  contact:
    name: Threefold
    url: https://raa131f9dj.execute-api.eu-west-1.amazonaws.com/prod/
servers:
- url: https://raa131f9dj.execute-api.eu-west-1.amazonaws.com/prod
  description: Live deployment, eu-west-1. Answers an anonymous request with no key.
- url: http://127.0.0.1:8001
  description: Local runtime, started by make run.
paths:
  /adapter/universal-tool-call:
    post:
      summary: Universal Multi-Agent Tool Adapter
      description: Evaluates tools in native OpenAI function_call or Anthropic tool_use JSON formats.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: >-
            Normalized evaluation result, with the same verdict fields POST /evaluate-tool-call returns under evaluation
        '400':
          description: >-
            The body is not a JSON object, or the tool call is not one this adapter reads: an Anthropic tool_use
            object, an OpenAI function_call, a tool_calls array of exactly one call, or {tool_name, arguments} whose
            arguments are an object or the JSON text of one. A body naming the call in two of those shapes at once
            is refused too: one verdict cannot answer for both, and the shape not read would be approved unread
  /api/sessions:
    get:
      summary: List Governed Sessions
      description: >-
        Returns the sessions the service has evaluated, newest first. This is the contract the sessions console
        renders. The listing scans the session table, which is honest at this scale only; a deployment with real
        traffic wants a secondary index on a recency key. The calls field counts retained history, which the store
        caps at the last fifty per session.
      parameters:
      - name: limit
        in: query
        required: false
        description: Maximum rows to return. Clamped to between 1 and 200.
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 200
      responses:
        '200':
          description: Session summaries, with the persistence mode of the most recent write
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  persistence:
                    type: string
                    enum:
                    - dynamodb
                    - memory
                    description: >-
                      Where the most recent session write landed. It does not describe where the rows below were
                      read from.
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        session_id:
                          type: string
                        developer_id:
                          type: string
                        project_name:
                          type: string
                        total_cost_usd:
                          type: number
                        total_input_tokens:
                          type: integer
                        total_output_tokens:
                          type: integer
                        is_tripped:
                          type: boolean
                        trip_reason:
                          type: string
                        is_terminated:
                          type: boolean
                        created_at:
                          type: string
                          format: date-time
                        calls:
                          type: integer
                          description: Retained history length, capped at 50.
  /evaluate-tool-call:
    post:
      summary: Evaluate Agent Tool Call
      description: >-
        Evaluates one tool invocation against the credential scanner, the layering rules, the loop detector and
        the budget. A hook sends this before the tool call runs, and the pages send it too; agent, origin and explain
        say which of the two a row came from, so a visitor pressing a button on the dashboard is never counted as
        an agent being governed. The loop gate treats the two differently. For origin hook, a detected loop refuses
        the repeating call with BLOCKED_LOOP_DETECTED and records it, but never halts the session: session_tripped
        stays false and the next different call is judged as usual, so a governed developer is not locked out of
        their own session. A session whose id starts sim-, and a call from a page, keep the terminal halt: the third
        identical call is refused, the session is frozen and every later call is refused with BLOCKED_CIRCUIT_BREAKER
        until an operator resumes it. Repeats of read-only or polling calls (git status, log, diff or show, ls,
        cat, pwd, gh run view, list or watch, sleep, and reads) are recorded as observations and are never refused
        as a loop.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - session_id
              - tool_name
              properties:
                session_id:
                  type: string
                  description: >-
                    What the loop detector counts against. A caller that shares one id between users shares a halt
                    with them.
                project_name:
                  type: string
                  description: >-
                    Required. A name that does not match the stack's AllowedProjectPattern (default ^Acme-[A-Za-z0-9-]{1,40}$),
                    or no name at all, is stored, counted and used as the metric dimension as 'unlabelled', and
                    the response says so in warnings.
                developer:
                  type: string
                  description: >-
                    Either 'anonymous' or a 12-character hex hash computed on the caller's machine, never a user
                    name. developer_id is still accepted from older callers. Pages that list decisions show any
                    developer value only as a short hash.
                developer_id:
                  type: string
                  description: What this field was called before the v2 request. New callers send developer.
                tool_name:
                  type: string
                action_type:
                  type: string
                  enum:
                  - FILE_READ
                  - FILE_WRITE
                  - COMMAND_EXEC
                arguments:
                  type: object
                  description: >-
                    The call's own arguments. For a write these carry the text being written, which is what the
                    layering rules read.
                agent:
                  type: string
                  enum:
                  - claude-code
                  - codex
                  - antigravity
                  - pre-commit
                  - ci
                  - page
                  description: >-
                    Which caller sent the call: claude-code, codex, antigravity, pre-commit, ci or page. Stored
                    on the ledger row. Any other value is recorded as 'unknown' and reported in warnings.
                origin:
                  type: string
                  enum:
                  - hook
                  - page
                  - ci
                  description: >-
                    hook, page or ci. Stored on the ledger row. Any other value is recorded as 'unknown' and reported
                    in warnings.
                explain:
                  type: boolean
                  description: >-
                    Whether a refusal gets a sentence from Amazon Bedrock. Default true, which is what the pages
                    send. Hooks send false, and the verdict then carries the deterministic reason with explanation_source
                    'deterministic' and no model call. An approved call is never sent to the model.
                dry_run:
                  type: boolean
                  description: >-
                    Default false. When true the call is evaluated and recorded as observed: it is never refused
                    and never trips the session, and the rule that would have refused it is returned under observations.
                    A repository installed in observe mode sends every call with dry_run true.
                projected_input_tokens:
                  type: integer
                projected_output_tokens:
                  type: integer
                budget_usd:
                  type: number
                hook_mode:
                  type: string
                  enum:
                  - observe
                  - managed
                  - enforce
                  description: >-
                    The mode the hook on the developer's machine runs in: observe sends every call as a dry run,
                    managed leaves the decision to the project's stage on the server, enforce never sends a dry
                    run. Stored on the ledger row. Absent, or any other value, is recorded as 'unknown'; another
                    value is reported in warnings.
      responses:
        '200':
          description: Evaluation verdict, the invariants it was measured against, and the explanation with its
            source
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: APPROVED, or the name of what refused it.
                  reason:
                    type: string
                  risk_level:
                    type: string
                  rule_evaluations:
                    type: object
                    description: Each invariant and whether this call satisfied it.
                  session_tripped:
                    type: boolean
                    description: >-
                      Whether the session is now halted, so that every later call is refused until an operator resumes
                      it. A loop refused for origin hook leaves it false; a loop in a sim- or page session sets
                      it.
                  current_session_cost_usd:
                    type: number
                  proof_hash:
                    type: string
                  explanation_source:
                    type: string
                    description: >-
                      What produced bedrock_explanation: bedrock when the model answered, deterministic_fallback
                      when it did not.
                  bedrock_explanation:
                    type:
                    - string
                    - 'null'
                  persistence:
                    type: string
                    enum:
                    - dynamodb
                    - memory
                  observations:
                    type: array
                    items:
                      type: string
                    description: What a rule in observe mode would have refused. The call still ran.
                  observed_rules:
                    type: array
                    items:
                      type: string
                  warnings:
                    type: array
                    items:
                      type: string
                    description: >-
                      What the service changed or ignored on the way in, for example a project name stored as 'unlabelled'.
                      Always present, empty when nothing was changed.
                  project_stage:
                    type: string
                    enum:
                    - observe
                    - enforce
                    description: >-
                      The calling project's stage on this stack: its own when configured, otherwise the stack's
                      DEFAULT_HOOK_STAGE (default observe). The stage decides only calls with origin hook or ci
                      that are not dry runs: observe judges them exactly as a dry run is judged, recorded and never
                      refused; enforce runs the gates, except that a refusal under one of the project's observe_rules
                      is recorded as an observation. Page and scenario calls always enforce. Reported on every verdict,
                      whether or not it applied.
                  suggested_fix:
                    type:
                    - object
                    - 'null'
                    description: >-
                      What to send instead of the refused call, worked out by deterministic code, never by a model.
                      Set on a refusal, and on an observation only when the request sent explain true and its origin
                      is neither hook nor ci, since a hook in Observe prints nothing; null otherwise. Also null
                      when the call carries more text, counted over every string in its arguments, than its kind
                      of fix can be worked out for within the gate's own 10 ms budget, by the verdict's rule key:
                      24,000 characters for advice (loop, budget, halted_session, protected_path, destructive_command)
                      and 3,000 for a credential, whether or not the call runs a command; 6,000 for a layering refusal
                      of a call that runs no command; and 1,500 for a layering refusal of a call that runs one,
                      and for an unreadable_write. A layering fix is rewritten and checked only while every write
                      in the call, taken together, comes to 1,500 characters or less; past that, up to its ceiling,
                      it is advice in words with validated false and no writes, naming the imports to move (the
                      first four, then how many more), the rules that forbid them and the first candidate layer
                      where no rule forbids them. Past its ceiling the refusal goes out as it always did, without
                      one. A starting point, never applied automatically. Never stored: the ledger row keeps only
                      suggested_fix_kind and suggested_fix_validated. A hook appends the summary, and nothing else,
                      to its deny reason.
                    required:
                    - kind
                    - summary
                    - steps
                    - validated
                    - checks
                    properties:
                      kind:
                        type: string
                        enum:
                        - layering
                        - credential
                        - protected_path
                        - unreadable_write
                        - loop
                        - budget
                        - halted_session
                        - destructive_command
                        description: Which gate's refusal this fixes.
                      summary:
                        type: string
                        maxLength: 200
                        description: 'One line, safe to append to a hook''s deny reason: no newline, no control
                          character, no credential.'
                      steps:
                        type: array
                        items:
                          type: string
                        description: What to do, in order, in words.
                      writes:
                        type: array
                        description: >-
                          What to send instead of what the call sent: a Write's whole content, an Edit's new text
                          beside the same old_string, or text a shell command added, marked partial. Left out when
                          the files come to more than 8 KB; they were still checked in full. Empty for advice in
                          words.
                        items:
                          type: object
                          required:
                          - path
                          - content
                          properties:
                            path:
                              type: string
                            content:
                              type: string
                            old_string:
                              type: string
                              description: 'Present for an Edit retry: replace this with content.'
                            partial:
                              type: boolean
                              description: Text a shell command added to a file whose other lines were never seen;
                                apply it with an Edit.
                            new_file:
                              type: boolean
                              description: >-
                                A port or an adapter proposed as a new file; if it already exists, add to it rather
                                than overwrite it.
                      validated:
                        type: boolean
                        description: >-
                          True only when every proposed write was run through the same gates, with the rules that
                          judged the call, and passed. Never true for advice in words or for a loop. It does not
                          claim the rewrite behaves as the original did.
                      checks:
                        type: array
                        description: Every check that was run on a proposed write.
                        items:
                          type: object
                          properties:
                            gate:
                              type: string
                              enum:
                              - layering
                              - credential
                              - boundary
                              - syntax
                              - route
                            path:
                              type: string
                            passed:
                              type: boolean
        '400':
          description: >-
            The body is not a JSON object, or a number in it cannot be used: a negative token count, or a budget
            of zero or less.
  /issue-certificate:
    post:
      summary: Issue Governance Certificate
      description: >-
        Issues a SHA-256 fingerprinted Governance Certificate over a session's verdicts. The fingerprint is unkeyed:
        it detects corruption and casual edits, not an adversary, because nothing signs it and nothing in CI requires
        one before a merge.
      responses:
        '200':
          description: The certificate, returned rather than archived
        '400':
          description: >-
            The body is not a JSON object, or there is nothing to certify: an empty list of evaluations, or a session
            this service has no record of governing
  /policy/config:
    get:
      summary: Get Dynamic Policy Configuration
      description: Retrieves runtime governance thresholds (max spend, loop thresholds, blocked patterns).
      responses:
        '200':
          description: Current policy configuration
    post:
      summary: Update Dynamic Policy Configuration
      description: >-
        Adjusts the runtime governance thresholds. This write is durable: it lands in DynamoDB and every container
        that starts afterwards adopts it, so it requires the operator key even on a deployment where reads are anonymous.
        The handler rebuilds the whole policy from the body, so send all four fields; blocked_patterns is not accepted
        and is discarded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                max_single_call_usd:
                  type: number
                max_session_budget_usd:
                  type: number
                monomorphic_repetition_threshold:
                  type: integer
      responses:
        '200':
          description: Updated policy configuration
        '401':
          description: No key was presented, and this deployment requires one for policy writes
        '403':
          description: The key was rejected, or this deployment has configured no policy-write key at all
      security:
      - OperatorApiKey: []
  /readyz:
    get:
      summary: Deep Subsystem Readiness Probe
      description: >-
        Verifies downstream dependencies (DynamoDB, Bedrock, S3, Webhook Dispatcher). HEAD answers with the same
        status and no body, so an uptime check need not download the breakdown on every probe.
      responses:
        '200':
          description: Subsystems health breakdown
  /sessions/{session_id}:
    get:
      summary: Inspect Session State
      description: >-
        Retrieves cumulative spend, history length and circuit breaker status for a session that has been recorded.
        Reading never creates a session.
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Current session statistics
        '404':
          description: No session with this id has been recorded (urn:threefold:error:session-not-found)
  /sessions/{session_id}/terminate:
    post:
      summary: Enterprise Emergency Kill Switch
      description: Immediately freezes and terminates an autonomous agent session, revoking further tool executions.
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        description: >-
          Replays the first response for a repeated key instead of freezing twice. Allowed through CORS, so a page
          served from another origin may send it.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operator_name:
                  type: string
                reason:
                  type: string
      responses:
        '200':
          description: Session frozen confirmation
  /sessions/{session_id}/resume:
    post:
      summary: Resume a halted session
      description: >-
        Lifts the halt on a recorded session, so its next call is evaluated again instead of refused with BLOCKED_CIRCUIT_BREAKER.
        Requires the operator key even where reads are anonymous, because it undoes a halt the gate or an operator
        made. The body names who cleared the halt and why, and both are kept on the session as the record of it.
        History and spend are kept too, so a session past its budget, or repeating the call that halted it, halts
        again. Never creates a session.
      security:
      - OperatorApiKey: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        description: Replays the first response for a repeated key instead of resuming twice.
        schema:
          type: string
      requestBody:
        required: true
        description: >-
          The record of who cleared the halt and why. Both are required, because that record is the reason this
          route needs the operator key; a value over its length is refused rather than cut, since a shortened record
          says something its author did not.
        content:
          application/json:
            schema:
              type: object
              required:
              - operator_name
              - reason
              properties:
                operator_name:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: Who cleared the halt.
                reason:
                  type: string
                  minLength: 1
                  maxLength: 240
                  description: Why it was cleared.
            example:
              operator_name: Acme platform on-call
              reason: Budget raised for the Acme-Billing migration; resuming the same session.
      responses:
        '200':
          description: The session is no longer halted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - SESSION_RESUMED
                  session_id:
                    type: string
                  operator:
                    type: string
                    description: The operator_name that was sent.
                  reason:
                    type: string
                  resumed_at:
                    type: string
                    format: date-time
                  previous_trip_reason:
                    type: string
                    description: The halt this resume cleared, as the session recorded it; empty when it recorded
                      none.
                  is_tripped:
                    type: boolean
                  total_cost_usd:
                    type: number
                  budget_usd:
                    type: number
                  note:
                    type: string
        '400':
          description: >-
            operator_name or reason is missing, is not text, or is longer than its limit (urn:threefold:error:bad-request,
            naming the field); nothing was changed
        '401':
          description: No key was presented
        '403':
          description: The key was rejected, or this deployment has configured no operator key at all
        '404':
          description: >-
            No session with this id has been recorded (urn:threefold:error:session-not-found), so there is nothing
            to resume and nothing is created
        '409':
          description: >-
            The session is running, not halted (urn:threefold:error:session-not-halted), so there is nothing to
            clear and nothing was changed
  /simulate-loop:
    post:
      summary: Simulate Thrashing Loop
      description: >-
        Simulates 3 consecutive identical file edits in a sim- session to demonstrate circuit-breaker tripping.
        The demo keeps the terminal halt: call 3 is refused and the session is frozen. A hook's loop refuses the
        repeating call without halting the session; see /evaluate-tool-call.
      responses:
        '200':
          description: Loop interception verdict with Bedrock explanation
  /simulate-secret:
    post:
      summary: Simulate Secret Leakage
      description: Simulates an agent attempting to export AWS access keys, tripping the Secret Scanner.
      responses:
        '200':
          description: Security block verdict
  /hooks/threefold_hook.py:
    get:
      summary: The hook itself
      description: >-
        The hook itself: one standard-library script that puts Threefold in front of Claude Code, Codex or Antigravity,
        served as readable text rather than as a download a reader cannot inspect, and answered without a key even
        where reads are private, because a product nobody can obtain is a demo. The agent is detected from the shape
        of its input, or named with --agent. The same file is served at /hooks/claude_code_hook.py and /claude_code_hook.py,
        so an install copied earlier keeps working.
      responses:
        '200':
          description: The script, as text/plain
          content:
            text/plain:
              schema:
                type: string
  /status:
    get:
      summary: Health & Active Policy Rules
      description: >-
        Returns health status, active governance rules, and model configuration. HEAD answers with the same status
        and no body, for a monitor that wants the code and not the body.
      responses:
        '200':
          description: Operational status and active rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: Threefold
                  status:
                    type: string
                    example: HEALTHY
  /api/insights:
    get:
      summary: What the gates decided, by project, kind of problem and rule
      description: >-
        Aggregates the decision ledger over a window for the Enforcement Console. A refusal and an observation are
        counted apart: an observation is a call that ran and that a rule in observe mode would have refused. Rows
        keep the target of a call and never its arguments.
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
      responses:
        '200':
          description: >-
            totals (decisions, refused, approved, refusal_rate, observed, projects, developers), by_category, by_rule,
            by_observed_rule, by_project, by_developer, by_day, recent_refusals, recent_observations, coverage
  /rules:
    get:
      summary: The layering rules in force
      description: >-
        Open, because a reader has to be able to see the architecture they are held to. With project, answers that
        project's own rules when it has saved some. When it has not, is_default is true and the rules shown are
        the shared default its calls are judged against until it saves its own. Without project, answers the shared
        set, as before.
      parameters:
      - name: project
        in: query
        required: false
        description: The project whose rules to read, an Acme-style alias such as Acme-Billing.
        schema:
          type: string
          example: Acme-Billing
      responses:
        '200':
          description: rules, count, is_default, languages_read, extensions_read, refresh_seconds, unsupported
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules:
                    type: array
                    items:
                      $ref: '#/components/schemas/LayeringRule'
                  count:
                    type: integer
                  is_default:
                    type: boolean
                    description: >-
                      Asked with project: true when that project has saved no rules of its own and the rules shown
                      are the shared default, false when they are its own. Asked without: true when the shared set
                      is still the one Threefold ships with.
                  languages_read:
                    type: array
                    items:
                      type: string
                  unsupported:
                    type: string
                  extensions_read:
                    type: array
                    items:
                      type: string
                  refresh_seconds:
                    type: number
                    description: How long a server may go on using the rules it holds before reading them again.
    post:
      summary: Replace the layering rules of one project, or the shared set
      description: >-
        Replaces a whole set and stores it. With project, the set is that project's own, stored under CONFIG#rules#<project>,
        and the gate applies it to calls whose project_name is that project; every other project keeps the shared
        set. Without project, the shared set is replaced, as before. The save is all or nothing: if any rule cannot
        be used, nothing is saved and the 400 names each rule and why. The server that takes the save applies the
        rules from its next call; every other server reads them again within refresh_seconds. Requires the operator
        key even where reads are anonymous, because the rules are the gate rather than a setting on it.
      security:
      - OperatorApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - rules
              properties:
                project:
                  type: string
                  example: Acme-Billing
                  description: >-
                    The project these rules are for, an Acme-style alias such as Acme-Billing. Leave it out to replace
                    the shared set every project without rules of its own uses.
                rules:
                  type: array
                  items:
                    $ref: '#/components/schemas/LayeringRule'
                  maxItems: 50
      responses:
        '200':
          description: RULES_UPDATED, with the rules as stored and refresh_seconds
        '400':
          description: At least one rule cannot be used; nothing was saved (urn:threefold:error:unusable-rule)
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  problems:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type:
                          - integer
                          - 'null'
                          description: Position of the rule in what was sent.
                        id:
                          type:
                          - string
                          - 'null'
                        reason:
                          type: string
        '401':
          description: No key was presented
        '403':
          description: The key was rejected, or this deployment has configured no operator key at all
  /rules/explain:
    post:
      summary: Try the rules on a file without saving or recording anything
      description: >-
        Reads the imports in the content and judges them against the layering rules in force, or against a draft
        sent in the body. With project, the rules in force are the ones the gate would apply to that project: its
        own when it has saved some, the shared set otherwise. Only the layering rules are tried: a write this answers
        ALLOW for can still be refused for a credential, a protected path, a loop or its cost. No verdict is issued,
        no ledger row is written and a draft is never put in force, which is why it is open.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - path
              properties:
                path:
                  type: string
                  example: src/main/java/com/acme/billing/domain/Order.java
                  description: >-
                    At most 400 characters, on one line, with no spaces: the same test the gate applies before it
                    judges a path.
                content:
                  type: string
                  example: import javax.persistence.Entity;
                project:
                  type: string
                  example: Acme-Billing
                  description: >-
                    Try the rules that project's calls are judged against. A draft sent in rules is tried instead,
                    whatever project says.
                rules:
                  type: array
                  items:
                    $ref: '#/components/schemas/LayeringRule'
                  description: A draft to try instead of the rules in force.
      responses:
        '200':
          description: >-
            language, imports, rules_considered (draft | in force), applicable_rules, verdict (REFUSE | OBSERVE
            | ALLOW), violations, note, scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  verdict:
                    type: string
                    enum:
                    - REFUSE
                    - OBSERVE
                    - ALLOW
                  language:
                    type:
                    - string
                    - 'null'
                  imports:
                    type: array
                    items:
                      type: string
                  applicable_rules:
                    type: array
                    items:
                      type: string
                  violations:
                    type: array
                    items:
                      type: object
                  note:
                    type: string
                  scope:
                    type: string
                    const: layering rules only
        '400':
          description: >-
            The body is not a JSON object, has no path, has a path the gate would never judge (urn:threefold:error:nothing-to-explain),
            or carries a draft with a rule that cannot be used (urn:threefold:error:unusable-rule, with problems)
  /rules/draft:
    post:
      summary: Draft one layering rule from a sentence with Amazon Bedrock, try it, and save nothing
      description: >-
        Asks the model for one rule in the format POST /rules accepts, checks it with the validation a save uses,
        as one more member of the rules in force for project (so an id already in force is caught), sets its mode
        to observe whatever the model proposed, and tries it on the examples sent and on up to two files built from
        the rule itself, with the verdicts POST /rules/explain gives. A drafted rule watches, so a file it would
        refuse reads OBSERVE. Nothing is saved, no verdict is issued and no ledger row is written: putting the draft
        in force is a separate POST /rules, which needs the operator. When the model cannot be reached the answer
        is 503 with no draft; Threefold never stands in for the model with a rule of its own. Each draft is at most
        two model calls, and only the description and the paths, expectations and imports of the examples reach
        the model, never the rest of an example's file. Open where PublicReads is true, as POST /rules/explain is;
        on a stack deployed with PublicReads=false it needs the operator key or a sign-in session.
      security:
      - {}
      - OperatorApiKey: []
      - SignInSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - description
              properties:
                description:
                  type: string
                  minLength: 1
                  maxLength: 600
                  example: Billing domain classes may not reach persistence; java.util is fine.
                  description: >-
                    The boundary in words. Refused with 400 when empty or longer than 600 characters, rather than
                    cut to length and drafted from half a sentence.
                project:
                  type: string
                  maxLength: 120
                  example: Acme-Billing
                  description: >-
                    The project the rule is for. The draft is checked against that project's rules in force, its
                    own or the shared set. A name outside AllowedProjectPattern is drafted with a warning, as POST
                    /rules/explain answers it. Leave it out to draft for the shared set.
                examples:
                  type: array
                  maxItems: 5
                  description: Files the rule should refuse or allow, tried against the draft.
                  items:
                    type: object
                    required:
                    - path
                    - expect
                    properties:
                      path:
                        type: string
                        maxLength: 400
                        example: src/main/java/com/acme/billing/domain/Order.java
                        description: >-
                          At most 400 characters, on one line, with no spaces: the same test the gate applies before
                          it judges a path.
                      content:
                        type: string
                        maxLength: 4000
                        example: import javax.persistence.Entity;
                        description: What an agent might write there. Its imports are what a rule reads.
                      expect:
                        type: string
                        enum:
                        - refuse
                        - allow
      responses:
        '200':
          description: >-
            rule (mode always observe), validation, tried, source (bedrock), model, attempts, project, saved (always
            false), notes, unsupported, warnings
          content:
            application/json:
              schema:
                type: object
                properties:
                  rule:
                    $ref: '#/components/schemas/LayeringRule'
                  validation:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        const: true
                      errors:
                        type: array
                        items:
                          type: string
                  tried:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        content_preview:
                          type: string
                          description: At most 160 characters of the content, credentials redacted.
                        expected:
                          type: string
                          enum:
                          - refuse
                          - allow
                        verdict:
                          type: string
                          enum:
                          - REFUSE
                          - OBSERVE
                          - ALLOW
                        matched:
                          type: boolean
                          description: 'Whether the verdict is what was expected: REFUSE or OBSERVE for refuse,
                            ALLOW for allow.'
                        origin:
                          type: string
                          enum:
                          - caller
                          - generated
                          description: An example sent in the request, or one built from the rule itself.
                        note:
                          type: string
                  source:
                    type: string
                    const: bedrock
                  model:
                    type:
                    - string
                    - 'null'
                  attempts:
                    type: integer
                    minimum: 1
                    maximum: 2
                    description: 'Model calls made: one, or two when the first answer was repaired.'
                  project:
                    type:
                    - string
                    - 'null'
                  saved:
                    type: boolean
                    const: false
                  notes:
                    type: array
                    items:
                      type: string
                  unsupported:
                    type: string
                  warnings:
                    type: array
                    items:
                      type: string
        '400':
          description: >-
            The body is not a JSON object, the description is missing or longer than 600 characters, more than 5
            examples were sent, an example's path is not one the gate would judge, its content is longer than 4000
            characters or its expect is neither refuse nor allow, project is not a string, or the rules in force
            already number 50. No model call is made. invalid_params names the field.
        '401':
          description: PublicReads is false and no key or sign-in session was presented
        '403':
          description: >-
            PublicReads is false and the key or sign-in session was rejected, or this deployment has configured
            no operator key at all (urn:threefold:error:reads-private)
        '422':
          description: >-
            The model read the description as a boundary a layering rule cannot express, so nothing was drafted
            (urn:threefold:error:not-a-layering-rule)
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  source:
                    type: string
                    const: bedrock
                  attempts:
                    type: integer
                  saved:
                    type: boolean
                    const: false
                  unsupported:
                    type: string
        '502':
          description: >-
            The model answered, but no answer was a usable rule, even after one repair; nothing was drafted (urn:threefold:error:undraftable-rule).
            problems says why, in the words POST /rules would use.
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  problems:
                    type: array
                    items:
                      type: string
                  rejected_draft:
                    description: The last answer, when it was small enough to echo, or null.
                  validation:
                    type: object
                    properties:
                      ok:
                        type: boolean
                        const: false
                      errors:
                        type: array
                        items:
                          type: string
                  source:
                    type: string
                    const: bedrock
                  model:
                    type:
                    - string
                    - 'null'
                  attempts:
                    type: integer
                  saved:
                    type: boolean
                    const: false
        '503':
          description: >-
            Amazon Bedrock could not be asked or did not answer, or this container has made its drafting calls;
            no rule was drafted and nothing was saved (urn:threefold:error:model-unavailable). There is no fallback
            draft.
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  source:
                    type: string
                    const: unavailable
                  model:
                    type:
                    - string
                    - 'null'
                  saved:
                    type: boolean
                    const: false
  /api/auth/links:
    post:
      summary: Mint a single-use sign-in link
      description: >-
        Called by the CLI with the operator key, so the operator signs in to the dashboard without pasting the key
        into a page. Answers a code that works once, for 120 seconds, and a link to this stack's own dashboard that
        carries it: <base>dashboard.html#/signin?code=<code>&next=<next>, with next URL-encoded. Only the SHA-256
        of the code is stored. Requires the key itself: a sign-in session is refused here with 403 (urn:threefold:error:session-not-enough),
        so a session can never renew itself.
      security:
      - OperatorApiKey: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                next:
                  type: string
                  maxLength: 256
                  default: /overview
                  example: /projects/Acme-Billing
                  description: >-
                    Where the dashboard goes after signing in: a path inside it, starting with / and carrying no
                    scheme, host, //, backslash, fragment or whitespace.
            example:
              next: /projects/Acme-Billing
      responses:
        '200':
          description: 'The code and the link, answered with Cache-Control: no-store'
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - expires_in
                - url
                properties:
                  code:
                    type: string
                  expires_in:
                    type: integer
                    enum:
                    - 120
                  url:
                    type: string
                    format: uri
        '400':
          description: next is not a path inside the dashboard (urn:threefold:error:bad-request)
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  status:
                    type: integer
        '401':
          description: No key was presented
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  status:
                    type: integer
        '403':
          description: >-
            The key was rejected, a sign-in session was presented instead of the key (urn:threefold:error:session-not-enough),
            or this deployment has configured no operator key at all (urn:threefold:error:sign-in-disabled)
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  status:
                    type: integer
  /api/auth/sessions:
    post:
      summary: Trade a sign-in code for a session
      description: >-
        Open: the code is the credential. Spends the code, which then cannot be used again, and answers a session
        token that counts as the operator for 43200 seconds, presented as Authorization: Bearer <token>. Only the
        SHA-256 of the token is stored. A session is honoured only while the key that minted its code is still configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
                  description: The code from the sign-in link.
      responses:
        '200':
          description: 'The session, answered with Cache-Control: no-store'
          content:
            application/json:
              schema:
                type: object
                required:
                - token
                - expires_at
                - ttl_seconds
                properties:
                  token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  ttl_seconds:
                    type: integer
                    enum:
                    - 43200
        '400':
          description: No code was sent (urn:threefold:error:bad-request)
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  status:
                    type: integer
        '401':
          description: The code was used, has expired or was never issued (urn:threefold:error:sign-in-code-invalid)
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  status:
                    type: integer
        '429':
          description: The rate limit every route shares
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  status:
                    type: integer
    delete:
      summary: Sign out
      description: >-
        Revokes the session presented as Authorization: Bearer <token>. The container that takes the request refuses
        the token at once; every other container within 60 seconds. Open, and idempotent: with no session, or one
        already gone, it still answers 200. The body is GET /api/auth/whoami as it stands after the sign-out.
      security:
      - SignInSession: []
      - {}
      responses:
        '200':
          description: Signed out; who the caller is now
          content:
            application/json:
              schema:
                type: object
                required:
                - authenticated
                - via
                - expires_at
                - reads_public
                - sandbox_writes
                properties:
                  authenticated:
                    type: boolean
                    description: True when the request carries a configured operator key or a live sign-in session.
                  via:
                    type:
                    - string
                    - 'null'
                    enum:
                    - key
                    - session
                    - null
                  expires_at:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: When the session lapses, in UTC. null for a key, which does not lapse, and for
                      a stranger.
                  reads_public:
                    type: boolean
                    description: Whether this stack answers its reads without the operator (PublicReads).
                  sandbox_writes:
                    type: boolean
                    description: >-
                      Whether anyone may create a sandbox project and write to it here, which is exactly when reads_public
                      is true.
        '503':
          description: >-
            The store did not confirm the sign-out, so other containers may honour the session until it lapses (urn:threefold:error:sign-out-incomplete)
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  status:
                    type: integer
  /api/auth/whoami:
    get:
      summary: Who the caller is, and what this stack leaves open
      description: >-
        Open on every stack: it answers about what the request carries. The pages read it to decide whether to offer
        sign-in, the sandbox or the operator's controls.
      security:
      - SignInSession: []
      - OperatorApiKey: []
      - {}
      responses:
        '200':
          description: 'Answered with Cache-Control: no-store'
          content:
            application/json:
              schema:
                type: object
                required:
                - authenticated
                - via
                - expires_at
                - reads_public
                - sandbox_writes
                properties:
                  authenticated:
                    type: boolean
                    description: True when the request carries a configured operator key or a live sign-in session.
                  via:
                    type:
                    - string
                    - 'null'
                    enum:
                    - key
                    - session
                    - null
                  expires_at:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: When the session lapses, in UTC. null for a key, which does not lapse, and for
                      a stranger.
                  reads_public:
                    type: boolean
                    description: Whether this stack answers its reads without the operator (PublicReads).
                  sandbox_writes:
                    type: boolean
                    description: >-
                      Whether anyone may create a sandbox project and write to it here, which is exactly when reads_public
                      is true.
  /install.py:
    get:
      summary: The installer, pointed at this stack
      description: >-
        threefold_install.py with this stack's own address, https://<host>/<stage>/, written in where the source
        says __THREEFOLD_ENDPOINT__, so the one command a team runs installs from and reports to the stack that
        served it. Served as readable text, answered without a key on every stack. The X-Threefold-SHA256 header
        is the SHA-256 of exactly the bytes in the body, and equals installer_sha256 in /dist/manifest.json fetched
        from the same host.
      responses:
        '200':
          description: The script, as text/plain
          headers:
            X-Threefold-SHA256:
              description: SHA-256 of the body, in hex
              schema:
                type: string
                pattern: ^[0-9a-f]{64}$
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: The request's host cannot be written into a script (urn:threefold:error:unknown-host)
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  status:
                    type: integer
        '500':
          description: The installer is missing from this deployment (urn:threefold:error:script-missing)
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  status:
                    type: integer
  /dist/threefold-bundle.zip:
    get:
      summary: The hook, the CLI and the domain package, as one zip
      description: >-
        What the installer installs: bin/threefold_hook.py, bin/threefold_cli.py, lib/threefold/__init__.py and
        lib/threefold/domain/*.py, byte for byte as deployed. Built once per server with fixed timestamps, so every
        download from it is the same bytes and bundle_sha256 in the manifest stays true. Answered without a key
        on every stack.
      responses:
        '200':
          description: The zip
          headers:
            X-Threefold-SHA256:
              description: SHA-256 of the zip, in hex
              schema:
                type: string
                pattern: ^[0-9a-f]{64}$
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '500':
          description: A file the bundle carries is missing from this deployment (urn:threefold:error:script-missing)
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  status:
                    type: integer
  /dist/manifest.json:
    get:
      summary: The hashes of the bundle and the installer
      description: >-
        Lets the installer, or a reader, check what was downloaded: each file in the bundle with its SHA-256 and
        size, the SHA-256 of the zip, and the SHA-256 of /install.py as this host serves it. Answered without a
        key on every stack.
      responses:
        '200':
          description: The manifest
          content:
            application/json:
              schema:
                type: object
                required:
                - files
                - bundle_sha256
                - installer_sha256
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      required:
                      - path
                      - sha256
                      - bytes
                      properties:
                        path:
                          type: string
                          example: bin/threefold_hook.py
                        sha256:
                          type: string
                          pattern: ^[0-9a-f]{64}$
                        bytes:
                          type: integer
                  bundle_sha256:
                    type: string
                    pattern: ^[0-9a-f]{64}$
                  installer_sha256:
                    type: string
                    pattern: ^[0-9a-f]{64}$
        '400':
          description: The request's host cannot be written into a script (urn:threefold:error:unknown-host)
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  status:
                    type: integer
        '500':
          description: A file the manifest describes is missing from this deployment (urn:threefold:error:script-missing)
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  status:
                    type: integer
  /api/overview:
    get:
      summary: Tiles, a daily series and totals by agent, origin, rule and project, from the rollups
      description: >-
        Read from one rollup item per project and day, added to as every decision is recorded, so the numbers are
        exact however busy the ledger is. approved, observed and refused are disjoint: observed is a call that ran
        and that a rule would have refused, and a day's calls are the sum of the three. needs_review is the observed
        calls nobody has labelled; false_alarms the calls labelled false alarm. self_correction is the one figure
        not read from the rollups: it is read from the ledger, a bounded number of rows, and says whether it covered
        the whole window.
      parameters:
      - name: days
        in: query
        required: false
        description: The window, 1 to 30 days ending today.
        schema:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
      - name: project
        in: query
        required: false
        description: Only this project.
        schema:
          type: string
      responses:
        '200':
          description: >-
            window_days, generated_at, source (always rollups), totals, series, by_agent, by_origin, by_rule, by_project,
            stages, self_correction (read from the ledger, not the rollups)
          content:
            application/json:
              schema:
                type: object
                properties:
                  window_days:
                    type: integer
                  generated_at:
                    type: string
                  source:
                    type: string
                    enum:
                    - rollups
                  totals:
                    type: object
                    properties:
                      calls:
                        type: integer
                      approved:
                        type: integer
                      refused:
                        type: integer
                      would_refuse:
                        type: integer
                      needs_review:
                        type: integer
                      false_alarms:
                        type: integer
                      projects:
                        type: integer
                      agents:
                        type: integer
                  series:
                    type: array
                    items:
                      type: object
                      properties:
                        day:
                          type: string
                        approved:
                          type: integer
                        observed:
                          type: integer
                        refused:
                          type: integer
                  by_agent:
                    type: array
                    items:
                      type: object
                      properties:
                        agent:
                          type: string
                        calls:
                          type: integer
                  by_origin:
                    type: array
                    items:
                      type: object
                      properties:
                        origin:
                          type: string
                        calls:
                          type: integer
                  by_rule:
                    type: array
                    items:
                      type: object
                      properties:
                        rule_key:
                          type: string
                        refused:
                          type: integer
                        would_refuse:
                          type: integer
                  by_project:
                    type: array
                    items:
                      type: object
                      properties:
                        project:
                          type: string
                        stage:
                          type: string
                        configured:
                          type: boolean
                        calls:
                          type: integer
                        refused:
                          type: integer
                        would_refuse:
                          type: integer
                        needs_review:
                          type: integer
                        last_seen:
                          type:
                          - string
                          - 'null'
                  stages:
                    type: object
                    properties:
                      observe:
                        type: integer
                      enforce:
                        type: integer
                  self_correction:
                    $ref: '#/components/schemas/SelfCorrection'
  /api/decisions:
    get:
      summary: The ledger's rows, newest first, filtered and a page at a time
      description: >-
        Reads the ledger day by day from today backwards. Each request reads a bounded number of ledger pages, so
        a filter that matches little may return fewer than limit rows with a next_cursor: follow it until it is
        null. The cursor is opaque and resumes exactly after the last row returned.
      parameters:
      - name: days
        in: query
        required: false
        description: The window, 1 to 30 days ending today.
        schema:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
      - name: project
        in: query
        required: false
        description: Only this project.
        schema:
          type: string
      - name: rule
        in: query
        required: false
        description: Only rows with this rule_key.
        schema:
          type: string
      - name: kind
        in: query
        required: false
        description: refused, observed (ran, and a rule would have refused it), approved (nothing flagged it), or
          all.
        schema:
          type: string
          enum:
          - all
          - refused
          - observed
          - approved
          default: all
      - name: review
        in: query
        required: false
        description: Only rows with this review, or with none.
        schema:
          type: string
          enum:
          - any
          - unreviewed
          - correct
          - false_alarm
          default: any
      - name: agent
        in: query
        required: false
        description: Only this agent.
        schema:
          type: string
      - name: session
        in: query
        required: false
        description: Only this session.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: At most this many rows.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        required: false
        description: The next_cursor of the previous page.
        schema:
          type: string
      responses:
        '200':
          description: items and next_cursor
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DecisionRow'
                  next_cursor:
                    type:
                    - string
                    - 'null'
        '400':
          description: A kind, review or cursor this service does not know.
  /api/decision:
    get:
      summary: One decision, with its session and the layering rule it was keyed by
      parameters:
      - name: timestamp
        in: query
        required: true
        schema:
          type: string
      - name: verdict_id
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: decision, session (or null) and rule (the layering rule's definition, or null for a gate)
          content:
            application/json:
              schema:
                type: object
                properties:
                  decision:
                    $ref: '#/components/schemas/DecisionRow'
                  session:
                    type:
                    - object
                    - 'null'
                    properties:
                      session_id:
                        type: string
                      calls:
                        type: integer
                      cost_usd:
                        type: number
                      is_tripped:
                        type: boolean
                  rule:
                    oneOf:
                    - $ref: '#/components/schemas/LayeringRule'
                    - type: 'null'
        '400':
          description: timestamp or verdict_id is missing.
        '404':
          description: No such decision is recorded.
  /api/projects:
    get:
      summary: Every configured project, and every project seen in the last 7 days
      description: Counts are over the last 7 days, from the rollups. A sandbox is listed until it expires.
      responses:
        '200':
          description: projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      type: object
                      properties:
                        project:
                          type: string
                        stage:
                          type: string
                          enum:
                          - observe
                          - enforce
                        configured:
                          type: boolean
                          description: False for a project seen in the rollups with no configuration; its stage
                            is then the stack default.
                        observe_rules:
                          type: array
                          items:
                            type: string
                        created_at:
                          type:
                          - string
                          - 'null'
                        promoted_at:
                          type:
                          - string
                          - 'null'
                        last_seen:
                          type:
                          - string
                          - 'null'
                        calls:
                          type: integer
                        refused:
                          type: integer
                        would_refuse:
                          type: integer
                        needs_review:
                          type: integer
                        agents:
                          type: array
                          items:
                            type: string
                        hook_modes:
                          type: array
                          items:
                            type: string
  /api/projects/{name}:
    get:
      summary: 'One project: its configuration and whether each of its rules is ready to enforce'
      description: >-
        A project's rules are its layering rules in force plus the gates LOOP, PROTECTED_PATH, UNREADABLE_WRITE
        and BUDGET. Read from the rollups over the window.
      parameters:
      - name: name
        in: path
        required: true
        description: The project, an Acme-style alias such as Acme-Billing.
        schema:
          type: string
          example: Acme-Billing
      - name: days
        in: query
        required: false
        description: The window, 1 to 30 days ending today.
        schema:
          type: integer
          minimum: 1
          maximum: 30
          default: 14
      responses:
        '200':
          description: project, config (null when never configured) and readiness
          content:
            application/json:
              schema:
                type: object
                properties:
                  project:
                    type: string
                  config:
                    oneOf:
                    - $ref: '#/components/schemas/ProjectConfig'
                    - type: 'null'
                  readiness:
                    type: object
                    properties:
                      summary:
                        type: object
                        properties:
                          stage:
                            type: string
                          days_observed:
                            type: integer
                          calls_observed:
                            type: integer
                          would_have_refused:
                            type: integer
                          reviewed:
                            type: integer
                          false_alarms:
                            type: integer
                          rules_ready:
                            type: integer
                          rules_quiet:
                            type: integer
                          rules_noisy:
                            type: integer
                          rules_needing_review:
                            type: integer
                          false_alarm_rate:
                            type: number
                          self_correction:
                            $ref: '#/components/schemas/SelfCorrection'
                      rules:
                        type: array
                        items:
                          type: object
                          properties:
                            rule_key:
                              type: string
                            kind:
                              type: string
                              enum:
                              - layering
                              - gate
                            mode_now:
                              type: string
                              enum:
                              - observe
                              - enforce
                            would_refuse:
                              type: integer
                              description: Calls it flagged that ran, in the window.
                            refused:
                              type: integer
                              description: Calls it refused while already enforcing, in the window.
                            correct:
                              type: integer
                            false_alarms:
                              type: integer
                            unreviewed:
                              type: integer
                            last_seen:
                              type:
                              - string
                              - 'null'
                            state:
                              type: string
                              enum:
                              - quiet
                              - needs_review
                              - ready
                              - noisy
                              description: >-
                                noisy if any false alarm, else needs_review if any unreviewed, else ready if it
                                flagged anything, else quiet.
                            recommendation:
                              type: string
        '404':
          description: The name is neither an alias this stack admits nor 'unlabelled'.
    post:
      summary: Create or change a project's configuration
      parameters:
      - name: name
        in: path
        required: true
        description: The project, an Acme-style alias such as Acme-Billing.
        schema:
          type: string
          example: Acme-Billing
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                stage:
                  type: string
                  enum:
                  - observe
                  - enforce
                observe_rules:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: The project and its stored configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  project:
                    type: string
                  config:
                    $ref: '#/components/schemas/ProjectConfig'
        '400':
          description: >-
            The name does not match AllowedProjectPattern, a stage is neither observe nor enforce, or a rule key
            is not one of the project's rules (its layering rules in force plus LOOP, PROTECTED_PATH, UNREADABLE_WRITE
            and BUDGET).
  /api/projects/{name}/promote:
    post:
      summary: Enforce the rules picked; every other rule of the project keeps observing
      description: Sets stage enforce and observe_rules to the project's rules minus enforce, and adds a history
        entry.
      parameters:
      - name: name
        in: path
        required: true
        description: The project, an Acme-style alias such as Acme-Billing.
        schema:
          type: string
          example: Acme-Billing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - enforce
              properties:
                enforce:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: The project and its stored configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  project:
                    type: string
                  config:
                    $ref: '#/components/schemas/ProjectConfig'
        '400':
          description: >-
            The name does not match AllowedProjectPattern, a stage is neither observe nor enforce, or a rule key
            is not one of the project's rules (its layering rules in force plus LOOP, PROTECTED_PATH, UNREADABLE_WRITE
            and BUDGET).
  /api/projects/{name}/demote:
    post:
      summary: Back to observe, in one step
      description: >-
        Sets stage observe and adds a history entry. observe_rules is kept, so a promotion undone is one step to
        redo.
      parameters:
      - name: name
        in: path
        required: true
        description: The project, an Acme-style alias such as Acme-Billing.
        schema:
          type: string
          example: Acme-Billing
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: The project and its stored configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  project:
                    type: string
                  config:
                    $ref: '#/components/schemas/ProjectConfig'
        '400':
          description: >-
            The name does not match AllowedProjectPattern, a stage is neither observe nor enforce, or a rule key
            is not one of the project's rules (its layering rules in force plus LOOP, PROTECTED_PATH, UNREADABLE_WRITE
            and BUDGET).
  /api/projects/{name}/reviews:
    post:
      summary: 'Label what a rule flagged: correct, false alarm, or clear'
      description: >-
        The label is stored on the ledger row itself, conditionally on the row belonging to this project, with reviewed_at,
        review_note and reviewed_by, which is 8 hex of a hash of the credential presented (X-API-Key or Authorization:
        Bearer), never the credential, or anonymous. A row of another project, a row nothing flagged, or an item
        that cannot be read is skipped with its reason.
      parameters:
      - name: name
        in: path
        required: true
        description: The project, an Acme-style alias such as Acme-Billing.
        schema:
          type: string
          example: Acme-Billing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - items
              properties:
                items:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required:
                    - timestamp
                    - verdict_id
                    - label
                    properties:
                      timestamp:
                        type: string
                      verdict_id:
                        type: string
                      label:
                        type: string
                        enum:
                        - correct
                        - false_alarm
                        - clear
                      note:
                        type: string
                        maxLength: 200
      responses:
        '200':
          description: updated and skipped
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
                  skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        verdict_id:
                          type: string
                        reason:
                          type: string
                          description: other-project, not-found, nothing-flagged, or why the item could not be read.
        '400':
          description: items is not a list of 1 to 100 reviews, or the name does not match AllowedProjectPattern.
  /api/sandbox:
    post:
      summary: A throwaway project, seeded, for trying the review and promotion walk
      description: >-
        Creates Acme-Sandbox-<8 hex> in observe with sandbox true and a 24 hour expiry, and sends a dozen synthetic
        hook calls from claude-code, codex and antigravity through the real evaluator. Several would be refused
        under more than one rule, and one of them is a false alarm: a test module under tests/domain/ that the domain
        rule's path pattern also covers.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: project, calls_seeded and the dashboard url
          content:
            application/json:
              schema:
                type: object
                properties:
                  project:
                    type: string
                  calls_seeded:
                    type: integer
                  url:
                    type: string
                    example: dashboard.html#/projects/Acme-Sandbox-0a1b2c3d
        '409':
          description: This stack's AllowedProjectPattern does not admit sandbox names.
  /proof.json:
    get:
      summary: 'The proof page''s snapshot: the benchmark and the owner''s own use, anonymised'
      description: >-
        Written by scripts/build_proof.py and deployed with the function, so it changes only when a new snapshot
        is committed. benchmark carries what benchmark/report.py computes from the result rows it names, per condition,
        with the headline sentence exactly as computed and pilot true when every real-agent row was a pilot run.
        private carries aggregate totals read from the owner's private stack with the operator key: never a project
        name, a path, a target or a developer. Each section names its source and when its snapshot was taken, and
        a section that was not measured is absent, never zero.
      responses:
        '200':
          description: schema, generated_at, generated_by, benchmark (when measured), private (when measured), method
          content:
            application/json:
              schema:
                type: object
                required:
                - schema
                - generated_at
                properties:
                  schema:
                    type: integer
                  generated_at:
                    type: string
                  generated_by:
                    type: string
                  benchmark:
                    type: object
                    description: >-
                      source, snapshot_at, pilot, headline, models, agent_versions, dates, run_ids, tasks, rows,
                      real_rows, valid_rows, scripted_rows, conditions (per condition: n, not_measured, violation,
                      completion, self_correction, overhead) and evidence.
                  private:
                    type: object
                    description: >-
                      source, snapshot_at, window_days, days_observed, calls_governed, would_refuse, refused, reviewed,
                      false_alarms, false_alarm_rate, projects, agents, stages and self_correction: numbers only.
                      false_alarms and false_alarm_rate are null when calls were refused in the window, because
                      the overview counts false alarms on refused calls as well and reviewed calls on would-refuse
                      calls only.
                  method:
                    type: array
                    description: The evidence files, by their path in the repository.
                    items:
                      type: object
                      properties:
                        label:
                          type: string
                        path:
                          type: string
        '404':
          description: >-
            No snapshot is deployed here; the proof page reads this as not measured yet (urn:threefold:error:proof-not-found)
          content:
            application/problem+json:
              schema:
                type: object
        '500':
          description: The deployed snapshot is not a JSON object (urn:threefold:error:proof-unreadable)
          content:
            application/problem+json:
              schema:
                type: object
components:
  securitySchemes:
    OperatorApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        Operator key for writes that outlive the request. Reading needs none. A deployment that has configured no
        key refuses policy writes outright with 403.
    SignInSession:
      type: http
      scheme: bearer
      description: >-
        A sign-in session token from POST /api/auth/sessions, sent as Authorization: Bearer <token>. It counts as
        the operator everywhere the operator key does, except for minting sign-in links, and lapses after 43200
        seconds or when it is signed out.
  schemas:
    LayeringRule:
      type: object
      required:
      - id
      - when_path_matches
      - forbid_imports
      properties:
        id:
          type: string
          description: What a refusal quotes. Must be unique within the set.
        description:
          type: string
          description: The sentence a developer reads when stopped.
        mode:
          type: string
          enum:
          - enforce
          - observe
          default: enforce
          description: >-
            enforce refuses the write. observe lets it run and records that the rule would have refused it. A missing
            or null mode means enforce. Any other value makes the whole save fail with 400, naming the rule.
        when_path_matches:
          type: array
          items:
            type: string
          description: >-
            A list of globs over the file path, at most 40, each at most 300 characters. ** crosses folders, * and
            ? stay inside one. Case is ignored.
        forbid_imports:
          type: array
          items:
            type: string
          description: >-
            A list of at most 40 patterns. A dotted or slashed module prefix forbids it and everything beneath it,
            never a sibling that only shares its first letters. Globs are allowed.
        allow_imports:
          type: array
          items:
            type: string
          description: >-
            Exceptions, a list of at most 40. When an allow and a forbid both match, the more specific pattern decides.
    DecisionRow:
      type: object
      description: >-
        One ledger row, as a public page may show it: the project is an Acme-style alias or 'unlabelled' and the
        developer an 8-hex hash. Never the call's arguments or file content.
      properties:
        verdict_id:
          type: string
        timestamp:
          type: string
          format: date-time
        session_id:
          type: string
        developer_id:
          type: string
          description: An 8-hex hash, never the value sent.
        project_name:
          type: string
        tool_name:
          type: string
        action_type:
          type: string
        agent:
          type: string
        origin:
          type: string
        dry_run:
          type: boolean
        status:
          type: string
        rule:
          type: string
          description: The invariant that failed, or NONE. Kept as it always was.
        rule_key:
          type: string
          description: >-
            What decided the call, and what readiness, reviews and observe_rules group by: the id of the layering
            rule that decided, or LOOP, PROTECTED_PATH (which also covers destructive commands), UNREADABLE_WRITE,
            CREDENTIAL, BUDGET, HALTED_SESSION, or NONE when nothing flagged the call. Set on observations as well
            as refusals. Rows written before it existed are given one on the way out.
        stage:
          type: string
          enum:
          - observe
          - enforce
          description: The stage the call was judged under. A dry run is observe, a page call is enforce.
        hook_mode:
          type: string
          description: observe, managed, enforce or unknown, as the hook sent it.
        target:
          type: string
        reason:
          type: string
        observed_rules:
          type: array
          items:
            type: string
        observed_reason:
          type: string
        observed_target:
          type: string
        cost_usd:
          type: number
        review:
          type:
          - string
          - 'null'
          enum:
          - correct
          - false_alarm
          - null
        reviewed_at:
          type:
          - string
          - 'null'
        review_note:
          type:
          - string
          - 'null'
        category:
          type: string
        category_label:
          type: string
        suggested_fix_kind:
          type: string
          enum:
          - layering
          - credential
          - protected_path
          - unreadable_write
          - loop
          - budget
          - halted_session
          - destructive_command
          description: >-
            The kind of suggested fix the call's response carried. Present only on a row whose call was sent one;
            the fix itself is never stored.
        suggested_fix_validated:
          type: boolean
          description: >-
            Whether every proposed write of that fix passed the same gates. Present only beside suggested_fix_kind.
    ProjectConfig:
      type: object
      description: A project's stage configuration, stored at PK=CONFIG#project#<name>.
      properties:
        stage:
          type: string
          enum:
          - observe
          - enforce
        observe_rules:
          type: array
          items:
            type: string
          description: Rule keys whose refusals are recorded as observations while the project enforces.
        created_at:
          type:
          - string
          - 'null'
        updated_at:
          type:
          - string
          - 'null'
        promoted_at:
          type:
          - string
          - 'null'
        demoted_at:
          type:
          - string
          - 'null'
        sandbox:
          type: boolean
          description: True for a sandbox, which is gone 24 hours after it was made.
        history:
          type: array
          description: The last 20 promotions and demotions.
          items:
            type: object
            properties:
              at:
                type: string
              action:
                type: string
                enum:
                - promote
                - demote
              by:
                type: string
                description: 8 hex of a hash of the credential used, or anonymous.
              enforce:
                type: array
                items:
                  type: string
              observe:
                type: array
                items:
                  type: string
    SelfCorrection:
      type: object
      description: >-
        How often an agent that was refused went on to do the same thing acceptably, read from the ledger rather
        than the rollups because it is a question about the order of calls in a session. A refusal of a hook or
        ci call self-corrected when one of the next ten calls of the same session aimed at the same file and was
        approved or only observed. Commands are left out on both sides: the ledger keeps only the program a command
        ran, never the rest of its line, so it cannot say which file a refused command was aimed at; a refused command
        is not considered, and a later command is never taken as a correction, though it counts as one of the calls
        in between. Calls recorded at the same instant are not ordered against each other: one that shares the refusal's
        instant is never its correction, and a tie can only lengthen a distance. Page calls are never considered,
        and nothing is refused in the observe stage, so a project there considers no refusal. The read is bounded:
        complete is false when it stopped before the window's oldest day, and the figure then covers the newest
        rows_read rows only.
      required:
      - refusals_considered
      - self_corrected
      - rate
      - median_calls_to_correct
      - rows_read
      - complete
      properties:
        refusals_considered:
          type: integer
          description: >-
            Refusals of hook and ci calls in the window aimed at a file the ledger recorded. A refusal with no recorded
            target, or of a command, whose recorded target is only the program it ran, cannot be matched with anything
            and is left out.
        self_corrected:
          type: integer
          description: >-
            Of those, the refusals followed within the next ten calls of the same session by a call to the same
            file that was not refused and was not a command.
        rate:
          type:
          - number
          - 'null'
          description: >-
            self_corrected / refusals_considered, rounded to four places; null when no refusal was considered, because
            none of none is not a rate.
        median_calls_to_correct:
          type:
          - number
          - 'null'
          description: >-
            The median number of calls from a refusal to the call that corrected it, 1 being the very next call;
            null when nothing was corrected. Calls that share an instant with the correction are all counted as
            having come before it.
        rows_read:
          type: integer
          description: Ledger rows read to compute the figure, of every project, before the project filter.
        complete:
          type: boolean
          description: >-
            False when the bounded read stopped before it covered the whole window, or when the ledger could not
            be read: a store that cannot page the ledger, or a query that failed. A failed read is never reported
            as an empty window.

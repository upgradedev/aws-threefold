openapi: 3.1.0
info:
  title: Threefold Governance Sidecar API
  version: 1.0.0
  description: >
    Autonomous coding agent governance sidecar and cost circuit-breaker. Deterministic
    code decides: it scans arguments for credential shapes, refuses writes that cross a
    Clean Architecture boundary, halts a session that repeats a cycle of tool calls, and
    caps projected spend. Amazon Bedrock (Claude Haiku 4.5) only phrases the verdict, and
    every response says which of the two produced the sentence it carries, in
    explanation_source. Certificates are SHA-256 fingerprints over a session's verdicts:
    they detect corruption, not an adversary, because nothing signs them.
  contact:
    name: Threefold Team
    url: https://github.com/upgradedev/threefold-aws
servers:
  - url: https://raa131f9dj.execute-api.eu-west-1.amazonaws.com/prod
    description: Live deployment, eu-west-1. Answers an anonymous request with no key.
  - url: http://127.0.0.1:8001
    description: Local runtime, started by make run.

paths:
  /status:
    get:
      summary: Health & Active Policy Rules
      description: Returns health status, active governance rules, and model configuration.
      responses:
        '200':
          description: Operational status and active rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: Threefold
                  status:
                    type: string
                    example: HEALTHY

  /evaluate-tool-call:
    post:
      summary: Evaluate Agent Tool Call
      description: Evaluates an individual tool invocation against secret scanners, loops, boundary guards, and budget.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - session_id
                - tool_name
              properties:
                session_id:
                  type: string
                developer_id:
                  type: string
                project_name:
                  type: string
                tool_name:
                  type: string
                action_type:
                  type: string
                  enum: [FILE_READ, FILE_WRITE, COMMAND_EXEC]
                arguments:
                  type: object
                projected_input_tokens:
                  type: integer
                projected_output_tokens:
                  type: integer
                budget_usd:
                  type: number
      responses:
        '200':
          description: Evaluation verdict, risk assessment, and Bedrock explanation

  /adapter/universal-tool-call:
    post:
      summary: Universal Multi-Agent Tool Adapter
      description: Evaluates tools in native OpenAI function_call or Anthropic tool_use JSON formats.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Normalized evaluation result

  /simulate-loop:
    post:
      summary: Simulate Thrashing Loop
      description: Simulates 3 consecutive identical file edits to demonstrate circuit-breaker tripping.
      responses:
        '200':
          description: Loop interception verdict with Bedrock explanation

  /simulate-secret:
    post:
      summary: Simulate Secret Leakage
      description: Simulates an agent attempting to export AWS access keys, tripping the Secret Scanner.
      responses:
        '200':
          description: Security block verdict

  /issue-certificate:
    post:
      summary: Issue Cryptographic Governance Certificate
      description: Issues a signed SHA-256 Governance Certificate for CI/CD PR gating.
      responses:
        '200':
          description: Cryptographic certificate

  /api/sessions:
    get:
      summary: List Governed Sessions
      description: >-
        Returns the sessions the service has evaluated, newest first. This is the
        contract the sessions console renders. The listing scans the session table,
        which is honest at this scale only; a deployment with real traffic wants a
        secondary index on a recency key. The calls field counts retained history,
        which the store caps at the last fifty per session.
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum rows to return. Clamped to between 1 and 200.
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Session summaries, with the persistence mode of the most recent write
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  persistence:
                    type: string
                    enum: [dynamodb, memory]
                    description: >-
                      Where the most recent session write landed. It does not describe
                      where the rows below were read from.
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        session_id:
                          type: string
                        developer_id:
                          type: string
                        project_name:
                          type: string
                        total_cost_usd:
                          type: number
                        total_input_tokens:
                          type: integer
                        total_output_tokens:
                          type: integer
                        is_tripped:
                          type: boolean
                        trip_reason:
                          type: string
                        is_terminated:
                          type: boolean
                        created_at:
                          type: string
                          format: date-time
                        calls:
                          type: integer
                          description: Retained history length, capped at 50.

  /sessions/{session_id}:
    get:
      summary: Inspect Session State
      description: Retrieves cumulative spend, token history, and circuit breaker status for an active session.
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current session statistics

  /sessions/{session_id}/terminate:
    post:
      summary: Enterprise Emergency Kill Switch
      description: Immediately freezes and terminates an autonomous agent session, revoking further tool executions.
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          description: >-
            Replays the first response for a repeated key instead of freezing twice.
            Allowed through CORS, so a page served from another origin may send it.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operator_name:
                  type: string
                reason:
                  type: string
      responses:
        '200':
          description: Session frozen confirmation

  /readyz:
    get:
      summary: Deep Subsystem Readiness Probe
      description: Verifies downstream dependencies (DynamoDB, Bedrock, S3, Webhook Dispatcher).
      responses:
        '200':
          description: Subsystems health breakdown

  /policy/config:
    get:
      summary: Get Dynamic Policy Configuration
      description: Retrieves runtime governance thresholds (max spend, loop thresholds, blocked patterns).
      responses:
        '200':
          description: Current policy configuration
    post:
      summary: Update Dynamic Policy Configuration
      description: >-
        Adjusts the runtime governance thresholds. This write is durable: it lands in
        DynamoDB and every container that starts afterwards adopts it, so it requires
        the operator key even on a deployment where reads are anonymous. The handler
        rebuilds the whole policy from the body, so send all four fields;
        blocked_patterns is not accepted and is discarded.
      security:
        - OperatorApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                max_single_call_usd:
                  type: number
                max_session_budget_usd:
                  type: number
                monomorphic_repetition_threshold:
                  type: integer
      responses:
        '200':
          description: Updated policy configuration

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer

components:
  securitySchemes:
    OperatorApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        Operator key for writes that outlive the request. Reading needs none. A
        deployment that has configured no key refuses policy writes outright with 403.

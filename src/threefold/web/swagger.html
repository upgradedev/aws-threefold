<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Threefold API — OpenAPI 3.1 Documentation</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    body { margin: 0; padding: 0; background: #0b0f19; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .header-bar { background: #111827; padding: 1rem 2rem; border-bottom: 1px solid #1f2937; display: flex; justify-content: space-between; align-items: center; }
    .header-title { font-size: 1.25rem; font-weight: 700; color: #a855f7; }
    .back-link { color: #94a3b8; text-decoration: none; font-size: 0.875rem; padding: 0.5rem 1rem; border: 1px solid #374151; border-radius: 0.375rem; }
    .back-link:hover { color: #fff; background: #1f2937; }
    .swagger-ui .topbar { display: none; }
    .swagger-ui { filter: invert(88%) hue-rotate(180deg); }
    .swagger-ui .highlight-code { filter: invert(100%) hue-rotate(180deg); }
  </style>
</head>
<body>
  <div class="header-bar">
    <div class="header-title">🔍 Threefold Governance Sidecar API — OpenAPI 3.1</div>
    <div>
      <a href="index.html" class="back-link">← Back to Dashboard</a>
    </div>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    // The server rewrites __THREEFOLD_BASE_PATH__ to the API Gateway stage prefix
    // when it serves this page. The spec used to be requested from the origin with
    // no prefix, which misses /prod and answers 404. Opened straight from disk the
    // token survives, and the spec is the file sitting next to this one.
    const SERVED_BASE_PATH = "__THREEFOLD_BASE_PATH__";
    const SPEC_URL = SERVED_BASE_PATH.indexOf("THREEFOLD_BASE_PATH") !== -1
      ? "openapi.json"
      : location.origin + SERVED_BASE_PATH + "/openapi.json";

    window.onload = function() {
      const specUrl = SPEC_URL;

      SwaggerUIBundle({
        url: specUrl,
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIBundle.SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout"
      });
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Threefold — Operations</title>
  <meta name="description" content="Threefold operations dashboard: what every coding agent's tool call was judged, by project, rule and agent, with the two-stage rollout from Observe to Enforce." />
  <!-- Tailwind CSS via CDN, pinned to an exact version: an unpinned major is a
       script that can change under a page that did not change, and it runs on the
       same origin as the sign-in this browser may hold. No integrity hash: the
       Play CDN answers with no Access-Control-Allow-Origin header, so a browser
       would refuse a script carrying one and the page would lose every style. -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <link rel="stylesheet" href="assets/threefold.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #0a0d18; color: #f3f4f6; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <script src="assets/threefold.js"></script>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden">
  <a href="#view" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[80] tf-btn">Skip to content</a>

  <header class="sticky top-0 z-40 border-b border-gray-800 bg-gray-950/85 backdrop-blur">
    <div class="max-w-7xl mx-auto px-4 h-14 flex items-center gap-3">
      <a href="#/overview" class="flex items-center gap-2.5 shrink-0" aria-label="Threefold overview">
        <span class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 via-purple-600 to-pink-600 flex items-center justify-center shadow-lg shadow-purple-500/20" aria-hidden="true">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="#fff" stroke-width="1.8"><path d="M10 2.5 16 5v4.5c0 4-2.6 6.8-6 8-3.4-1.2-6-4-6-8V5l6-2.5z"/><path d="m7.5 10 1.8 1.8L13 8"/></svg>
        </span>
        <span class="hidden sm:block">
          <span class="block text-sm font-bold tracking-tight text-white leading-4">Threefold</span>
          <span class="block text-[11px] text-gray-500 leading-4">Agent governance</span>
        </span>
      </a>
      <div id="tf-nav" class="flex-1 min-w-0 flex items-center justify-end">
        <!-- Without script, the pages this app links to are still reachable. -->
        <nav aria-label="Threefold" class="flex items-center gap-3 text-xs text-gray-400">
          <a href="index.html" class="underline">Demo</a>
          <a href="rules.html" class="underline">Rules</a>
          <a href="sessions.html" class="underline">Sessions</a>
          <a href="connect.html" class="underline">Connect</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="flex-1 w-full max-w-7xl mx-auto px-4 py-6">
    <div id="view" tabindex="-1" class="outline-none">
      <noscript>
        <div class="tf-card p-6 space-y-2">
          <h1 class="text-lg font-semibold text-white">This dashboard needs JavaScript</h1>
          <p class="text-sm text-gray-400">It reads the ledger from the API in the browser. The <a class="tf-link" href="index.html">demo</a>, the <a class="tf-link" href="connect.html">connect page</a> and the <a class="tf-link" href="swagger.html">API document</a> are reachable without it.</p>
        </div>
      </noscript>
    </div>
    <p id="live-status" class="sr-only" aria-live="polite"></p>
  </main>

  <div id="modal-root"></div>
  <div id="toast-root" class="tf-toast-root" aria-live="polite"></div>

  <footer class="border-t border-gray-800 py-4 text-center text-xs text-gray-500 px-4">
    Threefold · AWS Zero to Shipped Hackathon 2026 · Every number on this page is read from the API as you look at it
  </footer>

  <script>
    // The application: one page, a route per screen, each drawn from what the
    // API answers. Nothing here carries a number of its own. Every value read
    // from the service is rendered through html``, which escapes it.
    const T = window.Threefold;
    const { html, raw, setHtml, num, pct, query, timeAgo, shortDay, dateTime } = T;
    const C = T.COLORS;

    // ------------------------------------------------------------ routes
    // The contract's routes, in the order the navigation lists them.
    const ROUTES = [
      { path: '/overview', nav: 'overview', title: 'Overview', view: viewOverview },
      { path: '/projects', nav: 'projects', title: 'Projects', view: viewProjects },
      { path: '/projects/:name', nav: 'projects', title: 'Project', view: viewProject },
      { path: '/review', nav: 'review', title: 'Review', view: viewReview },
      { path: '/calls', nav: 'overview', title: 'Calls', view: viewCalls },
      { path: '/call', nav: 'overview', title: 'Call', view: viewCall },
      { path: '/connect', nav: 'connect', title: 'Connect', view: viewConnect },
      { path: '/signin', nav: '', title: 'Sign in', view: viewSignin },
      { path: '/try', nav: 'demo', title: 'Try it', view: viewTry },
      { path: '/proof', nav: 'proof', title: 'Proof', view: viewProof }
    ];

    // A day is the smallest thing a rollup holds, so the shortest window
    // the service can answer is one UTC day — today, from 00:00 UTC. It was
    // offered as '24 h' and worded 'the last 24 hours', which at 00:05 UTC
    // described five minutes of calls. The names below say what it is.
    const DAY_CHOICES = [
      { days: 1, label: 'Today' }, { days: 7, label: '7 d' }, { days: 14, label: '14 d' }, { days: 30, label: '30 d' }
    ];
    const REFRESH_MS = 30000;

    const AGENT_LABELS = {
      'claude-code': 'Claude Code', codex: 'Codex', antigravity: 'Antigravity',
      'pre-commit': 'pre-commit', ci: 'CI', page: 'Page', unknown: 'Unknown'
    };
    const OUTCOMES = {
      refused: { label: 'Refused', chip: 'tf-chip-rose', color: C.refused },
      observed: { label: 'Would refuse', chip: 'tf-chip-amber', color: C.observed },
      approved: { label: 'Approved', chip: 'tf-chip-emerald', color: C.approved }
    };
    const STAGES = {
      observe: { label: 'Observe', chip: 'tf-chip-amber' },
      enforce: { label: 'Enforce', chip: 'tf-chip-purple' }
    };
    const STATES = {
      ready: { label: 'Ready', chip: 'tf-chip-emerald', says: 'everything it flagged was marked correct' },
      quiet: { label: 'Quiet', chip: 'tf-chip-gray', says: 'it flagged nothing' },
      needs_review: { label: 'Needs review', chip: 'tf-chip-sky', says: 'some of what it flagged has no label yet' },
      noisy: { label: 'Noisy', chip: 'tf-chip-rose', says: 'at least one flag was a false alarm' }
    };
    const REVIEWS = {
      correct: { label: 'Correct', chip: 'tf-chip-emerald' },
      false_alarm: { label: 'False alarm', chip: 'tf-chip-rose' }
    };
    const HOOK_MODES = {
      managed: 'follows the project\'s stage on the server',
      observe: 'capped to Observe on the machine: never refused, whatever the stage',
      enforce: 'enforces on the machine, whatever the stage',
      unknown: 'an older hook that does not report its mode'
    };
    const GATE_KEYS = {
      LOOP: 'The same call repeating',
      PROTECTED_PATH: 'A write to a protected path, such as hook settings or .git/hooks',
      UNREADABLE_WRITE: 'A shell write whose content cannot be read, under a rule that covers the path',
      CREDENTIAL: 'A credential in the arguments',
      BUDGET: 'The spend ceiling',
      HALTED_SESSION: 'A call in a session that was already halted',
      NONE: 'Nothing flagged the call'
    };

    // ----------------------------------------------------------- helpers

    function outcomeOf(row) {
      const status = String((row && row.status) || '');
      if (status && status !== 'APPROVED') return 'refused';
      if ((Array.isArray(row.observed_rules) && row.observed_rules.length) || row.observed_rule) return 'observed';
      return 'approved';
    }
    function ruleKeyOf(row) {
      return row.rule_key || (Array.isArray(row.observed_rules) && row.observed_rules[0]) || row.observed_rule || row.rule || 'NONE';
    }
    function targetOf(row) { return row.observed_target || row.target || ''; }
    function reasonOf(row) { return (outcomeOf(row) === 'observed' && row.observed_reason) || row.reason || ''; }
    function agentLabel(agent) { return AGENT_LABELS[agent] || agent || 'Unknown'; }

    function outcomeChip(row) {
      const o = OUTCOMES[outcomeOf(row)];
      return html`<span class="tf-chip ${o.chip}">${o.label}</span>`;
    }
    function stageChip(stage, configured) {
      const s = STAGES[stage];
      if (!s) return html`<span class="tf-chip tf-chip-gray">${stage || 'unknown'}</span>`;
      return html`<span class="tf-chip ${s.chip}" title="${configured === false ? 'Not configured: the stack default applies' : s.label}">${stage === 'enforce' ? raw(T.ICONS.shield) : raw(T.ICONS.eye)}${s.label}${configured === false ? ' · default' : ''}</span>`;
    }
    function stateChip(state) {
      const s = STATES[state];
      if (!s) return html`<span class="tf-chip tf-chip-gray">${state || '—'}</span>`;
      return html`<span class="tf-chip ${s.chip}" title="${s.label}: ${s.says}">${s.label}</span>`;
    }
    function reviewChip(review) {
      const r = REVIEWS[review];
      if (!r) return html`<span class="text-gray-600 text-[11px]">no label</span>`;
      return html`<span class="tf-chip ${r.chip}">${r.label}</span>`;
    }
    function agentChip(agent) { return html`<span class="tf-chip tf-chip-gray">${agentLabel(agent)}</span>`; }

    function callsHref(params) { return '#/calls' + query(params); }
    function projectHref(name) { return '#/projects/' + encodeURIComponent(name); }
    function callHref(row) { return '#/call' + query({ timestamp: row.timestamp, verdict_id: row.verdict_id }); }
    function reviewHref(params) { return '#/review' + query(params || {}); }

    function pickDays(value, fallback, allowAny) {
      const n = Number(value);
      if (allowAny && Number.isInteger(n) && n >= 1 && n <= 30) return n;
      return DAY_CHOICES.some(c => c.days === n) ? n : fallback;
    }
    function windowWords(days) { return days === 1 ? 'the day so far, UTC' : 'the last ' + days + ' days'; }

    // Days from a calendar day to today, inclusive, in UTC, which is how the
    // ledger keeps its days.
    function daysSince(day) {
      const then = Date.parse(String(day) + 'T00:00:00Z');
      if (isNaN(then)) return 7;
      const now = new Date();
      const today = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
      return Math.min(30, Math.max(1, Math.floor((today - then) / 86400000) + 1));
    }

    function plural(n, one, many) { return num(n) + ' ' + (n === 1 ? one : (many || one + 's')); }

    // Self-correction, as the overview and a project's page both word it. It
    // counts only an agent's refusals, from a hook or CI, of a call to a file:
    // a page call is a visitor pressing a button, and for a command the ledger
    // keeps only the program, so the Refused tile beside it can be larger. A
    // window with no such refusal says so rather than showing a rate of
    // nothing, and a read that stopped short says how much it covered: the
    // rows it read are of every project, which a project's page says too.
    const SELF_CORRECTION_SCOPE = 'It counts refusals of a hook or CI call to a file; a refused command is left out, because the ledger keeps only the program it ran.';
    // The rate is over the refusals whose session made a later call: a
    // single-call probe had no chance to correct itself. A stack that
    // predates that count divided by every refusal, and is worded so.
    function selfCorrectionChances(sc) {
      return typeof sc.refusals_with_later_call === 'number' ? sc.refusals_with_later_call : sc.refusals_considered;
    }
    function selfCorrectionShown(sc) {
      return !!(sc && typeof sc.refusals_considered === 'number' && sc.refusals_considered > 0 && selfCorrectionChances(sc) > 0);
    }
    function selfCorrectionWords(sc, ofOneProject) {
      if (!sc || typeof sc !== 'object') return 'not reported by this stack';
      const read = typeof sc.rows_read === 'number' && sc.rows_read > 0;
      if (sc.complete === false && !read) return 'not measured: the ledger could not be read';
      const partial = sc.complete === false
        ? ' · read stopped after the newest ' + plural(sc.rows_read, 'call') + (ofOneProject ? ' of every project' : '')
        : '';
      const n = sc.refusals_considered;
      if (!selfCorrectionShown(sc) && typeof n === 'number' && n > 0) {
        return 'not measured: ' + (n === 1 ? 'the one agent refusal had no later call' : 'none of the ' + num(n) + ' agent refusals had a later call') + ' in its session' + partial;
      }
      if (!selfCorrectionShown(sc)) {
        return (sc.complete === false ? 'no agent (hook or CI) refusal among the calls read' : 'no agent (hook or CI) refusal in this window') + partial;
      }
      const median = typeof sc.median_calls_to_correct === 'number'
        ? ' · median ' + (Math.round(sc.median_calls_to_correct * 10) / 10) + (sc.median_calls_to_correct === 1 ? ' call' : ' calls')
        : '';
      const counted = typeof sc.refusals_with_later_call === 'number';
      const without = counted && sc.refusals_without_later_call > 0 ? ' · ' + num(sc.refusals_without_later_call) + ' more had no later call' : '';
      return pct(sc.rate) + ' of ' + plural(selfCorrectionChances(sc), 'agent refusal') + (counted ? ' followed by another call' : '') + median + without + partial;
    }

    function sum(list, key) { return (list || []).reduce((s, r) => s + (typeof r[key] === 'number' ? r[key] : 0), 0); }

    function pageTitle(title, sub, actions) {
      return html`<div class="flex flex-wrap items-end justify-between gap-4 mb-5">
        <div class="min-w-0">
          <h1 id="view-title" tabindex="-1" class="text-xl md:text-2xl font-semibold tracking-tight text-white outline-none tf-break">${title}</h1>
          ${sub ? html`<p class="text-xs md:text-sm text-gray-400 mt-1 max-w-3xl">${sub}</p>` : ''}
        </div>
        ${actions ? html`<div class="flex flex-wrap items-center gap-2">${actions}</div>` : ''}
      </div>`;
    }

    function crumbs(items) {
      return html`<nav aria-label="Breadcrumb" class="text-[11px] text-gray-500 mb-2 flex flex-wrap items-center gap-1">
        ${items.map((item, i) => html`${i ? html`<span aria-hidden="true">/</span>` : ''}${item.href
          ? html`<a href="${item.href}" class="hover:text-gray-300 underline-offset-2 hover:underline">${item.label}</a>`
          : html`<span class="text-gray-400 tf-break" aria-current="page">${item.label}</span>`}`)}
      </nav>`;
    }

    function card(title, sub, body, extra) {
      return html`<section class="tf-card p-5 ${extra || ''}">
        <div class="flex flex-wrap items-start justify-between gap-2 mb-4">
          <div class="min-w-0">
            <h2 class="tf-section-title">${title}</h2>
            ${sub ? html`<p class="tf-section-sub">${sub}</p>` : ''}
          </div>
        </div>
        ${body}
      </section>`;
    }

    function emptyNote(text, next) {
      return html`<div class="rounded-xl border border-dashed border-gray-800 p-4 text-xs text-gray-400">
        <p>${text}</p>${next ? html`<p class="mt-2">${next}</p>` : ''}
      </div>`;
    }

    function skeleton(kind) {
      if (kind === 'tiles') {
        return html`<div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-3" aria-hidden="true">
          ${[1, 2, 3, 4, 5, 6].map(() => html`<div class="tf-card p-4 space-y-3"><div class="tf-skeleton h-3 w-20"></div><div class="tf-skeleton h-7 w-16"></div><div class="tf-skeleton h-3 w-28"></div></div>`)}
        </div>`;
      }
      if (kind === 'table') {
        return html`<div class="tf-card p-5 space-y-3" aria-hidden="true">
          ${[1, 2, 3, 4, 5, 6].map(() => html`<div class="tf-skeleton h-4 w-full"></div>`)}
        </div>`;
      }
      return html`<div class="tf-card p-5" aria-hidden="true"><div class="tf-skeleton h-48 w-full"></div></div>`;
    }

    function loadingView(title, sub, kinds) {
      return html`${pageTitle(title, sub)}<div class="space-y-4" aria-busy="true"><p class="sr-only">Loading</p>${(kinds || ['table']).map(skeleton)}</div>`;
    }

    // The state for a failed read: signed out when the stack refused, an error
    // with a retry otherwise.
    function failure(err, what) {
      return T.isAuthError(err) ? T.signedOutHtml(err, what) : T.errorHtml(err, what, 'retry');
    }

    function announce(text) {
      const el = document.getElementById('live-status');
      if (el) el.textContent = text;
    }

    // ------------------------------------------------------------ router

    let current = { token: 0, route: null, params: {}, args: [], leave: [], actions: {} };

    function compile(path) {
      return new RegExp('^' + path.replace(/:[a-z]+/g, '([^/]+)') + '$');
    }
    ROUTES.forEach(r => { r.re = compile(r.path); });

    function decodePart(s) {
      try { return decodeURIComponent(String(s).replace(/\+/g, ' ')); } catch (err) { return String(s); }
    }

    function parseHash(hash) {
      const body = String(hash || '').replace(/^#/, '');
      const at = body.indexOf('?');
      const path = (at >= 0 ? body.slice(0, at) : body) || '/overview';
      const params = {};
      if (at >= 0) {
        body.slice(at + 1).split('&').forEach(pair => {
          if (!pair) return;
          const eq = pair.indexOf('=');
          const name = decodePart(eq >= 0 ? pair.slice(0, eq) : pair);
          params[name] = decodePart(eq >= 0 ? pair.slice(eq + 1) : '');
        });
      }
      return { path, params };
    }

    function resolve(path) {
      for (const r of ROUTES) {
        const m = r.re.exec(path);
        if (m) return { route: r, args: m.slice(1).map(decodePart) };
      }
      return null;
    }

    function makeContext(token, params, args) {
      return {
        token, params, args,
        alive: () => token === current.token,
        onLeave: fn => { if (token === current.token) current.leave.push(fn); },
        actions: map => { if (token === current.token) Object.assign(current.actions, map); },
        render: safe => { if (token === current.token) setHtml(document.getElementById('view'), safe); }
      };
    }

    function route() {
      current.leave.forEach(fn => { try { fn(); } catch (err) { /* cleanup is best effort */ } });
      closeDialog();
      const token = current.token + 1;
      const { path, params } = parseHash(location.hash);
      const found = resolve(path);
      current = { token, route: found ? found.route : null, params, args: found ? found.args : [], leave: [], actions: {} };
      T.mountNav(document.getElementById('tf-nav'), { active: found ? found.route.nav : '', inDashboard: true });
      const ctx = makeContext(token, params, current.args);
      if (!found) {
        document.title = 'Not found — Threefold';
        ctx.render(html`${pageTitle('Nothing lives at this address', 'The link may be from an older version of this dashboard.')}
          <div class="flex flex-wrap gap-2"><a class="tf-btn tf-btn-primary" href="#/overview">Go to the overview</a><a class="tf-btn" href="#/projects">Projects</a></div>`);
        return;
      }
      document.title = found.route.title + ' — Threefold';
      try {
        found.route.view(ctx);
      } catch (err) {
        ctx.render(T.errorHtml({ kind: 'http', message: String(err && err.message || err) }, 'this screen', null));
      }
      const title = document.getElementById('view-title');
      if (title && typeof title.focus === 'function') {
        try { title.focus({ preventScroll: true }); } catch (err) { /* focus is a courtesy */ }
      }
      if (typeof window.scrollTo === 'function') { try { window.scrollTo(0, 0); } catch (err) { /* no scroll */ } }
    }

    function go(hash) {
      if (location.hash === hash) route(); else location.hash = hash;
    }

    function closest(node, name) {
      while (node && node !== document) {
        if (typeof node.hasAttribute === 'function' && node.hasAttribute(name)) return node;
        node = node.parentNode;
      }
      return null;
    }

    function dispatch(kind, event) {
      const el = closest(event.target, 'data-' + kind);
      if (!el) return;
      const name = el.getAttribute('data-' + kind);
      const fn = current.actions[name] || GLOBAL_ACTIONS[name];
      if (!fn) return;
      // Only a form's submit has a default to stop; a button's click has none,
      // and stopping a click would stop a checkbox from ticking.
      if (kind === 'submit' && typeof event.preventDefault === 'function') event.preventDefault();
      fn(el, event);
    }

    const GLOBAL_ACTIONS = {
      retry: () => route(),
      'close-dialog': () => closeDialog()
    };

    document.addEventListener('click', event => {
      // A click on the dimmed backdrop closes a dialog; a click inside it does not.
      if (dialogOpen && event.target && typeof event.target.hasAttribute === 'function' && event.target.hasAttribute('data-overlay')) { closeDialog(); return; }
      const row = closest(event.target, 'data-row-href');
      const inner = closest(event.target, 'data-action') || (event.target && event.target.closest && event.target.closest('a,button,input,select,label'));
      if (row && !inner) { go(row.getAttribute('data-row-href')); return; }
      dispatch('action', event);
    });
    document.addEventListener('change', event => dispatch('change', event));
    document.addEventListener('submit', event => dispatch('submit', event));
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && dialogOpen) closeDialog();
    });
    window.addEventListener('hashchange', route);
    // A sign-in or a sign-out redraws the screen with the new credential. A
    // sign-in the stack stopped accepting does not: the screen that met the
    // refusal already says so, and says what to run.
    T.onAuthChange(reason => { if (reason !== 'expired' && current.route && current.route.path !== '/signin') route(); });
    // The switch in the navigation turns the reader's own names for the
    // aliases off and on, so the screen is drawn again and every label on it
    // follows at once. Three screens are left out: /signin and /try show no
    // alias a reader would name, and /connect redraws from its own state
    // below, so a half-typed name survives the switch.
    // A dialog and a toast outlive the screen under them, so a redraw of the
    // route alone would leave a name of the reader's own on either. A dialog is
    // drawn from the state of the screen that opened it, so it is closed rather
    // than carried across: route() closes it, and a screen that keeps its own
    // state closes it here. A toast is written again from the words that raised
    // it, with nothing asked of the service.
    const KEEPS_ITS_OWN_STATE = { '/signin': true, '/try': true, '/connect': true };
    T.onLocalNamesChange(() => {
      if (current.route && !KEEPS_ITS_OWN_STATE[current.route.path]) route();
      else closeDialog();
      if (toastUp) toastUp.draw();
    });

    // ------------------------------------------------------ dialog, toast

    let dialogOpen = false;
    let dialogReturn = null;

    function openDialog(title, body, footer) {
      dialogReturn = document.activeElement || null;
      dialogOpen = true;
      setHtml(document.getElementById('modal-root'), html`<div class="tf-overlay" data-overlay>
        <div class="tf-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" data-dialog>
          <div class="px-5 pt-5 pb-3 border-b border-gray-800 flex items-start justify-between gap-3">
            <h2 id="dialog-title" class="text-base font-semibold text-white">${title}</h2>
            <button type="button" class="tf-btn tf-btn-quiet tf-btn-sm" data-action="close-dialog" aria-label="Close">Close</button>
          </div>
          <div id="dialog-body" class="px-5 py-4 space-y-4">${body}</div>
          <div id="dialog-footer" class="px-5 py-4 border-t border-gray-800 flex flex-wrap justify-end gap-2">${footer}</div>
        </div>
      </div>`);
      const first = document.getElementById('dialog-first');
      if (first && typeof first.focus === 'function') { try { first.focus(); } catch (err) { /* courtesy */ } }
    }

    function closeDialog() {
      if (!dialogOpen) return;
      dialogOpen = false;
      setHtml(document.getElementById('modal-root'), html``);
      if (dialogReturn && typeof dialogReturn.focus === 'function') { try { dialogReturn.focus(); } catch (err) { /* courtesy */ } }
      dialogReturn = null;
    }

    let toastSeq = 0;
    const toastActions = {};
    // The toast on screen, and how to write it again. A toast whose words name
    // a project is given a function rather than a string, so the switch in the
    // navigation reaches it rather than leaving a name up for nine seconds.
    let toastUp = null;
    function toast(message, actionLabel, action) {
      toastSeq += 1;
      const id = 'toast-' + toastSeq;
      if (action) toastActions[id] = action;
      const words = typeof message === 'function' ? message : () => message;
      const root = document.getElementById('toast-root');
      const draw = () => setHtml(root, html`<div class="tf-toast" id="${id}" role="status">
        <span class="flex-1 tf-break">${words()}</span>
        ${action ? html`<button type="button" class="tf-btn tf-btn-sm" data-action="toast" data-toast="${id}">${actionLabel}</button>` : ''}
        <button type="button" class="tf-btn tf-btn-quiet tf-btn-sm" data-action="toast-close" data-toast="${id}" aria-label="Dismiss">✕</button>
      </div>`);
      draw();
      toastUp = { id: id, draw: draw };
      announce(words());
      setTimeout(() => {
        const el = document.getElementById(id);
        if (el && el.parentNode && typeof el.parentNode.removeChild === 'function') el.parentNode.removeChild(el);
        delete toastActions[id];
        if (toastUp && toastUp.id === id) toastUp = null;
      }, 9000);
    }
    function dismissToast(id) {
      delete toastActions[id];
      if (toastUp && toastUp.id === id) toastUp = null;
      setHtml(document.getElementById('toast-root'), html``);
    }
    GLOBAL_ACTIONS.toast = el => {
      const id = el.getAttribute('data-toast');
      const fn = toastActions[id];
      dismissToast(id);
      if (fn) fn();
    };
    GLOBAL_ACTIONS['toast-close'] = el => dismissToast(el.getAttribute('data-toast'));

    // ---------------------------------------------------------- overview

    function windowPicker(base, days, extra) {
      return html`<div class="tf-segmented" role="group" aria-label="Time window">
        ${DAY_CHOICES.map(c => html`<a href="${base + query(Object.assign({}, extra || {}, { days: c.days }))}" aria-current="${c.days === days ? 'true' : 'false'}" aria-label="${windowWords(c.days)}">${c.label}</a>`)}
      </div>`;
    }

    function tile(t) {
      return html`<a href="${t.href}" class="tf-card tf-card-link tf-tile" aria-label="${t.label}: ${num(t.value)}. ${t.sub}. ${t.opens || 'Open the rows behind it'}">
        <span class="tf-tile-label">${t.label}</span>
        <span class="flex items-end justify-between gap-2 min-w-0">
          <span class="tf-tile-value" data-metric="${t.metric}" title="${typeof t.value === 'number' ? t.value.toLocaleString('en-US') : ''}">${num(t.value)}</span>
          ${t.spark ? html`<span class="hidden sm:inline-flex" aria-hidden="true">${t.spark}</span>` : ''}
        </span>
        <span class="tf-tile-sub">${t.sub}</span>
      </a>`;
    }

    function viewOverview(ctx) {
      const days = pickDays(ctx.params.days, 7);
      let data = null;
      let loadedAt = 0;
      const actions = pageTitleActions(days);
      ctx.render(loadingView('Overview', 'What Threefold judged across every project in ' + windowWords(days) + '.', ['tiles', 'chart', 'table']));

      function load(quiet) {
        return T.api('/api/overview' + query({ days })).then(body => {
          if (!ctx.alive()) return;
          data = body || {};
          loadedAt = Date.now();
          draw();
          if (quiet) announce('Overview refreshed');
        }, err => {
          if (!ctx.alive()) return;
          // A refresh that fails leaves what was read on screen and says so.
          if (quiet && data) {
            const el = document.getElementById('freshness');
            if (el) setHtml(el, html`<span class="text-amber-300">The last refresh failed (${err.message}); what is shown was read ${timeAgo(new Date(loadedAt).toISOString())}.</span>`);
            return;
          }
          if (T.isAuthError(err)) clearInterval(timer);
          ctx.render(html`${pageTitle('Overview', null, actions)}${failure(err, 'the overview')}`);
        });
      }

      function chartWidth() {
        const el = document.getElementById('daily-chart');
        const w = el && el.clientWidth;
        return w && w > 0 ? w : 640;
      }

      function dailyChart() {
        const series = Array.isArray(data.series) ? data.series : [];
        if (!series.length) return emptyNote('No days to draw in this window.');
        return T.stackedBars(series, {
          width: chartWidth(),
          height: 210,
          title: 'Calls per day, ' + windowWords(days),
          desc: 'Stacked columns, one per day: refused at the base, then would refuse, then approved.',
          keys: [
            { key: 'refused', label: 'Refused', color: C.refused },
            { key: 'observed', label: 'Would refuse', color: C.observed },
            { key: 'approved', label: 'Approved', color: C.approved }
          ],
          href: (row, key) => callsHref({ kind: key, day: row.day, days: daysSince(row.day) })
        });
      }

      function draw() {
        const t = data.totals || {};
        const stages = data.stages || {};
        const series = Array.isArray(data.series) ? data.series : [];
        const byAgent = Array.isArray(data.by_agent) ? data.by_agent : [];
        const byOrigin = Array.isArray(data.by_origin) ? data.by_origin : [];
        const byRule = Array.isArray(data.by_rule) ? data.by_rule : [];
        const byProject = Array.isArray(data.by_project) ? data.by_project : [];
        const head = pageTitle('Overview', 'What Threefold judged across every project in ' + windowWords(days) + '.', actions);
        const fresh = html`<p id="freshness" class="text-[11px] text-gray-500 -mt-3 mb-4">Read at ${T.clockTime(loadedAt)} from daily rollups${data.generated_at ? ' generated ' + timeAgo(data.generated_at) : ''}, so the counts are exact however busy the ledger is. Refreshes every 30 seconds while this tab is open.</p>`;

        if (!t.calls) {
          ctx.render(html`${head}${fresh}${overviewEmpty(days)}`);
          return;
        }

        const perDay = series.map(r => (r.approved || 0) + (r.observed || 0) + (r.refused || 0));
        const topAgents = byAgent.slice().sort((a, b) => (b.calls || 0) - (a.calls || 0)).slice(0, 3).map(a => agentLabel(a.agent));
        const tiles = [
          { label: 'Calls governed', metric: 'calls', value: t.calls, href: callsHref({ days }),
            sub: num(t.approved) + ' approved', spark: T.sparkline(perDay, { label: 'Calls per day', color: C.accent }) },
          { label: 'Refused', metric: 'refused', value: t.refused, href: callsHref({ kind: 'refused', days }),
            sub: t.refused ? pct(t.refused / t.calls) + ' of calls, stopped before they ran' : 'nothing was refused in this window',
            spark: T.sparkline(series.map(r => r.refused || 0), { label: 'Refused per day', color: C.refused }) },
          // Read from the ledger rather than the rollups: whether a refused
          // agent then did the same thing acceptably is a question about the
          // order of its calls. The calls listing cannot filter by origin, so
          // the link opens every refusal, and the label says so.
          { label: 'Self-corrected', metric: 'self_corrected',
            value: selfCorrectionShown(data.self_correction) ? data.self_correction.self_corrected : null,
            href: callsHref({ kind: 'refused', days }), sub: selfCorrectionWords(data.self_correction),
            opens: SELF_CORRECTION_SCOPE + ' Opens every refused call in this window' },
          { label: 'Would refuse', metric: 'would_refuse', value: t.would_refuse, href: callsHref({ kind: 'observed', days }),
            sub: t.would_refuse ? 'ran; a rule in Observe would have stopped them' : 'no observing rule flagged a call',
            spark: T.sparkline(series.map(r => r.observed || 0), { label: 'Would refuse per day', color: C.observed }) },
          { label: 'Needs review', metric: 'needs_review', value: t.needs_review, href: callsHref({ kind: 'observed', review: 'unreviewed', days }),
            sub: t.needs_review ? 'label them so rules can become Ready' : 'every flagged call has a label' },
          { label: 'Projects', metric: 'projects', value: t.projects, href: '#/projects',
            sub: num(stages.observe) + ' in Observe · ' + num(stages.enforce) + ' in Enforce' },
          { label: 'Agents', metric: 'agents', value: t.agents, href: callsHref({ days }),
            sub: topAgents.length ? topAgents.join(', ') : 'none reported' }
        ];

        const outcome = T.donut([
          { label: 'Refused', value: t.refused, color: C.refused, href: callsHref({ kind: 'refused', days }) },
          { label: 'Would refuse', value: t.would_refuse, color: C.observed, href: callsHref({ kind: 'observed', days }) },
          { label: 'Approved', value: t.approved, color: C.approved, href: callsHref({ kind: 'approved', days }) }
        ], { title: 'Outcome of every call', sub: 'calls' });

        const origins = byOrigin.length
          ? html`<div class="mt-5 pt-4 border-t border-gray-800">
              <p class="tf-label">Where calls came from</p>
              <ul class="flex flex-wrap gap-1.5">${byOrigin.map(o => html`<li class="tf-chip tf-chip-gray"><span class="text-gray-400">${o.origin}</span><span class="font-mono">${num(o.calls)}</span></li>`)}</ul>
              <p class="text-[11px] text-gray-500 mt-2">hook is an agent being governed, page a visitor pressing a button here, ci a pipeline.</p>
            </div>`
          : '';

        const rules = byRule.filter(r => (r.refused || 0) + (r.would_refuse || 0) > 0)
          .sort((a, b) => ((b.refused || 0) + (b.would_refuse || 0)) - ((a.refused || 0) + (a.would_refuse || 0)));
        const ruleBars = rules.length
          ? T.hbars(rules.map(r => ({
              label: r.rule_key, href: callsHref({ rule: r.rule_key, days }),
              segments: [
                { value: r.refused || 0, label: 'refused', color: C.refused, href: callsHref({ rule: r.rule_key, kind: 'refused', days }) },
                { value: r.would_refuse || 0, label: 'would refuse', color: C.observed, href: callsHref({ rule: r.rule_key, kind: 'observed', days }) }
              ],
              sublabel: GATE_KEYS[r.rule_key] || ''
            })), { title: 'By rule', keys: [{ label: 'Refused', color: C.refused }, { label: 'Would refuse', color: C.observed }] })
          : emptyNote('No rule refused or flagged a call in this window.', html`Every call passed every gate. <a class="tf-link" href="${callsHref({ days })}">See the calls</a>.`);

        const agents = byAgent.filter(a => (a.calls || 0) > 0).sort((a, b) => (b.calls || 0) - (a.calls || 0));
        const agentBars = agents.length
          ? T.hbars(agents.map(a => ({
              label: agentLabel(a.agent), href: callsHref({ agent: a.agent, days }),
              segments: [{ value: a.calls, label: 'calls', color: C.accent, href: callsHref({ agent: a.agent, days }) }]
            })), { title: 'By agent' })
          : emptyNote('No agent reported itself in this window.');

        ctx.render(html`${head}${fresh}
          <div class="space-y-4">
            <div class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-7 gap-3">${tiles.map(tile)}</div>
            ${t.needs_review ? html`<a href="${reviewHref()}" class="tf-card tf-card-link flex flex-wrap items-center justify-between gap-3 px-5 py-3 border-sky-900/60">
                <span class="text-sm text-sky-200"><strong class="text-white">${plural(t.needs_review, 'call')}</strong> a rule would have refused ${t.needs_review === 1 ? 'is' : 'are'} waiting for a label${t.false_alarms ? html`<span class="text-gray-400"> · ${plural(t.false_alarms, 'false alarm')} marked so far</span>` : ''}.</span>
                <span class="tf-btn tf-btn-sm">Open the review queue ${raw(T.ICONS.arrow)}</span>
              </a>` : ''}
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
              ${card('Calls per day', 'Click a segment to open the calls behind it.', html`<div id="daily-chart">${dailyChart()}</div>`, 'lg:col-span-2 min-w-0')}
              ${card('Outcome', 'Every call ends approved, would refuse (ran, flagged by an observing rule) or refused.', html`${outcome}${origins}`, 'min-w-0')}
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
              ${card('By rule', 'What decided, refused and would refuse. A layering rule by its id, a gate by its key. A call two rules would have refused counts under each, so these do not add up to the tiles.', ruleBars, 'min-w-0')}
              ${card('By agent', 'Calls each agent sent in this window.', agentBars, 'min-w-0')}
            </div>
            ${card('By project', 'Stage, and what each project\'s rules did. Open a project for its readiness and the Promote button.', projectsTable(byProject, days, true), 'min-w-0')}
          </div>`);
      }

      let resizeTimer = null;
      const onResize = () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          const el = document.getElementById('daily-chart');
          if (el && data && data.totals && data.totals.calls) setHtml(el, dailyChart());
        }, 150);
      };
      const timer = setInterval(() => {
        if (document.visibilityState !== 'hidden') load(true);
      }, REFRESH_MS);
      const onVisible = () => {
        if (document.visibilityState === 'visible' && Date.now() - loadedAt > REFRESH_MS) load(true);
      };
      window.addEventListener('resize', onResize);
      document.addEventListener('visibilitychange', onVisible);
      ctx.onLeave(() => {
        clearInterval(timer);
        clearTimeout(resizeTimer);
        if (typeof window.removeEventListener === 'function') window.removeEventListener('resize', onResize);
        if (typeof document.removeEventListener === 'function') document.removeEventListener('visibilitychange', onVisible);
      });
      ctx.actions({ refresh: () => load(true) });
      return load(false);
    }

    function pageTitleActions(days) {
      return html`${windowPicker('#/overview', days)}<button type="button" class="tf-btn tf-btn-quiet" data-action="refresh" aria-label="Refresh now">${raw(T.ICONS.refresh)} Refresh</button>`;
    }

    function overviewEmpty(days) {
      return html`<div class="tf-card p-6 md:p-8 space-y-5" data-state="empty">
        <div class="space-y-2 max-w-2xl">
          <h2 class="text-lg font-semibold text-white">No tool call reached this stack in ${windowWords(days)}</h2>
          <p class="text-sm text-gray-400">Threefold records a row each time it judges an agent's tool call. None arrived in this window, which means no agent has been pointed here lately, not that nothing was found.</p>
        </div>
        <ol class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <li class="tf-card-quiet p-4 space-y-2">
            <p class="text-xs font-semibold text-purple-300">Connect a repository</p>
            <p class="text-[11px] text-gray-400">One command. It starts in Observe, so nothing your agents do is refused while you watch.</p>
            <a href="#/connect" class="tf-btn tf-btn-primary tf-btn-sm">Connect ${raw(T.ICONS.arrow)}</a>
          </li>
          <li class="tf-card-quiet p-4 space-y-2">
            <p class="text-xs font-semibold text-purple-300">Try it in a minute</p>
            <p class="text-[11px] text-gray-400">On the public demo: a sandbox project seeded with calls from three agents, reviewed and promoted by you.</p>
            <a href="#/try" class="tf-btn tf-btn-sm">Start the walkthrough</a>
          </li>
          <li class="tf-card-quiet p-4 space-y-2">
            <p class="text-xs font-semibold text-purple-300">${days < 30 ? 'Look further back' : 'Watch a refusal now'}</p>
            <p class="text-[11px] text-gray-400">${days < 30 ? 'Calls older than this window are still in the ledger.' : 'The demo page runs the circuit breaker against the live service.'}</p>
            ${days < 30 ? html`<a href="#/overview?days=30" class="tf-btn tf-btn-sm">Show 30 days</a>` : html`<a href="${T.pageHref('index.html')}" class="tf-btn tf-btn-sm">Open the demo</a>`}
          </li>
        </ol>
      </div>`;
    }

    // A project table, shared by the overview and the projects screen. Every
    // number opens the calls behind it.
    function projectsTable(rows, days, compact) {
      if (!rows.length) {
        return emptyNote('No project sent a call in this window.', html`<a class="tf-link" href="#/connect">Connect a repository</a> and its first call appears here.`);
      }
      const sorted = rows.slice().sort((a, b) => (b.needs_review || 0) - (a.needs_review || 0) || (b.calls || 0) - (a.calls || 0));
      const numLink = (value, params, tone) => html`<a href="${callsHref(Object.assign({ days }, params))}" class="tf-num-link ${value ? tone : 'text-gray-500'}">${num(value)}</a>`;
      const desktop = html`<div class="hidden md:block tf-scroll-x">
        <table class="tf-table">
          <thead><tr>
            <th scope="col">Project</th><th scope="col">Stage</th>
            <th scope="col" class="num">Calls</th><th scope="col" class="num">Refused</th>
            <th scope="col" class="num">Would refuse</th><th scope="col" class="num">Needs review</th>
            ${compact ? '' : html`<th scope="col">Agents</th><th scope="col">Hook modes</th>`}
            <th scope="col">Last seen</th>
          </tr></thead>
          <tbody>${sorted.map(p => html`<tr>
            <th scope="row" class="font-normal"><a href="${projectHref(p.project)}" class="tf-link-quiet font-mono tf-break">${T.projectName(p.project)}</a></th>
            <td>${stageChip(p.stage, p.configured)}</td>
            <td class="num">${numLink(p.calls, { project: p.project }, 'text-gray-200')}</td>
            <td class="num">${numLink(p.refused, { project: p.project, kind: 'refused' }, 'text-rose-300')}</td>
            <td class="num">${numLink(p.would_refuse, { project: p.project, kind: 'observed' }, 'text-amber-300')}</td>
            <td class="num">${p.needs_review ? html`<a href="${reviewHref({ project: p.project })}" class="tf-num-link text-sky-300">${num(p.needs_review)}</a>` : html`<span class="text-gray-500">${num(p.needs_review)}</span>`}</td>
            ${compact ? '' : html`<td>${chipList(p.agents, agentLabel)}</td><td>${chipList(p.hook_modes)}</td>`}
            <td class="text-gray-400 whitespace-nowrap">${timeAgo(p.last_seen)}</td>
          </tr>`)}</tbody>
        </table>
      </div>`;
      const mobile = html`<ul class="md:hidden space-y-2">${sorted.map(p => html`<li class="tf-card-quiet p-3 space-y-2">
        <div class="flex items-start justify-between gap-2">
          <a href="${projectHref(p.project)}" class="tf-link-quiet font-mono text-sm tf-break">${T.projectName(p.project)}</a>
          ${stageChip(p.stage, p.configured)}
        </div>
        <div class="grid grid-cols-4 gap-1 text-center">
          ${[['Calls', p.calls, {}, 'text-gray-200'], ['Refused', p.refused, { kind: 'refused' }, 'text-rose-300'], ['Would', p.would_refuse, { kind: 'observed' }, 'text-amber-300']].map(([label, value, params, tone]) =>
            html`<a href="${callsHref(Object.assign({ days, project: p.project }, params))}" class="rounded-lg bg-gray-900 py-1.5"><span class="block font-mono text-sm ${value ? tone : 'text-gray-500'}">${num(value)}</span><span class="block text-[10px] text-gray-500">${label}</span></a>`)}
          <a href="${reviewHref({ project: p.project })}" class="rounded-lg bg-gray-900 py-1.5"><span class="block font-mono text-sm ${p.needs_review ? 'text-sky-300' : 'text-gray-500'}">${num(p.needs_review)}</span><span class="block text-[10px] text-gray-500">Review</span></a>
        </div>
        ${compact ? '' : html`<div class="flex flex-wrap gap-1">${chipList(p.agents, agentLabel)} ${chipList(p.hook_modes)}</div>`}
        <p class="text-[11px] text-gray-500">Last seen ${timeAgo(p.last_seen)}</p>
      </li>`)}</ul>`;
      return html`${desktop}${mobile}`;
    }

    function chipList(values, label) {
      if (!Array.isArray(values) || !values.length) return html`<span class="text-gray-600">—</span>`;
      return html`<span class="inline-flex flex-wrap gap-1">${values.map(v => html`<span class="tf-chip tf-chip-gray">${label ? label(v) : v}</span>`)}</span>`;
    }

    // ---------------------------------------------------------- projects

    function viewProjects(ctx) {
      const sub = 'Every project seen in the last 7 days, configured or not. A project with no configuration follows the stack\'s default stage.';
      ctx.render(loadingView('Projects', sub, ['table']));
      return T.api('/api/projects').then(body => {
        if (!ctx.alive()) return;
        const rows = (body && Array.isArray(body.projects)) ? body.projects : [];
        const observe = rows.filter(p => p.stage === 'observe').length;
        const enforce = rows.filter(p => p.stage === 'enforce').length;
        ctx.render(html`${pageTitle('Projects', sub, html`<a href="#/connect" class="tf-btn tf-btn-primary">Connect a repository</a>`)}
          ${rows.length ? html`<p class="text-xs text-gray-400 mb-4"><span data-metric="projects">${num(rows.length)}</span> project${rows.length === 1 ? '' : 's'} · ${num(observe)} in Observe · ${num(enforce)} in Enforce</p>` : ''}
          ${card('All projects', 'Numbers cover the last 7 days and open the calls behind them.', projectsTable(rows, 7, false))}`);
      }, err => {
        if (ctx.alive()) ctx.render(html`${pageTitle('Projects', sub)}${failure(err, 'the project list')}`);
      });
    }

    // ----------------------------------------------------------- project

    function connectCommands(name) {
      const base = T.STACK_URL;
      return {
        powershell: 'irm ' + base + 'install.py -OutFile threefold.py; py threefold.py connect --project ' + name,
        posix: 'curl -fsSL ' + base + 'install.py -o threefold.py && python3 threefold.py connect --project ' + name
      };
    }

    function stageBanner(name, stage, config, readiness) {
      const rules = (readiness && readiness.rules) || [];
      const observing = rules.filter(r => r.mode_now === 'observe').map(r => r.rule_key);
      if (stage === 'enforce') {
        return html`<section class="tf-card p-5 border-purple-900/70 bg-purple-950/20" aria-label="Stage">
          <div class="flex flex-wrap items-start justify-between gap-4">
            <div class="flex items-start gap-3 max-w-3xl">
              <span class="mt-0.5 inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-purple-950 text-purple-300 border border-purple-800" aria-hidden="true">${raw(T.ICONS.shield)}</span>
              <div class="space-y-1.5">
                <h2 class="text-base font-semibold text-white">Enforce: the rules in force refuse a call before it runs</h2>
                <p class="text-xs text-gray-300">An agent's write or command that breaks a rule in force is refused, and the agent is told why. ${observing.length
                  ? html`<strong class="text-white">${plural(observing.length, 'rule')}</strong> still ${observing.length === 1 ? 'observes' : 'observe'}: ${observing.join(', ')}. ${observing.length === 1 ? 'It records' : 'They record'} what ${observing.length === 1 ? 'it' : 'they'} would refuse, and ${observing.length === 1 ? 'refuses' : 'refuse'} nothing.`
                  : 'Every rule of this project is in force.'}</p>
                <p class="text-[11px] text-gray-500">Back to Observe is one click and applies from the next call. A hook capped to observe on its machine is never refused, whatever this says; the agents list below flags one.</p>
              </div>
            </div>
            <div class="flex flex-wrap gap-2">
              <button type="button" class="tf-btn" data-action="promote-open">Change which rules enforce</button>
              <button type="button" class="tf-btn tf-btn-warn" data-action="demote-open">Back to Observe</button>
            </div>
          </div>
        </section>`;
      }
      return html`<section class="tf-card p-5 border-amber-900/60 bg-amber-950/10" aria-label="Stage">
        <div class="flex flex-wrap items-start justify-between gap-4">
          <div class="flex items-start gap-3 max-w-3xl">
            <span class="mt-0.5 inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-amber-950 text-amber-300 border border-amber-800" aria-hidden="true">${raw(T.ICONS.eye)}</span>
            <div class="space-y-1.5">
              <h2 class="text-base font-semibold text-white">Observe: what the hooks send is judged and recorded, and not refused</h2>
              <p class="text-xs text-gray-300">Your agents work exactly as before. What a rule <em>would</em> have refused is listed below: mark each one correct or false alarm. A rule whose flags were all correct is <strong class="text-emerald-300">Ready</strong>; one that flagged nothing is <strong class="text-gray-200">Quiet</strong>. When the rules you care about read Ready, promote the project and those rules start refusing; the others keep observing.</p>
              <p class="text-[11px] text-gray-500">One thing is refused even here: a call carrying a credential, which the hook refuses on the machine and never sends. A call the hook holds back, such as one outside the project, is neither sent nor recorded.${config ? '' : ' This project has no configuration yet, so it follows the stack default.'}</p>
            </div>
          </div>
          <div class="flex flex-wrap gap-2">
            <button type="button" class="tf-btn tf-btn-primary" data-action="promote-open" ${rules.length ? '' : raw('disabled')}>Promote to Enforce…</button>
          </div>
        </div>
      </section>`;
    }

    function viewProject(ctx) {
      const name = ctx.args[0] || '';
      const days = pickDays(ctx.params.days, 14, true);
      const state = { detail: null, recent: null, recentError: null, selected: null };
      // The alias is what this screen is addressed by and what every request
      // below sends; T.projectName adds the reader's own name for display only.
      const shown = T.projectName(name);
      const crumb = crumbs([{ label: 'Projects', href: '#/projects' }, { label: shown }]);
      ctx.render(html`${crumb}${loadingView(shown, 'Reading its stage and readiness…', ['tiles', 'table'])}`);

      function load() {
        const detail = T.api('/api/projects/' + encodeURIComponent(name) + query({ days }));
        const recent = T.api('/api/decisions' + query({ project: name, days, limit: 100 })).catch(err => { state.recentError = err; return null; });
        return Promise.all([detail, recent]).then(([d, r]) => {
          if (!ctx.alive()) return;
          state.detail = d || {};
          state.recent = r && Array.isArray(r.items) ? r.items : null;
          draw();
        }, err => {
          if (!ctx.alive()) return;
          if (err && err.kind === 'not_found') {
            ctx.render(html`${crumb}${pageTitle(shown, null)}${emptyNote('This stack has no record of a project by this name: no configuration, and no call in the window.', html`If it was just connected, its first call may still be on its way. <a class="tf-link" href="#/connect">Connect it</a>, or go back to <a class="tf-link" href="#/projects">the projects</a>.`)}`);
            return;
          }
          ctx.render(html`${crumb}${pageTitle(shown, null)}${failure(err, 'this project')}`);
        });
      }

      function draw() {
        const d = state.detail;
        const config = d.config || null;
        const readiness = d.readiness || {};
        const summary = readiness.summary || {};
        const rules = Array.isArray(readiness.rules) ? readiness.rules : [];
        const stage = summary.stage || (config && config.stage) || 'observe';
        const sandbox = !!(config && config.sandbox);

        const stats = [
          ['Days observed', summary.days_observed, 'days_observed'],
          ['Calls observed', summary.calls_observed, 'calls_observed'],
          ['Would have refused', summary.would_have_refused, 'would_have_refused'],
          ['Reviewed', summary.reviewed, 'reviewed'],
          ['False alarms', summary.false_alarms, 'false_alarms']
        ];
        const corrected = summary.self_correction;
        const statTiles = html`<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-7 gap-3">
          ${stats.map(([label, value, metric]) => html`<div class="tf-card tf-tile"><span class="tf-tile-label">${label}</span><span class="tf-tile-value" data-metric="${metric}">${num(value)}</span></div>`)}
          <a href="${callsHref({ project: name, kind: 'refused', days })}" class="tf-card tf-card-link tf-tile" aria-label="Self-corrected: ${selfCorrectionWords(corrected, true)}. ${SELF_CORRECTION_SCOPE} Opens every refused call of this project in this window">
            <span class="tf-tile-label">Self-corrected</span>
            <span class="tf-tile-value" data-metric="self_corrected">${num(selfCorrectionShown(corrected) ? corrected.self_corrected : null)}</span>
            <span class="tf-tile-sub">${selfCorrectionWords(corrected, true)}</span>
          </a>
          <div class="tf-card tf-tile col-span-2 sm:col-span-1"><span class="tf-tile-label">Rules</span>
            <span class="flex flex-wrap gap-1 mt-1">
              <span class="tf-chip tf-chip-emerald">${num(summary.rules_ready)} ready</span>
              <span class="tf-chip tf-chip-gray">${num(summary.rules_quiet)} quiet</span>
              <span class="tf-chip tf-chip-sky">${num(summary.rules_needing_review)} to review</span>
              <span class="tf-chip tf-chip-rose">${num(summary.rules_noisy)} noisy</span>
            </span>
            <span class="tf-tile-sub">false-alarm rate ${pct(summary.false_alarm_rate)}</span>
          </div>
        </div>`;

        const readinessTable = rules.length ? html`<div class="tf-scroll-x">
          <table class="tf-table">
            <thead><tr>
              <th scope="col">Rule</th><th scope="col">Now</th>
              <th scope="col" class="num">Would refuse</th><th scope="col" class="num">Refused</th><th scope="col" class="num">Correct</th>
              <th scope="col" class="num">False alarms</th><th scope="col" class="num">Unreviewed</th>
              <th scope="col">State</th><th scope="col">Recommendation</th>
            </tr></thead>
            <tbody>${rules.map(r => html`<tr>
              <th scope="row" class="font-normal">
                <a href="${callsHref({ project: name, rule: r.rule_key, days })}" class="tf-link-quiet font-mono tf-break">${r.rule_key}</a>
                <span class="block text-[10px] text-gray-500">${r.kind === 'gate' ? 'gate' : 'layering rule'}${r.last_seen ? ' · last ' + timeAgo(r.last_seen) : ''}</span>
              </th>
              <td>${r.mode_now === 'enforce' ? html`<span class="tf-chip tf-chip-purple">enforce</span>` : html`<span class="tf-chip tf-chip-amber">observe</span>`}</td>
              <td class="num"><a class="tf-num-link" href="${callsHref({ project: name, rule: r.rule_key, kind: 'observed', days })}">${num(r.would_refuse)}</a></td>
              <td class="num"><a class="tf-num-link ${r.refused ? 'text-rose-300' : ''}" href="${callsHref({ project: name, rule: r.rule_key, kind: 'refused', days })}">${num(r.refused || 0)}</a></td>
              <td class="num"><a class="tf-num-link text-emerald-300" href="${callsHref({ project: name, rule: r.rule_key, review: 'correct', days })}">${num(r.correct)}</a></td>
              <td class="num"><a class="tf-num-link ${r.false_alarms ? 'text-rose-300' : ''}" href="${callsHref({ project: name, rule: r.rule_key, review: 'false_alarm', days })}">${num(r.false_alarms)}</a></td>
              <td class="num">${r.unreviewed ? html`<a class="tf-num-link text-sky-300" href="${reviewHref({ project: name, rule: r.rule_key })}">${num(r.unreviewed)}</a>` : html`<span class="text-gray-500">${num(r.unreviewed)}</span>`}</td>
              <td>${stateChip(r.state)}</td>
              <td class="text-gray-400 min-w-[14rem]">${r.recommendation || STATES[r.state] && STATES[r.state].says || ''}</td>
            </tr>`)}</tbody>
          </table>
        </div>` : emptyNote('No rule readiness yet.', 'Readiness appears once this project has sent calls in the window.');

        const recent = state.recent;
        const recentBody = recent === null
          ? (state.recentError ? failure(state.recentError, 'the recent calls') : emptyNote('Recent calls could not be read.'))
          : recent.length ? callsList(recent.slice(0, 12), { project: false }) : emptyNote('No call from this project in ' + windowWords(days) + '.', 'Run the connect command below, then use your agent as usual.');

        ctx.render(html`${crumb}
          ${pageTitle(html`<span class="font-mono">${shown}</span>`, null, html`${stageChip(stage, config ? true : false)}${sandbox ? html`<span class="tf-chip tf-chip-sky" title="A sandbox made by the walkthrough; it expires on its own">Sandbox · expires within a day</span>` : ''}`)}
          <div class="space-y-4">
            ${stageBanner(name, stage, config, readiness)}
            ${statTiles}
            ${card('Readiness, rule by rule', 'Noisy if anything it flagged was a false alarm; else Needs review while anything is unlabelled; else Ready if it flagged anything; else Quiet.', readinessTable)}
            ${T.PROJECT_PATTERN.test(name) ? html`<p class="text-xs"><a class="tf-link" data-link="draft-rule" href="${T.pageHref('rules.html' + query({ project: name }) + '#draft')}">Draft a rule for this project</a> <span class="text-gray-500">from a sentence, with Amazon Bedrock; it starts in Observe beside the rules above.</span></p>` : ''}
            <div class="grid grid-cols-1 lg:grid-cols-5 gap-4">
              ${card('Recent calls', recent && recent.length ? 'The newest first. Open one for everything the ledger holds.' : null, html`${recentBody}${recent && recent.length ? html`<p class="mt-3"><a class="tf-link text-xs" href="${callsHref({ project: name, days })}">All calls from ${shown}</a></p>` : ''}`, 'lg:col-span-3 min-w-0')}
              <div class="lg:col-span-2 space-y-4 min-w-0">
                ${card('Agents and their hook mode', recent && recent.length ? 'From the latest ' + recent.length + ' calls.' : null, agentsPanel(recent, stage))}
                ${card('Setup', 'Connect another checkout or machine to this project.', setupPanel(name))}
              </div>
            </div>
            ${config && Array.isArray(config.history) && config.history.length ? card('Stage history', 'The last changes to this project\'s configuration.', historyList(config.history)) : ''}
          </div>`);
      }

      function agentsPanel(recent, stage) {
        if (!recent || !recent.length) return emptyNote('No agent has sent a call from this project in the window.');
        const byAgent = {};
        recent.forEach(row => {
          const agent = row.agent || 'unknown';
          const mode = row.hook_mode || 'unknown';
          byAgent[agent] = byAgent[agent] || { modes: {}, last: row.timestamp, calls: 0 };
          byAgent[agent].modes[mode] = true;
          byAgent[agent].calls += 1;
        });
        return html`<ul class="space-y-3">${Object.keys(byAgent).map(agent => {
          const info = byAgent[agent];
          const modes = Object.keys(info.modes);
          const capped = stage === 'enforce' && modes.indexOf('observe') !== -1;
          return html`<li class="tf-card-quiet p-3 space-y-1.5">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <span class="text-sm text-white">${agentLabel(agent)}</span>
              <span class="text-[11px] text-gray-500">${plural(info.calls, 'call')} · last ${timeAgo(info.last)}</span>
            </div>
            <div class="flex flex-wrap gap-1">${modes.map(m => html`<span class="tf-chip ${m === 'observe' ? 'tf-chip-amber' : m === 'managed' ? 'tf-chip-emerald' : 'tf-chip-gray'}" title="${HOOK_MODES[m] || m}">${m}</span>`)}</div>
            <p class="text-[11px] text-gray-400">${modes.map(m => HOOK_MODES[m] || m).join('; ')}.</p>
            ${capped ? html`<p class="text-[11px] text-amber-300" role="note">This project is in Enforce, but this agent's hook is capped to observe on its machine, so its calls are never refused. On that machine, run <span class="font-mono">python threefold.py connect --mode managed</span>.</p>` : ''}
          </li>`;
        })}</ul>`;
      }

      function historyList(history) {
        return html`<ol class="space-y-2">${history.slice().reverse().map(h => html`<li class="flex flex-wrap items-baseline gap-x-3 gap-y-1 text-xs">
          <span class="font-mono text-gray-500 whitespace-nowrap">${dateTime(h.at)}</span>
          <span class="tf-chip ${h.action === 'demote' ? 'tf-chip-amber' : h.action === 'promote' ? 'tf-chip-purple' : 'tf-chip-gray'}">${h.action}</span>
          ${Array.isArray(h.enforce) && h.enforce.length ? html`<span class="text-gray-300">enforce: <span class="font-mono">${h.enforce.join(', ')}</span></span>` : ''}
          ${Array.isArray(h.observe) && h.observe.length ? html`<span class="text-gray-500">observe: <span class="font-mono">${h.observe.join(', ')}</span></span>` : ''}
          ${h.by ? html`<span class="text-gray-600">by ${h.by}</span>` : ''}
        </li>`)}</ol>`;
      }

      function promoteBody() {
        const rules = (state.detail.readiness && state.detail.readiness.rules) || [];
        const chosen = state.selected;
        const count = rules.filter(r => chosen.has(r.rule_key)).length;
        return html`<p class="text-xs text-gray-300">Checked rules start refusing from the next call. Unchecked rules keep observing: they record what they would refuse, and refuse nothing. Ready and Quiet rules are checked for you; the rest need a look first.</p>
          <ul class="space-y-2">${rules.map((r, i) => html`<li>
            <label class="flex items-start gap-3 tf-card-quiet p-3 cursor-pointer">
              <input type="checkbox" class="mt-0.5 accent-purple-500" ${i === 0 ? raw('id="dialog-first"') : ''} data-change="promote-toggle" data-rule="${r.rule_key}" ${chosen.has(r.rule_key) ? raw('checked') : ''} />
              <span class="min-w-0 flex-1">
                <span class="flex flex-wrap items-center gap-2"><span class="font-mono text-xs text-white tf-break">${r.rule_key}</span>${stateChip(r.state)}</span>
                <span class="block text-[11px] text-gray-400 mt-1">${num(r.would_refuse)} flagged · ${num(r.correct)} correct · ${num(r.false_alarms)} false alarm${r.false_alarms === 1 ? '' : 's'} · ${num(r.unreviewed)} unreviewed${r.recommendation ? html` — ${r.recommendation}` : ''}</span>
              </span>
            </label>
          </li>`)}</ul>
          <p id="promote-summary" class="text-xs ${count ? 'text-gray-300' : 'text-amber-300'}">${count
            ? plural(count, 'rule') + ' will enforce; ' + plural(rules.length - count, 'rule') + ' will keep observing.'
            : 'No rule is checked, so nothing would be refused. Check at least one.'}</p>
          <p id="promote-error" class="text-xs text-rose-300" role="alert"></p>`;
      }

      function promoteFooter(busy) {
        const rules = (state.detail.readiness && state.detail.readiness.rules) || [];
        const count = rules.filter(r => state.selected.has(r.rule_key)).length;
        return html`<button type="button" class="tf-btn" data-action="close-dialog">Cancel</button>
          <button type="button" class="tf-btn tf-btn-primary" data-action="promote-confirm" ${count && !busy ? '' : raw('disabled')}>${busy ? 'Promoting…' : 'Promote with ' + plural(count, 'rule')}</button>`;
      }

      function writeError(err, verb) {
        if (T.isAuthError(err)) return verb + ' needs the operator. Sign in with python threefold.py open on the machine that holds the key, then try again.';
        return 'Nothing changed: ' + err.message + '.';
      }

      ctx.actions({
        'promote-open': () => {
          const rules = (state.detail && state.detail.readiness && state.detail.readiness.rules) || [];
          const enforcing = rules.filter(r => r.mode_now === 'enforce').map(r => r.rule_key);
          const stage = ((state.detail && state.detail.readiness && state.detail.readiness.summary) || {}).stage;
          const preset = stage === 'enforce' && enforcing.length
            ? enforcing
            : rules.filter(r => r.state === 'ready' || r.state === 'quiet').map(r => r.rule_key);
          state.selected = new Set(preset);
          openDialog(html`Promote ${T.projectName(name)} to Enforce`, promoteBody(), promoteFooter(false));
        },
        'promote-toggle': el => {
          const key = el.getAttribute('data-rule');
          if (el.checked) state.selected.add(key); else state.selected.delete(key);
          const summary = document.getElementById('promote-summary');
          const rules = state.detail.readiness.rules || [];
          const count = rules.filter(r => state.selected.has(r.rule_key)).length;
          if (summary) {
            summary.className = 'text-xs ' + (count ? 'text-gray-300' : 'text-amber-300');
            summary.textContent = count
              ? plural(count, 'rule') + ' will enforce; ' + plural(rules.length - count, 'rule') + ' will keep observing.'
              : 'No rule is checked, so nothing would be refused. Check at least one.';
          }
          setHtml(document.getElementById('dialog-footer'), promoteFooter(false));
        },
        'promote-confirm': () => {
          const rules = state.detail.readiness.rules || [];
          const enforce = rules.filter(r => state.selected.has(r.rule_key)).map(r => r.rule_key);
          if (!enforce.length) return;
          setHtml(document.getElementById('dialog-footer'), promoteFooter(true));
          return T.api('/api/projects/' + encodeURIComponent(name) + '/promote', { method: 'POST', body: { enforce } }).then(() => {
            if (!ctx.alive()) return;
            closeDialog();
            toast(() => T.projectNameText(name) + ' is in Enforce: ' + plural(enforce.length, 'rule') + ' now refuse' + (enforce.length === 1 ? 's' : '') + '.');
            load();
          }, err => {
            if (!ctx.alive()) return;
            const el = document.getElementById('promote-error');
            if (el) el.textContent = writeError(err, 'Promoting');
            setHtml(document.getElementById('dialog-footer'), promoteFooter(false));
          });
        },
        'demote-open': () => {
          openDialog('Back to Observe?', html`<p class="text-sm text-gray-300">Every rule of <span class="font-mono">${T.projectName(name)}</span> stops refusing from the next call. Everything is still judged and recorded, and the readiness you built up is kept.</p>
            <p id="demote-error" class="text-xs text-rose-300" role="alert"></p>`,
            html`<button type="button" class="tf-btn" data-action="close-dialog">Cancel</button><button type="button" id="dialog-first" class="tf-btn tf-btn-warn" data-action="demote-confirm">Back to Observe</button>`);
        },
        'demote-confirm': () => {
          return T.api('/api/projects/' + encodeURIComponent(name) + '/demote', { method: 'POST', body: {} }).then(() => {
            if (!ctx.alive()) return;
            closeDialog();
            toast(() => T.projectNameText(name) + ' is back in Observe. Nothing is refused from the next call.');
            load();
          }, err => {
            if (!ctx.alive()) return;
            const el = document.getElementById('demote-error');
            if (el) el.textContent = writeError(err, 'Going back to Observe');
          });
        }
      });
      return load();
    }

    function setupPanel(name) {
      const cmd = connectCommands(name);
      return html`<div class="space-y-3">
        <div><p class="tf-label">Windows, PowerShell</p>${T.commandBlock(cmd.powershell, 'PowerShell connect command')}</div>
        <div><p class="tf-label">macOS or Linux</p>${T.commandBlock(cmd.posix, 'macOS and Linux connect command')}</div>
        <p class="text-[11px] text-gray-500">Run it at the root of the repository. It detects the agents on the machine, starts in Observe, and ends by sending one harmless call you will see above. <a class="tf-link" href="#/connect">The guided version</a> waits for that call with you.</p>
      </div>`;
    }

    // A list of calls as rows that open their detail. Shared by the project
    // screen and the calls screen.
    function callsList(rows, options) {
      options = options || {};
      const showProject = options.project !== false;
      const desktop = html`<div class="hidden md:block tf-scroll-x">
        <table class="tf-table">
          <thead><tr>
            <th scope="col">When</th><th scope="col">Outcome</th>
            ${showProject ? html`<th scope="col">Project</th>` : ''}
            <th scope="col">Agent</th><th scope="col">Call</th><th scope="col">Rule</th><th scope="col">Review</th>
          </tr></thead>
          <tbody>${rows.map(row => html`<tr class="cursor-pointer" data-row-href="${callHref(row)}">
            <td class="whitespace-nowrap"><a href="${callHref(row)}" class="tf-link-quiet" title="${dateTime(row.timestamp)}">${timeAgo(row.timestamp)}</a></td>
            <td>${outcomeChip(row)}</td>
            ${showProject ? html`<td class="font-mono text-gray-300 tf-break">${T.projectName(row.project_name)}</td>` : ''}
            <td class="text-gray-300 whitespace-nowrap">${agentLabel(row.agent)}</td>
            <td class="min-w-[12rem]"><span class="font-mono text-gray-200">${row.tool_name}</span> <span class="font-mono text-gray-500 tf-break">${targetOf(row)}</span></td>
            <td class="font-mono text-gray-400 tf-break">${outcomeOf(row) === 'approved' ? '' : ruleKeyOf(row)}</td>
            <td>${outcomeOf(row) === 'observed' ? reviewChip(row.review) : ''}</td>
          </tr>`)}</tbody>
        </table>
      </div>`;
      const mobile = html`<ul class="md:hidden space-y-2">${rows.map(row => html`<li>
        <a href="${callHref(row)}" class="block tf-card-quiet p-3 space-y-1.5">
          <span class="flex flex-wrap items-center justify-between gap-2">${outcomeChip(row)}<span class="text-[11px] text-gray-500">${timeAgo(row.timestamp)}</span></span>
          <span class="block text-xs"><span class="font-mono text-gray-200">${row.tool_name}</span> <span class="font-mono text-gray-500 tf-break">${targetOf(row)}</span></span>
          <span class="block text-[11px] text-gray-500">${showProject ? html`<span class="font-mono">${T.projectName(row.project_name)}</span> · ` : ''}${agentLabel(row.agent)}${outcomeOf(row) !== 'approved' ? html` · <span class="font-mono">${ruleKeyOf(row)}</span>` : ''}</span>
          ${outcomeOf(row) === 'observed' ? html`<span class="block">${reviewChip(row.review)}</span>` : ''}
        </a>
      </li>`)}</ul>`;
      return html`${desktop}${mobile}`;
    }

    // ------------------------------------------------------------- review

    function viewReview(ctx) {
      const project = T.PROJECT_PATTERN.test(ctx.params.project || '') ? ctx.params.project : '';
      const rule = /^[A-Za-z0-9_.:-]{1,80}$/.test(ctx.params.rule || '') ? ctx.params.rule : '';
      const days = pickDays(ctx.params.days, 30);
      const sub = 'Calls a rule in Observe would have refused and nobody has labelled. Correct if the rule was right to flag it, False alarm if the call should run. A rule becomes Ready when everything it flagged is correct.';
      const state = { items: [], cursor: null, loadingMore: false, error: null, groupsOrder: [] };
      ctx.render(loadingView('Review', sub, ['table']));

      function fetchPage(cursor) {
        return T.api('/api/decisions' + query({ kind: 'observed', review: 'unreviewed', days, project, rule, limit: 200, cursor }));
      }

      function load() {
        return fetchPage(null).then(body => {
          if (!ctx.alive()) return;
          state.items = (body && Array.isArray(body.items)) ? body.items.filter(r => !r.review) : [];
          state.cursor = body && body.next_cursor ? body.next_cursor : null;
          draw();
        }, err => {
          if (ctx.alive()) ctx.render(html`${pageTitle('Review', sub)}${failure(err, 'the review queue')}`);
        });
      }

      function groups() {
        const map = {};
        const order = [];
        state.items.forEach(row => {
          const key = JSON.stringify([row.project_name || '', ruleKeyOf(row)]);
          if (!map[key]) { map[key] = { key, project: row.project_name || '', rule: ruleKeyOf(row), items: [] }; order.push(key); }
          map[key].items.push(row);
        });
        // A project's groups sit together; within a project, the rule with the
        // most waiting first. Each group keeps its calls newest first.
        return order.map(k => map[k]).sort((a, b) =>
          a.project.localeCompare(b.project) || b.items.length - a.items.length || a.rule.localeCompare(b.rule));
      }

      function filters() {
        return html`<div class="flex flex-wrap items-center gap-2">
          ${windowPicker('#/review', days, { project, rule })}
          ${project || rule ? html`<a href="${reviewHref({ days })}" class="tf-btn tf-btn-quiet tf-btn-sm">Show every project</a>` : ''}
        </div>`;
      }

      function draw() {
        const list = groups();
        const scope = [project && html`<span class="font-mono">${T.projectName(project)}</span>`, rule && html`rule <span class="font-mono">${rule}</span>`].filter(Boolean);
        const head = pageTitle('Review', sub, filters());
        if (!list.length) {
          ctx.render(html`${head}
            <div class="tf-card p-6 space-y-3" data-state="empty">
              <h2 class="text-base font-semibold text-white">Nothing waits for a label${scope.length ? html` in ${scope}` : ''}</h2>
              <p class="text-sm text-gray-400">Every call a rule would have refused in ${windowWords(days)} has a label, or no rule in Observe flagged one. Rules whose flags were all correct now read Ready on their project's page.</p>
              <div class="flex flex-wrap gap-2"><a class="tf-btn tf-btn-primary" href="${project ? projectHref(project) : '#/projects'}">${project ? html`Open ${T.projectName(project)}` : 'Open the projects'}</a><a class="tf-btn" href="${callsHref({ kind: 'observed', days, project })}">See the labelled calls</a></div>
            </div>`);
          return;
        }
        ctx.render(html`${head}
          <p class="text-xs text-gray-400 mb-4" id="review-count"><strong class="text-white" data-metric="unreviewed">${num(state.items.length)}</strong> call${state.items.length === 1 ? '' : 's'} waiting in ${plural(list.length, 'group')}${scope.length ? html` · ${scope}` : ''}${state.cursor ? ', and more beyond these' : ''}.</p>
          <p id="review-error" class="text-xs text-rose-300 mb-3" role="alert"></p>
          <div class="space-y-4">${list.map((g, gi) => html`<section class="tf-card p-4 md:p-5 space-y-3" aria-labelledby="group-${gi}">
            <div class="flex flex-wrap items-start justify-between gap-3">
              <div class="min-w-0">
                <h2 id="group-${gi}" class="text-sm font-semibold text-white flex flex-wrap items-center gap-2">
                  <a href="${projectHref(g.project)}" class="tf-link-quiet font-mono tf-break">${T.projectName(g.project)}</a>
                  <span class="tf-chip tf-chip-amber font-mono">${g.rule}</span>
                  <span class="text-xs font-normal text-gray-500">${plural(g.items.length, 'call')}</span>
                </h2>
                ${GATE_KEYS[g.rule] ? html`<p class="tf-section-sub">${GATE_KEYS[g.rule]}</p>` : ''}
              </div>
              <div class="flex flex-wrap gap-2">
                <button type="button" class="tf-btn tf-btn-good tf-btn-sm" data-action="label-group" data-group="${g.key}" data-label="correct">All ${g.items.length} correct</button>
                <button type="button" class="tf-btn tf-btn-danger tf-btn-sm" data-action="label-group" data-group="${g.key}" data-label="false_alarm">All false alarm</button>
              </div>
            </div>
            <label class="block"><span class="sr-only">Note for the labels you set in this group</span>
              <input id="note-${gi}" type="text" maxlength="200" class="tf-input w-full" placeholder="Optional note, sent with the labels you set in this group (200 characters)" /></label>
            <ul class="divide-y divide-gray-800/70">${g.items.map(row => html`<li class="py-3 flex flex-col md:flex-row md:items-start gap-3">
              <div class="min-w-0 flex-1 space-y-1">
                <p class="text-xs"><span class="font-mono text-gray-200">${row.tool_name}</span> <span class="font-mono text-gray-400 tf-break">${targetOf(row)}</span></p>
                <p class="text-[11px] text-gray-400 tf-break">${reasonOf(row)}</p>
                <p class="text-[11px] text-gray-500">${agentLabel(row.agent)} · <span title="${dateTime(row.timestamp)}">${timeAgo(row.timestamp)}</span> · <a class="tf-link" href="${callHref(row)}">details</a></p>
              </div>
              <div class="flex gap-2 shrink-0">
                <button type="button" class="tf-btn tf-btn-good tf-btn-sm" data-action="label-one" data-verdict="${row.verdict_id}" data-timestamp="${row.timestamp}" data-label="correct" data-group-index="${gi}" aria-label="Correct: ${row.tool_name} ${targetOf(row)}">Correct</button>
                <button type="button" class="tf-btn tf-btn-danger tf-btn-sm" data-action="label-one" data-verdict="${row.verdict_id}" data-timestamp="${row.timestamp}" data-label="false_alarm" data-group-index="${gi}" aria-label="False alarm: ${row.tool_name} ${targetOf(row)}">False alarm</button>
              </div>
            </li>`)}</ul>
          </section>`)}</div>
          ${state.cursor ? html`<div class="mt-4"><button type="button" class="tf-btn" data-action="more" ${state.loadingMore ? raw('disabled') : ''}>${state.loadingMore ? 'Loading…' : 'Load more'}</button></div>` : ''}`);
      }

      function noteFor(groupIndex) {
        const el = document.getElementById('note-' + groupIndex);
        const text = el && typeof el.value === 'string' ? el.value.trim().slice(0, 200) : '';
        return text;
      }

            sub: t.would_refuse ? 'they ran; a rule in Observe flagged them' : 'no observing rule flagged a call',
            spark: T.sparkline(series.map(r => r.observed || 0), { label: 'Would refuse per day', color: C.observed, labels: dayLabels }) },
          // Read from the ledger rather than the rollups: whether a refused
          // agent then did the same thing acceptably is a question about the
          // order of its calls. The calls listing cannot filter by origin, so
          // the link opens every refusal, and the label says so.
          { label: 'Self-corrected', metric: 'self_corrected', icon: 'refresh', term: 'refused, then done right',
            value: selfCorrectionShown(data.self_correction) ? data.self_correction.self_corrected : null,
            href: callsHref({ kind: 'refused', days }), sub: selfCorrectionWords(data.self_correction),
            opens: SELF_CORRECTION_SCOPE + ' Opens every refused call in this window', more: 'See the refusals' },
          { label: visitor ? 'Waiting for a label' : 'Waiting for your label', metric: 'needs_review', value: t.needs_review, href: callsHref({ kind: 'observed', review: 'unreviewed', days }), icon: 'inbox', term: 'needs review',
            sub: t.needs_review ? 'label them so their rules can become Ready' : 'every flagged call has a label' },
          { label: 'Projects', metric: 'projects', value: t.projects, href: '#/projects', icon: 'folder', more: 'See the projects',
            sub: num(stages.observe) + ' in Observe · ' + num(stages.enforce) + ' in Enforce' },
          { label: codingCount !== null ? 'Coding agents' : 'Agents', metric: codingCount !== null ? 'coding_agents' : 'agents',
            value: codingCount !== null ? codingCount : t.agents, href: callsHref({ days }), icon: 'terminal', sub: agentWords }
        ];

        const outcome = T.donut([
          { label: 'Refused', value: t.refused, color: C.refused, href: callsHref({ kind: 'refused', days }) },
          { label: 'Would refuse', value: t.would_refuse, color: C.observed, href: callsHref({ kind: 'observed', days }) },
          { label: 'Approved', value: t.approved, color: C.approved, href: callsHref({ kind: 'approved', days }) }
        ], { title: 'Outcome of every call', sub: 'calls' });

        const origins = byOrigin.length
          ? html`<div class="mt-5 pt-4 border-t border-gray-800">
              <p class="tf-label">Where calls came from</p>
              <ul class="flex flex-wrap gap-1.5">${byOrigin.map(o => html`<li class="tf-chip tf-chip-gray" title="${ORIGIN_WORDS[o.origin] || o.origin}"><span class="text-gray-400">${o.origin}</span><span class="font-mono">${num(o.calls)}</span></li>`)}</ul>
            </div>`
          : '';

        const rules = byRule.filter(r => (r.refused || 0) + (r.would_refuse || 0) > 0)
          .sort((a, b) => ((b.refused || 0) + (b.would_refuse || 0)) - ((a.refused || 0) + (a.would_refuse || 0)));
        const ruleBars = rules.length
          ? T.hbars(rules.map(r => ({
              label: r.rule_key, href: callsHref({ rule: r.rule_key, days }),
              segments: [
                { value: r.refused || 0, label: 'refused', color: C.refused, href: callsHref({ rule: r.rule_key, kind: 'refused', days }) },
                { value: r.would_refuse || 0, label: 'would refuse', color: C.observed, href: callsHref({ rule: r.rule_key, kind: 'observed', days }) }
              ],
              sublabel: GATE_KEYS[r.rule_key] || ''
            })), { title: 'By rule', keys: [{ label: 'Refused', color: C.refused }, { label: 'Would refuse', color: C.observed }] })
          : emptyNote('No rule refused or flagged a call in this window.', html`Every call passed every gate. <a class="tf-link" href="${callsHref({ days })}">See the calls</a>.`);

        ctx.render(html`${head}${fresh}${sourceNote(data, who)}
          <div class="space-y-8">
            ${attentionStrip(data, days, att, who)}
            <section aria-labelledby="numbers-title">
              <div class="tf-ops-head"><div>
                <h2 id="numbers-title" class="tf-ops-h2">${T.icon('chart', 18)}The numbers</h2>
                <p class="tf-ops-sub">Every tile opens the calls behind it.</p>
              </div></div>
              <div class="tf-ops-tiles">${tiles.map(tile)}</div>
            </section>
            <div class="space-y-4">
              <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
                ${card('Calls per day', dailyWords(series), html`<div id="daily-chart">${dailyChart()}</div>`, 'lg:col-span-2 min-w-0')}
                ${card('Outcome', null, html`${outcome}${origins}`, 'min-w-0')}
              </div>
              <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                ${card('By rule', 'A call two rules flagged counts under each, so these add up to more than the tiles.', ruleBars, 'min-w-0')}
                ${agentsCard(byAgent)}
              </div>
              ${card('By project', 'Open a project to promote it.', projectsTable(byProject, days, true, !att.noisy ? undefined : att.noisy.error || att.noisy.stale ? null : falseAlarmsByProject(att.noisy)), 'min-w-0')}
            </div>
          </div>`);
        if (firstPaint) {
          firstPaint = false;
          const view = document.getElementById('view');
          if (view && typeof view.querySelectorAll === 'function') T.reveal(view.querySelectorAll('.tf-ops-att, .tf-ops-tile'), { stagger: 35 });
          T.animateNumbers(view);
        }
      }

      let resizeTimer = null;
      const onResize = () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          const el = document.getElementById('daily-chart');
          if (el && data && data.totals && data.totals.calls) setHtml(el, dailyChart());
        }, 150);
      };
      const timer = setInterval(() => {
        if (document.visibilityState !== 'hidden') load(true);
      }, REFRESH_MS);
      const onVisible = () => {
        if (document.visibilityState === 'visible' && Date.now() - loadedAt > REFRESH_MS) load(true);
      };
      window.addEventListener('resize', onResize);
      document.addEventListener('visibilitychange', onVisible);
      ctx.onLeave(() => {
        clearInterval(timer);
        clearTimeout(resizeTimer);
        if (typeof window.removeEventListener === 'function') window.removeEventListener('resize', onResize);
        if (typeof document.removeEventListener === 'function') document.removeEventListener('visibilitychange', onVisible);
      });
      // Resuming a halted session, from the strip. The route records who
      // cleared the halt and why, so both are asked for; the name is kept in
      // this browser for next time, as a convenience only.
      const NAME_KEY = 'threefold-operator-name';
      function resumeBody(id, halt) {
        let remembered = '';
        try { remembered = localStorage.getItem(NAME_KEY) || ''; } catch (err) { /* a convenience */ }
        return html`<p class="text-sm text-gray-300">Session <span class="font-mono text-white tf-break">${id}</span> was halted${halt && halt.trip_reason ? html`: <span class="text-gray-200">${halt.trip_reason}</span>` : ''}. Resuming clears the halt and keeps its history and spend, so the gates still apply to its next call.</p>
          <label class="block"><span class="tf-label">Why it is safe to resume</span>
            <input id="dialog-first" type="text" maxlength="240" class="tf-input w-full" placeholder="For example: the loop was a retry I stopped" /></label>
          <label class="block"><span class="tf-label">Your name, for the record</span>
            <input id="resume-name" type="text" maxlength="120" class="tf-input w-full" value="${remembered}" autocomplete="name" /></label>
          <p id="resume-error" class="text-xs text-rose-300" role="alert"></p>`;
      }
      function resumeFooter(id, busy) {
        return html`<button type="button" class="tf-btn" data-action="close-dialog">Cancel</button>
          <button type="button" class="tf-btn tf-btn-primary" data-action="resume-confirm" data-session="${id}" ${busy ? raw('disabled') : ''}>${busy ? 'Resuming…' : 'Resume the session'}</button>`;
      }
      ctx.actions({
        refresh: () => load(true, true),
        'resume-open': el => {
          const id = el.getAttribute('data-session') || '';
          const halt = att.sessions && att.sessions.rows ? att.sessions.rows.find(s => s && s.session_id === id) : null;
          openDialog('Resume this session?', resumeBody(id, halt), resumeFooter(id, false));
        },
        'resume-confirm': el => {
          const id = el.getAttribute('data-session') || '';
          const field = key => { const node = document.getElementById(key); return node && typeof node.value === 'string' ? node.value.trim() : ''; };
          const reason = field('dialog-first').slice(0, 240);
          const name = field('resume-name').slice(0, 120);
          const problem = document.getElementById('resume-error');
          if (!reason || !name) {
            if (problem) problem.textContent = 'Say why, and who you are: the record of a cleared halt keeps both.';
            return;
          }
          try { localStorage.setItem(NAME_KEY, name); } catch (err) { /* a convenience */ }
          setHtml(document.getElementById('dialog-footer'), resumeFooter(id, true));
          return T.api('/sessions/' + encodeURIComponent(id) + '/resume', { method: 'POST', body: { operator_name: name, reason } }).then(() => {
            if (!ctx.alive()) return;
            closeDialog();
            toast('Resumed ' + id + '. Its history and spend are kept, so the gates still apply.');
            loadSessions();
          }, err => {
            if (!ctx.alive()) return;
            const said = document.getElementById('resume-error');
            if (said) said.textContent = T.isAuthError(err) ? 'Resuming needs the operator. Sign in with python threefold.py open, then try again.' : 'Nothing changed: ' + trimStop(err.message) + '.';
            setHtml(document.getElementById('dialog-footer'), resumeFooter(id, false));
          });
        }
      });
      T.whoami().then(answer => {
        who = answer;
        // Who is reading decides what the strip offers: the public demo's
        // words, and the operator's Resume.
        if (ctx.alive() && data && answer) draw();
      });
      return load(false);
    }

    function pageTitleActions(days) {
      return html`${windowPicker('#/overview', days)}<button type="button" class="tf-btn tf-btn-quiet" data-action="refresh" aria-label="Refresh now">${raw(T.ICONS.refresh)} Refresh</button>`;
    }

    function overviewEmpty(days) {
      return html`<div class="tf-card p-6 md:p-8 space-y-5" data-state="empty">
        <div class="space-y-2 max-w-2xl">
          <h2 class="text-lg font-semibold text-white">No tool call reached this stack in ${windowWords(days)}</h2>
          <p class="text-sm text-gray-400">Threefold records a row each time it judges an agent's tool call. None arrived in this window, which means no agent has been pointed here lately, not that nothing was found.</p>
        </div>
        <ol class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <li class="tf-card-quiet p-4 space-y-2">
            <p class="text-xs font-semibold text-purple-300">Connect a repository</p>
            <p class="text-xs text-gray-400">One command. It starts in Observe, so nothing your agents do is refused while you watch.</p>
            <a href="#/connect" class="tf-btn tf-btn-primary tf-btn-sm">Connect ${raw(T.ICONS.arrow)}</a>
          </li>
          <li class="tf-card-quiet p-4 space-y-2">
            <p class="text-xs font-semibold text-purple-300">Try it in a minute</p>
            <p class="text-xs text-gray-400">On the public demo: a sandbox project seeded with calls from three agents, reviewed and promoted by you.</p>
            <a href="#/try" class="tf-btn tf-btn-sm">Start the walkthrough</a>
          </li>
          <li class="tf-card-quiet p-4 space-y-2">
            <p class="text-xs font-semibold text-purple-300">${days < 30 ? 'Look further back' : 'Watch a refusal now'}</p>
            <p class="text-xs text-gray-400">${days < 30 ? 'Calls older than this window are still in the ledger.' : 'The demo page runs the circuit breaker against the live service.'}</p>
            ${days < 30 ? html`<a href="#/overview?days=30" class="tf-btn tf-btn-sm">Show 30 days</a>` : html`<a href="${T.pageHref('index.html')}" class="tf-btn tf-btn-sm">Open the demo</a>`}
          </li>
        </ol>
      </div>`;
    }

    // A project table, shared by the overview and the projects screen: a row a
    // project, its stage and where its calls come from, what its rules did,
    // how much of it waits for a label, and its readiness. `fa` is the
    // window's false alarms by project (falseAlarmsByProject), or null while
    // they are unread. Every number opens the calls behind it.
    function projectsTable(rows, days, compact, fa) {
      if (!rows.length) {
        return emptyNote('No project sent a call in this window.', html`<a class="tf-link" href="#/connect">Connect a repository</a> and its first call appears here.`);
      }
      const sorted = rows.slice().sort((a, b) => (b.needs_review || 0) - (a.needs_review || 0) || (b.calls || 0) - (a.calls || 0));
      const numLink = (value, params, tone) => html`<a href="${callsHref(Object.assign({ days }, params))}" class="tf-num-link ${value ? tone : 'text-gray-500'}">${num(value)}</a>`;
      const meta = p => compact
        ? html`last seen ${timeAgo(p.last_seen)}`
        : html`${Array.isArray(p.agents) && p.agents.length ? p.agents.map(agentLabel).join(', ') : 'no agent yet'} · hooks ${chipWords(p.hook_modes)} · last seen ${timeAgo(p.last_seen)}`;
      const desktop = html`<div class="hidden md:block tf-scroll-x tf-ops-portfolio">
        <table class="tf-table">
          <thead><tr>
            <th scope="col">Project</th><th scope="col">Stage</th>
            <th scope="col" class="num">Calls</th><th scope="col" class="num">Refused</th>
            <th scope="col" class="num">Would refuse</th><th scope="col" class="num">Waiting</th>
            <th scope="col">Readiness</th>
          </tr></thead>
          <tbody>${sorted.map(p => html`<tr data-row-href="${projectHref(p.project)}">
            <th scope="row" class="font-normal"><span class="tf-ops-pname">
              <span class="flex flex-wrap items-center gap-2"><a href="${projectHref(p.project)}" class="tf-link-quiet font-mono tf-break">${T.projectName(p.project)}</a>${sourceBadge(p)}</span>
              <span class="tf-ops-pmeta">${meta(p)}</span>
            </span></th>
            <td>${stageChip(p.stage, p.configured)}</td>
            <td class="num">${numLink(p.calls, { project: p.project }, 'text-gray-200')}</td>
            <td class="num">${numLink(p.refused, { project: p.project, kind: 'refused' }, 'text-rose-300')}</td>
            <td class="num">${numLink(p.would_refuse, { project: p.project, kind: 'observed' }, 'text-amber-300')}</td>
            <td class="num">${p.needs_review ? html`<a href="${reviewHref({ project: p.project })}" class="tf-num-link text-sky-300">${num(p.needs_review)}</a>` : html`<span class="text-gray-500">${num(p.needs_review)}</span>`}</td>
            <td>${readinessCell(p, fa)}</td>
          </tr>`)}</tbody>
        </table>
      </div>`;
      const mobile = html`<ul class="md:hidden space-y-2">${sorted.map(p => html`<li class="tf-ops-pcard">
        <div class="flex items-start justify-between gap-2">
          <span class="min-w-0 flex flex-col gap-1"><a href="${projectHref(p.project)}" class="tf-link-quiet font-mono text-sm tf-break">${T.projectName(p.project)}</a><span class="flex flex-wrap gap-1">${sourceBadge(p)}</span></span>
          ${stageChip(p.stage, p.configured)}
        </div>
        <div class="tf-ops-pnums">
          ${[['Calls', p.calls, {}, 'text-gray-200'], ['Refused', p.refused, { kind: 'refused' }, 'text-rose-300'], ['Would refuse', p.would_refuse, { kind: 'observed' }, 'text-amber-300']].map(([label, value, params, tone]) =>
            html`<a href="${callsHref(Object.assign({ days, project: p.project }, params))}"><b class="${value ? tone : 'text-gray-500'}">${num(value)}</b><small>${label}</small></a>`)}
          <a href="${reviewHref({ project: p.project })}"><b class="${p.needs_review ? 'text-sky-300' : 'text-gray-500'}">${num(p.needs_review)}</b><small>Waiting</small></a>
        </div>
        ${readinessCell(p, fa)}
        <p class="tf-ops-pmeta">${meta(p)}</p>
      </li>`)}</ul>`;
      return html`${desktop}${mobile}`;
    }

    function chipWords(values) {
      return Array.isArray(values) && values.length ? values.join(', ') : 'not reported';
    }

    function chipList(values, label) {
      if (!Array.isArray(values) || !values.length) return html`<span class="text-gray-600">—</span>`;
      return html`<span class="inline-flex flex-wrap gap-1">${values.map(v => html`<span class="tf-chip tf-chip-gray">${label ? label(v) : v}</span>`)}</span>`;
    }

    // ---------------------------------------------------------- projects

    function viewProjects(ctx) {
      const sub = 'Every project seen in the last 7 days, configured or not: its stage, what its rules did, and how ready it is to enforce.';
      ctx.render(loadingView('Projects', sub, ['table']));
      // The window's false alarms, read beside the list: one is what makes a
      // project's rule Noisy, and the rows do not count them. A read that
      // fails leaves readiness unclaimed rather than the list unread.
      const alarms = T.api('/api/decisions' + query({ review: 'false_alarm', days: 7, limit: 200 })).then(body => {
        const rows = body && Array.isArray(body.items) ? body.items.filter(r => r && r.review === 'false_alarm') : [];
        return falseAlarmsByProject({ rows, partial: !!(body && body.next_cursor) });
      }, () => null);
      return Promise.all([T.api('/api/projects'), alarms]).then(([body, fa]) => {
        if (!ctx.alive()) return;
        const rows = (body && Array.isArray(body.projects)) ? body.projects : [];
        const observe = rows.filter(p => p.stage === 'observe').length;
        const enforce = rows.filter(p => p.stage === 'enforce').length;
        const waiting = sum(rows, 'needs_review');
        const summary = rows.length ? html`<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
            <div class="tf-card tf-tile"><span class="tf-tile-label">${T.icon('folder', 16)}Projects</span><span class="tf-tile-value" data-metric="projects">${num(rows.length)}</span><span class="tf-tile-sub">seen in the last 7 days</span></div>
            <div class="tf-card tf-tile"><span class="tf-tile-label">${T.icon('eye', 16)}In Observe</span><span class="tf-tile-value">${num(observe)}</span><span class="tf-tile-sub">judged and recorded, nothing refused</span></div>
            <div class="tf-card tf-tile"><span class="tf-tile-label">${T.icon('shield', 16)}In Enforce</span><span class="tf-tile-value">${num(enforce)}</span><span class="tf-tile-sub">the rules in force refuse</span></div>
            <a class="tf-card tf-card-link tf-tile" href="${reviewHref()}"><span class="tf-tile-label">${T.icon('inbox', 16)}Waiting for a label</span><span class="tf-tile-value">${num(waiting)}</span><span class="tf-tile-sub">${waiting ? 'across ' + plural(rows.filter(p => (p.needs_review || 0) > 0).length, 'project') : 'nothing to review'}</span></a>
          </div>` : '';
        if (!rows.length) {
          ctx.render(html`${pageTitle('Projects', sub)}
            ${T.emptyState({ icon: 'folder', text: 'No project sent a call in the last 7 days. Connect a repository: it starts in Observe, and its first call appears here.', action: { label: 'Connect a repository', href: '#/connect', primary: true } })}`);
          return;
        }
        ctx.render(html`${pageTitle('Projects', sub, html`<a href="#/connect" class="tf-btn tf-btn-primary">${T.icon('plug', 16)}Connect a repository</a>`)}
          ${summary}
          ${card('The portfolio', 'Most waiting first. A row opens its project, and a number the calls behind it.', projectsTable(rows, 7, false, fa))}`);
      }, err => {
        if (ctx.alive()) ctx.render(html`${pageTitle('Projects', sub)}${failure(err, 'the project list')}`);
      });
    }

    // ----------------------------------------------------------- project

    function connectCommands(name) {
      const base = T.STACK_URL;
      return {
        powershell: 'irm ' + base + 'install.py -OutFile threefold.py; py threefold.py connect --project ' + name,
        posix: 'curl -fsSL ' + base + 'install.py -o threefold.py && python3 threefold.py connect --project ' + name
      };
    }

    // The order a project's rules are read in: what needs a decision first.
    const STATE_ORDER = { noisy: 0, needs_review: 1, ready: 2, quiet: 3 };

    // The stage, as a reader remembers it: a short headline, one line of what
    // follows from the readiness beside it, and the one action that moves it
    // (Promote in Observe, Back to Observe in Enforce). How the stage works is
    // one click away, under the actions, rather than read before them.
    function stageHero(name, stage, config, readiness, days) {
      const rules = (readiness && readiness.rules) || [];
      const summary = (readiness && readiness.summary) || {};
      const observing = rules.filter(r => r.mode_now === 'observe').map(r => r.rule_key);
      const enforcing = rules.filter(r => r.mode_now === 'enforce').length;
      const waiting = sum(rules, 'unreviewed');
      const noisy = rules.filter(r => r.state === 'noisy').length;
      const canEnforce = rules.filter(r => r.state === 'ready' || r.state === 'quiet').length;
      const enforce = stage === 'enforce';
      const track = html`<div class="tf-ops-track" aria-hidden="true">
          <span class="tf-ops-step" id="stage-step-observe" data-on="${enforce ? '' : 'observe'}">${T.icon('eye', 14)}Observe</span>
          <span class="tf-ops-track-line"></span>
          <span class="tf-ops-step" id="stage-step-enforce" data-on="${enforce ? 'enforce' : ''}">${T.icon('shield', 14)}Enforce</span>
        </div>`;
      const could = html`<strong class="text-white">${num(canEnforce)} of ${plural(rules.length, 'rule')}</strong> could enforce today`;
      const more = (what, body) => html`<details class="tf-ops-hero-more"><summary>${what}${T.icon('chevrondown', 14)}</summary>${body}</details>`;
      const words = enforce
        ? html`<h2 id="stage-title" tabindex="-1" class="tf-ops-hero-title">${enforcing
              ? html`In Enforce: ${plural(enforcing, 'rule')} ${enforcing === 1 ? 'refuses' : 'refuse'} a call before it runs`
              : 'In Enforce: the rules in force refuse a call before it runs'}</h2>
            <p class="tf-ops-hero-text">${observing.length
              ? html`<strong class="text-white">${plural(observing.length, 'rule')}</strong> still ${observing.length === 1 ? 'observes' : 'observe'}: <span class="font-mono text-gray-200">${observing.join(', ')}</span>. Back to Observe applies from the next call.`
              : 'Every rule of this project is in force. Back to Observe applies from the next call.'}</p>
            <div class="tf-ops-hero-actions">
              <button type="button" class="tf-btn tf-btn-warn" data-action="demote-open">${T.icon('eye', 16)}Back to Observe</button>
              <button type="button" class="tf-btn" data-action="promote-open">Change which rules enforce</button>
            </div>
            ${more('How Enforce works', html`<p class="tf-ops-hero-fine">An agent's write or command that breaks a rule in force is refused, and the agent is told why. A rule that still observes records what it would refuse, and refuses nothing. A hook capped to observe on its machine is never refused, whatever this says; the agents list below flags one.</p>`)}`
        : html`<h2 id="stage-title" tabindex="-1" class="tf-ops-hero-title">In Observe: the rules record, and refuse nothing</h2>
            <p class="tf-ops-hero-text">${!rules.length
              ? 'Readiness appears once this project sends calls in the window.'
              : canEnforce === rules.length
                ? html`Every rule reads Ready or Quiet: promote, and ${rules.length === 1 ? 'it refuses' : 'they refuse'} from the next call.`
                : waiting
                  ? html`${could}; ${plural(waiting, 'call')} ${waiting === 1 ? 'waits' : 'wait'} for a label.`
                  : noisy
                    ? html`${could}; ${plural(noisy, 'noisy rule')} should keep observing.`
                    : html`${could}.`}</p>
            <div class="tf-ops-hero-actions">
              <button type="button" class="tf-btn tf-btn-primary tf-btn-lg" data-action="promote-open" ${rules.length ? '' : raw('disabled')}>${T.icon('shield', 16)}Promote to Enforce…</button>
              ${waiting ? html`<a class="tf-btn tf-btn-lg" href="${reviewHref({ project: name })}">${T.icon('inbox', 16)}Label ${plural(waiting, 'waiting call')}</a>` : ''}
            </div>
            ${more('How Observe works', html`<p class="tf-ops-hero-fine">Your agents work exactly as before. What a rule <em>would</em> have refused is listed below: mark each one correct or false alarm. A rule whose flags were all correct is Ready; one that flagged nothing is Quiet. Promote, and the rules you choose start refusing; the others keep observing.</p>
              <p class="tf-ops-hero-fine">One thing is refused even here: a call carrying a credential, which the hook refuses on the machine and never sends. A call the hook holds back, such as one outside the project, is neither sent nor recorded.${config ? '' : ' This project has no configuration yet, so it follows the stack default.'}</p>`)}`;
      const tally = [
        ['ready', summary.rules_ready, 'Ready', 'tf-good'], ['quiet', summary.rules_quiet, 'Quiet', ''],
        ['needs_review', summary.rules_needing_review, 'To review', 'text-sky-300'], ['noisy', summary.rules_noisy, 'Noisy', 'tf-bad']
      ];
      // A rate over nothing is not a rate: with no label yet, it says so.
      const reviewed = typeof summary.reviewed === 'number' ? summary.reviewed : 0;
      const side = html`<aside class="tf-ops-hero-side" aria-label="Readiness">
          <span class="tf-ops-att-kicker">Readiness, ${windowWords(days)}</span>
          ${rules.length
            ? html`<div class="tf-ops-tally">${tally.map(([key, value, label, tone]) => html`<div><b class="${value ? tone : 'text-gray-500'}">${num(value)}</b><small>${label}</small></div>`)}</div>`
            : html`<p class="text-xs text-gray-400">No rule has judged a call from this project in the window.</p>`}
          <p class="text-xs text-gray-500" data-note="false-alarm-rate">${reviewed > 0 && typeof summary.false_alarm_rate === 'number'
            ? html`False-alarm rate ${pct(summary.false_alarm_rate)} over ${plural(reviewed, 'labelled call')}.`
            : 'No flagged call is labelled yet, so there is no false-alarm rate.'}</p>
        </aside>`;
      return html`<section class="tf-ops-hero" id="stage-hero" data-stage="${enforce ? 'enforce' : 'observe'}" aria-label="Stage">
        <div class="tf-ops-hero-grid">
          <div class="min-w-0">${track}${words}</div>
          ${side}
        </div>
      </section>`;
    }

    // One rule's record: what it flagged, how much of that was labelled right
    // or wrong, and what to do next. The bar is the calls it flagged, split by
    // their label; every part opens those calls.
    function ruleRow(name, r, days) {
      const would = typeof r.would_refuse === 'number' ? r.would_refuse : 0;
      const parts = [
        { key: 'correct', value: r.correct || 0, label: 'correct', color: C.approved, href: callsHref({ project: name, rule: r.rule_key, review: 'correct', days }) },
        { key: 'false_alarm', value: r.false_alarms || 0, label: r.false_alarms === 1 ? 'false alarm' : 'false alarms', color: C.refused, href: callsHref({ project: name, rule: r.rule_key, review: 'false_alarm', days }) },
        { key: 'unreviewed', value: r.unreviewed || 0, label: 'not labelled', color: UNLABELLED, href: reviewHref({ project: name, rule: r.rule_key }) }
      ];
      const drawn = parts.filter(p => p.value > 0);
      const bar = would > 0 && drawn.length
        ? html`<div class="tf-ops-stack" role="img" aria-label="${r.rule_key}: ${parts.map(p => num(p.value) + ' ' + p.label).join(', ')} of ${num(would)} flagged">${drawn.map(p => html`<a href="${p.href}" style="flex-grow:${p.value};background:${p.color}" aria-label="${num(p.value)} ${p.label}, open these calls" data-tf-tip="${r.rule_key} · ${p.label}" data-tf-tip-value="${num(p.value)}" data-tf-tip-color="${p.color}"></a>`)}</div>`
        : html`<div class="tf-ops-stack" aria-hidden="true"></div>`;
      const words = would > 0
        ? html`<p class="tf-ops-stack-words"><span><a class="tf-num-link" href="${callsHref({ project: name, rule: r.rule_key, kind: 'observed', days })}">${num(would)}</a> flagged</span>${parts.filter(p => p.value > 0).map(p => html`<span><i style="background:${p.color}"></i>${num(p.value)} ${p.label}</span>`)}${r.refused ? html`<span class="text-rose-300"><a class="tf-num-link" href="${callsHref({ project: name, rule: r.rule_key, kind: 'refused', days })}">${num(r.refused)}</a> refused</span>` : ''}</p>`
        : html`<p class="tf-ops-stack-words">Flagged nothing in ${windowWords(days)}${r.refused ? html` · <span class="text-rose-300"><a class="tf-num-link" href="${callsHref({ project: name, rule: r.rule_key, kind: 'refused', days })}">${num(r.refused)}</a> refused</span>` : ''}</p>`;
      return html`<li class="tf-ops-rule" data-state="${r.state || ''}">
        <div class="tf-ops-rule-name">
          <span class="tf-ops-chips">${stateChip(r.state)}${r.mode_now === 'enforce' ? html`<span class="tf-chip tf-chip-purple">${T.icon('shield', 13)}enforce</span>` : html`<span class="tf-chip tf-chip-amber">${T.icon('eye', 13)}observe</span>`}</span>
          <a href="${callsHref({ project: name, rule: r.rule_key, days })}" class="tf-link-quiet tf-ops-rule-key">${r.rule_key}</a>
          <span class="tf-ops-rule-what">${r.kind === 'gate' ? (GATE_KEYS[r.rule_key] || 'a gate of the service') : 'a layering rule'}${r.last_seen ? ' · last flagged ' + timeAgo(r.last_seen) : ''}</span>
        </div>
        <div class="min-w-0">${bar}${words}</div>
        <div class="min-w-0">
          <p class="tf-ops-rule-say">${inflect(r.recommendation) || STATES[r.state] && STATES[r.state].says || ''}</p>
          ${r.unreviewed ? html`<p class="tf-ops-rule-links"><a class="tf-link" href="${reviewHref({ project: name, rule: r.rule_key })}">Label ${plural(r.unreviewed, 'call')}</a></p>` : ''}
        </div>
      </li>`;
    }

    // The colour of a flagged call nobody has labelled: neutral, never a
    // status. It is the design system's --tf-text-4, read from the stylesheet,
    // and resolved to its value because a tooltip keys only a literal colour.
    const UNLABELLED = (() => {
      try {
        const value = getComputedStyle(document.documentElement).getPropertyValue('--tf-text-4').trim();
        if (/^#[0-9a-fA-F]{3,8}$/.test(value)) return value;
      } catch (err) { /* the fallback below */ }
      return '#818ba5';
    })();

    function readinessList(name, rules, days) {
      if (!rules.length) return emptyNote('No rule readiness yet.', 'Readiness appears once this project has sent calls in the window.');
      const sorted = rules.slice().sort((a, b) => (STATE_ORDER[a.state] === undefined ? 9 : STATE_ORDER[a.state]) - (STATE_ORDER[b.state] === undefined ? 9 : STATE_ORDER[b.state]));
      // A Quiet rule that refused nothing has nothing to show but an empty
      // bar and the same two sentences, and a project has several; one row
      // names them all, so the rules that need a decision stand out. A Quiet
      // rule that refused calls keeps its own row: it did something.
      const silent = sorted.filter(r => r.state === 'quiet' && !r.refused);
      const rows = silent.length >= 2 ? sorted.filter(r => silent.indexOf(r) === -1) : sorted;
      const flagged = rows.some(r => (r.would_refuse || 0) > 0);
      return html`${flagged ? T.legend([{ label: 'Correct', color: C.approved }, { label: 'False alarm', color: C.refused }, { label: 'Not labelled', color: UNLABELLED }]) : ''}
        <ul class="tf-ops-rules${flagged ? ' mt-3' : ''}">${rows.map(r => ruleRow(name, r, days))}${silent.length >= 2 ? quietRow(name, silent, days) : ''}</ul>`;
    }

    // The Quiet rules that refused nothing, as one row: how many, each by its
    // key and mode, and what follows for them.
    function quietRow(name, silent, days) {
      const enforcing = silent.filter(r => r.mode_now === 'enforce').length;
      const observing = silent.length - enforcing;
      const say = !observing
        ? 'Enforcing, and none of them flagged anything in this window.'
        : !enforcing
          ? 'Promoting them would have refused nothing seen here.'
          : html`${num(enforcing)} enforce and ${num(observing)} observe; promoting the ${observing === 1 ? 'one that observes' : num(observing) + ' that observe'} would have refused nothing seen here.`;
      return html`<li class="tf-ops-rule tf-ops-rule-quiet" data-state="quiet" data-rules="${silent.length}">
        <div class="tf-ops-rule-name">
          <span class="tf-ops-chips">${stateChip('quiet')}</span>
          <span class="tf-ops-quiet-count">${plural(silent.length, 'rule')} flagged nothing</span>
          <span class="tf-ops-rule-what">in ${windowWords(days)}</span>
        </div>
        <ul class="tf-ops-quiet-keys" aria-label="The quiet rules">${silent.map(r => html`<li><a class="tf-chip tf-chip-gray font-mono" href="${callsHref({ project: name, rule: r.rule_key, days })}" title="${r.rule_key}: ${r.mode_now === 'enforce' ? 'enforcing' : 'observing'}, ${r.kind === 'gate' ? (GATE_KEYS[r.rule_key] || 'a gate of the service') : 'a layering rule'}">${T.icon(r.mode_now === 'enforce' ? 'shield' : 'eye', 13)}${r.rule_key}</a></li>`)}</ul>
        <div class="min-w-0"><p class="tf-ops-rule-say">${say}</p></div>
      </li>`;
    }

    function viewProject(ctx) {
      const name = ctx.args[0] || '';
      const days = pickDays(ctx.params.days, 14, true);
      const state = { detail: null, recent: null, recentError: null, selected: null, busy: false };
      // The alias is what this screen is addressed by and what every request
      // below sends; T.projectName adds the reader's own name for display only.
      const shown = T.projectName(name);
      const crumb = crumbs([{ label: 'Projects', href: '#/projects' }, { label: shown }]);
      ctx.render(html`${crumb}${loadingView(shown, 'Reading its stage and readiness…', ['hero', 'tiles', 'table'])}`);

      function load() {
        const detail = T.api('/api/projects/' + encodeURIComponent(name) + query({ days }));
        const recent = T.api('/api/decisions' + query({ project: name, days, limit: 100 })).catch(err => { state.recentError = err; return null; });
        return Promise.all([detail, recent]).then(([d, r]) => {
          if (!ctx.alive()) return;
          state.detail = d || {};
          state.recent = r && Array.isArray(r.items) ? r.items : null;
          draw();
        }, err => {
          if (!ctx.alive()) return;
          if (err && err.kind === 'not_found') {
            ctx.render(html`${crumb}${pageTitle(shown, null)}${emptyNote('This stack has no record of a project by this name: no configuration, and no call in the window.', html`If it was just connected, its first call may still be on its way. <a class="tf-link" href="#/connect">Connect it</a>, or go back to <a class="tf-link" href="#/projects">the projects</a>.`)}`);
            return;
          }
          ctx.render(html`${crumb}${pageTitle(shown, null)}${failure(err, 'this project')}`);
        });
      }

      function draw() {
        const d = state.detail;
        const config = d.config || null;
        const readiness = d.readiness || {};
        const summary = readiness.summary || {};
        const rules = Array.isArray(readiness.rules) ? readiness.rules : [];
        const stage = summary.stage || (config && config.stage) || 'observe';
        const sandbox = !!(config && config.sandbox);

        const stats = [
          ['Days observed', summary.days_observed, 'days_observed', 'with a call, in ' + windowWords(days)],
          ['Calls observed', summary.calls_observed, 'calls_observed', 'judged and recorded'],
          ['Would refuse', summary.would_have_refused, 'would_have_refused', 'flagged by a rule in Observe'],
          ['Reviewed', summary.reviewed, 'reviewed', 'flagged calls with a label'],
          ['False alarms', summary.false_alarms, 'false_alarms', 'labels that said the rule was wrong']
        ];
        const corrected = summary.self_correction;
        const statTiles = html`<div class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-6 gap-3">
          ${stats.map(([label, value, metric, says]) => html`<div class="tf-card tf-tile"><span class="tf-tile-label">${label}</span><span class="tf-tile-value" data-metric="${metric}">${num(value)}</span><span class="tf-tile-sub">${says}</span></div>`)}
          <a href="${callsHref({ project: name, kind: 'refused', days })}" class="tf-card tf-card-link tf-tile" aria-label="Self-corrected: ${selfCorrectionWords(corrected, true)}. ${SELF_CORRECTION_SCOPE} Opens every refused call of this project in this window">
            <span class="tf-tile-label">Self-corrected</span>
            <span class="tf-tile-value" data-metric="self_corrected">${num(selfCorrectionShown(corrected) ? corrected.self_corrected : null)}</span>
            <span class="tf-tile-sub">${selfCorrectionWords(corrected, true)}</span>
          </a>
        </div>`;

        const recent = state.recent;
        const recentBody = recent === null
          ? (state.recentError ? failure(state.recentError, 'the recent calls') : emptyNote('Recent calls could not be read.'))
          : recent.length ? callsList(recent.slice(0, 12), { project: false, foldRule: true }) : emptyNote('No call from this project in ' + windowWords(days) + '.', 'Run the connect command below, then use your agent as usual.');

        ctx.render(html`${crumb}
          ${pageTitle(html`<span class="font-mono">${shown}</span>`, null, html`${stageChip(stage, config ? true : false)}${sourceBadge({ project: name, sandbox, source: d.source })}${sandbox ? html`<span class="tf-chip tf-chip-sky" title="A sandbox made by the walkthrough; its stage expires on its own">Sandbox · expires within a day</span>` : ''}`)}
          <div class="space-y-6">
            ${stageHero(name, stage, config, readiness, days)}
            ${statTiles}
            ${card('Readiness, rule by rule', 'What needs a decision comes first. One false alarm makes a rule Noisy.', html`${readinessList(name, rules, days)}${T.PROJECT_PATTERN.test(name) ? html`<p class="text-xs mt-4"><a class="tf-link" data-link="draft-rule" href="${T.pageHref('rules.html' + query({ project: name }) + '#draft')}">Draft a rule for this project</a> <span class="text-gray-500">from a sentence, with Amazon Bedrock; it starts in Observe beside the rules above.</span></p>` : ''}`)}
            <div class="grid grid-cols-1 lg:grid-cols-5 gap-4">
              ${card('Recent calls', null, html`${recentBody}${recent && recent.length ? html`<p class="mt-3"><a class="tf-link text-xs" href="${callsHref({ project: name, days })}">All calls from ${shown}</a></p>` : ''}`, 'lg:col-span-3 min-w-0')}
              <div class="lg:col-span-2 space-y-4 min-w-0">
                ${card('Agents', recent && recent.length ? 'From the latest ' + recent.length + ' calls.' : null, agentsPanel(recent, stage))}
                ${card('Connect another machine', null, setupPanel(name))}
              </div>
            </div>
            ${config && Array.isArray(config.history) && config.history.length ? card('Stage history', 'Newest first.', historyList(config.history)) : ''}
          </div>`);
      }

      function agentsPanel(recent, stage) {
        if (!recent || !recent.length) return emptyNote('No agent has sent a call from this project in the window.');
        const byAgent = {};
        recent.forEach(row => {
          const agent = row.agent || 'unknown';
          const mode = row.hook_mode || 'unknown';
          byAgent[agent] = byAgent[agent] || { modes: {}, last: row.timestamp, calls: 0 };
          byAgent[agent].modes[mode] = true;
          byAgent[agent].calls += 1;
        });
        return html`<ul class="space-y-3">${Object.keys(byAgent).map(agent => {
          const info = byAgent[agent];
          const modes = Object.keys(info.modes);
          const capped = stage === 'enforce' && modes.indexOf('observe') !== -1;
          return html`<li class="tf-card-quiet p-3 space-y-1.5">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <span class="text-sm text-white inline-flex items-center gap-2">${T.icon('terminal', 16)}${agentLabel(agent)}</span>
              <span class="text-xs text-gray-500">${plural(info.calls, 'call')} · last ${timeAgo(info.last)}</span>
            </div>
            <div class="flex flex-wrap items-center gap-x-2 gap-y-1">${modes.map(m => html`<span class="tf-chip ${m === 'observe' ? 'tf-chip-amber' : m === 'managed' ? 'tf-chip-emerald' : 'tf-chip-gray'}" title="${HOOK_MODES[m] || m}">${m}</span><span class="text-xs text-gray-400">${HOOK_MODE_WORDS[m] || HOOK_MODES[m] || m}</span>`)}</div>
            ${capped ? html`<p class="text-xs text-amber-300" role="note">This project is in Enforce, but this agent's hook is capped to observe on its machine, so its calls are never refused. On that machine, run <span class="font-mono">python threefold.py connect --mode managed</span>.</p>` : ''}
          </li>`;
        })}</ul>`;
      }

      function historyList(history) {
        return html`<ol class="space-y-2">${history.slice().reverse().map(h => html`<li class="flex flex-wrap items-baseline gap-x-3 gap-y-1 text-xs">
          <span class="font-mono text-gray-500 whitespace-nowrap">${dateTime(h.at)}</span>
          <span class="tf-chip ${h.action === 'demote' ? 'tf-chip-amber' : h.action === 'promote' ? 'tf-chip-purple' : 'tf-chip-gray'}">${h.action}</span>
          ${Array.isArray(h.enforce) && h.enforce.length ? html`<span class="text-gray-300">enforce: <span class="font-mono">${h.enforce.join(', ')}</span></span>` : ''}
          ${Array.isArray(h.observe) && h.observe.length ? html`<span class="text-gray-500">observe: <span class="font-mono">${h.observe.join(', ')}</span></span>` : ''}
          ${h.by ? html`<span class="text-gray-500">by ${h.by}</span>` : ''}
        </li>`)}</ol>`;
      }

      function promoteBody() {
        const rules = (state.detail.readiness && state.detail.readiness.rules) || [];
        const chosen = state.selected;
        const count = rules.filter(r => chosen.has(r.rule_key)).length;
        return html`<p class="text-xs text-gray-300">Checked rules start refusing from the next call. Unchecked rules keep observing: they record what they would refuse, and refuse nothing. Ready and Quiet rules are checked for you; the rest need a look first.</p>
          <ul class="space-y-2">${rules.map((r, i) => html`<li>
            <label class="flex items-start gap-3 tf-card-quiet p-3 cursor-pointer">
              <input type="checkbox" class="mt-0.5 accent-purple-500" ${i === 0 ? raw('id="dialog-first"') : ''} data-change="promote-toggle" data-rule="${r.rule_key}" ${chosen.has(r.rule_key) ? raw('checked') : ''} />
              <span class="min-w-0 flex-1">
                <span class="flex flex-wrap items-center gap-2"><span class="font-mono text-xs text-white tf-break">${r.rule_key}</span>${stateChip(r.state)}</span>
                <span class="block text-xs text-gray-400 mt-1">${num(r.would_refuse)} flagged · ${num(r.correct)} correct · ${num(r.false_alarms)} false alarm${r.false_alarms === 1 ? '' : 's'} · ${num(r.unreviewed)} unreviewed${r.recommendation ? html` — ${inflect(r.recommendation)}` : ''}</span>
              </span>
            </label>
          </li>`)}</ul>
          <p id="promote-summary" class="text-xs ${count ? 'text-gray-300' : 'text-amber-300'}">${count
            ? plural(count, 'rule') + ' will enforce; ' + plural(rules.length - count, 'rule') + ' will keep observing.'
            : 'No rule is checked, so nothing would be refused. Check at least one.'}</p>
          <p id="promote-error" class="text-xs text-rose-300" role="alert"></p>`;
      }

      function promoteFooter(busy) {
        const rules = (state.detail.readiness && state.detail.readiness.rules) || [];
        const count = rules.filter(r => state.selected.has(r.rule_key)).length;
        return html`<button type="button" class="tf-btn" data-action="close-dialog">Cancel</button>
          <button type="button" class="tf-btn tf-btn-primary" data-action="promote-confirm" ${count && !busy ? '' : raw('disabled')}>${busy ? 'Promoting…' : 'Promote with ' + plural(count, 'rule')}</button>`;
      }

      function demoteFooter(busy) {
        return html`<button type="button" class="tf-btn" data-action="close-dialog">Cancel</button><button type="button" id="dialog-first" class="tf-btn tf-btn-warn" data-action="demote-confirm" ${busy ? raw('disabled aria-busy="true"') : ''}>${busy ? 'Going back to Observe…' : 'Back to Observe'}</button>`;
      }

      // After a promotion or a demotion the screen is drawn again, and the
      // button that opened the dialog is gone with it. The focus goes to the
      // stage's new headline, so a keyboard or a screen reader carries on
      // from what changed, and the stage the project moved to pulses once.
      function stageChanged(stage) {
        if (!ctx.alive() || !state.detail) return;
        const title = document.getElementById('stage-title');
        if (title && typeof title.focus === 'function') { try { title.focus({ preventScroll: false }); } catch (err) { /* courtesy */ } }
        T.pulse(document.getElementById('stage-step-' + stage), stage === 'enforce' ? '' : 'warn');
        const hero = document.getElementById('stage-hero');
        T.pulse(hero, stage === 'enforce' ? '' : 'warn');
      }

      function writeError(err, verb) {
        if (T.isAuthError(err)) return verb + ' needs the operator. Sign in with python threefold.py open on the machine that holds the key, then try again.';
        return 'Nothing changed: ' + err.message + '.';
      }

      ctx.actions({
        'promote-open': () => {
          const rules = (state.detail && state.detail.readiness && state.detail.readiness.rules) || [];
          const enforcing = rules.filter(r => r.mode_now === 'enforce').map(r => r.rule_key);
          const stage = ((state.detail && state.detail.readiness && state.detail.readiness.summary) || {}).stage;
          const preset = stage === 'enforce' && enforcing.length
            ? enforcing
            : rules.filter(r => r.state === 'ready' || r.state === 'quiet').map(r => r.rule_key);
          state.selected = new Set(preset);
          openDialog(html`Promote ${T.projectName(name)} to Enforce`, promoteBody(), promoteFooter(false));
        },
        'promote-toggle': el => {
          const key = el.getAttribute('data-rule');
          if (el.checked) state.selected.add(key); else state.selected.delete(key);
          const summary = document.getElementById('promote-summary');
          const rules = state.detail.readiness.rules || [];
          const count = rules.filter(r => state.selected.has(r.rule_key)).length;
          if (summary) {
            summary.className = 'text-xs ' + (count ? 'text-gray-300' : 'text-amber-300');
            summary.textContent = count
              ? plural(count, 'rule') + ' will enforce; ' + plural(rules.length - count, 'rule') + ' will keep observing.'
              : 'No rule is checked, so nothing would be refused. Check at least one.';
          }
          setHtml(document.getElementById('dialog-footer'), promoteFooter(false));
        },
        'promote-confirm': () => {
          const rules = state.detail.readiness.rules || [];
          const enforce = rules.filter(r => state.selected.has(r.rule_key)).map(r => r.rule_key);
          if (!enforce.length || state.busy) return;
          state.busy = true;
          setHtml(document.getElementById('dialog-footer'), promoteFooter(true));
          return T.api('/api/projects/' + encodeURIComponent(name) + '/promote', { method: 'POST', body: { enforce } }).then(() => {
            state.busy = false;
            if (!ctx.alive()) return;
            closeDialog();
            toast(() => T.projectNameText(name) + ' is in Enforce: ' + plural(enforce.length, 'rule') + ' now refuse' + (enforce.length === 1 ? 's' : '') + '.');
            return load().then(() => stageChanged('enforce'));
          }, err => {
            state.busy = false;
            if (!ctx.alive()) return;
            const el = document.getElementById('promote-error');
            if (el) el.textContent = writeError(err, 'Promoting');
            setHtml(document.getElementById('dialog-footer'), promoteFooter(false));
          });
        },
        'demote-open': () => {
          openDialog('Back to Observe?', html`<p class="text-sm text-gray-300">Every rule of <span class="font-mono">${T.projectName(name)}</span> stops refusing from the next call. Everything is still judged and recorded, and the readiness you built up is kept.</p>
            <p id="demote-error" class="text-xs text-rose-300" role="alert"></p>`,
            demoteFooter(false));
        },
        'demote-confirm': () => {
          // One press sends one demote: the button is disabled and says so
          // while the request is out, and comes back if it fails.
          if (state.busy) return;
          state.busy = true;
          setHtml(document.getElementById('dialog-footer'), demoteFooter(true));
          return T.api('/api/projects/' + encodeURIComponent(name) + '/demote', { method: 'POST', body: {} }).then(() => {
            state.busy = false;
            if (!ctx.alive()) return;
            closeDialog();
            toast(() => T.projectNameText(name) + ' is back in Observe. Nothing is refused from the next call.');
            return load().then(() => stageChanged('observe'));
          }, err => {
            state.busy = false;
            if (!ctx.alive()) return;
            const el = document.getElementById('demote-error');
            if (el) el.textContent = writeError(err, 'Going back to Observe');
            setHtml(document.getElementById('dialog-footer'), demoteFooter(false));
          });
        }
      });
      return load();
    }

    function setupPanel(name) {
      const cmd = connectCommands(name);
      return html`<div class="space-y-3">
        <div><p class="tf-label">Windows, PowerShell</p>${T.commandBlock(cmd.powershell, 'PowerShell connect command')}</div>
        <div><p class="tf-label">macOS or Linux</p>${T.commandBlock(cmd.posix, 'macOS and Linux connect command')}</div>
        <p class="text-xs text-gray-400">At the root of the repository. <a class="tf-link" href="#/connect">The guided version</a> waits for its first call with you.</p>
      </div>`;
    }

    // A list of calls as rows that open their detail. Shared by the project
    // screen and the calls screen.
    function callsList(rows, options) {
      options = options || {};
      const showProject = options.project !== false;
      // A narrow card folds the rule under the call it judged, so a rule key
      // is never broken inside a word to fit a column of its own.
      const foldRule = options.foldRule === true;
      const desktop = html`<div class="hidden md:block tf-scroll-x">
        <table class="tf-table">
          <thead><tr>
            <th scope="col">When</th><th scope="col">Outcome</th>
            ${showProject ? html`<th scope="col">Project</th>` : ''}
            <th scope="col">Agent</th><th scope="col">Call</th>${foldRule ? '' : html`<th scope="col">Rule</th>`}<th scope="col">Review</th>
          </tr></thead>
          <tbody>${rows.map(row => html`<tr class="cursor-pointer" data-row-href="${callHref(row)}">
            <td class="whitespace-nowrap"><a href="${callHref(row)}" class="tf-link-quiet" title="${dateTime(row.timestamp)}">${timeAgo(row.timestamp)}</a></td>
            <td>${outcomeChip(row)}</td>
            ${showProject ? html`<td class="font-mono text-gray-300 tf-break">${T.projectName(row.project_name)}</td>` : ''}
            <td class="text-gray-300 whitespace-nowrap">${agentLabel(row.agent)}</td>
            <td class="min-w-[12rem]"><span class="font-mono text-gray-200">${row.tool_name}</span> <span class="font-mono text-gray-500 tf-break">${breakable(targetOf(row))}</span>${foldRule && outcomeOf(row) !== 'approved' ? html`<span class="block font-mono text-xs text-gray-400 mt-0.5">${breakable(ruleKeyOf(row))}</span>` : ''}</td>
            ${foldRule ? '' : html`<td class="font-mono text-gray-400 whitespace-nowrap">${outcomeOf(row) === 'approved' ? html`<span class="text-gray-600">—</span>` : ruleKeyOf(row)}</td>`}
            <td>${outcomeOf(row) === 'observed' ? reviewChip(row.review) : ''}</td>
          </tr>`)}</tbody>
        </table>
      </div>`;
      const mobile = html`<ul class="md:hidden space-y-2">${rows.map(row => html`<li>
        <a href="${callHref(row)}" class="block tf-card-quiet p-3 space-y-1.5">
          <span class="flex flex-wrap items-center justify-between gap-2">${outcomeChip(row)}<span class="text-xs text-gray-500">${timeAgo(row.timestamp)}</span></span>
          <span class="block text-xs"><span class="font-mono text-gray-200">${row.tool_name}</span> <span class="font-mono text-gray-500 tf-break">${targetOf(row)}</span></span>
          <span class="block text-xs text-gray-500">${showProject ? html`<span class="font-mono">${T.projectName(row.project_name)}</span> · ` : ''}${agentLabel(row.agent)}${outcomeOf(row) !== 'approved' ? html` · <span class="font-mono">${ruleKeyOf(row)}</span>` : ''}</span>
          ${outcomeOf(row) === 'observed' ? html`<span class="block">${reviewChip(row.review)}</span>` : ''}
        </a>
      </li>`)}</ul>`;
      return html`${desktop}${mobile}`;
    }

    // ------------------------------------------------------------- review

    // The queue of calls a rule in Observe would have refused, labelled from
    // the keyboard: J and K move, C marks correct, F false alarm, U takes the
    // last label back. Labels show at once and come back if the service
    // refuses them.
    // A page of the review queue: the most GET /api/decisions returns. The
    // ledger may hand back a cursor with a page that is not full, because it
    // reads day by day; only a full page says more calls are there.
    const REVIEW_PAGE = 200;
    const REVIEW_KEYS = [['J', 'next'], ['K', 'previous'], ['C', 'correct'], ['F', 'false alarm'], ['U', 'undo the last label']];

    // The one kind of project anyone may label on the public demo: a visitor's
    // sandbox, named as POST /api/sandbox names it. Every other project's
    // labels are the operator's.
    const SANDBOX_NAME = /^Acme-Sandbox-[0-9a-f]{8}$/;

    // Whether this reader may label a project's calls: the operator always; on
    // a stack that lets anyone write sandboxes, anyone, in a sandbox. A stack
    // that did not say who is reading is not second-guessed: the service
    // answers a label it refuses, and the queue puts the call back.
    function mayLabel(who, project) {
      if (!who || who.authenticated === true) return true;
      return who.sandbox_writes === true && SANDBOX_NAME.test(String(project || ''));
    }
    function isVisitor(who) { return !!who && who.authenticated !== true; }

    function viewReview(ctx) {
      const project = T.PROJECT_PATTERN.test(ctx.params.project || '') ? ctx.params.project : '';
      const rule = /^[A-Za-z0-9_.:-]{1,80}$/.test(ctx.params.rule || '') ? ctx.params.rule : '';
      const days = pickDays(ctx.params.days, 30);
      const sub = 'Calls a rule in Observe would have refused. Correct if the rule was right; False alarm if the call should run.';
      // `order` is this visit's group order. It is fixed when the queue is
      // first drawn, so a label never moves the group being worked, and a
      // group first seen later (Load more, an undo) joins at the end. `at` is
      // the row the keyboard is on, held by its key rather than its place, so
      // a label anywhere else cannot move it. `notes` keeps each group's note
      // across redraws. `labelled` holds the rows labelled on this visit and
      // still labelled; `saved` the batches Undo can take back. `engaged` is
      // set once the reader works the queue, and from then on a redraw hands
      // focus back to the row the keyboard is on.
      const state = { items: [], cursor: null, loadingMore: false, who: null, order: [], at: null, notes: {}, noteOpen: {}, labelled: {}, saved: [], engaged: false };
      ctx.render(loadingView('Review', sub, ['table']));

      function fetchPage(cursor) {
        return T.api('/api/decisions' + query({ kind: 'observed', review: 'unreviewed', days, project, rule, limit: REVIEW_PAGE, cursor }));
      }

      // Who is reading decides which groups can be labelled here, and on the
      // public demo it puts those first, so it is read with the first page.
      function load() {
        return Promise.all([fetchPage(null), T.whoami()]).then(([body, who]) => {
          if (!ctx.alive()) return;
          state.who = who || null;
          state.items = (body && Array.isArray(body.items)) ? body.items.filter(r => !r.review) : [];
          state.cursor = body && body.next_cursor ? body.next_cursor : null;
          state.full = !!(body && Array.isArray(body.items) && body.items.length >= REVIEW_PAGE);
          draw();
        }, err => {
          if (ctx.alive()) ctx.render(html`${pageTitle('Review', sub)}${failure(err, 'the review queue')}`);
        });
      }

      const rowKey = r => r.verdict_id + '|' + r.timestamp;
      const groupKey = r => JSON.stringify([r.project_name || '', ruleKeyOf(r)]);

      // A group is one rule in one project, because a label is written to that
      // project's own route. Groups a reader may label lead; then the rule
      // with the most waiting, with its projects after it, so what one rule
      // flagged is read together. The order is taken once and then kept.
      function settleOrder(list) {
        const known = {};
        state.order.forEach(k => { known[k] = true; });
        const fresh = list.filter(g => !known[g.key]);
        if (!fresh.length) return;
        const perRule = {};
        state.items.forEach(row => { const r = ruleKeyOf(row); perRule[r] = (perRule[r] || 0) + 1; });
        const open = g => (mayLabel(state.who, g.project) ? 1 : 0);
        // For the operator, a visitor's sandbox, which expires within a day,
        // follows the projects that are theirs; a visitor's order is `open`.
        const own = g => (isVisitor(state.who) || !SANDBOX_NAME.test(g.project) ? 1 : 0);
        fresh.sort((a, b) => open(b) - open(a) || own(b) - own(a) ||
          (perRule[b.rule] || 0) - (perRule[a.rule] || 0) || a.rule.localeCompare(b.rule) ||
          b.items.length - a.items.length || a.project.localeCompare(b.project));
        state.order = state.order.concat(fresh.map(g => g.key));
      }

      // The groups on screen, in this visit's order. Each keeps its calls
      // newest first, and its place in the order names its note and heading.
      function groups() {
        const map = {};
        const keys = [];
        state.items.forEach(row => {
          const key = groupKey(row);
          if (!map[key]) { map[key] = { key, project: row.project_name || '', rule: ruleKeyOf(row), items: [] }; keys.push(key); }
          map[key].items.push(row);
        });
        settleOrder(keys.map(k => map[k]));
        return state.order.filter(k => map[k]).map(k => Object.assign(map[k], { slot: state.order.indexOf(k), open: mayLabel(state.who, map[k].project) }));
      }

      // Every row, in the order the groups draw them, with its group.
      function ordered(list) {
        const rows = [];
        (list || groups()).forEach(g => g.items.forEach(row => rows.push({ row, g })));
        return rows;
      }

      // Where the keyboard is: the row held in `at`, or the first row when
      // that one has left the queue some other way.
      function currentIndex(rows) {
        const at = rows.findIndex(x => rowKey(x.row) === state.at);
        if (at >= 0) return at;
        state.at = rows.length ? rowKey(rows[0].row) : null;
        return rows.length ? 0 : -1;
      }

      // Before rows leave the queue: if the keyboard is on one of them, it
      // moves to the next row that stays, in the same group while one is left,
      // or else to the one before.
      function stepAside(leaving) {
        const rows = ordered();
        const here = currentIndex(rows);
        if (here < 0 || !leaving[state.at]) return;
        for (let i = here + 1; i < rows.length; i++) {
          if (!leaving[rowKey(rows[i].row)]) { state.at = rowKey(rows[i].row); return; }
        }
        for (let i = here - 1; i >= 0; i--) {
          if (!leaving[rowKey(rows[i].row)]) { state.at = rowKey(rows[i].row); return; }
        }
        state.at = null;
      }

      function filters() {
        return html`<div class="flex flex-wrap items-center gap-2">
          ${windowPicker('#/review', days, { project, rule })}
          ${project || rule ? html`<a href="${reviewHref({ days })}" class="tf-btn tf-btn-quiet tf-btn-sm">Show every project</a>` : ''}
        </div>`;
      }

      function labelledCount() { return Object.keys(state.labelled).length; }
      function distinct(list, key) { const seen = {}; list.forEach(g => { seen[g[key]] = true; }); return Object.keys(seen).length; }

      function signinHref() { return '#/signin' + query({ next: '/review' + query({ days, project, rule }) }); }

      function progress(list) {
        const waiting = state.items.length;
        const done = labelledCount();
        const total = waiting + done;
        const width = total ? Math.round((done / total) * 1000) / 10 : 0;
        const scope = [project && html`<span class="font-mono">${T.projectName(project)}</span>`, rule && html`rule <span class="font-mono">${rule}</span>`].filter(Boolean);
        return html`<div class="tf-ops-progress mb-3">
          <p class="text-xs text-gray-400" id="review-count"><strong class="text-white" data-metric="unreviewed">${num(waiting)}</strong> call${waiting === 1 ? '' : 's'} waiting, under ${plural(distinct(list, 'rule'), 'rule')} in ${plural(distinct(list, 'project'), 'project')}${scope.length ? html` · ${scope}` : ''}${state.cursor && state.full ? ', and more beyond these' : ''}${done ? html` · <span class="text-emerald-300">${plural(done, 'call')} labelled on this visit</span>` : ''}.</p>
          ${done ? html`<span class="tf-ops-meter" data-state="${waiting ? 'part' : 'done'}" role="img" aria-label="${num(done)} of ${num(total)} labelled on this visit"><span class="tf-ops-meter-track"><span class="tf-ops-meter-fill" style="width:${width}%"></span></span><span class="tf-ops-meter-words">${num(done)}/${num(total)}</span></span>` : ''}
        </div>`;
      }

      // On the public demo, signed out: which of these groups a visitor may
      // label, said before a key is pressed rather than after one fails.
      function visitorNote(list) {
        if (!isVisitor(state.who)) return '';
        const open = list.filter(g => g.open);
        return html`<div class="tf-ops-visitor mb-4" role="note" data-visitor="${open.length ? 'some' : 'none'}">
          ${T.icon('lock', 18)}
          <div class="min-w-0 space-y-1">
            <p class="text-sm text-white font-medium">${open.length
              ? html`You can label the ${plural(open.length, 'group')} from visitors' sandboxes, which come first.`
              : 'You are not signed in, and none of these groups is a sandbox\'s.'}</p>
            <p class="text-xs text-gray-400">Anyone may label a sandbox's calls on this public demo. The other projects' labels are the operator's; their groups read Operator only.</p>
          </div>
          <div class="flex flex-wrap gap-2">
            <a class="tf-btn tf-btn-sm${open.length ? '' : ' tf-btn-primary'}" href="#/try">Try it with your own sandbox</a>
            <a class="tf-btn tf-btn-quiet tf-btn-sm" href="${signinHref()}">${T.icon('signin', 14)}Sign in</a>
          </div>
        </div>`;
      }

      function keysLegend() {
        return html`<div class="tf-ops-keys mb-4 hidden md:flex" role="note" aria-label="Keyboard">
          <span class="text-gray-300 font-semibold">${T.icon('command', 14)}Keyboard</span>
          ${REVIEW_KEYS.map(([key, what]) => html`<span>${T.kbd(key)}${what}</span>`)}
        </div>`;
      }

      // A project's line inside a rule: who may label it, the bulk labels
      // when it holds more than one call, and its note. A group of one call is
      // labelled by its row's own buttons; a bulk button beside them would
      // say the same thing twice.
      function groupActions(g) {
        if (!g.open) {
          return html`<div class="tf-ops-proj-tools">
            <span class="tf-chip tf-chip-gray" title="Only the operator may label this project's calls">${T.icon('lock', 13)}Operator only</span>
            <a class="tf-btn tf-btn-quiet tf-btn-sm" href="${signinHref()}">Sign in to label</a>
          </div>`;
        }
        const noting = state.noteOpen[g.key] || state.notes[g.key];
        return html`<div class="tf-ops-proj-tools">
          ${noting ? '' : html`<button type="button" class="tf-ops-note-add" data-action="note-open" data-group="${g.key}"><span aria-hidden="true">+</span>Add a note to these labels</button>`}
          ${g.items.length < 2 ? '' : html`<button type="button" class="tf-btn tf-btn-good tf-btn-sm" data-action="label-group" data-group="${g.key}" data-label="correct">${T.icon('check', 14)}All ${g.items.length} correct</button>
          <button type="button" class="tf-btn tf-btn-danger tf-btn-sm" data-action="label-group" data-group="${g.key}" data-label="false_alarm">All false alarm</button>`}
        </div>`;
      }

      // A group's note, optional, sent with the labels set in it. It stays a
      // small link beside the project until the reader asks for it or has
      // written one, so a queue of small groups is not a column of fields.
      function noteField(g) {
        if (!state.noteOpen[g.key] && !state.notes[g.key]) return '';
        return html`<label class="block tf-ops-proj-note"><span class="sr-only">Note for the labels you set in this group</span>
          <input id="note-${g.slot}" type="text" maxlength="200" class="tf-input tf-input-sm w-full md:max-w-lg" data-change="note" data-group="${g.key}" value="${state.notes[g.key] || ''}" placeholder="Optional note, sent with the labels you set in this group" /></label>`;
      }

      function rowActions(row, g, here) {
        if (!g.open) return '';
        const hint = key => here ? html`<kbd class="tf-kbd tf-ops-kbd-hint" aria-hidden="true">${key}</kbd>` : '';
        return html`<div class="tf-ops-qrow-actions">
          <button type="button" class="tf-btn tf-btn-good tf-btn-sm" data-action="label-one" data-verdict="${row.verdict_id}" data-timestamp="${row.timestamp}" data-label="correct" aria-label="Correct: ${row.tool_name} ${targetOf(row)}">Correct${hint('C')}</button>
          <button type="button" class="tf-btn tf-btn-danger tf-btn-sm" data-action="label-one" data-verdict="${row.verdict_id}" data-timestamp="${row.timestamp}" data-label="false_alarm" aria-label="False alarm: ${row.tool_name} ${targetOf(row)}">False alarm${hint('F')}</button>
        </div>`;
      }

      // The sentence every call of a rule shares, said once above its calls,
      // and what differs call by call. A layering rule's reason is a lead
      // ("Layering rule 'x' refuses this write:"), which the chip already
      // names, then the rule's own description, then the file and what it
      // imports; only that last part differs. It is found from the calls
      // themselves: their common start cut back to a whole sentence, or,
      // for a lone call, where its description ends. A reason that splits
      // no way is shown whole on its row. Every part is the service's text
      // and is escaped where it is drawn.
      const RULE_LEAD = /^(?:Clean Architecture violation:\s*)?Layering rule '[^']*' (?:would refuse|refuses) this write:\s*/i;
      // `rows` are a section's calls; a section of one call reads the rule's
      // calls across the queue instead, so a lone call still finds where its
      // rule's description ends.
      function ruleWords(ruleKey, own) {
        const rows = own.length > 1 ? own : state.items.filter(r => ruleKeyOf(r) === ruleKey);
        const bodies = rows.map(r => String(reasonOf(r) || '').replace(RULE_LEAD, '').trim());
        let shared = '';
        if (bodies.length > 1 && bodies[0] && bodies.every(b => b === bodies[0])) shared = bodies[0];
        if (!shared && bodies.length > 1) {
          const first = bodies[0];
          let n = 0;
          while (n < first.length && bodies.every(b => b[n] === first[n])) n += 1;
          const cut = first.slice(0, n).lastIndexOf('. ');
          if (cut >= 20) shared = first.slice(0, cut + 1);
        }
        if (!shared) {
          const heads = bodies.map(b => { const at = b.indexOf(". '"); return at > 0 ? b.slice(0, at + 1) : ''; });
          if (heads.length && heads[0] && heads.every(h => h === heads[0])) shared = heads[0];
        }
        const detail = {};
        rows.forEach((r, i) => { detail[rowKey(r)] = shared && bodies[i].indexOf(shared) === 0 ? bodies[i].slice(shared.length).trim() : bodies[i]; });
        return { shared, detail };
      }

      // What differs, in a reader's words: the file is already on the row
      // above, so it is not said twice, and an import is set as code.
      // The ledger keeps a reason up to a length, so the pattern an import
      // matched can be cut short; the import is said, and the cut part is
      // left to the call's details rather than shown broken.
      function detailOf(row, text) {
        let t = String(text || '');
        const target = targetOf(row);
        if (target && t.indexOf("'" + target + "' ") === 0) t = t.slice(target.length + 3);
        const m = /^imports '([^']+)'(.*)$/.exec(t);
        if (!m) return { markup: t, words: t };
        const rest = /^, which matches '([^']+)'(.*)$/.exec(m[2]);
        const differs = rest && rest[1] !== m[1];
        const tail = rest ? html`${differs ? html`, which matches <code class="tf-ops-code">${rest[1]}</code>` : ''}${rest[2]}`
          : /^, which matches/.test(m[2]) ? '' : m[2];
        const words = 'imports ' + m[1] + (rest ? (differs ? ', which matches ' + rest[1] : '') + rest[2] : /^, which matches/.test(m[2]) ? '' : m[2]);
        return { markup: html`imports <code class="tf-ops-code">${m[1]}</code>${tail}`, words };
      }
      // A detail longer than a line of meta takes a line of its own.
      function detailIsLong(detail) { return detail.words.length > 72; }

      // The groups on screen, gathered by rule: a run of groups under the
      // same rule, that the reader may or may not label alike, is one
      // section. The order of the groups is the visit's own, so a rule whose
      // sandbox calls follow the operator's own projects is two sections.
      function sections(list) {
        const out = [];
        list.forEach(g => {
          const last = out[out.length - 1];
          if (last && last.rule === g.rule && last.open === g.open) last.groups.push(g);
          else out.push({ rule: g.rule, open: g.open, groups: [g] });
        });
        return out;
      }

      // Focus that a redraw took away: nowhere, the page itself, or a row the
      // redraw replaced.
      function focusLost() {
        const a = document.activeElement;
        if (!a || (document.body && a === document.body)) return true;
        if (typeof a.isConnected === 'boolean' && !a.isConnected) return true;
        return /^qrow-/.test(String(a.id || ''));
      }

      function draw() {
        const before = document.activeElement;
        const typing = before && /^note-/.test(String(before.id || '')) ? before.id : '';
        const list = groups();
        const rows = ordered(list);
        const here = currentIndex(rows);
        const scope = [project && html`<span class="font-mono">${T.projectName(project)}</span>`, rule && html`rule <span class="font-mono">${rule}</span>`].filter(Boolean);
        const head = pageTitle('Review', sub, filters());
        if (!list.length) {
          const done = labelledCount();
          ctx.render(html`${head}
            <div class="tf-card p-6 md:p-8 space-y-4" data-state="empty">
              <div class="flex items-start gap-4">
                <span class="tf-ops-arrived-mark" aria-hidden="true">${T.icon('check', 22)}</span>
                <div class="space-y-2 min-w-0">
                  <h2 class="text-lg font-semibold text-white">Nothing waits for a label${scope.length ? html` in ${scope}` : ''}</h2>
                  <p class="text-sm text-gray-400 max-w-2xl">${done ? plural(done, 'call') + ' labelled on this visit. ' : ''}Every call a rule would have refused in ${windowWords(days)} has a label, or no rule in Observe flagged one. Rules whose flags were all correct now read Ready on their project's page.</p>
                </div>
              </div>
              <p id="review-error" class="text-xs text-rose-300" role="alert"></p>
              <div class="flex flex-wrap gap-2"><a class="tf-btn tf-btn-primary" href="${project ? projectHref(project) : '#/projects'}">${project ? html`Open ${T.projectName(project)}` : 'Open the projects'}</a><a class="tf-btn" href="${callsHref({ kind: 'observed', days, project })}">See the labelled calls</a></div>
            </div>`);
          if (state.engaged && focusLost()) focusTitle();
          return;
        }
        let index = -1;
        ctx.render(html`${head}
          ${progress(list)}
          ${visitorNote(list)}
          ${keysLegend()}
          <p id="review-error" class="text-xs text-rose-300 mb-3" role="alert"></p>
          <div class="space-y-4">${sections(list).map((sec, si) => {
            const w = ruleWords(sec.rule, sec.groups.reduce((all, g) => all.concat(g.items), []));
            const sandboxes = sec.groups.every(g => SANDBOX_NAME.test(g.project));
            const calls = sec.groups.reduce((n, g) => n + g.items.length, 0);
            return html`<section class="tf-card tf-ops-rsec" aria-labelledby="rule-${si}" data-open="${sec.open ? 'true' : 'false'}">
            <div class="tf-ops-rsec-head">
              <h2 id="rule-${si}" class="tf-ops-group-title">
                <span class="tf-chip tf-chip-amber font-mono">${T.icon('eye', 13)}${sec.rule}</span>
                <span class="tf-ops-count">${num(calls)}</span>
                ${sandboxes ? html`<span class="text-xs font-normal text-gray-500">in ${sec.groups.length === 1 ? "a visitor's sandbox" : num(sec.groups.length) + " visitors' sandboxes"}</span>` : sec.groups.length > 1 ? html`<span class="text-xs font-normal text-gray-500">in ${plural(sec.groups.length, 'project')}</span>` : ''}
              </h2>
              <p class="tf-ops-rsec-rule">${w.shared || GATE_KEYS[sec.rule] || 'A layering rule: what a layer of the code may not import'}</p>
            </div>
            ${sec.groups.map(g => html`<div class="tf-ops-proj" data-open="${g.open ? 'true' : 'false'}">
              <div class="tf-ops-proj-head">
                <h3 id="group-${g.slot}" class="tf-ops-proj-title"><a href="${projectHref(g.project)}" class="tf-link-quiet font-mono tf-break">${T.projectName(g.project)}</a><span class="tf-ops-count">${num(g.items.length)}</span></h3>
                ${groupActions(g)}
              </div>
              ${g.open ? noteField(g) : ''}
              <ul class="tf-ops-queue">${g.items.map(row => {
              index += 1;
              const on = index === here;
              const d = w.detail[rowKey(row)] ? detailOf(row, w.detail[rowKey(row)]) : null;
              return html`<li id="qrow-${index}" class="tf-ops-qrow" tabindex="-1" data-current="${on ? 'true' : 'false'}" data-action="queue-pick" data-row="${rowKey(row)}"${on ? raw(' aria-current="true"') : ''}>
              <div class="tf-ops-qrow-body">
                <p class="tf-ops-qrow-what"><span class="font-mono text-gray-100">${row.tool_name}</span> <span class="font-mono text-gray-300 tf-break">${breakable(targetOf(row))}</span></p>
                ${d && detailIsLong(d) ? html`<p class="tf-ops-qrow-line tf-break">${d.markup}</p>` : ''}
                <p class="tf-ops-qrow-meta">${d && !detailIsLong(d) ? html`<span class="tf-ops-qrow-detail tf-break">${d.markup}</span><span aria-hidden="true">·</span>` : ''}<span>${agentLabel(row.agent)}</span><span aria-hidden="true">·</span><span title="${dateTime(row.timestamp)}">${timeAgo(row.timestamp)}</span><span aria-hidden="true">·</span><a class="tf-link" href="${callHref(row)}">details</a></p>
              </div>
              ${rowActions(row, g, on)}
            </li>`;
              })}</ul>
            </div>`)}
          </section>`;
          })}</div>
          ${state.cursor ? html`<div class="mt-4"><button type="button" class="tf-btn" data-action="more" ${state.loadingMore ? raw('disabled') : ''}>${state.loadingMore ? 'Loading…' : state.full ? 'Load more' : 'Look further back'}</button></div>` : ''}`);
        // A redraw replaces every row, and with them the focus. A reader typing
        // a note keeps the field; one working the queue gets the row back.
        if (typing) { refocus(document.getElementById(typing)); return; }
        if (!focusLost()) return;
        // The route focused the title of the loading screen, which this draw
        // replaced. Until the reader works the queue, the new title takes the
        // focus, so Tab and a screen reader start from the top of the queue
        // rather than the top of the page; once they do, the row the keyboard
        // is on takes it. The title draws no ring (see #view-title above).
        if (state.engaged) focusCurrent(false, false); else focusTitle();
      }

      function refocus(el) {
        if (el && typeof el.focus === 'function') { try { el.focus({ preventScroll: true }); } catch (err) { /* courtesy */ } }
      }
      function focusTitle() { refocus(document.getElementById('view-title')); }

      // What the group's field holds now, which is also kept for the redraw.
      function noteFor(g) {
        const el = document.getElementById('note-' + g.slot);
        if (el && typeof el.value === 'string') state.notes[g.key] = el.value.slice(0, 200);
        return String(state.notes[g.key] || '').trim().slice(0, 200);
      }

      // Puts rows back in the queue, newest first, as the ledger lists them,
      // and the keyboard on the first of them: they are what was just undone.
      function restore(rows) {
        const known = {};

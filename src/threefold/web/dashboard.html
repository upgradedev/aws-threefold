      return (Array.isArray(b.conditions) ? b.conditions : []).find(c => c && c.condition === name) || null;
    }
    function measured(stat) { return !!(stat && typeof stat.n === 'number' && stat.n > 0 && typeof stat.rate === 'number'); }

    function violationChart(list) {
      const shown = list.filter(b => b.pilot !== true && CONDITION_ORDER.some(name => { const c = conditionOf(b, name); return c && measured(c.violation); }));
      if (!shown.length) return '';
      const governed = shown.map(b => conditionOf(b, 'threefold')).filter(c => c && measured(c.violation));
      const clean = governed.filter(c => c.violation.k === 0).length;
      const baseline = shown.map(b => conditionOf(b, 'none')).filter(c => c && measured(c.violation));
      const landed = baseline.filter(c => c.violation.k > 0).length;
      const verdict = governed.length === shown.length && clean === shown.length
        ? html`No governed violation landed with Threefold enforcing, in any of the ${plural(shown.length, 'series', 'series')}${baseline.length ? html`; with no guidance, a violation landed in ${landed === baseline.length && baseline.length === shown.length ? 'every one of them' : html`${num(landed)} of ${plural(baseline.length, 'series', 'series')}`}` : ''}.`
        : html`With Threefold enforcing, a governed violation landed in ${num(governed.length - clean)} of ${plural(governed.length, 'measured series', 'measured series')}${baseline.length ? html`; with no guidance, in ${num(landed)} of ${plural(baseline.length, 'series', 'series')}` : ''}.`;
      const legendKeys = CONDITION_ORDER.map(name => {
        const c = shown.map(b => conditionOf(b, name)).find(Boolean);
        return { label: conditionName(c, name), color: CONDITION_COLORS[name] };
      });
      const multiples = shown.map(b => {
        const parts = String(b.label || (Array.isArray(b.models) ? b.models.join(', ') : 'Series')).split(' · ');
        const rows = CONDITION_ORDER.map(name => conditionOf(b, name)).filter(c => c && measured(c.violation)).map(c => ({
          label: conditionName(c, c.condition),
          value: html`${pct(c.violation.rate)} <span class="text-gray-500">· ${num(c.violation.k)}/${num(c.violation.n)}</span>`,
          segments: [{ value: Math.round(c.violation.rate * 1000) / 10, label: '% of runs a violation landed', color: CONDITION_COLORS[c.condition] || T.CATEGORICAL_OTHER }]
        }));
        return html`<figure class="tf-ops-multiple">
          <figcaption class="tf-ops-multiple-title">${parts[0]}${parts.length > 1 ? html`<span class="tf-ops-multiple-sub">${parts.slice(1).join(' · ')}</span>` : ''}</figcaption>
          ${T.hbars(rows, { max: 100, title: 'Violation landed, ' + (b.label || 'series') })}
          <div class="tf-ops-scale" aria-hidden="true"><span>0%</span><span>50%</span><span>100%</span></div>
        </figure>`;
      });
      return card('Did a violation land?', 'The share of runs in which the benchmark\'s own checkers found a governed violation in what the agent left behind, per series, on one scale from 0 to 100%. An empty bar is none.', html`
        <div class="tf-ops-verdict mb-4">${T.icon('shield', 20)}<p>${verdict}</p></div>
        <div class="mb-3">${T.legend(legendKeys)}</div>
        <div class="tf-ops-multiples">${multiples}</div>
        <p class="text-[11px] text-gray-500 mt-3">Each bar is k of n runs of one series under one condition; the table below gives every figure with its 95% interval, and each series' own card follows it.</p>`, 'min-w-0');
    }

    function benchmarkCards(proof) {
      const list = Array.isArray(proof.benchmarks) ? proof.benchmarks.filter(b => b && typeof b === 'object') : [];
      if (!list.length) return benchmarkCard(proof.benchmark);
      return html`${violationChart(list)}${seriesComparison(list)}${list.map(b => benchmarkCard(b, b.label))}`;
    }

    function benchmarkCard(b, label) {
      const title = typeof label === 'string' && label ? label : 'The benchmark';
      if (!b || typeof b !== 'object') {
        return card(title, null, notMeasured('This snapshot carries no benchmark result.',
          'The benchmark gives a coding agent the same Acme tasks with no guidance, with the rules in CLAUDE.md, and with Threefold enforcing.'));
      }
      const conditions = Array.isArray(b.conditions) ? b.conditions : [];
      const list = v => (Array.isArray(v) && v.length ? v.join(', ') : 'not recorded');
      const pilot = b.pilot === true ? html`<div class="rounded-xl border border-amber-800 bg-amber-950/30 p-3 mb-4" data-proof="pilot" role="note">
          <p class="text-sm font-semibold text-amber-200">PILOT: not a result</p>
          <p class="text-xs text-amber-100/80">These runs prove the harness end to end. No figure below should be quoted as a measurement.</p>
        </div>` : '';
      const table = conditions.length ? html`<div class="tf-scroll-x mt-4"><table class="tf-table">
          <thead><tr>
            <th scope="col">Condition</th><th scope="col" class="num">Runs measured</th>
            <th scope="col">Violation landed</th><th scope="col">Tests passed</th>
            <th scope="col">Self-corrected</th><th scope="col">Overhead against no guidance</th>
          </tr></thead>
          <tbody>${conditions.map(c => html`<tr data-condition="${c.condition}">
            <th scope="row" class="font-normal min-w-[9rem]"><span class="text-gray-200">${c.label || c.condition}</span><span class="block text-[10px] text-gray-500 font-mono">${c.condition}</span></th>
            <td class="num"><span class="font-mono">${num(c.n)}</span>${c.not_measured ? html`<span class="block text-[10px] text-amber-300">${plural(c.not_measured, 'run')} measured nothing</span>` : ''}</td>
            <td>${share(c.violation)}</td>
            <td>${share(c.completion)}</td>
            <td>${correctedCell(c)}</td>
            <td>${overheadCell(c)}</td>
          </tr>`)}</tbody>
        </table></div>` : notMeasured('The snapshot names no condition.');
      const facts = [
        ['Model', list(b.models)],
        ['Agent', (b.agent || 'not recorded') + (Array.isArray(b.agent_versions) && b.agent_versions.length ? ' ' + b.agent_versions.join(', ') : '')],
        ['Run on', list(b.dates)],
        ['Real-agent runs measured', num(b.valid_rows) + ' of ' + num(b.real_rows)]
      ];
      return card(title, 'The same Acme tasks under each condition, judged by checkers that do not import Threefold.', html`
        ${pilot}
        <blockquote class="border-l-2 border-purple-700 pl-4 text-sm text-gray-200 tf-break" data-proof="headline">${b.headline || 'No headline was computed.'}</blockquote>
        <p class="text-[11px] text-gray-500 mt-1">The headline sentence exactly as benchmark/report.py computed it from the rows.</p>
        <dl class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-4">${facts.map(([label, value]) => html`<div class="tf-card-quiet p-3 min-w-0"><dt class="tf-label">${label}</dt><dd class="text-xs text-gray-200 tf-break">${value}</dd></div>`)}</dl>
        ${table}
        ${provenance(b.source, b.snapshot_at)}`, 'min-w-0');
    }

    function ownUseCard(p) {
      const title = 'The owner\'s own use';
      const sub = 'Threefold governing the owner\'s real work, anonymised: aggregates only, never a project name, a path, a developer or a target.';
      if (!p || typeof p !== 'object') {
        return card(title, sub, notMeasured('This snapshot carries no totals from the owner\'s own work.',
          'They are read from the owner\'s private stack with the operator key, and only the totals are kept.'));
      }
      const tiles = [
        ['Days observed', num(p.days_observed), 'days_observed', typeof p.window_days === 'number' ? 'with a governed call, of the last ' + num(p.window_days) : 'with a governed call'],
        ['Calls governed', num(p.calls_governed), 'calls_governed', 'judged and recorded'],
        ['Would refuse', num(p.would_refuse), 'would_refuse', 'ran; a rule in Observe would have refused them'],
        ['Reviewed', num(p.reviewed), 'reviewed', 'would-refuse calls the owner labelled'],
        ['False-alarm rate', pct(p.false_alarm_rate), 'false_alarm_rate', typeof p.false_alarm_rate === 'number' && typeof p.false_alarms === 'number' && typeof p.reviewed === 'number'
          ? num(p.false_alarms) + ' of ' + num(p.reviewed) + ' reviewed'
          : (typeof p.refused === 'number' && p.refused > 0 ? 'not given: calls were refused in this window, and these totals count their labels too' : 'not measured')],
        ['Projects', num(p.projects), 'projects', 'counted, never named'],
        ['Agents', num(p.agents), 'agents', 'counted, never named']
      ];
      return card(title, sub, html`
        <div class="grid grid-cols-2 sm:grid-cols-4 xl:grid-cols-7 gap-3">${tiles.map(([label, value, metric, note]) => html`<div class="tf-card-quiet tf-tile">
          <span class="tf-tile-label">${label}</span><span class="tf-tile-value" data-metric="${metric}">${value}</span><span class="tf-tile-sub">${note}</span>
        </div>`)}</div>
        ${p.self_correction ? html`<p class="text-xs text-gray-400 mt-3">Self-corrected: ${selfCorrectionWords(p.self_correction)}.</p>` : ''}
        ${provenance(p.source, p.snapshot_at)}`, 'min-w-0');
    }

    function evidenceItem(item) {
      if (!item || typeof item.path !== 'string') return '';
      const href = typeof item.href === 'string' && /^https:\/\//.test(item.href) ? item.href : '';
      return html`<li class="flex flex-wrap gap-x-2">${href
        ? html`<a class="tf-link font-mono text-xs tf-break" href="${href}" rel="noopener">${item.path}</a>`
        : html`<span class="font-mono text-xs text-gray-200 tf-break">${item.path}</span>`}<span class="text-xs text-gray-500">${item.label || ''}</span></li>`;
    }

    function methodCard(proof) {
      const b = proof.benchmark && typeof proof.benchmark === 'object' ? proof.benchmark : {};
      const items = [].concat(Array.isArray(b.evidence) ? b.evidence : [], Array.isArray(proof.method) ? proof.method : []);
      const linked = items.some(i => i && typeof i.href === 'string' && /^https:\/\//.test(i.href));
      const terms = [
        ['Violation landed', 'the benchmark\'s own checkers found a governed violation in the files the agent left behind.'],
        ['Tests passed', 'the task\'s acceptance tests, restored from the template first, all passed.'],
        ['Self-corrected, in the benchmark', 'a run refused at least once that still finished with its tests passing and no violation.'],
        ['Self-corrected, on the dashboard', 'a refusal of a hook or CI call to a file followed, within the next ten calls of the same session, by a call to the same file that was not refused. A refused command is left out, and a command is never taken as the correction, because the ledger keeps only the program a command ran. Calls recorded at the same instant are not ordered against each other, so a tie can only lengthen the count of calls it took.'],
        ['Overhead', 'the mean turns, seconds and cost of a run under a condition, over the same means with no guidance.'],
        ['Reviewed and false-alarm rate', 'the would-refuse calls the owner labelled, and the share of them labelled false alarm. The rate is given only for a window in which nothing was refused: the totals count false alarms on refused calls as well, and reviewed calls on would-refuse calls only.']
      ];
      return card('How this was measured', 'The definitions behind every figure above, and the files that hold the evidence.', html`
        <dl class="space-y-2">${terms.map(([term, text]) => html`<div class="text-xs"><dt class="inline font-semibold text-gray-200">${term}:</dt> <dd class="inline text-gray-400">${text}</dd></div>`)}</dl>
        <div class="mt-4 pt-3 border-t border-gray-800">
          <p class="tf-label">Evidence</p>
          ${items.length ? html`<ul class="space-y-1.5" data-proof="evidence">${items.map(evidenceItem)}</ul>` : notMeasured('The snapshot names no evidence file.')}
          ${items.length && !linked ? html`<p class="text-[11px] text-gray-500 mt-2">Each is a file in the Threefold repository, at the path shown.</p>` : ''}
          <p class="text-[11px] text-gray-500 mt-2">The live figures on this stack are read from <a class="tf-link" href="${T.specHref('GET', '/api/overview')}">GET /api/overview</a>, and this snapshot from <a class="tf-link" href="${T.specHref('GET', '/proof.json')}">GET /proof.json</a>.</p>
        </div>`, 'min-w-0');
    }

    function viewProof(ctx) {
      ctx.render(loadingView('Proof', PROOF_SUB, ['table', 'table']));
      return T.api('/proof.json').then(body => {
        if (!ctx.alive()) return;
        const proof = body && typeof body === 'object' ? body : {};
        const written = typeof proof.generated_at === 'string' && proof.generated_at
          ? html`Snapshot written ${when(proof.generated_at)}` : 'The snapshot does not record when it was written';
        const by = typeof proof.generated_by === 'string' && proof.generated_by ? html` by <span class="font-mono">${proof.generated_by}</span>` : '';
        ctx.render(html`${pageTitle('Proof', PROOF_SUB)}
          <p class="text-[11px] text-gray-500 -mt-3 mb-4" data-proof="generated">${written}${by}. It changes only when a new one is deployed.</p>
          <div class="space-y-4">
            ${benchmarkCards(proof)}
            ${ownUseCard(proof.private)}
            ${methodCard(proof)}
          </div>`);
      }, err => {
        if (!ctx.alive()) return;
        if (err && err.kind === 'not_found') {
          ctx.render(html`${pageTitle('Proof', PROOF_SUB)}<div class="tf-card p-6 md:p-8 space-y-3" data-state="empty">
            <h2 class="text-lg font-semibold text-white">Not measured yet</h2>
            <p class="text-sm text-gray-400 max-w-2xl">This stack has no proof snapshot deployed, so this page shows nothing rather than something invented.</p>
            <p class="text-xs text-gray-500 max-w-2xl">A snapshot is written by <span class="font-mono">scripts/build_proof.py</span> from the benchmark's result rows and, when the owner adds them, the totals of the owner's own use.</p>
            <div class="flex flex-wrap gap-2"><a class="tf-btn" href="#/overview">The overview</a><a class="tf-btn" href="#/try">Try it in a minute</a></div>
          </div>`);
          return;
        }
        ctx.render(html`${pageTitle('Proof', PROOF_SUB)}${failure(err, 'the proof snapshot')}`);
      });
    }

    // ------------------------------------------------------------- start

    // What the page tests drive: the router and the current screen's actions.
    const Dash = window.Dash = {
      route, go, parseHash, resolve, safeNext, ROUTES,
      act: (name, attrs) => {
        const fn = current.actions[name] || GLOBAL_ACTIONS[name];
        if (!fn) throw new Error('No action ' + name + ' on this screen');
        const el = {
          checked: !!(attrs && attrs.checked),
          getAttribute: n => (attrs && Object.prototype.hasOwnProperty.call(attrs, n) ? attrs[n] : null),
          hasAttribute: n => !!(attrs && Object.prototype.hasOwnProperty.call(attrs, n))
        };
        return fn(el, { preventDefault() {}, target: el });
      }
    };

    route();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Threefold — Operations</title>
  <meta name="description" content="Threefold operations dashboard: what every coding agent's tool call was judged, by project, rule and agent, with the two-stage rollout from Observe to Enforce." />
  <!-- Tailwind CSS via CDN, pinned to an exact version: an unpinned major is a
       script that can change under a page that did not change, and it runs on the
       same origin as the sign-in this browser may hold. No integrity hash: the
       Play CDN answers with no Access-Control-Allow-Origin header, so a browser
       would refuse a script carrying one and the page would lose every style. -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <link rel="stylesheet" href="assets/threefold.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #0a0d18; color: #f3f4f6; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <style>
    /* OPS: the operator's screens (every route but #/try). Components built on
       the design system's tokens in assets/threefold.css; nothing here holds a
       colour or a size of its own that a token already names. A background on
       a button is declared for button.x as well, for Tailwind's preflight. */

    .tf-ops-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--tf-space-1h) var(--tf-space-2); margin-bottom: var(--tf-space-1h); }
    .tf-ops-head > :first-child { min-width: 0; flex: 1 1 22rem; }
    /* A screen's title takes the focus when the screen opens, so a screen
       reader starts there and Tab moves on from it. It is a heading, not a
       control, so it draws no focus ring: the design system's ring on
       [tabindex] would otherwise frame the headline of every screen. */
    #view-title:focus, #view-title:focus-visible { outline: none; }
    /* The same for a stage's headline, which takes the focus after a promotion or a demotion. */
    #stage-title:focus, #stage-title:focus-visible { outline: none; }

    .tf-ops-h2 { margin: 0; display: flex; align-items: center; gap: 8px; font: 600 1rem/1.5rem var(--tf-font-sans); letter-spacing: -0.01em; color: var(--tf-text); }
    .tf-ops-h2 .tf-icon { width: 18px; height: 18px; color: var(--tf-accent-text); }
    .tf-ops-sub { margin: 2px 0 0; font-size: 0.75rem; line-height: 1.125rem; color: var(--tf-text-3); }
    .tf-ops-fresh { display: flex; align-items: center; gap: 8px; margin: -8px 0 var(--tf-space-2); font-size: 0.75rem; line-height: 1rem; color: var(--tf-text-3); font-variant-numeric: tabular-nums; }
    .tf-ops-live { width: 6px; height: 6px; flex-shrink: 0; border-radius: 50%; background: var(--tf-approved); box-shadow: 0 0 0 3px rgba(14, 165, 114, 0.18); }
    .tf-ops-count { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 6px; border-radius: var(--tf-radius-pill); font: 600 0.6875rem/1 var(--tf-font-sans); background: var(--tf-surface-3); color: var(--tf-text); font-variant-numeric: tabular-nums; }

    /* Where the numbers come from, on the public demo. */
    /* Neutral on purpose: its bar is drawn in categorical hues, and the info
       tint sits too close to the cyan one to share a figure with it. */
    .tf-ops-source { display: grid; grid-template-columns: 18px minmax(0, 1fr); align-items: start; gap: 10px 12px; padding: 12px 16px; margin-bottom: var(--tf-space-2); border-radius: var(--tf-radius-md); background: var(--tf-surface-1); border: 1px solid var(--tf-hairline-strong); font-size: var(--tf-fs-small); line-height: var(--tf-lh-small); color: var(--tf-text-2); }
    .tf-ops-source > .tf-icon { width: 18px; height: 18px; margin-top: 1px; color: var(--tf-text-3); }
    .tf-ops-source p { margin: 0; min-width: 0; }
    .tf-ops-source > .tf-ops-share { grid-column: 1 / -1; }
    @media (min-width: 900px) {
      .tf-ops-source { grid-template-columns: 18px minmax(0, 1fr) 15rem; align-items: center; gap: 10px 20px; }
      .tf-ops-source > .tf-ops-share { grid-column: auto; }
    }
    .tf-ops-source strong { color: var(--tf-text); font-weight: 600; }
    .tf-ops-share { min-width: 0; }
    .tf-ops-share-bar { display: flex; gap: 2px; height: 8px; border-radius: 4px; overflow: hidden; background: var(--tf-track); }
    .tf-ops-share-bar > span { display: block; height: 100%; min-width: 3px; }
    .tf-ops-share-bar > span:last-child { border-radius: 0 4px 4px 0; }
    .tf-ops-share .tf-legend { margin-top: 8px; font-size: 0.75rem; }

    /* Needs your attention: three slots, each either something to do or clear. */
    .tf-ops-attention { display: grid; grid-template-columns: 1fr; gap: var(--tf-space-1h); }
    @media (min-width: 900px) { .tf-ops-attention { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .tf-ops-att { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 16px 16px 14px; min-width: 0; border-radius: var(--tf-radius-lg); background: var(--tf-surface-1); border: 1px solid var(--tf-hairline); box-shadow: var(--tf-shadow-1); }
    .tf-ops-att::before { content: ''; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; background: var(--tf-hairline-strong); }
    .tf-ops-att[data-tone="warn"] { border-color: var(--tf-observed-line); }
    .tf-ops-att[data-tone="warn"]::before { background: var(--tf-observed); }
    .tf-ops-att[data-tone="danger"] { border-color: var(--tf-refused-line); }
    .tf-ops-att[data-tone="danger"]::before { background: var(--tf-refused); }
    .tf-ops-att[data-tone="info"] { border-color: var(--tf-info-line); }
    .tf-ops-att[data-tone="info"]::before { background: var(--tf-info); }
    .tf-ops-att[data-tone="ok"] { background: transparent; box-shadow: none; }
    .tf-ops-att[data-tone="ok"]::before { background: var(--tf-approved); opacity: 0.55; }
    .tf-ops-att-head { display: flex; align-items: flex-start; gap: 10px; }
    .tf-ops-att-icon { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex-shrink: 0; border-radius: 9px; background: var(--tf-surface-2); border: 1px solid var(--tf-hairline-strong); color: var(--tf-text-2); }
    .tf-ops-att-icon .tf-icon { width: 16px; height: 16px; }
    .tf-ops-att[data-tone="warn"] .tf-ops-att-icon { background: var(--tf-observed-soft); border-color: var(--tf-observed-line); color: var(--tf-observed-text); }
    .tf-ops-att[data-tone="danger"] .tf-ops-att-icon { background: var(--tf-refused-soft); border-color: var(--tf-refused-line); color: var(--tf-refused-text); }
    .tf-ops-att[data-tone="info"] .tf-ops-att-icon { background: var(--tf-info-soft); border-color: var(--tf-info-line); color: var(--tf-info-text); }
    .tf-ops-att[data-tone="ok"] .tf-ops-att-icon { background: var(--tf-approved-soft); border-color: var(--tf-approved-line); color: var(--tf-approved-text); }
    .tf-ops-att-kicker { display: block; font: 600 var(--tf-fs-micro)/1rem var(--tf-font-sans); letter-spacing: var(--tf-track-caps); text-transform: uppercase; color: var(--tf-text-3); }
    .tf-ops-att-title { margin: 2px 0 0; font: 600 0.9375rem/1.375rem var(--tf-font-sans); letter-spacing: -0.01em; color: var(--tf-text); }
    .tf-ops-att[data-tone="ok"] .tf-ops-att-title { font-weight: 500; color: var(--tf-text-2); }
    .tf-ops-att-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
    .tf-ops-att-list a { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 5px 8px; margin: 0 -8px; border-radius: var(--tf-radius-sm); color: var(--tf-text-2); text-decoration: none; font-size: 0.75rem; line-height: 1.125rem; }
    .tf-ops-att-list a:hover { background: var(--tf-surface-2); color: var(--tf-text); }
    .tf-ops-att-list .tf-ops-att-what { min-width: 0; overflow-wrap: anywhere; }
    .tf-ops-att-list .tf-ops-att-n { flex-shrink: 0; font-family: var(--tf-font-mono); font-variant-numeric: tabular-nums; color: var(--tf-text); }
    /* A halted session: who, why and when, stacked so the reason keeps the width. */
    .tf-ops-halts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .tf-ops-halts > li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
    .tf-ops-halt { flex: 1 1 14rem; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding: 6px 8px; margin: 0 -8px; border-radius: var(--tf-radius-sm); text-decoration: none; font-size: 0.75rem; line-height: 1.125rem; color: var(--tf-text-2); }
    .tf-ops-halt:hover { background: var(--tf-surface-2); }
    .tf-ops-halt-id { overflow-wrap: anywhere; }
    .tf-ops-halt-why { color: var(--tf-text-3); overflow-wrap: anywhere; }
    .tf-ops-halt-when { font-size: 0.75rem; color: var(--tf-text-3); font-variant-numeric: tabular-nums; }
    .tf-ops-att-note { margin: 0; font-size: 0.75rem; line-height: 1rem; color: var(--tf-text-3); }
    .tf-ops-att-foot { margin-top: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 4px; }

    /* The tiles: the first carries the busiest story and spans two columns. */
    .tf-ops-tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--tf-space-1h); }
    @media (min-width: 768px) { .tf-ops-tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .tf-ops-tiles .tf-tile { height: 100%; }
    .tf-ops-tile-wide { grid-column: span 2; }
    .tf-ops-tile-wide .tf-tile-value { font-size: 2.5rem; line-height: 2.75rem; }
    .tf-ops-tile .tf-tile-label .tf-icon { color: var(--tf-text-3); }
    .tf-ops-tile .tf-tile-sub { overflow-wrap: anywhere; }

    /* A small meter: how much of what a project's rules flagged has a label. */
    .tf-ops-meter { display: flex; align-items: center; gap: 8px; min-width: 7rem; }
    .tf-ops-meter-track { flex: 1 1 auto; height: 6px; min-width: 3rem; border-radius: 3px; background: rgba(139, 92, 246, 0.16); overflow: hidden; }
    .tf-ops-meter-fill { display: block; height: 100%; border-radius: 0 3px 3px 0; background: var(--tf-accent); }
    .tf-ops-meter[data-state="done"] .tf-ops-meter-track { background: rgba(14, 165, 114, 0.18); }
    .tf-ops-meter[data-state="done"] .tf-ops-meter-fill { background: var(--tf-approved); }
    .tf-ops-meter[data-state="none"] .tf-ops-meter-track { background: var(--tf-track); }
    .tf-ops-meter-words { flex-shrink: 0; font-size: 0.75rem; line-height: 1rem; color: var(--tf-text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }

    /* A project's readiness in the portfolio: its state, and its flagged calls split by label. */
    .tf-ops-ready { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; min-width: 12rem; }
    .tf-ops-ready > .tf-chip { flex-shrink: 0; }
    /* Where a state waits on a read still on its way: a chip's shape, no word. */
    .tf-ops-chip-wait { display: inline-block; flex-shrink: 0; width: 64px; height: 22px; border-radius: var(--tf-radius-pill); }
    .tf-ops-ready-bar { display: flex; gap: 2px; flex: 1 1 4rem; min-width: 4rem; max-width: 9rem; height: 6px; border-radius: 3px; overflow: hidden; background: var(--tf-track); }
    .tf-ops-ready-bar > span { display: block; height: 100%; min-width: 3px; }
    .tf-ops-ready-bar > span:last-child { border-radius: 0 3px 3px 0; }
    .tf-ops-pcard .tf-ops-ready-bar { max-width: none; }

    /* Where a project's calls come from: identity, so a dot in a categorical hue beside a word. */
    .tf-ops-src { gap: 6px; }
    .tf-ops-src::before { content: ''; width: 7px; height: 7px; border-radius: 99px; background: var(--tf-cat-other); flex-shrink: 0; }
    .tf-ops-src[data-src="fleet"]::before { background: var(--tf-cat-1); }
    .tf-ops-src[data-src="sandbox"]::before { background: var(--tf-cat-2); }

    /* The portfolio: one row a project. */
    .tf-ops-portfolio .tf-table td, .tf-ops-portfolio .tf-table tbody th { vertical-align: middle; }
    .tf-ops-portfolio .tf-table tbody tr[data-row-href] { cursor: pointer; }
    .tf-ops-pname { display: flex; flex-direction: column; gap: 4px; min-width: 12rem; }
    .tf-ops-pmeta { font-size: 0.75rem; line-height: 1rem; color: var(--tf-text-3); overflow-wrap: anywhere; }
    .tf-ops-pcard { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: var(--tf-radius-md); background: var(--tf-inset); border: 1px solid var(--tf-hairline); }
    .tf-ops-pnums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; text-align: center; }
    .tf-ops-pnums a { display: block; padding: 6px 2px; border-radius: var(--tf-radius); background: var(--tf-surface-1); border: 1px solid var(--tf-hairline); text-decoration: none; }
    .tf-ops-pnums a:hover { border-color: var(--tf-hairline-strong); background: var(--tf-surface-2); }
    .tf-ops-pnums b { display: block; font: 600 0.9375rem/1.25rem var(--tf-font-mono); font-variant-numeric: tabular-nums; }
    .tf-ops-pnums small { display: block; font-size: 0.75rem; line-height: 1rem; color: var(--tf-text-3); }

    /* A project's stage: where it is on the way from Observe to Enforce. */
    .tf-ops-hero { position: relative; overflow: hidden; padding: var(--tf-space-3); border-radius: var(--tf-radius-xl); border: 1px solid var(--tf-hairline-strong); background: radial-gradient(640px 220px at 0% 0%, var(--tf-observed-soft), transparent 70%), var(--tf-surface-1); box-shadow: var(--tf-shadow-2); }
    .tf-ops-hero[data-stage="enforce"] { background: radial-gradient(640px 220px at 0% 0%, rgba(139, 92, 246, 0.2), transparent 70%), var(--tf-surface-1); border-color: var(--tf-accent-line); }
    .tf-ops-hero-grid { display: grid; grid-template-columns: 1fr; gap: var(--tf-space-3); align-items: start; }
    @media (min-width: 1024px) { .tf-ops-hero-grid { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); } }
    .tf-ops-hero-title { margin: 10px 0 0; font: 650 1.375rem/1.875rem var(--tf-font-sans); letter-spacing: -0.02em; color: var(--tf-text); text-wrap: balance; }
    @media (min-width: 768px) { .tf-ops-hero-title { font-size: 1.625rem; line-height: 2.125rem; } }
    .tf-ops-hero-text { margin: 8px 0 0; max-width: 62ch; font-size: var(--tf-fs-small); line-height: 1.375rem; color: var(--tf-text-2); }
    .tf-ops-hero-fine { margin: 8px 0 0; max-width: 62ch; font-size: 0.75rem; line-height: 1rem; color: var(--tf-text-3); }
    .tf-ops-hero-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: var(--tf-space-2); }
    .tf-ops-hero-more { margin-top: var(--tf-space-2); max-width: 62ch; }
    .tf-ops-hero-more > summary { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; list-style: none; padding: 2px 0; border-radius: var(--tf-radius-sm); font-size: 0.75rem; line-height: 1rem; color: var(--tf-text-3); }
    .tf-ops-hero-more > summary::-webkit-details-marker { display: none; }
    .tf-ops-hero-more > summary:hover { color: var(--tf-text-2); }
    .tf-ops-hero-more > summary:focus-visible { outline: 2px solid var(--tf-focus); outline-offset: 2px; }
    .tf-ops-hero-more > summary .tf-icon { width: 14px; height: 14px; transition: transform var(--tf-dur-1); }
    .tf-ops-hero-more[open] > summary .tf-icon { transform: rotate(180deg); }
    .tf-ops-track { display: flex; align-items: center; gap: 8px; }
    .tf-ops-step { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: var(--tf-radius-pill); border: 1px solid var(--tf-hairline-strong); background: var(--tf-inset); font: 600 0.75rem/1 var(--tf-font-sans); color: var(--tf-text-3); }
    .tf-ops-step .tf-icon { width: 14px; height: 14px; }
    .tf-ops-step[data-on="observe"] { background: var(--tf-observed-soft); border-color: var(--tf-observed-line); color: var(--tf-observed-text); }
    .tf-ops-step[data-on="enforce"] { background: var(--tf-accent-soft); border-color: var(--tf-accent-line); color: var(--tf-accent-text); }
    .tf-ops-track-line { flex: 0 1 48px; min-width: 16px; height: 1px; background: var(--tf-hairline-strong); }
    .tf-ops-hero-side { display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: var(--tf-radius-md); background: rgba(8, 11, 21, 0.6); border: 1px solid var(--tf-hairline); }
    .tf-ops-hero-side .tf-ops-att-kicker { margin-bottom: 2px; }
    .tf-ops-tally { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .tf-ops-tally > div { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: var(--tf-radius); background: var(--tf-surface-1); border: 1px solid var(--tf-hairline); }
    .tf-ops-tally b { font: 650 1.125rem/1.5rem var(--tf-font-sans); color: var(--tf-text); }
    .tf-ops-tally small { font-size: 0.75rem; line-height: 1rem; color: var(--tf-text-3); }

    /* Readiness, rule by rule. */
    .tf-ops-rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .tf-ops-rule { display: grid; grid-template-columns: 1fr; gap: 10px 20px; padding: 14px 16px; border-radius: var(--tf-radius-md); background: var(--tf-inset); border: 1px solid var(--tf-hairline); }
    @media (min-width: 900px) { .tf-ops-rule { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1.2fr); align-items: center; } }
    .tf-ops-rule[data-state="noisy"] { border-color: var(--tf-refused-line); }
    .tf-ops-rule[data-state="needs_review"] { border-color: var(--tf-info-line); }
    .tf-ops-rule[data-state="ready"] { border-color: var(--tf-approved-line); }
    .tf-ops-rule-name { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .tf-ops-rule-name .tf-ops-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .tf-ops-rule-key { font: 500 0.8125rem/1.25rem var(--tf-font-mono); color: var(--tf-text); overflow-wrap: anywhere; }
    .tf-ops-rule-what { font-size: 0.75rem; line-height: 1rem; color: var(--tf-text-3); }
    .tf-ops-rule-say { font-size: 0.75rem; line-height: 1.125rem; color: var(--tf-text-2); }
    .tf-ops-rule-links { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px; font-size: 0.75rem; }
    .tf-ops-rule-quiet { background: transparent; border-style: dashed; }
    .tf-ops-quiet-count { font: 500 0.8125rem/1.25rem var(--tf-font-sans); color: var(--tf-text); }
    .tf-ops-quiet-keys { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
    .tf-ops-quiet-keys .tf-chip { text-decoration: none; max-width: 100%; overflow-wrap: anywhere; }
    .tf-ops-quiet-keys .tf-chip:hover { border-color: var(--tf-hairline-strong); color: var(--tf-text); }
    .tf-ops-stack { display: flex; gap: 2px; height: 8px; border-radius: 4px; background: var(--tf-track); overflow: hidden; }
    .tf-ops-stack > a, .tf-ops-stack > span { display: block; height: 100%; min-width: 3px; }
    .tf-ops-stack > :last-child { border-radius: 0 4px 4px 0; }
    .tf-ops-stack-words { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 6px; font-size: 0.75rem; line-height: 1rem; color: var(--tf-text-3); font-variant-numeric: tabular-nums; }
    .tf-ops-stack-words i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: -0.05em; font-style: normal; }

    /* Review: a keyboard-first queue. */
    .tf-ops-keys { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 10px 14px; border-radius: var(--tf-radius-md); background: var(--tf-inset); border: 1px solid var(--tf-hairline); font-size: 0.75rem; line-height: 1rem; color: var(--tf-text-3); }
    .tf-ops-keys > span { display: inline-flex; align-items: center; gap: 6px; }
    .tf-ops-progress { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
    .tf-ops-progress .tf-ops-meter { flex: 1 1 14rem; max-width: 26rem; }
    .tf-ops-queue { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
    .tf-ops-qrow { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 8px 10px 8px 16px; margin: 0 -10px; border-radius: var(--tf-radius-md); border: 1px solid transparent; outline: none; transition: background-color var(--tf-dur-1), border-color var(--tf-dur-1); }
    @media (min-width: 768px) { .tf-ops-qrow { flex-direction: row; align-items: center; gap: 16px; } }
    .tf-ops-qrow + .tf-ops-qrow { margin-top: 1px; }
    .tf-ops-qrow:hover { background: rgba(26, 34, 56, 0.45); }
    .tf-ops-qrow[data-current="true"] { background: var(--tf-accent-soft); border-color: var(--tf-accent-line); }
    .tf-ops-qrow[data-current="true"]::before { content: ''; position: absolute; left: 5px; top: 9px; bottom: 9px; width: 3px; border-radius: 3px; background: var(--tf-accent); }
    .tf-ops-qrow:focus-visible { border-color: var(--tf-focus); }
    .tf-ops-qrow-body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .tf-ops-qrow-what { margin: 0; font-size: 0.8125rem; line-height: 1.25rem; }
    .tf-ops-qrow-meta { margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; font-size: 0.75rem; line-height: 1.125rem; color: var(--tf-text-3); }

    const REFRESH_MS = 30000;

    const AGENT_LABELS = {
      'claude-code': 'Claude Code', codex: 'Codex', antigravity: 'Antigravity',
      'pre-commit': 'pre-commit', ci: 'CI', page: 'Page', unknown: 'Unknown'
    };
    const OUTCOMES = {
      refused: { label: 'Refused', chip: 'tf-chip-rose', color: C.refused },
      observed: { label: 'Would refuse', chip: 'tf-chip-amber', color: C.observed },
      approved: { label: 'Approved', chip: 'tf-chip-emerald', color: C.approved }
    };
    const STAGES = {
      observe: { label: 'Observe', chip: 'tf-chip-amber' },
      enforce: { label: 'Enforce', chip: 'tf-chip-purple' }
    };
    const STATES = {
      ready: { label: 'Ready', chip: 'tf-chip-emerald', says: 'everything it flagged was marked correct' },
      quiet: { label: 'Quiet', chip: 'tf-chip-gray', says: 'it flagged nothing' },
      needs_review: { label: 'Needs review', chip: 'tf-chip-sky', says: 'some of what it flagged has no label yet' },
      noisy: { label: 'Noisy', chip: 'tf-chip-rose', says: 'at least one flag was a false alarm' }
    };
    const REVIEWS = {
      correct: { label: 'Correct', chip: 'tf-chip-emerald' },
      false_alarm: { label: 'False alarm', chip: 'tf-chip-rose' }
    };
    const HOOK_MODES = {
      managed: 'follows the project\'s stage on the server',
      observe: 'capped to Observe on the machine: never refused, whatever the stage',
      enforce: 'enforces on the machine, whatever the stage',
      unknown: 'an older hook that does not report its mode'
    };
    // A hook mode in a few words, beside its chip; HOOK_MODES says it whole.
    const HOOK_MODE_WORDS = { managed: 'follows the stage', observe: 'never refused here', enforce: 'always enforces', unknown: 'an older hook' };
    const GATE_KEYS = {
      LOOP: 'The same call repeating',
      PROTECTED_PATH: 'A write to a protected path, such as hook settings or .git/hooks',
      UNREADABLE_WRITE: 'A shell write whose content cannot be read, under a rule that covers the path',
      CREDENTIAL: 'A credential in the arguments',
      BUDGET: 'The spend ceiling',
      HALTED_SESSION: 'A call in a session that was already halted',
      NONE: 'Nothing flagged the call'
    };

    // ----------------------------------------------------------- helpers

    function outcomeOf(row) {
      const status = String((row && row.status) || '');
      if (status && status !== 'APPROVED') return 'refused';
      if ((Array.isArray(row.observed_rules) && row.observed_rules.length) || row.observed_rule) return 'observed';
      return 'approved';
    }
    function ruleKeyOf(row) {
      return row.rule_key || (Array.isArray(row.observed_rules) && row.observed_rules[0]) || row.observed_rule || row.rule || 'NONE';
    }
    function targetOf(row) { return row.observed_target || row.target || ''; }
    function reasonOf(row) { return (outcomeOf(row) === 'observed' && row.observed_reason) || row.reason || ''; }
    function agentLabel(agent) { return AGENT_LABELS[agent] || agent || 'Unknown'; }

    // An outcome is an icon and a word, never a colour alone.
    function outcomeChip(row) {
      const kind = outcomeOf(row);
      return T.statusChip(kind, OUTCOMES[kind].label);
    }
    function stageChip(stage, configured) {
      const s = STAGES[stage];
      if (!s) return html`<span class="tf-chip tf-chip-gray">${stage || 'unknown'}</span>`;
      return html`<span class="tf-chip ${s.chip}" title="${configured === false ? 'Not configured: the stack default applies' : s.label}">${stage === 'enforce' ? raw(T.ICONS.shield) : raw(T.ICONS.eye)}${s.label}${configured === false ? ' · default' : ''}</span>`;
    }
    function stateChip(state) {
      const s = STATES[state];
      if (!s) return html`<span class="tf-chip tf-chip-gray">${state || '—'}</span>`;
      return html`<span class="tf-chip ${s.chip}" title="${s.label}: ${s.says}">${s.label}</span>`;
    }
    function reviewChip(review) {
      const r = REVIEWS[review];
      if (!r) return html`<span class="text-gray-600 text-[11px]">no label</span>`;
      return html`<span class="tf-chip ${r.chip}">${r.label}</span>`;
    }
    function agentChip(agent) { return html`<span class="tf-chip tf-chip-gray">${agentLabel(agent)}</span>`; }
    // A path or an identifier that may not fit its column breaks after a
    // slash, a dash or an underscore, never inside a word. Every part
    // is escaped by html``; only the break opportunities are markup.
    function breakable(text) {
      const parts = String(text == null ? '' : text).split(/(?<=[/_-])/);
      return html`${parts.map((p, i) => html`${i ? raw('<wbr>') : ''}${p}`)}`;
    }

    function callsHref(params) { return '#/calls' + query(params); }
    function projectHref(name) { return '#/projects/' + encodeURIComponent(name); }
    function callHref(row) { return '#/call' + query({ timestamp: row.timestamp, verdict_id: row.verdict_id }); }
    function reviewHref(params) { return '#/review' + query(params || {}); }

    function pickDays(value, fallback, allowAny) {
      const n = Number(value);
      if (allowAny && Number.isInteger(n) && n >= 1 && n <= 30) return n;
      return DAY_CHOICES.some(c => c.days === n) ? n : fallback;
    }
    function windowWords(days) { return days === 1 ? 'the day so far, UTC' : 'the last ' + days + ' days'; }

    // Days from a calendar day to today, inclusive, in UTC, which is how the
    // ledger keeps its days.
    function daysSince(day) {
      const then = Date.parse(String(day) + 'T00:00:00Z');
      if (isNaN(then)) return 7;
      const now = new Date();
      const today = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
      return Math.min(30, Math.max(1, Math.floor((today - then) / 86400000) + 1));
    }

    function plural(n, one, many) { return num(n) + ' ' + (n === 1 ? one : (many || one + 's')); }
    // A message the service wrote, without the full stop it may end in, so a
    // sentence built around it does not end in two.
    function trimStop(text) { return String(text || '').replace(/[.\s]+$/, ''); }
    // The service writes a count it does not inflect as "1 false alarm(s)";
    // the page says it the way a reader would, before it is escaped.
    function inflect(text) {
      return String(text || '').replace(/\b(\d+) ([A-Za-z][A-Za-z-]*(?: [A-Za-z][A-Za-z-]*)?)\(s\)/g, (m, n, word) => n + ' ' + word + (n === '1' ? '' : 's'));
    }

    // Self-correction, as the overview and a project's page both word it. It
    // counts only an agent's refusals, from a hook or CI, of a call to a file:
    // a page call is a visitor pressing a button, and for a command the ledger
    // keeps only the program, so the Refused tile beside it can be larger. A
    // window with no such refusal says so rather than showing a rate of
    // nothing, and a read that stopped short says how much it covered: the
    // rows it read are of every project, which a project's page says too.
    const SELF_CORRECTION_SCOPE = 'It counts refusals of a hook or CI call to a file; a refused command is left out, because the ledger keeps only the program it ran.';
    // The rate is over the refusals whose session made a later call: a
    // single-call probe had no chance to correct itself. A stack that
    // predates that count divided by every refusal, and is worded so.
    function selfCorrectionChances(sc) {
      return typeof sc.refusals_with_later_call === 'number' ? sc.refusals_with_later_call : sc.refusals_considered;
    }
    function selfCorrectionShown(sc) {
      return !!(sc && typeof sc.refusals_considered === 'number' && sc.refusals_considered > 0 && selfCorrectionChances(sc) > 0);
    }
    function selfCorrectionWords(sc, ofOneProject) {
      if (!sc || typeof sc !== 'object') return 'not reported by this stack';
      const read = typeof sc.rows_read === 'number' && sc.rows_read > 0;
      if (sc.complete === false && !read) return 'not measured: the ledger could not be read';
      const partial = sc.complete === false
        ? ' · read stopped after the newest ' + plural(sc.rows_read, 'call') + (ofOneProject ? ' of every project' : '')
        : '';
      const n = sc.refusals_considered;
      if (!selfCorrectionShown(sc) && typeof n === 'number' && n > 0) {
        return 'not measured: ' + (n === 1 ? 'the one agent refusal had no later call' : 'none of the ' + num(n) + ' agent refusals had a later call') + ' in its session' + partial;
      }
      if (!selfCorrectionShown(sc)) {
        return (sc.complete === false ? 'no agent (hook or CI) refusal among the calls read' : 'no agent (hook or CI) refusal in this window') + partial;
      }
      const median = typeof sc.median_calls_to_correct === 'number'
        ? ' · median ' + (Math.round(sc.median_calls_to_correct * 10) / 10) + (sc.median_calls_to_correct === 1 ? ' call' : ' calls')
        : '';
      const counted = typeof sc.refusals_with_later_call === 'number';
      const without = counted && sc.refusals_without_later_call > 0 ? ' · ' + num(sc.refusals_without_later_call) + ' more had no later call' : '';
      return pct(sc.rate) + ' of ' + plural(selfCorrectionChances(sc), 'agent refusal') + (counted ? ' followed by another call' : '') + median + without + partial;
    }

    function sum(list, key) { return (list || []).reduce((s, r) => s + (typeof r[key] === 'number' ? r[key] : 0), 0); }

    function pageTitle(title, sub, actions) {
      return html`<div class="flex flex-wrap items-end justify-between gap-4 mb-5">
        <div class="min-w-0">
          <h1 id="view-title" tabindex="-1" class="text-xl md:text-2xl font-semibold tracking-tight text-white outline-none tf-break">${title}</h1>
          ${sub ? html`<p class="text-xs md:text-sm text-gray-400 mt-1 max-w-3xl">${sub}</p>` : ''}
        </div>
        ${actions ? html`<div class="flex flex-wrap items-center gap-2">${actions}</div>` : ''}
      </div>`;
    }

    function crumbs(items) {
      return html`<nav aria-label="Breadcrumb" class="text-xs text-gray-500 mb-2 flex flex-wrap items-center gap-1">
        ${items.map((item, i) => html`${i ? html`<span aria-hidden="true">/</span>` : ''}${item.href
          ? html`<a href="${item.href}" class="hover:text-gray-300 underline-offset-2 hover:underline">${item.label}</a>`
          : html`<span class="text-gray-400 tf-break" aria-current="page">${item.label}</span>`}`)}
      </nav>`;
    }

    function card(title, sub, body, extra) {
      return html`<section class="tf-card p-5 ${extra || ''}">
        <div class="flex flex-wrap items-start justify-between gap-2 mb-4">
          <div class="min-w-0">
            <h2 class="tf-section-title">${title}</h2>
            ${sub ? html`<p class="tf-section-sub">${sub}</p>` : ''}
          </div>
        </div>
        ${body}
      </section>`;
    }

    function emptyNote(text, next) {
      return html`<div class="rounded-xl border border-dashed border-gray-800 p-4 text-xs text-gray-400">
        <p>${text}</p>${next ? html`<p class="mt-2">${next}</p>` : ''}
      </div>`;
    }

    // Grey shapes in the layout the screen is about to draw, so nothing jumps
    // when the answer lands.
    function skeleton(kind) {
      const block = (h, w) => html`<div class="tf-skeleton ${h} ${w}"></div>`;
      if (kind === 'attention') {
        return html`<div class="tf-ops-attention" aria-hidden="true">
          ${['a', 'b', 'c'].map(() => html`<div class="tf-ops-att space-y-3">${block('h-3', 'w-16')}${block('h-5', 'w-2/3')}${block('h-3', 'w-full')}${block('h-3', 'w-4/5')}</div>`)}
        </div>`;
      }
      if (kind === 'kpis') {
        return html`<div class="tf-ops-tiles" aria-hidden="true">
          ${['wide', 'a', 'b', 'c', 'd', 'e', 'f'].map(k => html`<div class="tf-card p-4 space-y-3${k === 'wide' ? ' tf-ops-tile-wide' : ''}">${block('h-3', 'w-24')}${block('h-8', 'w-20')}${block('h-3', 'w-32')}</div>`)}
        </div>`;
      }
      if (kind === 'hero') {
        return html`<div class="tf-ops-hero space-y-4" aria-hidden="true">${block('h-6', 'w-40')}${block('h-7', 'w-3/4')}${block('h-4', 'w-full')}${block('h-4', 'w-2/3')}${block('h-10', 'w-48')}</div>`;
      }
      if (kind === 'tiles') {
        return html`<div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-3" aria-hidden="true">
          ${[1, 2, 3, 4, 5, 6].map(() => html`<div class="tf-card p-4 space-y-3"><div class="tf-skeleton h-3 w-20"></div><div class="tf-skeleton h-7 w-16"></div><div class="tf-skeleton h-3 w-28"></div></div>`)}
        </div>`;
      }
      if (kind === 'table') {
        return html`<div class="tf-card p-5 space-y-3" aria-hidden="true">
          ${[1, 2, 3, 4, 5, 6].map(() => html`<div class="tf-skeleton h-4 w-full"></div>`)}
        </div>`;
      }
      return html`<div class="tf-card p-5" aria-hidden="true"><div class="tf-skeleton h-48 w-full"></div></div>`;
    }

    function loadingView(title, sub, kinds) {
      return html`${pageTitle(title, sub)}<div class="space-y-4" aria-busy="true"><p class="sr-only">Loading</p>${(kinds || ['table']).map(skeleton)}</div>`;
    }

    // The state for a failed read: signed out when the stack refused, an error
    // with a retry otherwise.
    function failure(err, what) {
      return T.isAuthError(err) ? T.signedOutHtml(err, what) : T.errorHtml(err, what, 'retry');
    }

    function announce(text) {
      const el = document.getElementById('live-status');
      if (el) el.textContent = text;
    }

    // ------------------------------------------------------------ router

    let current = { token: 0, route: null, params: {}, args: [], leave: [], actions: {} };

    function compile(path) {
      return new RegExp('^' + path.replace(/:[a-z]+/g, '([^/]+)') + '$');
    }
    ROUTES.forEach(r => { r.re = compile(r.path); });

    function decodePart(s) {
      try { return decodeURIComponent(String(s).replace(/\+/g, ' ')); } catch (err) { return String(s); }
    }

    function parseHash(hash) {
      const body = String(hash || '').replace(/^#/, '');
      const at = body.indexOf('?');
      const path = (at >= 0 ? body.slice(0, at) : body) || '/overview';
      const params = {};
      if (at >= 0) {
        body.slice(at + 1).split('&').forEach(pair => {
          if (!pair) return;
          const eq = pair.indexOf('=');
          const name = decodePart(eq >= 0 ? pair.slice(0, eq) : pair);
          params[name] = decodePart(eq >= 0 ? pair.slice(eq + 1) : '');
        });
      }
      return { path, params };
    }

    function resolve(path) {
      for (const r of ROUTES) {
        const m = r.re.exec(path);
        if (m) return { route: r, args: m.slice(1).map(decodePart) };
      }
      return null;
    }

    function makeContext(token, params, args) {
      return {
        token, params, args,
        alive: () => token === current.token,
        onLeave: fn => { if (token === current.token) current.leave.push(fn); },
        actions: map => { if (token === current.token) Object.assign(current.actions, map); },
        render: safe => { if (token === current.token) setHtml(document.getElementById('view'), safe); }
      };
    }

    function route() {
      current.leave.forEach(fn => { try { fn(); } catch (err) { /* cleanup is best effort */ } });
      closeDialog();
      const token = current.token + 1;
      const { path, params } = parseHash(location.hash);
      const found = resolve(path);
      current = { token, route: found ? found.route : null, params, args: found ? found.args : [], leave: [], actions: {} };
      T.mountNav(document.getElementById('tf-nav'), { active: found ? found.route.nav : '', inDashboard: true });
      const ctx = makeContext(token, params, current.args);
      if (!found) {
        document.title = 'Not found — Threefold';
        ctx.render(html`${pageTitle('Nothing lives at this address', 'The link may be from an older version of this dashboard.')}
          <div class="flex flex-wrap gap-2"><a class="tf-btn tf-btn-primary" href="#/overview">Go to the overview</a><a class="tf-btn" href="#/projects">Projects</a></div>`);
        return;
      }
      document.title = found.route.title + ' — Threefold';
      try {
        found.route.view(ctx);
      } catch (err) {
        ctx.render(T.errorHtml({ kind: 'http', message: String(err && err.message || err) }, 'this screen', null));
      }
      const title = document.getElementById('view-title');
      if (title && typeof title.focus === 'function') {
        try { title.focus({ preventScroll: true }); } catch (err) { /* focus is a courtesy */ }
      }
      if (typeof window.scrollTo === 'function') { try { window.scrollTo(0, 0); } catch (err) { /* no scroll */ } }
    }

    function go(hash) {
      if (location.hash === hash) route(); else location.hash = hash;
    }

    function closest(node, name) {
      while (node && node !== document) {
        if (typeof node.hasAttribute === 'function' && node.hasAttribute(name)) return node;
        node = node.parentNode;
      }
      return null;
    }

    function dispatch(kind, event) {
      const el = closest(event.target, 'data-' + kind);
      if (!el) return;
      const name = el.getAttribute('data-' + kind);
      const fn = current.actions[name] || GLOBAL_ACTIONS[name];
      if (!fn) return;
      // Only a form's submit has a default to stop; a button's click has none,
      // and stopping a click would stop a checkbox from ticking.
      if (kind === 'submit' && typeof event.preventDefault === 'function') event.preventDefault();
      fn(el, event);
    }

    const GLOBAL_ACTIONS = {
      retry: () => route(),
      'close-dialog': () => closeDialog()
    };

    document.addEventListener('click', event => {
      // A click on the dimmed backdrop closes a dialog; a click inside it does not.
      if (dialogOpen && event.target && typeof event.target.hasAttribute === 'function' && event.target.hasAttribute('data-overlay')) { closeDialog(); return; }
      const row = closest(event.target, 'data-row-href');
      const inner = closest(event.target, 'data-action') || (event.target && event.target.closest && event.target.closest('a,button,input,select,label'));
      if (row && !inner) { go(row.getAttribute('data-row-href')); return; }
      dispatch('action', event);
    });
    document.addEventListener('change', event => dispatch('change', event));
    document.addEventListener('submit', event => dispatch('submit', event));
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && dialogOpen) closeDialog();
    });
    window.addEventListener('hashchange', route);
    // A sign-in or a sign-out redraws the screen with the new credential. A
    // sign-in the stack stopped accepting does not: the screen that met the
    // refusal already says so, and says what to run.
    T.onAuthChange(reason => { if (reason !== 'expired' && current.route && current.route.path !== '/signin') route(); });
    // The switch in the navigation turns the reader's own names for the
    // aliases off and on, so the screen is drawn again and every label on it
    // follows at once. Three screens are left out: /signin and /try show no
    // alias a reader would name, and /connect redraws from its own state
    // below, so a half-typed name survives the switch.
    // A dialog and a toast outlive the screen under them, so a redraw of the
    // route alone would leave a name of the reader's own on either. A dialog is
    // drawn from the state of the screen that opened it, so it is closed rather
    // than carried across: route() closes it, and a screen that keeps its own
    // state closes it here. A toast is written again from the words that raised
    // it, with nothing asked of the service.
    const KEEPS_ITS_OWN_STATE = { '/signin': true, '/try': true, '/connect': true };
    T.onLocalNamesChange(() => {
      if (current.route && !KEEPS_ITS_OWN_STATE[current.route.path]) route();
      else closeDialog();
      if (toastUp) toastUp.draw();
    });

    // ------------------------------------------------------ dialog, toast

    let dialogOpen = false;
    let dialogReturn = null;

    function openDialog(title, body, footer) {
      dialogReturn = document.activeElement || null;
      dialogOpen = true;
      setHtml(document.getElementById('modal-root'), html`<div class="tf-overlay" data-overlay>
        <div class="tf-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" data-dialog>
          <div class="px-5 pt-5 pb-3 border-b border-gray-800 flex items-start justify-between gap-3">
            <h2 id="dialog-title" class="text-base font-semibold text-white">${title}</h2>
            <button type="button" class="tf-btn tf-btn-quiet tf-btn-sm" data-action="close-dialog" aria-label="Close">Close</button>
          </div>
          <div id="dialog-body" class="px-5 py-4 space-y-4">${body}</div>
          <div id="dialog-footer" class="px-5 py-4 border-t border-gray-800 flex flex-wrap justify-end gap-2">${footer}</div>
        </div>
      </div>`);
      const first = document.getElementById('dialog-first');
      if (first && typeof first.focus === 'function') { try { first.focus(); } catch (err) { /* courtesy */ } }
    }

    function closeDialog() {
      if (!dialogOpen) return;
      dialogOpen = false;
      setHtml(document.getElementById('modal-root'), html``);
      if (dialogReturn && typeof dialogReturn.focus === 'function') { try { dialogReturn.focus(); } catch (err) { /* courtesy */ } }
      dialogReturn = null;
    }

    let toastSeq = 0;
    const toastActions = {};
    // The toast on screen, and how to write it again. A toast whose words name
    // a project is given a function rather than a string, so the switch in the
    // navigation reaches it rather than leaving a name up for nine seconds.
    let toastUp = null;
    function toast(message, actionLabel, action) {
      toastSeq += 1;
      const id = 'toast-' + toastSeq;
      if (action) toastActions[id] = action;
      const words = typeof message === 'function' ? message : () => message;
      const root = document.getElementById('toast-root');
      const draw = () => setHtml(root, html`<div class="tf-toast" id="${id}" role="status">
        <span class="flex-1 tf-break">${words()}</span>
        ${action ? html`<button type="button" class="tf-btn tf-btn-sm" data-action="toast" data-toast="${id}">${actionLabel}</button>` : ''}
        <button type="button" class="tf-btn tf-btn-quiet tf-btn-sm" data-action="toast-close" data-toast="${id}" aria-label="Dismiss">✕</button>
      </div>`);
      draw();
      toastUp = { id: id, draw: draw };
      announce(words());
      setTimeout(() => {
        const el = document.getElementById(id);
        if (el && el.parentNode && typeof el.parentNode.removeChild === 'function') el.parentNode.removeChild(el);
        delete toastActions[id];
        if (toastUp && toastUp.id === id) toastUp = null;
      }, 9000);
    }
    function dismissToast(id) {
      delete toastActions[id];
      if (toastUp && toastUp.id === id) toastUp = null;
      setHtml(document.getElementById('toast-root'), html``);
    }
    GLOBAL_ACTIONS.toast = el => {
      const id = el.getAttribute('data-toast');
      const fn = toastActions[id];
      dismissToast(id);
      if (fn) fn();
    };
    GLOBAL_ACTIONS['toast-close'] = el => dismissToast(el.getAttribute('data-toast'));

    // ---------------------------------------------------------- overview

    function windowPicker(base, days, extra) {
      return html`<div class="tf-segmented" role="group" aria-label="Time window">
        ${DAY_CHOICES.map(c => html`<a href="${base + query(Object.assign({}, extra || {}, { days: c.days }))}" aria-current="${c.days === days ? 'true' : 'false'}" aria-label="${windowWords(c.days)}">${c.label}</a>`)}
      </div>`;
    }

    // A tile: the plain words first, the value, what it means, the precise term
    // quieter, and the rows behind it. The value is the API's, drawn through
    // num(); data-tf-count lets the shared layer replay the climb once a load.
    function tile(t) {
      const shown = num(t.value);
      const counted = typeof t.value === 'number' && isFinite(t.value);
      return html`<a href="${t.href}" class="tf-card tf-card-link tf-tile tf-ops-tile${t.wide ? ' tf-ops-tile-wide' : ''}" aria-label="${t.label}: ${shown}. ${t.sub}. ${t.opens || 'Open the rows behind it'}">
        <span class="tf-tile-label">${t.icon ? T.icon(t.icon, 16) : ''}${t.label}</span>
        <span class="tf-tile-row"><span class="tf-tile-value" data-metric="${t.metric}"${counted ? html` data-tf-count="${t.value}"` : ''} title="${counted ? t.value.toLocaleString('en-US') : ''}">${shown}</span>${t.spark ? html`<span class="tf-tile-spark" aria-hidden="true">${t.spark}</span>` : ''}</span>
        <span class="tf-tile-sub">${t.sub}</span>
        ${t.term ? html`<span class="tf-tile-term">${t.term}</span>` : ''}
        <span class="tf-tile-more" aria-hidden="true">${t.more || 'See the calls'}${T.icon('arrowright', 14)}</span>
      </a>`;
    }

    // What each kind of caller is, for the callers that are not coding agents.
    const CALLER_KINDS = {
      page: 'a visitor pressing a button on a page here',
      ci: 'a pipeline or a pre-commit check',
      unknown: 'a call that did not say which agent sent it'
    };

    // What each origin of a call is, said on hover beside its count.
    const ORIGIN_WORDS = {
      hook: 'hook: a coding agent being governed',
      page: 'page: a visitor pressing a button here',
      ci: 'ci: a pipeline or a pre-commit check'
    };

    // Where a project's calls come from, on a stack that says so. A stack from
    // before the field says only whether a project is a visitor's sandbox.
    const SOURCES = {
      fleet: { label: 'Fleet', says: 'The synthetic Acme fleet: scheduled agents whose calls run through the real gates' },
      sandbox: { label: 'Sandbox', says: 'A visitor\'s sandbox, seeded with synthetic calls by the walkthrough' },
      other: { label: 'Other', says: 'Neither the fleet nor a sandbox: the service\'s own probes, the demo page, or a connected repository' }
    };
    function sourceOf(p) {
      if (p && Object.prototype.hasOwnProperty.call(SOURCES, p.source)) return p.source;
      if (p && (p.sandbox === true || /^Acme-Sandbox-[0-9a-f]{8}$/.test(String(p.project || '')))) return 'sandbox';
      return '';
    }
    function sourceBadge(p) {
      const src = sourceOf(p);
      if (!src) return '';
      return html`<span class="tf-chip tf-chip-gray tf-ops-src" data-src="${src}" title="${SOURCES[src].says}">${SOURCES[src].label}</span>`;
    }

    // The false alarms of a window, by project, from one read of the ledger
    // (GET /api/decisions?review=false_alarm). A project row counts what its
    // rules flagged and what still waits, not what was labelled wrong, and a
    // single false alarm is what makes a rule Noisy, so readiness needs this
    // read beside the rows. `complete` says the read reached the end of the
    // window: only then does a project with none count as having none.
    function falseAlarmsByProject(read) {
      if (!read || !Array.isArray(read.rows)) return null;
      const byProject = {};
      read.rows.forEach(row => {
        const name = String(row.project_name || '');
        const seen = byProject[name] || (byProject[name] = { any: 0, observed: 0 });
        seen.any += 1;
        if (outcomeOf(row) === 'observed') seen.observed += 1;
      });
      return { byProject, complete: read.partial !== true };
    }

    // A project's readiness, as its page states it for each rule, drawn small
    // for the portfolio: the calls its rules flagged, split by their label
    // (correct, false alarm, not labelled), and the state that follows. Any
    // false alarm makes it Noisy; else anything unlabelled needs review; else
    // it is Ready if it flagged anything and Quiet if not. Approved green is
    // drawn only where the false alarms were read to the end of the window:
    // a labelled call that may be a false alarm is drawn neutral, never Ready.
    // `fa` undefined is a read still on its way: a state that hangs on it is
    // a placeholder until it lands, so nothing is claimed and then taken back.
    // `fa` null is a read that failed: that state is left unsaid, and the
    // words say why, rather than a fifth state the product does not have.
    function readinessCell(p, fa) {
      const would = p.would_refuse;
      const waiting = p.needs_review;
      if (typeof would !== 'number' || typeof waiting !== 'number') return html`<span class="text-gray-500">—</span>`;
      const reading = fa === undefined;
      const seen = (fa && fa.byProject[p.project]) || { any: 0, observed: 0 };
      const known = !!fa && (fa.complete || seen.any > 0);
      const flagged = would + (typeof p.refused === 'number' ? p.refused : 0);
      const state = seen.any > 0 ? 'noisy' : flagged <= 0 ? 'quiet' : reading ? '' : waiting > 0 ? 'needs_review' : known ? 'ready' : '';
      const chip = state ? stateChip(state) : reading
        ? html`<span class="tf-skeleton tf-ops-chip-wait" aria-hidden="true"></span><span class="sr-only">Reading the false alarms</span>`
        : '';
      const unread = !state && !reading ? html` · <span title="The false alarms of this window could not all be read, so neither Ready nor Noisy is claimed">false alarms not all read</span>` : '';
      if (would <= 0) {
        return html`<span class="tf-ops-ready" data-state="${state || 'unknown'}">${chip}<span class="tf-ops-ready-bar" aria-hidden="true"></span><span class="tf-ops-meter-words">${flagged > 0 ? 'nothing to label' : 'nothing flagged'}${unread}</span></span>`;
      }
      const done = Math.max(0, Math.min(would, would - waiting));
      const wrong = Math.min(done, seen.observed);
      const parts = [
        { part: 'correct', value: known ? done - wrong : 0, color: C.approved, label: 'correct' },
        { part: 'labelled', value: known ? 0 : done - wrong, color: C.accent, label: 'labelled' },
        { part: 'false_alarm', value: wrong, color: C.refused, label: wrong === 1 ? 'false alarm' : 'false alarms' },
        // Not labelled yet is the bar still to fill: the empty track.
        { part: 'unlabelled', value: waiting, color: 'transparent', label: 'not labelled' }
      ].filter(x => x.value > 0);
      const said = parts.map(x => num(x.value) + ' ' + x.label).join(', ');
      return html`<span class="tf-ops-ready" data-state="${state || 'unknown'}" title="${said}, of ${num(would)} flagged">${chip}<span class="tf-ops-ready-bar" role="img" aria-label="${num(done)} of ${num(would)} flagged calls labelled">${parts.map(x => html`<span data-part="${x.part}" style="flex-grow:${x.value};background:${x.color}"></span>`)}</span><span class="tf-ops-meter-words">${num(done)}/${num(would)} labelled${wrong ? html` · <span class="text-rose-300">${plural(wrong, 'false alarm')}</span>` : ''}${unread}</span></span>`;
    }

    // One slot of the attention strip: something to do, or plainly nothing.
    function attSlot(o) {
      return html`<article class="tf-ops-att" data-tone="${o.tone || ''}" data-slot="${o.slot}">
        <div class="tf-ops-att-head">
          <span class="tf-ops-att-icon" aria-hidden="true">${T.icon(o.icon, 16)}</span>
          <div class="min-w-0"><span class="tf-ops-att-kicker">${o.kicker}</span><h3 class="tf-ops-att-title">${o.title}</h3></div>
        </div>
        ${o.body || ''}
        ${o.foot ? html`<div class="tf-ops-att-foot">${o.foot}</div>` : ''}
      </article>`;
    }

    function attLoading(slot, kicker, icon) {
      return attSlot({ slot, kicker, icon, title: html`<span class="sr-only">Reading</span><span class="tf-skeleton tf-skeleton-line" style="width:70%;margin-top:6px" aria-hidden="true"></span>`,
        body: html`<span class="tf-skeleton tf-skeleton-line" style="width:90%" aria-hidden="true"></span>` });
    }

    function attUnread(slot, kicker, icon, what, err) {
      return attSlot({ slot, kicker, icon, title: what + ' could not be read',
        body: html`<p class="tf-ops-att-note">${T.isAuthError(err) ? 'This needs the operator: sign in with python threefold.py open.' : trimStop(err && err.message ? err.message : 'The service did not answer') + '. Nothing is shown rather than a guess.'}</p>` });
    }

    // Signed out on the public demo, the queue is not the reader's to work:
    // anyone may label a sandbox's calls, and only the operator the rest. The
    // slot says so, and offers the walkthrough, which makes a sandbox of the
    // reader's own, rather than a keyboard for labels that would be refused.
    function reviewSlot(data, days, who) {
      const t = data.totals || {};
      const visitor = !!who && who.reads_public === true && who.authenticated !== true;
      const waiting = typeof t.needs_review === 'number' ? t.needs_review : 0;
      if (!waiting) {
        return attSlot({ slot: 'reviews', tone: 'ok', icon: 'check', kicker: 'Reviews', title: 'Nothing waits for a label',
          body: html`<p class="tf-ops-att-note">Every call a rule in Observe flagged in ${windowWords(days)} has a label.</p>` });
      }
      // A visitor's sandbox expires within a day and is the visitor's to
      // label, so for the operator the projects that are theirs lead, and a
      // sandbox is listed only where room is left.
      const theirs = p => (visitor || sourceOf(p) !== 'sandbox' ? 1 : 0);
      const rows = (Array.isArray(data.by_project) ? data.by_project : []).filter(p => (p.needs_review || 0) > 0)
        .sort((a, b) => theirs(b) - theirs(a) || (b.needs_review || 0) - (a.needs_review || 0) || String(a.project).localeCompare(String(b.project)));
      const split = data.sandbox_split && data.sandbox_split.sandbox;
      const inSandboxes = split && typeof split.needs_review === 'number' && split.needs_review > 0 ? split.needs_review : 0;
      return attSlot({
        slot: 'reviews', tone: 'info', icon: 'inbox', kicker: 'Reviews',
        title: html`${plural(waiting, 'call')} ${waiting === 1 ? 'waits' : 'wait'} for ${visitor ? 'a' : 'your'} label`,
        body: html`<ul class="tf-ops-att-list">${rows.slice(0, 3).map(p => html`<li><a href="${reviewHref({ project: p.project, days })}"><span class="tf-ops-att-what font-mono">${T.projectName(p.project)}</span><span class="tf-ops-att-n">${num(p.needs_review)}</span></a></li>`)}</ul>
          ${rows.length > 3 ? html`<p class="tf-ops-att-note">and ${plural(rows.length - 3, 'more project')}.</p>` : ''}
          ${inSandboxes ? html`<p class="tf-ops-att-note">${num(inSandboxes)} of them ${inSandboxes === 1 ? 'is' : 'are'} in visitors' sandboxes${visitor ? ', which anyone may label' : ', which drop out of these figures within a day'}.</p>` : ''}
          ${visitor ? html`<p class="tf-ops-att-note">The other projects' labels are the operator's.</p>` : ''}`,
        foot: visitor
          ? html`<a class="tf-btn tf-btn-primary tf-btn-sm" href="#/try">Try it with your own sandbox${T.icon('arrowright', 14)}</a><a class="tf-btn tf-btn-quiet tf-btn-sm" href="${reviewHref({ days })}">See the queue</a>`
          : html`<a class="tf-btn tf-btn-primary tf-btn-sm" href="${reviewHref({ days })}">Start reviewing${T.icon('arrowright', 14)}</a><span class="tf-micro tf-ops-kbd-hint inline-flex items-center gap-1">${T.kbd('J')}${T.kbd('K')} move, ${T.kbd('C')}${T.kbd('F')} label</span>`
      });
    }

    function noisySlot(att, days) {
      const kicker = 'Rules';
      if (!att.noisy) return attLoading('noisy', kicker, 'alert');
      if (att.noisy.error) return attUnread('noisy', kicker, 'alert', 'False alarms', att.noisy.error);
      const groups = {};
      const order = [];
      // A visitor's sandbox is a walkthrough that asks the visitor to find
      // its one false alarm, so a sandbox's false alarm is the exercise done,
      // not a rule gone wrong. It is counted apart, never listed.
      const inSandboxes = att.noisy.rows.filter(row => SANDBOX_NAME.test(String(row.project_name || ''))).length;
      const apart = inSandboxes
        ? html`<p class="tf-ops-att-note">Left out: ${plural(inSandboxes, 'false alarm')} in visitors' sandboxes, where the walkthrough asks for one.</p>` : '';
      att.noisy.rows.filter(row => !SANDBOX_NAME.test(String(row.project_name || ''))).forEach(row => {
        const project = String(row.project_name || '');
        const rule = ruleKeyOf(row);
        const key = project + '\u0000' + rule;
        if (!groups[key]) { groups[key] = { project, rule, count: 0, refused: 0 }; order.push(key); }
        groups[key].count += 1;
        if (outcomeOf(row) === 'refused') groups[key].refused += 1;
      });
      const list = order.map(k => groups[k]).sort((a, b) => b.count - a.count || a.rule.localeCompare(b.rule));
      const partial = html`${att.noisy.partial ? html`<p class="tf-ops-att-note">Counted over the newest ${plural(att.noisy.rows.length, 'false alarm')}; the ledger holds more.</p>` : ''}${att.noisy.stale
        ? html`<p class="tf-ops-att-note text-amber-300">As read at ${T.clockTime(att.noisy.at)}: the last re-read failed (${trimStop(att.noisy.stale.message || 'no answer')}).</p>` : ''}`;
      if (!list.length) {
        return attSlot({ slot: 'noisy', tone: 'ok', icon: 'check', kicker, title: 'No rule turned noisy',
          body: html`<p class="tf-ops-att-note">No call from ${windowWords(days)} is marked a false alarm.</p>${apart}${partial}` });
      }
      // How loud the slot is follows what the false alarms cost. A rule that
      // refused a call marked a false alarm stopped work it should not have:
      // that is the refused colour. One whose false alarms were all calls it
      // only watched stopped none of them; they were would-refuse calls, so
      // it takes their colour. The note speaks of those false alarms only:
      // the same rule may have refused other calls, rightly, in the window,
      // and may be enforcing now, so it is not told it refused nothing, nor
      // that it has yet to enforce.
      const bit = list.filter(g => g.refused > 0);
      return attSlot({
        slot: 'noisy', tone: bit.length ? 'danger' : 'warn', icon: 'alert', kicker,
        title: html`${plural(list.length, 'rule')} turned noisy`,
        body: html`<ul class="tf-ops-att-list">${list.slice(0, 3).map(g => html`<li><a href="${projectHref(g.project)}" title="${g.refused ? 'Open the project: it refused calls marked false alarm; go back to Observe, or refine the rule' : 'Open the project: refine the rule before it refuses a call like these'}"><span class="tf-ops-att-what"><span class="font-mono text-gray-200">${g.rule}</span> <span class="text-gray-500">in</span> <span class="font-mono">${T.projectName(g.project)}</span></span><span class="tf-ops-att-n">${plural(g.count, 'false alarm')}${g.refused ? html` <span class="text-rose-300">· ${num(g.refused)} refused</span>` : ''}</span></a></li>`)}</ul>
          ${list.length > 3 ? html`<p class="tf-ops-att-note">and ${plural(list.length - 3, 'more rule')}.</p>` : ''}
          <p class="tf-ops-att-note">${bit.length
            ? html`${bit.length === list.length ? (list.length === 1 ? 'It' : 'Each') : plural(bit.length, 'of them', 'of them')} refused a call marked false alarm: go back to Observe, or refine the rule.`
            : list.length === 1 ? 'None of its false alarms was refused: it only watched those calls. Refine it before it refuses one like them.' : 'None of their false alarms was refused: they only watched those calls. Refine each before it refuses one like them.'}</p>${apart}${partial}`,
        foot: html`<a class="tf-btn tf-btn-sm" href="${callsHref({ review: 'false_alarm', days })}">The calls marked false alarm</a>`
      });
    }

    // How many sessions the strip reads: the route's own ceiling.
    const SESSIONS_READ = 200;

    // Sessions that halt on purpose: the demo page's scenarios (sim-) and the
    // service's own live probes (probe-), each of which trips the breaker to
    // show it working. Nobody has to act on them, so the strip leaves them out.
    const HALTS_ON_PURPOSE = /^(sim|probe)-/;

    function haltedSlot(att, who) {
      const kicker = 'Sessions';
      if (!att.sessions) return attLoading('halted', kicker, 'stop');
      if (att.sessions.error) return attUnread('halted', kicker, 'stop', 'Sessions', att.sessions.error);
      const halted = att.sessions.rows.filter(s => s && s.is_tripped === true && !HALTS_ON_PURPOSE.test(String(s.session_id || '')));
      // Resuming clears a halt, so it is the operator's: a visitor is told so
      // rather than offered a button the stack would refuse.
      const operator = !!who && who.authenticated === true;
      // The list is read up to a limit; a full read may not be every session.
      // It is not on the timer, so the slot says when it was read.
      const partial = html`${att.sessions.rows.length >= SESSIONS_READ
        ? html`<p class="tf-ops-att-note">Among the newest ${plural(att.sessions.rows.length, 'session')} read; the table holds more.</p>` : ''}${att.sessions.at
        ? html`<p class="tf-ops-att-note" data-note="sessions-read">Read at ${T.clockTime(att.sessions.at)} · Refresh to read again.</p>` : ''}`;
      if (!halted.length) {
        return attSlot({ slot: 'halted', tone: 'ok', icon: 'check', kicker, title: 'No session is halted',
          body: html`<p class="tf-ops-att-note">Left out: the demo page's scenarios and the service's own probes, which halt their sessions on purpose.</p>${partial}` });
      }
      return attSlot({
        slot: 'halted', tone: 'danger', icon: 'stop', kicker,
        title: html`${plural(halted.length, 'session')} halted`,
        body: html`<ul class="tf-ops-halts">${halted.slice(0, 3).map(s => html`<li>
            <a class="tf-ops-halt" href="${T.pageHref('sessions.html' + query({ session: s.session_id }))}">
              <span class="tf-ops-halt-id"><span class="font-mono text-gray-100">${s.session_id}</span>${s.project_name ? html` <span class="text-gray-500">in</span> <span class="font-mono">${T.projectName(s.project_name)}</span>` : ''}</span>
              ${s.trip_reason ? html`<span class="tf-ops-halt-why">${s.trip_reason}</span>` : ''}
              <span class="tf-ops-halt-when">started ${timeAgo(s.created_at)}</span>
            </a>
            ${operator ? html`<button type="button" class="tf-btn tf-btn-sm" data-action="resume-open" data-session="${s.session_id}">${T.icon('refresh', 14)}Resume…</button>` : ''}
          </li>`)}</ul>
          ${halted.length > 3 ? html`<p class="tf-ops-att-note">and ${plural(halted.length - 3, 'more session')}.</p>` : ''}
          <p class="tf-ops-att-note">Every later call in it is refused until ${operator ? 'you resume it' : 'the operator resumes it'}.</p>${partial}`,
        foot: html`<a class="tf-btn tf-btn-quiet tf-btn-sm" href="${T.pageHref('sessions.html')}">All sessions</a>`
      });
    }

    function attentionStrip(data, days, att, who) {
      return html`<section aria-labelledby="attention-title">
        <div class="tf-ops-head"><div>
          <h2 id="attention-title" class="tf-ops-h2">${T.icon('bolt', 18)}Needs your attention</h2>
          <p class="tf-ops-sub">Labels and false alarms from ${windowWords(days)}, refreshed with the numbers. Halted sessions are read when the page opens and on Refresh.</p>
        </div></div>
        <div class="tf-ops-attention">${reviewSlot(data, days, who)}${noisySlot(att, days)}${haltedSlot(att, who)}</div>
      </section>`;
    }

    // On the public demo, the one sentence that says what the numbers are made
    // of, from `sources` where the stack reports it and from `sandbox_split`
    // where it predates that field. Only the fleet is called synthetic: the
    // page cannot know what else reached a public stack, so the rest is named
    // by where it came from. Nothing is said on a private stack.
    function sourceNote(data, who) {
      if (!who || who.reads_public !== true) return '';
      const count = part => (part && typeof part.calls === 'number' ? part.calls : null);
      const some = part => (count(part) || 0) > 0;
      let clauses = [];
      let parts = [];
      const s = data.sources && typeof data.sources === 'object' ? data.sources : null;
      const split = data.sandbox_split && typeof data.sandbox_split === 'object' ? data.sandbox_split : null;
      if (s) {
        const fleet = s.fleet || {};
        clauses = [
          some(s.fleet) && html`<strong>${num(count(s.fleet))}</strong> from the synthetic Acme fleet, ${typeof fleet.projects === 'number' ? plural(fleet.projects, 'project') : 'projects'} whose scheduled agents run through the real gates`,
          some(s.sandbox) && html`<strong>${num(count(s.sandbox))}</strong> from visitors' sandboxes`,
          some(s.other) && html`<strong>${num(count(s.other))}</strong> from other callers: the service's own probes, the demo page, or a repository connected to this stack`
        ];
        parts = [
          { label: 'Acme fleet, synthetic', value: count(s.fleet), color: T.CATEGORICAL[0] },
          { label: 'Sandboxes', value: count(s.sandbox), color: T.CATEGORICAL[1] },
          { label: 'Other callers', value: count(s.other), color: T.CATEGORICAL_OTHER }
        ];
      } else if (split) {
        clauses = [
          some(split.sandbox) && html`<strong>${num(count(split.sandbox))}</strong> from visitors' sandboxes`,
          some(split.elsewhere) && html`${some(split.sandbox) ? 'the other ' : ''}<strong>${num(count(split.elsewhere))}</strong> from everything else: the synthetic Acme fleet where it runs, the service's own probes, the demo page, or a repository connected to this stack`
        ];
        parts = [
          { label: 'Sandboxes', value: count(split.sandbox), color: T.CATEGORICAL[1] },
          { label: 'Everything else', value: count(split.elsewhere), color: T.CATEGORICAL_OTHER }
        ];
      }
      const said = clauses.filter(Boolean);
      const sentence = said.length
        ? html`Where these calls come from, on this public demo: ${said.map((c, i) => html`${i ? '; ' : ''}${c}`)}.`
        : html`On this public demo, calls come from the synthetic Acme fleet where it runs, visitors' sandboxes, the service's own probes, the demo page, or a repository connected to this stack.`;
      const drawn = parts.filter(p => typeof p.value === 'number' && p.value > 0);
      const bar = drawn.length ? html`<div class="tf-ops-share">
          <div class="tf-ops-share-bar" role="img" aria-label="${parts.map(p => p.label + ' ' + num(p.value)).join(', ')}">${drawn.map(p => html`<span style="flex-grow:${p.value};background:${p.color}" data-tf-tip="${p.label}" data-tf-tip-value="${num(p.value)}" data-tf-tip-color="${p.color}"></span>`)}</div>
          ${T.legend(parts.map(p => ({ label: p.label, color: p.color })))}
        </div>` : '';
      return html`<div class="tf-ops-source" data-sources="${s ? 'sources' : split ? 'sandbox_split' : 'none'}">${T.icon('info', 18)}<p>${sentence}</p>${bar}</div>`;
    }

    function viewOverview(ctx) {
      const days = pickDays(ctx.params.days, 7);
      let data = null;
      let loadedAt = 0;
      let who = null;
      let firstPaint = true;
      // The attention strip's own reads, kept between redraws so a refresh
      // does not flash them: false alarms from the ledger, halted sessions.
      const att = { noisy: null, sessions: null };
      let attStarted = false;
      const actions = pageTitleActions(days);
      const sub = 'What Threefold judged across every project in ' + windowWords(days) + '.';
      ctx.render(loadingView('Overview', sub, ['attention', 'kpis', 'chart']));

      // The false alarms of the window: a filtered read of the ledger, so it
      // is read again with every refresh of the numbers. A project's
      // readiness is drawn from both reads together, and never green from a
      // false-alarm read older than the numbers beside it.
      function readFalseAlarms() {
        return T.api('/api/decisions' + query({ review: 'false_alarm', days, limit: 200 })).then(body => {
          // Only rows the ledger says were marked false alarm: a stack that did
          // not filter would otherwise have every call counted as one.
          const rows = body && Array.isArray(body.items) ? body.items : [];
          return { rows: rows.filter(r => r && r.review === 'false_alarm'), partial: !!(body && body.next_cursor), at: Date.now() };
        });
      }
      // A refresh that could not read them keeps the last rows in the slot,
      // marked stale, and readiness claims nothing from them.
      function falseAlarmsFailed(err) {
        att.noisy = att.noisy && !att.noisy.error ? Object.assign({}, att.noisy, { stale: err }) : { error: err };
      }

      function load(quiet, withSessions) {
        const numbers = T.api('/api/overview' + query({ days }));
        // Once the strip has started, a refresh reads the false alarms beside
        // the numbers and draws once both have answered.
        const alarms = attStarted ? readFalseAlarms().then(read => ({ read }), err => ({ err })) : null;
        return Promise.all([numbers, alarms]).then(([body, fa]) => {
          if (!ctx.alive()) return;
          data = body || {};
          loadedAt = Date.now();
          if (fa) { if (fa.read) att.noisy = fa.read; else falseAlarmsFailed(fa.err); }
          // The strip's own reads start once the overview has calls to speak
          // of: a stack that refused the overview would refuse them too, and
          // an empty window has nothing for them to find yet.
          if (!attStarted && data.totals && data.totals.calls) { attStarted = true; loadAttention(); }
          else if (withSessions && attStarted) loadSessions();
          draw();
          if (quiet) announce('Overview refreshed');
        }, err => {
          if (!ctx.alive()) return;
          // A refresh that fails leaves what was read on screen and says so.
          if (quiet && data) {
            const el = document.getElementById('freshness');
            if (el) setHtml(el, html`<span class="text-amber-300">The last refresh failed (${err.message}); what is shown was read ${timeAgo(new Date(loadedAt).toISOString())}.</span>`);
            return;
          }
          if (T.isAuthError(err)) clearInterval(timer);
          ctx.render(html`${pageTitle('Overview', null, actions)}${failure(err, 'the overview')}`);
        });
      }

      // The session list is a scan of the table, so it is read when the strip
      // starts, on Refresh and after a resume, never on the timer; the slot
      // says when it was read. A read that fails leaves the last good one.
      function loadSessions() {
        return T.api('/api/sessions' + query({ limit: SESSIONS_READ })).then(body => {
          att.sessions = { rows: body && Array.isArray(body.sessions) ? body.sessions : [], at: Date.now() };
        }, err => { att.sessions = att.sessions && !att.sessions.error ? att.sessions : { error: err }; })
          .then(() => { if (ctx.alive() && data) draw(); });
      }

      function loadAttention() {
        readFalseAlarms().then(read => { att.noisy = read; }, falseAlarmsFailed)
          .then(() => { if (ctx.alive() && data) draw(); });
        loadSessions();
      }

      function chartWidth() {
        const el = document.getElementById('daily-chart');
        const w = el && el.clientWidth;
        return w && w > 0 ? w : 640;
      }

      function dailyChart() {
        const series = Array.isArray(data.series) ? data.series : [];
        if (!series.length) return emptyNote('No days to draw in this window.');
        return T.stackedBars(series, {
          width: chartWidth(),
          height: 220,
          title: 'Calls per day, ' + windowWords(days),
          desc: 'Stacked columns, one per day: refused at the base, then would refuse, then approved.',
          keys: [
            { key: 'refused', label: 'Refused', color: C.refused },
            { key: 'observed', label: 'Would refuse', color: C.observed },
            { key: 'approved', label: 'Approved', color: C.approved }
          ],
          href: (row, key) => callsHref({ kind: key, day: row.day, days: daysSince(row.day) })
        });
      }

      // A window with few busy days still reads as intended: it says what the
      // window holds rather than leaving a reader to wonder at the gaps.
      function dailyWords(series) {
        const busy = series.filter(r => (r.approved || 0) + (r.observed || 0) + (r.refused || 0) > 0);
        if (series.length <= 1) return 'Click a segment to open the calls behind it.';
        if (busy.length === 1) return 'Every call in this window arrived on ' + shortDay(busy[0].day) + '; the other days hold none. Click a segment to open its calls.';
        if (busy.length < series.length) return 'Calls arrived on ' + busy.length + ' of the ' + series.length + ' days in this window; a day without a column had none. Click a segment to open its calls.';
        return 'Click a segment to open the calls behind it.';
      }

      function agentsCard(byAgent) {
        const kinded = byAgent.some(a => typeof a.kind === 'string');
        const coding = byAgent.filter(a => (a.calls || 0) > 0 && (!kinded || a.kind === 'coding_agent')).sort((a, b) => (b.calls || 0) - (a.calls || 0));
        const others = kinded ? byAgent.filter(a => (a.calls || 0) > 0 && a.kind !== 'coding_agent') : [];
        const bars = coding.length
          ? T.hbars(coding.map(a => ({
              label: agentLabel(a.agent), href: callsHref({ agent: a.agent, days }),
              segments: [{ value: a.calls, label: 'calls', color: C.accent, href: callsHref({ agent: a.agent, days }) }],
              sublabel: typeof a.calls_in_sandboxes === 'number' && a.calls_in_sandboxes > 0
                ? (a.calls_in_sandboxes === a.calls ? 'every one of them in visitors\' sandboxes' : num(a.calls_in_sandboxes) + ' of them in visitors\' sandboxes')
                : ''
            })), { title: 'Coding agents' })
          : emptyNote(kinded ? 'No coding agent sent a call in this window.' : 'No agent reported itself in this window.');
        const apart = others.length ? html`<div class="mt-5 pt-4 border-t border-gray-800">
            <p class="tf-label">Not coding agents</p>
            <ul class="space-y-1.5">${others.map(a => html`<li class="text-xs"><a class="tf-link-row flex-wrap gap-x-2" href="${callsHref({ agent: a.agent, days })}"><span class="text-gray-200">${agentLabel(a.agent)}</span><span class="font-mono text-gray-400">${plural(a.calls, 'call')}</span><span class="text-gray-500">${CALLER_KINDS[a.kind] || CALLER_KINDS.unknown}</span></a></li>`)}</ul>
          </div>` : '';
        return card(kinded ? 'Coding agents' : 'By agent', null, html`${bars}${apart}`, 'min-w-0');
      }

      function draw() {
        const t = data.totals || {};
        const stages = data.stages || {};
        const series = Array.isArray(data.series) ? data.series : [];
        const byAgent = Array.isArray(data.by_agent) ? data.by_agent : [];
        const byOrigin = Array.isArray(data.by_origin) ? data.by_origin : [];
        const byRule = Array.isArray(data.by_rule) ? data.by_rule : [];
        const byProject = Array.isArray(data.by_project) ? data.by_project : [];
        const head = pageTitle('Overview', sub, actions);
        // When the numbers were read, in a few words; how they are kept exact
        // is a hover away rather than a line of its own.
        const fresh = html`<p id="freshness" class="tf-ops-fresh" title="Counted from daily rollups${data.generated_at ? ' generated ' + timeAgo(data.generated_at) : ''}, so they are exact however busy the ledger is. Refreshed every 30 seconds while this tab is open."><span class="tf-ops-live" aria-hidden="true"></span>Updated ${T.clockTime(loadedAt)} · refreshes every 30 s</p>`;

        if (!t.calls) {
          ctx.render(html`${head}${fresh}${overviewEmpty(days)}`);
          return;
        }

        const perDay = series.map(r => (r.approved || 0) + (r.observed || 0) + (r.refused || 0));
        const dayLabels = series.map(r => shortDay(r.day));
        const kinded = byAgent.some(a => typeof a.kind === 'string');
        const codingCount = typeof t.coding_agents === 'number' ? t.coding_agents : null;
        const coding = byAgent.filter(a => (a.calls || 0) > 0 && (!kinded || a.kind === 'coding_agent')).sort((a, b) => (b.calls || 0) - (a.calls || 0));
        const others = kinded ? byAgent.filter(a => (a.calls || 0) > 0 && a.kind !== 'coding_agent') : [];
        // Signed out on the public demo, the queue is not the reader's own.
        const visitor = !!who && who.reads_public === true && who.authenticated !== true;
        const agentWords = (coding.length ? coding.slice(0, 3).map(a => agentLabel(a.agent)).join(', ') : 'none in this window') +
          (others.length ? ' · not agents: ' + others.map(a => agentLabel(a.agent) + ' (' + plural(a.calls, 'call') + ')').join(', ') : '');
        const tiles = [
          { label: 'Calls judged', metric: 'calls', value: t.calls, href: callsHref({ days }), icon: 'layers', wide: true,
            sub: num(t.approved) + ' approved, ' + num(t.refused) + ' refused and ' + num(t.would_refuse) + ' would refuse, in ' + windowWords(days),
            spark: T.sparkline(perDay, { label: 'Calls per day', color: C.accent, labels: dayLabels, width: 168, height: 40 }) },
          { label: 'Refused', metric: 'refused', value: t.refused, href: callsHref({ kind: 'refused', days }), icon: 'stop',
            sub: t.refused ? 'stopped before they ran: ' + pct(t.refused / t.calls) + ' of calls' : 'nothing was refused in this window',
            spark: T.sparkline(series.map(r => r.refused || 0), { label: 'Refused per day', color: C.refused, labels: dayLabels }) },
          { label: 'Would refuse', metric: 'would_refuse', value: t.would_refuse, href: callsHref({ kind: 'observed', days }), icon: 'eye',

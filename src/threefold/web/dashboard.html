            ${rows.length ? html`<div class="tf-try-cards${play.cards ? ' tf-try-play' : ''}">${rows.map(flagCard)}</div>` : html`${T.emptyState({
              icon: 'check',
              text: 'Every call in the list ran, and none broke a rule in Observe. The ledger can lag a moment behind a new sandbox, so a second read may find more.',
              action: { label: 'Read the list again', action: 'try-show' }
            })}${Array.isArray(state.calls) && state.calls.length ? lanes(state.calls, {}) : ''}`}`,
          actions: rows.length ? primary('try-review', 'Label each call') : primary('try-readiness', 'See the rules', 'Reading readiness…')
        };
      }

      function clampCursor() {
        const total = state.observed.length;
        state.cursor = Math.max(0, Math.min(total - 1, Number(state.cursor) || 0));
        return state.cursor;
      }

      function nextUnlabelled(from) {
        const rows = state.observed;
        for (let k = 1; k <= rows.length; k++) {
          const j = (from + k) % rows.length;
          if (!state.labels[rows[j].verdict_id]) return j;
        }
        return -1;
      }

      function labelTally() {
        const byRule = new Map();
        state.observed.forEach(r => {
          const k = ruleKeyOf(r);
          if (!byRule.has(k)) byRule.set(k, []);
          byRule.get(k).push(state.labels[r.verdict_id] || '');
        });
        return html`<div class="tf-try-side-block">
          <p class="tf-label">Your labels, by rule</p>
          <ul class="tf-try-tally">${Array.from(byRule).map(([key, marks]) => html`<li><span>${key}</span><span class="tf-try-tally-marks">${marks.map(l => html`<span class="tf-try-q-mark" data-label="${l}" title="${l ? REVIEWS[l].label : 'No label yet'}">${l === 'correct' ? T.icon('check', 11) : l === 'false_alarm' ? T.icon('x', 11) : ''}</span>`)}</span></li>`)}</ul>
          <p class="tf-try-muted">A rule with a false alarm will read Noisy and keep observing.</p>
        </div>`;
      }

      // The two labels for the call on top. On a desk they sit on the card;
      // on a phone they sit in the sticky bar at the foot of the screen, so
      // the thumb finds them in the same place from call to call however tall
      // the card above is.
      function verdicts(row) {
        const l = state.labels[row.verdict_id];
        return html`<div class="tf-try-verdicts" role="group" aria-label="Your label for this call">
          <button type="button" id="try-correct" class="tf-btn tf-btn-good tf-try-verdict" data-action="try-label" data-verdict="${row.verdict_id}" data-label="correct" aria-pressed="${l === 'correct' ? 'true' : 'false'}" aria-keyshortcuts="C">${T.icon('check', 20)}Correct${T.kbd('C')}</button>
          <button type="button" id="try-false" class="tf-btn tf-btn-danger tf-try-verdict" data-action="try-label" data-verdict="${row.verdict_id}" data-label="false_alarm" aria-pressed="${l === 'false_alarm' ? 'true' : 'false'}" aria-keyshortcuts="F">${T.icon('x', 20)}False alarm${T.kbd('F')}</button>
        </div>`;
      }

      function progressSegs(rows, i) {
        return html`<div class="tf-try-progress" aria-hidden="true">${rows.map((r, j) => html`<span class="tf-try-seg" data-label="${state.labels[r.verdict_id] || ''}" data-current="${j === i ? 'true' : 'false'}"></span>`)}</div>`;
      }

      // The last label given, kept on screen above the stack, so the card
      // that moved on leaves a receipt where the eye already is.
      function receipt() {
        const last = state.lastLabel;
        if (!last || !REVIEWS[last.label]) {
          return html`<p class="tf-try-receipt">${T.icon('info', 14)}<span>Label the call on top, and the next one comes up.</span></p>`;
        }
        return html`<p class="tf-try-receipt" data-label="${last.label}">${T.icon(last.label === 'correct' ? 'check' : 'x', 14)}<span>Marked <b>${REVIEWS[last.label].label}</b>: <span class="tf-mono">${last.target}</span></span></p>`;
      }

      function reviewBoard(play, inBar) {
        const rows = state.observed;
        const total = rows.length;
        const i = clampCursor();
        const row = rows[i];
        const l = state.labels[row.verdict_id];
        const why = tryWhy(row, state.rulesDef);
        const rest = rows.filter((r, j) => j !== i && !state.labels[r.verdict_id]).length;
        const gone = play.gone && REVIEWS[play.gone.label] ? play.gone : null;
        return html`<div class="tf-try-review">
          <div class="tf-try-stack-col">
            ${receipt()}
            <div class="tf-try-stack" data-behind="${Math.min(2, rest)}">
              <article class="tf-try-card" data-dir="${play.card || ''}" data-label="${l || ''}" aria-labelledby="try-card-file" aria-describedby="try-card-why">
                <header class="tf-try-card-top">
                  <span class="tf-try-card-count">Call ${num(i + 1)} of ${num(total)}</span>
                  <span class="tf-try-card-agent">${tryAvatar(row.agent, true)}${agentLabel(row.agent)} · <span class="tf-mono">${row.tool_name}</span></span>
                </header>
                <p id="try-card-file" class="tf-try-card-file">${tryTarget(row)}</p>
                <p class="tf-try-card-rule">${T.statusChip('observed')}<span class="tf-break">${ruleKeyOf(row)}</span></p>
                <p id="try-card-why" class="tf-try-card-why">${tryWhyHtml(why)}</p>
                ${inBar ? '' : verdicts(row)}
                <nav class="tf-try-card-nav" aria-label="Move between calls">
                  <button type="button" id="try-prev" class="tf-btn tf-btn-quiet tf-btn-sm" data-action="try-move" data-move="-1" aria-keyshortcuts="ArrowLeft"${i === 0 ? raw(' disabled') : ''}>← Previous</button>
                  ${l ? reviewChip(l) : html`<span class="tf-try-muted">No label yet</span>`}
                  <button type="button" id="try-next" class="tf-btn tf-btn-quiet tf-btn-sm" data-action="try-move" data-move="1" aria-keyshortcuts="ArrowRight"${i === total - 1 ? raw(' disabled') : ''}>Next →</button>
                </nav>
              </article>
              ${gone ? html`<div class="tf-try-gone" data-label="${gone.label}" aria-hidden="true"><span class="tf-try-gone-stamp">${T.icon(gone.label === 'correct' ? 'check' : 'x', 18)}${REVIEWS[gone.label].label}</span><span class="tf-try-gone-file">${gone.target}</span></div>` : ''}
            </div>
          </div>
          <div class="tf-try-side-panel">
            ${inBar ? '' : html`<div>
              <p class="tf-try-progress-text">${num(labelledCount())} of ${num(total)} labelled</p>
              ${progressSegs(rows, i)}
            </div>`}
            <ol class="tf-try-queue" aria-label="The calls to label">
              ${rows.map((r, j) => {
                const mark = state.labels[r.verdict_id] || '';
                return html`<li><button type="button" data-action="try-goto" data-index="${j}" aria-current="${j === i ? 'true' : 'false'}">
                  <span class="tf-try-q-mark" data-label="${mark}" aria-hidden="true">${mark === 'correct' ? T.icon('check', 11) : mark === 'false_alarm' ? T.icon('x', 11) : ''}</span>
                  <span class="tf-try-q-text"><span class="tf-try-q-file">${tryTarget(r)}</span><span class="tf-try-q-state">${agentLabel(r.agent)} · ${mark ? REVIEWS[mark].label : 'to label'}</span></span>
                </button></li>`;
              })}
            </ol>
            ${labelTally()}
          </div>
        </div>`;
      }

      function screenLabel(play) {
        const total = state.observed.length;
        const done = labelledCount() === total;
        const inBar = !!(total && !done && thumb());
        return {
          kicker: 'Step 3 of 5',
          title: total && done ? 'Every call has a label' : 'Was the rule right?',
          sentence: total && done
            ? 'You marked ' + plural(labelCounts().correct, 'call') + ' correct and ' + plural(labelCounts().false_alarm, 'call') + ' a false alarm. Each rule now reads its state from those labels.'
            : 'Mark each call Correct if the rule was right, or False alarm if the call should run. One of them is a false alarm: spot it.',
          visual: total ? reviewBoard(play, inBar) : T.emptyState({ icon: 'check', text: 'No call in the sandbox was flagged by an observing rule, so there is nothing to label. Promote anyway to see a rule refuse.' }),
          actions: done
            ? primary('try-readiness', 'See what that did', 'Reading readiness…')
            : inBar
              ? html`<div class="tf-try-thumb">
                  <div class="tf-try-thumb-top"><p class="tf-try-progress-text">${num(labelledCount())} of ${num(total)} labelled</p>${progressSegs(state.observed, clampCursor())}</div>
                  ${verdicts(state.observed[clampCursor()])}
                </div>`
              : html`<span class="tf-try-wait">${primary('try-readiness', 'See what that did', null, true)}</span><p class="tf-try-hint">Label every call to continue.<span class="tf-try-keys"> Keys: ${T.kbd('C')} correct ${T.kbd('F')} false alarm ${T.kbd('←')}${T.kbd('→')} move</span></p>`
        };
      }

      function modeChip(mode) {
        return mode === 'enforce'
          ? html`<span class="tf-chip tf-chip-purple">${T.icon('shield', 13)}Enforces</span>`
          : html`<span class="tf-chip tf-chip-amber">${T.icon('eye', 13)}Keeps observing</span>`;
      }

      function ruleRow(r, i, play, quietWords) {
        const count = v => (typeof v === 'number' && v > 0 ? v : 0);
        const was = state.before && state.before[r.rule_key];
        const flip = !!(play.flip && was && was !== r.state);
        const checked = selected().has(r.rule_key);
        const mode = state.promoted ? (state.promoted.observe.indexOf(r.rule_key) === -1 ? 'enforce' : 'observe') : null;
        const flagged = count(r.would_refuse);
        const correct = count(r.correct);
        const alarms = count(r.false_alarms);
        const open = count(r.unreviewed);
        const segs = [].concat(Array(correct).fill('correct'), Array(alarms).fill('false_alarm'), Array(open).fill('unreviewed')).slice(0, 24);
        return html`<li><label class="tf-try-rule" for="try-rule-${i}" style="--tf-try-i:${i}">
          <input id="try-rule-${i}" type="checkbox" class="tf-try-check" data-change="try-toggle" data-rule="${r.rule_key}" ${checked ? raw('checked') : ''}${state.promoted || state.busy ? raw(' disabled') : ''} />
          <span class="tf-try-rule-main">
            <span class="tf-try-rule-top">
              <span class="tf-try-rule-key">${r.rule_key}</span>
              <span class="tf-try-kind">${r.kind === 'gate' || tryIsGate(r.rule_key) ? 'gate' : 'layering rule'}</span>
              <span class="tf-try-flip${flip ? ' tf-try-flipping' : ''}">${flip ? html`<span class="tf-try-was" aria-hidden="true">${stateChip(was)}</span>` : ''}<span class="tf-try-now">${stateChip(r.state)}</span></span>
              ${mode ? modeChip(mode) : ''}
            </span>
            ${flagged ? html`<span class="tf-try-bar" aria-hidden="true">${segs.map(k => html`<span class="tf-try-bar-seg" data-k="${k}"></span>`)}</span>
              <span class="tf-try-rule-counts">${plural(flagged, 'flag')}: ${num(correct)} correct · ${plural(alarms, 'false alarm')}${open ? ' · ' + num(open) + ' without a label' : ''}</span>` : ''}
            ${quietWords ? '' : html`<span class="tf-try-rule-rec">${r.recommendation || (STATES[r.state] || {}).says || ''}</span>`}
          </span>
        </label></li>`;
      }

      function stageSwitch(animate) {
        const enforce = !!(state.promoted && state.promoted.stage === 'enforce');
        return html`<div class="tf-try-switch${animate && enforce ? ' tf-try-switching' : ''}" data-stage="${enforce ? 'enforce' : 'observe'}" role="img" aria-label="The project's stage: ${enforce ? 'Enforce' : 'Observe'}">
          <span class="tf-try-switch-knob"></span>
          <span class="tf-try-switch-opt" data-opt="observe">${T.icon('eye', 18)}<span><b>Observe</b><small>judges and records; refuses nothing</small></span></span>
          <span class="tf-try-switch-opt" data-opt="enforce">${T.icon('shield', 18)}<span><b>Enforce</b><small>refuses a call that breaks a rule in force</small></span></span>
        </div>`;
      }

      function screenPromote(play) {
        const rules = readinessRules();
        const noisy = rules.filter(r => r.state === 'noisy').length;
        const chosen = rules.filter(r => selected().has(r.rule_key)).length;
        const flagged = rules.filter(r => (typeof r.would_refuse === 'number' && r.would_refuse > 0) || r.state !== 'quiet');
        const quiet = rules.filter(r => flagged.indexOf(r) === -1);
        let k = 0;
        const row = r => ruleRow(r, k++, play);
        const quietSays = Array.from(new Set(quiet.map(r => r.recommendation || (STATES[r.state] || {}).says || '')));
        const quietWords = quiet.length > 1 && quietSays.length === 1 ? quietSays[0] : '';
        const quietRow = r => ruleRow(r, k++, play, quietWords);
        const byState = ['ready', 'noisy', 'needs_review', 'quiet']
          .map(s => [s, rules.filter(r => r.state === s).length]).filter(([, n]) => n > 0);
        const p = state.promoted;
        const observing = p ? p.observe.filter(key => rules.some(r => r.rule_key === key)) : [];
        const enforcing = p ? plural(p.enforce.length, 'rule') + (p.enforce.length === 1 ? ' refuses the calls that break it' : ' refuse the calls that break them') : '';
        const keeps = observing.length ? '; ' + tryList(observing) + (observing.length === 1 ? ' keeps' : ' keep') + ' observing, recording and refusing nothing.' : '.';
        return {
          kicker: p ? (p.earlier ? 'Step 4 of 5 · promoted earlier' : 'Step 4 of 5 · promoted') : 'Step 4 of 5',
          title: p ? (p.earlier ? 'Already in Enforce' : 'Now in Enforce') : 'Promote to Enforce',
          sentence: p
            ? (p.earlier ? 'This sandbox was promoted before you came back: ' + enforcing + keeps : enforcing.replace(/ refuse/, ' now refuse') + keeps)
            : 'Each rule now reads its state from your labels. Ready and Quiet rules are checked. ' + (noisy
              ? (noisy === 1 ? 'The rule with a false alarm is Noisy and stays' : 'The rules with false alarms are Noisy and stay') + ' in Observe, where it records and refuses nothing.'
              : 'No rule is Noisy: you marked every flag correct. An unchecked rule keeps observing.'),
          visual: html`${projectBar(html`<span class="tf-try-states">${byState.map(([s, n]) => html`<span class="tf-try-stat">${stateChip(s)}<b>${num(n)}</b></span>`)}</span>`, !!play.promote)}
            ${stageSwitch(!!play.promote)}
            <div class="${play.flip ? 'tf-try-play' : ''}">
              ${flagged.length ? html`<ul class="tf-try-rules">${flagged.map(row)}</ul>` : ''}
              ${quiet.length ? html`<p class="tf-try-group">Flagged nothing here</p>${quietWords ? html`<p class="tf-try-rule-rec tf-try-group-note">${quietWords}</p>` : ''}<ul class="tf-try-rules tf-try-rules-quiet">${quiet.map(quietRow)}</ul>` : ''}
              ${rules.length ? '' : emptyNote('The service returned no rules for this project.')}
            </div>`,
          actions: p
            ? primary('try-next', 'Send the same kind of call again', 'Planning the call…')
            : html`${primary('try-promote', 'Promote with ' + plural(chosen, 'rule'), 'Promoting…', chosen === 0)}${chosen === 0 ? html`<p class="tf-try-hint">Check at least one rule to promote: with none in force, Enforce would refuse nothing.</p>` : ''}`
        };
      }

      function editor(plan, tone) {
        const args = plan && plan.arguments ? plan.arguments : {};
        const command = plan.action_type === 'COMMAND_EXEC';
        const read = plan.action_type === 'FILE_READ';
        const lines = command ? [String(args.command || '')] : read ? ['Read ' + String(args.file_path || '')] : String(args.content || '').replace(/\n$/, '').split('\n');
        const bad = line => command || read || /^\s*(import|from|using)\b/.test(line);
        const what = command ? 'command' : read ? 'read' : 'write';
        const note = tone === 'refused'
          ? 'Refused before it ran: a hook would have stopped the ' + what + ' here.'
          : tone === 'approved'
            ? 'This ' + what + ' was answered with an approval.'
            : plan.from === 'rule'
              ? html`No call in the sandbox fell under <span class="tf-mono">${plan.rule}</span>, so this write is built from the rule itself: a file it watches, and a package it forbids.`
              : plan.from === 'flagged'
                ? html`Built from a call <span class="tf-mono">${plan.rule}</span> flagged: ${command ? 'the same command' : read ? 'the same file' : 'the file it flagged, and the import it caught'}.`
                : html`Built from a call you marked correct under <span class="tf-mono">${plan.rule}</span>: ${command ? 'the same command' : read ? 'the same file' : 'the file it flagged, and the import it caught'}.`;
        return html`<figure class="tf-try-editor" data-tone="${tone || 'pending'}" data-kind="${what}">
          <figcaption class="tf-try-editor-tab">${T.icon(command ? 'terminal' : read ? 'book' : 'code', 14)}<span class="tf-break">${command ? 'Terminal' : (args.file_path || '')}</span><span class="tf-try-editor-meta">${plan.tool_name} · Claude Code · hook</span></figcaption>
          <pre class="tf-try-code"><code>${lines.map((line, n) => html`<span class="tf-try-line"${bad(line) ? raw(' data-bad') : ''}><span class="tf-try-ln" aria-hidden="true">${command ? '$' : n + 1}</span>${line}</span>`)}</code></pre>
          <p class="tf-try-editor-note">${note}</p>
        </figure>`;
      }

      // The flagged call the replay was built from, as step 2 showed it.
      function thenCard(plan) {
        const row = plan && plan.verdict_id ? state.observed.find(r => r.verdict_id === plan.verdict_id) : null;
        if (!row) {
          if (!plan || plan.from !== 'rule') return '';
          return html`<div class="tf-try-then" data-from="rule">
            <p class="tf-try-then-label">Earlier, in Observe</p>
            <p class="tf-try-then-none">No call in the sandbox fell under <span class="tf-mono">${plan.rule}</span>, so there is no earlier call to set beside this one. The write is built from the rule itself.</p>
          </div>`;
        }
        const l = state.labels[row.verdict_id];
        return html`<div class="tf-try-then">
          <p class="tf-try-then-label">Earlier, in Observe</p>
          <p class="tf-try-card-agent">${tryAvatar(row.agent, true)}${agentLabel(row.agent)} · <span class="tf-mono">${row.tool_name}</span></p>
          <p class="tf-try-file tf-break tf-try-then-file">${tryTarget(row)}</p>
          <p class="tf-try-summary">${T.statusChip('observed')}<span class="tf-try-muted">It ran, and was recorded.</span></p>
          ${l ? html`<p class="tf-try-summary"><span class="tf-try-muted">You marked it</span>${reviewChip(l)}</p>` : ''}
        </div>`;
      }

      function screenSend(play) {
        const plan = state.replay;
        const p = state.promoted;
        if (!plan && p) {
          return {
            kicker: 'Step 5 of 5',
            title: 'No single call can show these rules',
            sentence: html`The project is in Enforce, and ${tryListHtml(p.enforce.map(key => html`<span class="tf-mono tf-try-strong">${key}</span>`))} ${p.enforce.length === 1 ? 'is' : 'are'} in force. ${p.enforce.length === 1 ? 'It is a gate' : 'They are gates'} that one call cannot trip: a loop needs the same call repeated, a budget a session's spend, and an unreadable write a layering rule in force over its path. Nothing is sent rather than a call they would approve.`,
            visual: html`${projectBar()}${T.emptyState({ icon: 'shield', text: 'Start again and keep a layering rule checked on step 4 to watch one refuse a write.' })}`,
            actions: html`${primary('try-finish', 'See what just happened')}<button type="button" class="tf-btn tf-btn-quiet" data-action="try-restart">${T.icon('refresh', 16)}Start again</button>`
          };
        }
        const earlier = plan ? thenCard(plan) : '';
        return {
          kicker: 'Step 5 of 5',
          title: 'Send the same kind of call again',
          sentence: 'As a hook would: origin hook, agent Claude Code, to your sandbox, now in Enforce. This time the rule in force refuses it, and Amazon Bedrock explains why.',
          visual: plan
            ? html`${projectBar()}<div class="tf-try-compare">${earlier}<div class="tf-try-now-col"><p class="tf-try-then-label">Now, in Enforce · sent as a hook would</p>${editor(plan, 'pending')}</div></div>`
            : emptyNote('There is no call to send yet: promote the project first.'),
          actions: plan ? primary('try-send', 'Send it', 'Sending…') : primary('try-restart', 'Start again')
        };
      }

      // The fix the response carries, as it carries it: the summary and how
      // many gate checks passed, with the steps and the proposed files one
      // click away; "checked" is claimed only when the service says every
      // proposed write passed the same gates.
      function tryFix(fix) {
        if (!fix || typeof fix !== 'object' || typeof fix.summary !== 'string') return '';
        const checked = fix.validated === true;
        const steps = Array.isArray(fix.steps) ? fix.steps.filter(s => typeof s === 'string') : [];
        const writes = Array.isArray(fix.writes) ? fix.writes.filter(w => w && typeof w.path === 'string' && typeof w.content === 'string') : [];
        const checks = Array.isArray(fix.checks) ? fix.checks.filter(c => c && typeof c === 'object') : [];
        const passed = checks.filter(c => c.passed === true).length;
        const more = [];
        if (steps.length) more.push(plural(steps.length, 'step'));
        if (writes.length) more.push(plural(writes.length, 'proposed file'));
        return html`<section class="tf-try-fix" data-fix="${checked ? 'checked' : 'unchecked'}" aria-label="The fix in the response">
          <header class="tf-try-fix-head">
            <p class="tf-label">Suggested fix</p>
            ${typeof fix.kind === 'string' ? html`<span class="tf-chip tf-chip-gray">${fixKindLabel(fix.kind, fix.kind)}</span>` : ''}
            ${checked ? html`<span class="tf-chip tf-chip-emerald">${T.icon('check', 13)}Checked by Threefold: passes the same gates</span>` : ''}
          </header>
          <p class="tf-try-fix-summary">${fix.summary}</p>
          ${checks.length ? html`<p class="tf-try-fix-checks" data-passed="${passed === checks.length ? 'all' : 'some'}">${T.icon(passed === checks.length ? 'shield' : 'alert', 16)}${num(passed)} of ${num(checks.length)} gate checks passed on the proposed files</p>` : ''}
          ${more.length ? html`<details class="tf-try-fix-more">
            <summary>${T.icon('chevrondown', 14)}Show the ${tryList(more)}</summary>
            <div class="tf-try-fix-body">
              ${steps.length ? html`<ol class="tf-try-fix-steps">${steps.map(s => html`<li class="tf-break">${s}</li>`)}</ol>` : ''}
              ${writes.length ? html`<div class="tf-try-fix-writes">${writes.map(w => html`<div>
                <p class="tf-try-fix-path">${w.path}${w.new_file === true ? ' · a new file: if it exists, add to it' : ''}${w.partial === true ? ' · add this with an Edit where the command put it' : ''}${typeof w.old_string === 'string' ? ' · an Edit: in place of the text you replaced' : ''}${w.content === '' ? ' · empty' : ''}</p>
                <pre class="tf-pre tf-pre-plain"><code>${w.content}</code></pre>
              </div>`)}</div>` : ''}
            </div>
          </details>` : ''}
          <p class="tf-try-fix-foot">A starting point, never applied automatically.</p>
        </section>`;
      }

      // What a refusal stopped, in words.
      function stoppedWords(plan) {
        if (!plan) return 'Stopped before it ran';
        if (plan.action_type === 'COMMAND_EXEC') return 'Stopped before the command ran';
        if (plan.action_type === 'FILE_READ') return 'Stopped before the file was read';
        return 'Stopped before the file was written';
      }

      function screenClimax(play) {
        const r = state.result || {};
        const plan = state.replay;
        const refused = !!(r.status && r.status !== 'APPROVED');
        const source = r.explanation_source === 'bedrock' ? 'Amazon Bedrock' : r.explanation_source === 'deterministic_fallback' ? 'Deterministic explanation: the model was asked and did not answer' : 'Deterministic explanation';
        const observing = Array.isArray(state.observing) ? state.observing : [];
        // Plain words first: the rule's reason as a reader would say it. The
        // precise terms (the rule, the verdict, the stage) come second.
        const why = r.reason ? tryWhy({ status: r.status || 'APPROVED', reason: r.reason, rule_key: plan && plan.rule }, state.rulesDef) : null;
        const earlier = plan ? thenCard(plan) : '';
        return {
          tone: refused ? 'refused' : '',
          kicker: refused ? 'Step 5 of 5 · refused' : 'Step 5 of 5 · the answer',
          title: refused ? 'Refused, before it ran' : 'The service approved it',
          sentence: refused
            ? 'The same kind of call that ran in Observe is refused in Enforce' + (observing.length ? ', while ' + tryList(observing) + (observing.length === 1 ? ' keeps' : ' keep') + ' watching without refusing' : '') + '.'
            : 'This call was not refused' + (r.project_stage ? ' in stage ' + r.project_stage : '') + '. The rule it was built from may not be in force here; the project page shows each rule\'s mode.',
          visual: html`<div class="tf-try-climax${play.climax ? ' tf-try-play' : ''}">
            <div class="tf-try-verdict-banner" data-tone="${refused ? 'refused' : 'approved'}">
              <span class="tf-try-verdict-icon" aria-hidden="true">${T.icon(refused ? 'stop' : 'check', 28)}</span>
              <div class="tf-try-verdict-body">
                <p class="tf-try-verdict-lead">${refused ? stoppedWords(plan) : 'Answered with an approval'}</p>
                ${why ? html`<p class="tf-try-verdict-reason">${tryWhyHtml(why)}</p>` : ''}
                <p class="tf-try-verdict-terms">
                  ${plan && plan.rule ? html`<span class="tf-try-term"><span>Rule</span><span class="tf-mono">${plan.rule}</span></span>` : ''}
                  <span class="tf-try-term"><span>Verdict</span><span class="tf-mono">${r.status || '—'}</span></span>
                  ${r.project_stage ? html`<span class="tf-try-term"><span>Stage</span>${stageChip(r.project_stage)}</span>` : ''}
                </p>
              </div>
            </div>
            ${plan ? html`<div class="tf-try-compare tf-try-climax-compare">
              ${earlier}
              <div class="tf-try-now-col"><p class="tf-try-then-label">${refused ? 'Now, in Enforce · refused' : 'Now · approved'}</p>${editor(plan, refused ? 'refused' : 'approved')}</div>
            </div>` : ''}
            ${r.bedrock_explanation || tryFix(r.suggested_fix) ? html`<div class="tf-try-climax-grid">
              ${r.bedrock_explanation ? html`<figure class="tf-try-quote">
                <figcaption class="tf-try-quote-src">${T.icon('sparkles', 14)}${source}</figcaption>
                <blockquote>${r.bedrock_explanation}</blockquote>
                <p class="tf-try-quote-note">It explains the verdict for the person reading; the deterministic gate made it.</p>
              </figure>` : ''}
              ${tryFix(r.suggested_fix)}
            </div>` : ''}
          </div>`,
          actions: primary('try-finish', 'See what just happened')
        };
      }

      // Three facts, each read from a response the walkthrough received.
      function completionFacts() {
        const facts = [];
        const calls = Array.isArray(state.calls) ? state.calls : null;
        const seeded = typeof state.seeded === 'number' ? state.seeded : (calls ? calls.length : null);
        const flagged = state.observed.length;
        const agents = calls ? tryAgentsOf(calls) : [];
        const refusedFirst = calls ? tryTally(calls).refused : 0;
        // A fresh sandbox's seeded calls were all judged in Observe. A resumed
        // one's list may hold calls judged after a promotion, and says so.
        const inEnforce = typeof state.seeded === 'number' || !calls ? 0 : calls.filter(r => r.stage === 'enforce').length;
        const where = inEnforce ? num(seeded - inEnforce) + ' in Observe and ' + num(inEnforce) + ' in Enforce. ' : '';
        facts.push(seeded !== null
          ? {
            figure: num(seeded), label: inEnforce ? (seeded === 1 ? 'call judged' : 'calls judged') : (seeded === 1 ? 'call judged in Observe' : 'calls judged in Observe'),
            text: where + (agents.length ? tryList(agents) + ' sent them. ' : '') + (flagged ? plural(flagged, 'call') + ' would have been refused, and ' + (refusedFirst ? num(refusedFirst) + (refusedFirst === 1 ? ' was.' : ' were.') : 'none was.') : 'No rule flagged one' + (refusedFirst ? '.' : ', and none was refused.')),
            source: 'POST /api/sandbox · GET /api/decisions'
          }
          : { figure: num(flagged), label: 'calls flagged in Observe', text: 'Each one ran, and was recorded as a call its rule would have refused.', source: 'GET /api/decisions' });
        const c = labelCounts();
        const p = state.promoted;
        // The noisy rules the promotion left observing, as its answer lists them.
        const noisy = readinessRules().filter(r => r.state === 'noisy').map(r => r.rule_key)
          .filter(key => !p || p.observe.indexOf(key) !== -1);
        facts.push({
          figure: p ? num(p.enforce.length) : '—',
          label: p && p.enforce.length === 1 ? 'rule moved to Enforce' : 'rules moved to Enforce',
          text: 'You marked ' + plural(c.correct, 'call') + ' correct and ' + plural(c.false_alarm, 'call') + ' a false alarm' + (noisy.length ? ', so ' + tryList(noisy) + ' stayed in Observe.' : '.'),
          source: 'POST …/reviews · GET …/projects · POST …/promote'
        });
        const r = state.result || {};
        const refused = !!(r.status && r.status !== 'APPROVED');
        const fix = r.suggested_fix && typeof r.suggested_fix === 'object' && typeof r.suggested_fix.summary === 'string' ? r.suggested_fix : null;
        const fixChecks = fix && Array.isArray(fix.checks) ? fix.checks.filter(x => x && typeof x === 'object') : [];
        // A fix is called checked only when the service says so, and called
        // unchecked only when there were checks for it to fail.
        const extras = [];
        if (fix) extras.push(fix.validated === true ? 'a fix checked by Threefold' : fixChecks.length ? 'a fix the gates did not pass' : 'a suggested fix');
        if (r.explanation_source === 'bedrock') extras.push('a sentence from Amazon Bedrock');
        const rule = state.replay && state.replay.rule ? ' by ' + state.replay.rule : '';
        facts.push({
          figure: refused ? 'Refused' : (r.status ? 'Approved' : '—'), tone: refused ? 'refused' : '',
          label: 'the same kind of call, in Enforce',
          text: r.status
            ? (refused ? 'Stopped before it ran' + rule : 'Approved') + (extras.length ? ', with ' + tryList(extras) : '') + '. Its verdict: ' + r.status + '.'
            : state.planned && !state.replay ? 'No call was sent: no rule in force can be shown by a single call.' : 'No answer was recorded.',
          source: 'POST /evaluate-tool-call'
        });
        return facts;
      }

      function nextCard(href, iconName, name, sub, first) {
        return html`<a href="${href}" class="tf-card tf-card-link tf-try-next-card"${first ? raw(' data-primary') : ''}>
          <span class="tf-try-next-icon" aria-hidden="true">${T.icon(iconName, 18)}</span>
          <span class="tf-try-next-text"><span class="tf-try-next-name">${name}${T.icon('arrowright', 14)}</span><span class="tf-try-next-sub">${sub}</span></span>
        </a>`;
      }

      function screenDone(play) {
        return {
          kicker: 'Done',
          title: 'That was the whole rollout',
          sentence: 'Watch, label, promote, and back to Observe in one click if a rule bites wrong. Here is what just happened, as the service answered it.',
          visual: html`<ol class="tf-try-facts${play.enter ? ' tf-try-play' : ''}">${completionFacts().map((f, i) => html`<li class="tf-try-fact tf-try-rise" style="--tf-try-i:${i}" data-tone="${f.tone || ''}">
              <span class="tf-try-fact-n">${f.figure}</span>
              <span class="tf-try-fact-label">${f.label}</span>
              <p class="tf-try-fact-text">${f.text}</p>
              <p class="tf-try-fact-src">${f.source}</p>
            </li>`)}</ol>
            <h3 class="tf-try-next-title">Next</h3>
            <div class="tf-try-next">
              ${nextCard('#/connect', 'plug', 'Connect your repository', 'One command. It starts in Observe, so nothing is refused until you promote.', true)}
              ${state.project ? nextCard(projectHref(state.project), 'folder', 'Open this sandbox project', html`<span class="tf-mono">${state.project}</span>: its readiness, its calls, and Demote in one click.`) : ''}
              ${nextCard('#/proof', 'chart', 'See the proof', 'What Threefold has been measured to do, with real agents, with and without it.')}
            </div>`,
          actions: html`<button type="button" id="try-primary" class="tf-btn tf-btn-lg" data-action="try-restart">${T.icon('refresh', 16)}Start again</button><a class="tf-btn tf-btn-quiet" href="#/overview">The overview</a>`
        };
      }

      function screenPrivate() {
        return {
          kicker: 'Private stack',
          title: 'The walkthrough runs on the public demo',
          sentence: 'This is a private stack, where only the operator can make projects. Connect a real repository instead: it starts in Observe, so nothing is refused while you watch.',
          visual: T.emptyState({ icon: 'lock', text: 'Visitors cannot make a sandbox here. On the public demo anyone can, with no account.' }),
          actions: html`<a id="try-primary" class="tf-btn tf-btn-primary tf-btn-lg tf-try-primary" href="#/connect">Connect a repository${T.icon('arrowright', 16)}</a>`
        };
      }

      function screen(play) {
        if (state.who && state.who.reads_public === false) return screenPrivate();
        if (state.step === 2) return screenFlagged(play);
        if (state.step === 3) return screenLabel(play);
        if (state.step === 4) return screenPromote(play);
        if (state.step === 5) return state.result ? screenClimax(play) : screenSend(play);
        if (state.step >= 6) return screenDone(play);
        return screenMake(play);
      }

      function draw() {
        const play = state.play || {};
        state.play = {};
        const s = screen(play);
        ctx.render(html`<div class="tf-try${play.enter ? ' tf-try-entering' : ''}" data-step="${state.step}">
          ${side()}
          <section id="try-stage" class="tf-card tf-try-stage${play.enter ? ' tf-try-enter' : ''}" data-tone="${s.tone || ''}" aria-labelledby="try-step-title">
            <header class="tf-try-stage-head">
              <p class="tf-try-kicker">${s.kicker}</p>
              <h2 id="try-step-title" tabindex="-1" class="tf-try-h2">${s.title}</h2>
              ${s.sentence ? html`<p class="tf-try-sentence">${s.sentence}</p>` : ''}
            </header>
            ${state.error ? html`<div class="tf-callout tf-callout-danger" role="alert">${T.icon('alert', 18)}<div class="tf-callout-body"><p>${state.error}</p></div></div>` : ''}
            <div class="tf-try-visual">${s.visual || ''}</div>
            ${s.foot ? html`<p class="tf-try-foot">${s.foot}</p>` : ''}
            <div class="tf-try-actions">${s.actions || ''}</div>
          </section>
        </div>`);
        if (!ctx.alive()) return;
        if (play.enter) scrollToStage();
        const id = state.focusId;
        state.focusId = null;
        if (id) {
          const node = document.getElementById(id);
          if (node && typeof node.focus === 'function' && !node.disabled) { try { node.focus({ preventScroll: true }); } catch (err) { /* focus is a courtesy */ } }
        }
      }

      // A new step starts at the top of the stage: on a desk that is the top of
      // the page, and on a phone the stage's title just under the sticky rail.
      function scrollToStage() {
        if (typeof window.scrollTo !== 'function') return;
        let y = 0;
        try {
          const narrow = typeof window.matchMedia === 'function' && window.matchMedia('(max-width: 1023px)').matches;
          const stageEl = document.getElementById('try-stage');
          const railEl = document.getElementById('try-rail');
          if (narrow && stageEl && typeof stageEl.getBoundingClientRect === 'function' && railEl && typeof railEl.getBoundingClientRect === 'function') {
            const top = stageEl.getBoundingClientRect().top + (window.scrollY || 0);
            y = Math.max(0, Math.round(top - 56 - railEl.getBoundingClientRect().height - 12));
          }
        } catch (err) { y = 0; }
        try { window.scrollTo(0, y); } catch (err) { /* no scroll */ }
      }

      // A new step: the stage animates in, the page returns to its top, and
      // the keyboard lands on the step's title.
      function enter(step, play) {
        state.step = step;
        state.play = Object.assign({ enter: true }, play || {});
        state.focusId = 'try-step-title';
      }

      function fail(err, doing) {
        state.busy = false;
        state.error = T.isAuthError(err)
          ? (doing === 'create' ? 'This stack does not let visitors make a sandbox (HTTP ' + err.status + '). The walkthrough runs on the public demo.' : 'The stack refused (HTTP ' + err.status + '): a sandbox is open to anyone only on the public demo.')
          : 'That did not work: ' + String((err && err.message) || 'no answer').replace(/[.\s]+$/, '') + '. Try again.';
        // On step 3 with calls still to label the way on is disabled, so the
        // keyboard goes back to the call it was on.
        state.focusId = state.step === 3 && labelledCount() < state.observed.length ? 'try-correct' : 'try-primary';
        draw();
      }

      function loadCalls() {
        return T.api('/api/decisions' + query({ project: state.project, kind: 'all', days: 1, limit: 50 })).then(list => {
          state.calls = list && Array.isArray(list.items) ? list.items : [];
          state.callsError = null;
        }, err => { state.calls = null; state.callsError = err; });
      }

      function loadSandbox() {
        const p = state.project;
        return Promise.all([
          T.api('/api/projects/' + encodeURIComponent(p) + query({ days: 1 })),
          T.api('/api/decisions' + query({ project: p, kind: 'observed', days: 1, limit: 50 })),
          // The rules' own definitions, so a card can name an import the
          // reason cut short. Never in the way: a failed read is no names.
          ruleDefinitions()
        ]).then(([detail, list]) => {
          state.readiness = (detail && detail.readiness) || { rules: [] };
          applyConfig(detail);
          // Each rule's state before the labels, so step 4 can show it change.
          state.before = {};
          readinessRules().forEach(r => { state.before[r.rule_key] = r.state; });
          // Oldest first, the order they arrived in on step 1.
          state.observed = tryChronological(list && Array.isArray(list.items) ? list.items : []);
          state.flaggedRead = true;
          state.labels = {};
          state.observed.forEach(r => { if (r.review === 'correct' || r.review === 'false_alarm') state.labels[r.verdict_id] = r.review; });
          const first = state.observed.findIndex(r => !state.labels[r.verdict_id]);
          state.cursor = first === -1 ? 0 : first;
        });
      }

      // The ledger keeps no arguments, so the call is rebuilt: the file the
      // rule watched, and an import the rule forbids, written the way that
      // file's language writes one. A package a rule names, rather than an
      // import a call made, is written as a wildcard where the language
      // needs one.
      function importLine(path, name, isPackage) {
        const ext = (String(path).match(/\.([A-Za-z0-9]+)$/) || [])[1] || '';
        const lower = ext.toLowerCase();
        if (lower === 'java' || lower === 'kt' || lower === 'scala') return 'import ' + name + (isPackage ? '.*' : '') + ';\n';
        if (lower === 'cs') return 'using ' + name + ';\n';
        if (['ts', 'tsx', 'js', 'jsx', 'mjs', 'cjs'].indexOf(lower) !== -1) return "import client from '" + name + "';\n";
        if (lower === 'go') return 'import "' + name + '"\n';
        return 'import ' + name + '\n';
      }

      // Every rule of the sandbox, by id, read once. A failed read is an
      // empty set: what is built from it then says less, never something else.
      function ruleDefinitions() {
        if (state.rulesDef) return Promise.resolve(state.rulesDef);
        return T.api('/rules' + query({ project: state.project })).then(set => {
          const byId = {};
          (set && Array.isArray(set.rules) ? set.rules : []).forEach(r => { if (r && typeof r.id === 'string') byId[r.id] = r; });
          state.rulesDef = byId;
          return byId;
        }, () => ({}));
      }

      function ruleOfRow(row) {
        const key = ruleKeyOf(row);
        return T.api('/api/decision' + query({ timestamp: row.timestamp, verdict_id: row.verdict_id })).then(d => d && d.rule, () => null)
          .then(rule => rule || ruleDefinitions().then(defs => defs[key] || null));
      }

      // The import to write again: the one the flagged call made when its
      // reason carries it whole; else the package it matched, which the rule
      // names; else the first package the rule forbids by name.
      function importToSend(row, rule) {
        const forbid = rule && Array.isArray(rule.forbid_imports) ? rule.forbid_imports.filter(n => typeof n === 'string' && n) : [];
        const seen = row ? tryImportOf(row) : null;
        if (seen && !seen.cut) return { name: seen.name, isPackage: false };
        const matched = seen ? tryPackageFor(seen.name, forbid) : '';
        if (matched) return { name: matched, isPackage: true };
        const plain = forbid.find(n => !/[*]/.test(n)) || (forbid.length ? String(forbid[0]).replace(/\*+\.?/g, '').replace(/^[./]+|[./]+$/g, '') : '');
        return plain ? { name: plain, isPackage: true } : null;
      }

      function writePlan(base, path, rule, row) {
        const imp = importToSend(row, rule);
        return Object.assign(base, { kind: 'write', tool_name: 'Write', action_type: 'FILE_WRITE',
          arguments: { file_path: path, content: imp ? importLine(path, imp.name, imp.isPackage) : '# Acme sandbox\n' } });
      }

      // The call a flagged row made, rebuilt as the same kind of call: a
      // gate's command as that command, a gate's file as a call to that file,
      // and a layering rule's write as a write to the file it flagged.
      function planFromRow(row, from) {
        const key = ruleKeyOf(row);
        const base = { rule: key, from, verdict_id: row.verdict_id };
        if (tryIsGate(key)) {
          const command = row.action_type === 'COMMAND_EXEC' ? tryCommand(row) : '';
          if (command) return Promise.resolve(Object.assign(base, { kind: 'command', tool_name: 'Bash', action_type: 'COMMAND_EXEC', arguments: { command } }));
          const path = targetOf(row);
          return Promise.resolve(Object.assign(base, row.action_type === 'FILE_READ'
            ? { kind: 'read', tool_name: 'Read', action_type: 'FILE_READ', arguments: { file_path: path } }
            : { kind: 'write', tool_name: 'Write', action_type: 'FILE_WRITE', arguments: { file_path: path, content: '# Acme sandbox\n' } }));
        }
        return ruleOfRow(row).then(rule => writePlan(base, targetOf(row) || 'src/domain/acme_order.py', rule, row));
      }

      // A write a layering rule refuses, built from the rule alone: a file
      // its path pattern covers, and a package it forbids.
      function planFromRule(rule) {
        if (!rule || typeof rule.id !== 'string') return null;
        const globs = Array.isArray(rule.when_path_matches) ? rule.when_path_matches : [];
        for (const glob of globs) {
          const path = tryPathFromGlob(glob);
          const imp = path ? importToSend(null, rule) : null;
          if (path && imp) return writePlan({ rule: rule.id, from: 'rule', verdict_id: null }, path, rule, null);
        }
        return null;
      }

      // What to send again under the rules now in force: a call marked
      // correct, then any call flagged, preferring a layering rule's (a write
      // with the import it caught) over a gate's; then, when no call in the
      // sandbox fell under a rule in force, a write built from a layering
      // rule's definition. A gate that one call cannot show (a loop, a budget,
      // an unreadable write) is never stood in for by a call it would approve:
      // the answer is then no call at all, and step 5 says why.
      function planReplay(enforce) {
        const inForce = r => enforce.indexOf(ruleKeyOf(r)) !== -1;
        const newestFirst = (a, b) => String(b.timestamp).localeCompare(String(a.timestamp));
        const usable = state.observed.filter(r => inForce(r) && tryReplayable(r)).sort(newestFirst);
        const correct = usable.filter(r => state.labels[r.verdict_id] === 'correct');
        const layered = rows => rows.filter(r => !tryIsGate(ruleKeyOf(r)));
        const row = layered(correct)[0] || correct[0] || layered(usable)[0] || usable[0] || null;
        if (row) return planFromRow(row, state.labels[row.verdict_id] === 'correct' ? 'correct' : 'flagged');
        const layering = enforce.filter(key => !tryIsGate(key));
        if (!layering.length) return Promise.resolve(null);
        return ruleDefinitions().then(defs => {
          for (const key of layering) {
            const plan = planFromRule(defs[key]);
            if (plan) return plan;
          }
          return null;
        });
      }

      // A label, from a button or a key: shown at once, saved, and taken back
      // if the service does not keep it. The next call without a label comes
      // up, as a reviewer works down a queue.
      function label(verdict, value) {
        const index = state.observed.findIndex(r => r.verdict_id === verdict);
        const row = state.observed[index];
        if (!row || (value !== 'correct' && value !== 'false_alarm')) return;
        const before = state.labels[verdict];
        const beforeLast = state.lastLabel;
        state.labels[verdict] = value;
        state.lastLabel = { label: value, target: tryTarget(row) };
        state.error = null;
        const next = nextUnlabelled(index);
        if (next === -1) {
          state.cursor = index;
          state.focusId = 'try-primary';
        } else {
          state.play = { card: next > index ? 'next' : 'prev', gone: { label: value, target: tryTarget(row) } };
          state.cursor = next;
          state.focusId = 'try-correct';
        }
        announce(REVIEWS[value].label + ': ' + tryTarget(row) + '. ' + labelledCount() + ' of ' + state.observed.length + ' labelled.');
        draw();
        // Kept until the service has answered, so readiness is never read
        // ahead of a label the reader has already seen land.
        const saving = T.api('/api/projects/' + encodeURIComponent(state.project) + '/reviews', {
          method: 'POST', body: { items: [{ timestamp: row.timestamp, verdict_id: row.verdict_id, label: value }] }
        }).then(answer => {
          if (!ctx.alive()) return;
          const skipped = answer && Array.isArray(answer.skipped) ? answer.skipped : [];
          if (skipped.length) {
            if (before) state.labels[verdict] = before; else delete state.labels[verdict];
            state.lastLabel = beforeLast;
            state.error = 'That label was not saved: ' + (skipped[0].reason || 'skipped') + '.';
            state.cursor = index;
            draw();
          }
        }, err => {
          if (!ctx.alive()) return;
          if (before) state.labels[verdict] = before; else delete state.labels[verdict];
          state.lastLabel = beforeLast;
          state.cursor = index;
          fail(err, 'label');
        });
        state.saves.push(saving);
        saving.then(() => { const at = state.saves.indexOf(saving); if (at !== -1) state.saves.splice(at, 1); });
        return saving;
      }

      function move(delta, focusId) {
        const total = state.observed.length;
        if (!total) return;
        const to = Math.max(0, Math.min(total - 1, clampCursor() + delta));
        if (to === state.cursor) return;
        state.play = { card: to > state.cursor ? 'next' : 'prev' };
        state.cursor = to;
        const edge = (focusId === 'try-prev' && to === 0) || (focusId === 'try-next' && to === total - 1);
        state.focusId = edge || !focusId ? 'try-correct' : focusId;
        draw();
      }

      // C and F label the call on top of the stack, and the arrows move
      // through it. Only on step 3, never while the reader types, holds a
      // modifier, or has the palette or a dialog open.
      function onKey(event) {
        if (!event || !ctx.alive() || state.step !== 3 || state.busy || !state.observed.length) return;
        if (event.ctrlKey || event.metaKey || event.altKey) return;
        if (dialogOpen || (T.palette && typeof T.palette.isOpen === 'function' && T.palette.isOpen())) return;
        const target = event.target || {};
        const tag = String(target.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'textarea' || tag === 'select' || target.isContentEditable) return;
        if (typeof target.closest === 'function' && target.closest('#tf-nav, [role="dialog"]')) return;
        const key = event.key;
        const row = state.observed[clampCursor()];
        // A held C or F labels one call, never every call left in a burst.
        if (event.repeat && /^[cCfF]$/.test(key)) { if (typeof event.preventDefault === 'function') event.preventDefault(); return; }
        if (key === 'c' || key === 'C') label(row.verdict_id, 'correct');
        else if (key === 'f' || key === 'F') label(row.verdict_id, 'false_alarm');
        else if (key === 'ArrowRight') move(1);
        else if (key === 'ArrowLeft') move(-1);
        else return;
        if (typeof event.preventDefault === 'function') event.preventDefault();
      }
      document.addEventListener('keydown', onKey);
      ctx.onLeave(() => document.removeEventListener('keydown', onKey));

      ctx.actions({
        'try-create': () => {
          state.busy = true; state.error = null; draw();
          return T.api('/api/sandbox', { method: 'POST', body: {} }).then(body => {
            if (!ctx.alive()) return;
            const name = body && body.project ? String(body.project) : '';
            if (!/^Acme-Sandbox-[0-9a-f]{8}$/.test(name)) { fail({ message: 'the stack returned no sandbox name', kind: 'http' }, 'create'); return; }
            state.project = name;
            // The contract makes every sandbox in Observe.
            state.stage = 'observe';
            state.seeded = body && typeof body.calls_seeded === 'number' ? body.calls_seeded : null;
            remember();
            return loadCalls().then(() => {
              if (!ctx.alive()) return;
              state.busy = false;
              enter(1, { arrive: true });
              draw();
            });
          }, err => { if (ctx.alive()) fail(err, 'create'); });
        },
        'try-resume': () => {
          state.project = state.resume; state.seeded = null; state.stage = null; state.busy = true; state.error = null; draw();
          // Its stage too: it may have been promoted since it was made.
          const detail = T.api('/api/projects/' + encodeURIComponent(state.project) + query({ days: 1 })).then(d => {
            state.readiness = (d && d.readiness) || state.readiness;
            applyConfig(d);
          }, () => { /* the stage is then not claimed */ });
          return Promise.all([loadCalls(), detail]).then(() => {
            if (!ctx.alive()) return;
            state.busy = false;
            enter(1, { arrive: true });
            draw();
          });
        },
        'try-show': () => {
          state.busy = true; state.error = null; draw();
          // A second read from step 2 reads the whole list again as well.
          return Promise.all([loadSandbox(), state.step === 2 ? loadCalls() : null]).then(() => {
            if (!ctx.alive()) return;
            state.busy = false;
            enter(2, { cards: true });
            draw();
          }, err => { if (ctx.alive()) fail(err, 'show'); });
        },
        'try-review': () => {
          const first = state.observed.findIndex(r => !state.labels[r.verdict_id]);
          state.cursor = first === -1 ? 0 : first;
          state.error = null;
          enter(3, { card: 'next' });
          draw();
        },
        'try-label': el => label(el.getAttribute('data-verdict'), el.getAttribute('data-label')),
        'try-move': el => move(Number(el.getAttribute('data-move')) || 0, el.getAttribute('id')),
        'try-goto': el => {
          const to = Number(el.getAttribute('data-index'));
          if (!Number.isInteger(to) || to < 0 || to >= state.observed.length || to === state.cursor) return;
          state.play = { card: to > state.cursor ? 'next' : 'prev' };
          state.cursor = to;
          state.focusId = 'try-correct';
          draw();
        },
        'try-readiness': () => {
          state.busy = true; state.error = null; draw();
          // Every label saved first: a rule's state is read from them.
          return Promise.all(state.saves.slice()).then(() => T.api('/api/projects/' + encodeURIComponent(state.project) + query({ days: 1 }))).then(detail => {
            if (!ctx.alive()) return;
            state.busy = false;
            state.readiness = (detail && detail.readiness) || { rules: [] };
            applyConfig(detail);
            state.selected = new Set(readinessRules().filter(r => r.state === 'ready' || r.state === 'quiet').map(r => r.rule_key));
            enter(4, { flip: true });
            draw();
          }, err => { if (ctx.alive()) fail(err, 'readiness'); });
        },
        'try-toggle': el => {
          const key = el.getAttribute('data-rule');
          if (el.checked) selected().add(key); else selected().delete(key);
          state.focusId = el.id || el.getAttribute('id') || null;
          draw();
        },
        'try-promote': () => {
          const all = readinessRules().map(r => r.rule_key);
          const chosen = selected();
          const enforce = all.filter(key => chosen.has(key));
          if (!enforce.length || state.promoted) {
            // Enforce with no rule in force would refuse nothing, and step 5 would prove nothing.
            state.error = state.promoted ? null : 'Check at least one rule to promote.';
            draw();
            return;
          }
          state.observing = all.filter(key => !chosen.has(key));
          state.busy = true; state.error = null; draw();
          return T.api('/api/projects/' + encodeURIComponent(state.project) + '/promote', { method: 'POST', body: { enforce } })
            .then(answer => {
              const config = answer && answer.config && typeof answer.config === 'object' ? answer.config : {};
              const stage = typeof config.stage === 'string' ? config.stage : (answer && typeof answer.stage === 'string' ? answer.stage : 'enforce');
              state.promoted = { stage, enforce, observe: Array.isArray(config.observe_rules) ? config.observe_rules.map(String) : state.observing.slice() };
              return planReplay(enforce);
            })
            .then(plan => {
              if (!ctx.alive()) return;
              state.busy = false;
              state.replay = plan || null;
              state.planned = true;
              state.play = { promote: true };
              state.focusId = 'try-primary';
              draw();
            }, err => { if (ctx.alive()) fail(err, 'promote'); });
        },
        'try-next': () => {
          state.error = null;
          // A sandbox promoted on an earlier visit has no call planned yet.
          if (state.planned || !state.promoted) { enter(5); draw(); return; }
          state.busy = true; draw();
          return planReplay(state.promoted.enforce).then(plan => {
            if (!ctx.alive()) return;
            state.busy = false;
            state.replay = plan || null;
            state.planned = true;
            enter(5);
            draw();
          }, err => { if (ctx.alive()) fail(err, 'plan'); });
        },
        'try-send': () => {
          const plan = state.replay;
          if (!plan) return;
          state.busy = true; state.error = null; draw();
          // The contract asks for a hook's call that still carries the model's
          // sentence, so the visitor reads why it was refused. Never a sim-
          // session: those always enforce whatever the project's stage, so the
          // refusal would prove nothing about the promotion the visitor just made.
          return T.api('/evaluate-tool-call', {
            method: 'POST',
            body: {
              session_id: T.newSessionId('try-'),
              project_name: state.project,
              developer: 'anonymous',
              developer_id: 'anonymous',
              tool_name: plan.tool_name,
              action_type: plan.action_type,
              arguments: plan.arguments,
              agent: 'claude-code',
              origin: 'hook',
              explain: true,
              hook_mode: 'managed'
            }
          }).then(body => {
            if (!ctx.alive()) return;
            state.busy = false;
            state.result = body || {};
            enter(5, { climax: true });
            draw();
          }, err => { if (ctx.alive()) fail(err, 'send'); });
        },
        'try-finish': () => {
          state.error = null;
          enter(6);
          draw();
        },
        'try-restart': () => {
          try { localStorage.removeItem(TRY_STORAGE); } catch (err) { /* nothing stored */ }
          Object.assign(state, {
            step: 1, project: '', stage: null, seeded: null, calls: null, callsError: null, readiness: null, before: null, observed: [], flaggedRead: false, labels: {}, cursor: 0,
            selected: null, promoted: null, observing: null, result: null, replay: null, planned: false, error: null, busy: false, resume: null, saves: [], rulesDef: null, lastLabel: null
          });
          enter(1);
          draw();
        }
      });

      state.play = { peeks: true };
      draw();
      T.whoami().then(who => {
        if (!ctx.alive()) return;
        state.who = who;
        if (who && who.reads_public === false) draw();
      });
      Dash.tryState = state;
    }

    // ------------------------------------------------------------- proof

    // The proof page: the snapshot scripts/build_proof.py wrote, shown as it
    // was written. Every figure names its source and when it was taken, and a
    // section the snapshot does not carry reads "not measured yet", never a
    // zero. Nothing here computes a figure of its own.
    const PROOF_SUB = 'What Threefold has been measured to do, and how. Every figure names where it came from and when it was taken.';

    function notMeasured(what, next) {
      return html`<div class="rounded-xl border border-dashed border-gray-800 p-4 space-y-1" data-state="empty">
        <p class="text-sm font-semibold text-gray-200">Not measured yet</p>
        <p class="text-xs text-gray-400">${what}</p>
        ${next ? html`<p class="text-xs text-gray-500">${next}</p>` : ''}
      </div>`;
    }

    function when(value) {
      return typeof value === 'string' && value ? html`<time datetime="${value}">${value}</time>` : 'not recorded';
    }

    function provenance(source, snapshot) {
      return html`<p class="text-[11px] text-gray-500 mt-4 pt-3 border-t border-gray-800" data-proof="provenance">
        Source: <span class="text-gray-400">${source || 'not recorded'}</span> · Snapshot taken: <span class="text-gray-400">${when(snapshot)}</span>
      </p>`;
    }

    // A rate as k of n, or what stands in for one when nothing was measured.
    function share(stat) {
      if (!stat || typeof stat.n !== 'number' || stat.n <= 0) return html`<span class="text-gray-500">not measured</span>`;
      const interval = typeof stat.ci_low === 'number' && typeof stat.ci_high === 'number'
        ? html`<span class="block text-[10px] text-gray-500">95% CI ${pct(stat.ci_low)}–${pct(stat.ci_high)}</span>` : '';
      return html`<span class="font-mono">${pct(stat.rate)}</span> <span class="text-gray-500">(${num(stat.k)}/${num(stat.n)})</span>${interval}`;
    }

    function ratio(value) {
      return typeof value === 'number' && isFinite(value) ? value.toFixed(2) + '×' : '—';
    }

    function overheadCell(condition) {
      if (condition.condition === 'none') return html`<span class="text-gray-500">the baseline</span>`;
      const o = condition.overhead;
      if (!o || ['turns', 'seconds', 'cost'].every(k => typeof o[k] !== 'number')) return html`<span class="text-gray-500">not measured</span>`;
      return html`<span class="font-mono text-[11px]">turns ${ratio(o.turns)} · time ${ratio(o.seconds)} · cost ${ratio(o.cost)}</span>`;
    }

    function correctedCell(condition) {
      const sc = condition.self_correction || {};
      if (typeof condition.n !== 'number' || condition.n <= 0) return html`<span class="text-gray-500">not measured</span>`;
      if (!sc.refused_runs) return html`<span class="text-gray-500">no run was refused</span>`;
      return html`<span class="font-mono">${pct(sc.rate)}</span> <span class="text-gray-500">(${num(sc.self_corrected)}/${num(sc.refused_runs)} refused runs)</span>`;
    }

    // Every series side by side: one row per run of the matrix, never pooled,
    // because two models or two task families answer different questions.
    function seriesComparison(list) {
      const cell = (b, name, field) => {
        const c = (Array.isArray(b.conditions) ? b.conditions : []).find(x => x && x.condition === name);
        return c && c[field] ? share(c[field]) : html`<span class="text-gray-500">not measured</span>`;
      };
      return card('The benchmark, every series', 'Violation landed per condition, and whether the tests still passed with Threefold enforcing. Each row is one run of the matrix.', html`
        <div class="tf-scroll-x"><table class="tf-table" data-proof="series">
          <thead><tr>
            <th scope="col">Series</th><th scope="col">No guidance</th><th scope="col">Rules in CLAUDE.md</th>
            <th scope="col">Threefold enforcing</th><th scope="col">Tests passed, Threefold</th>
          </tr></thead>
          <tbody>${list.map(b => html`<tr data-series="${b.family || 'standard'}">
            <th scope="row" class="font-normal text-gray-200 tf-break">${b.label || (Array.isArray(b.models) ? b.models.join(', ') : 'series')}</th>
            <td>${cell(b, 'none', 'violation')}</td>
            <td>${cell(b, 'prompt', 'violation')}</td>
            <td>${cell(b, 'threefold', 'violation')}</td>
            <td>${cell(b, 'threefold', 'completion')}</td>
          </tr>`)}</tbody>
        </table></div>
        <p class="text-[11px] text-gray-500 mt-2">In the pressure series the developer's own prompt asks for the forbidden shortcut. Where Threefold's tests-passed rate is lower, the agent stopped and reported rather than land the violation.</p>`, 'min-w-0');
    }

    function benchmarkCards(proof) {
      const list = Array.isArray(proof.benchmarks) ? proof.benchmarks.filter(b => b && typeof b === 'object') : [];
      if (!list.length) return benchmarkCard(proof.benchmark);
      return html`${seriesComparison(list)}${list.map(b => benchmarkCard(b, b.label))}`;
    }

    function benchmarkCard(b, label) {
      const title = typeof label === 'string' && label ? label : 'The benchmark';
      if (!b || typeof b !== 'object') {
        return card(title, null, notMeasured('This snapshot carries no benchmark result.',
          'The benchmark gives a coding agent the same Acme tasks with no guidance, with the rules in CLAUDE.md, and with Threefold enforcing.'));
      }
      const conditions = Array.isArray(b.conditions) ? b.conditions : [];
      const list = v => (Array.isArray(v) && v.length ? v.join(', ') : 'not recorded');
      const pilot = b.pilot === true ? html`<div class="rounded-xl border border-amber-800 bg-amber-950/30 p-3 mb-4" data-proof="pilot" role="note">
          <p class="text-sm font-semibold text-amber-200">PILOT: not a result</p>
          <p class="text-xs text-amber-100/80">These runs prove the harness end to end. No figure below should be quoted as a measurement.</p>
        </div>` : '';
      const table = conditions.length ? html`<div class="tf-scroll-x mt-4"><table class="tf-table">
          <thead><tr>
            <th scope="col">Condition</th><th scope="col" class="num">Runs measured</th>
            <th scope="col">Violation landed</th><th scope="col">Tests passed</th>
            <th scope="col">Self-corrected</th><th scope="col">Overhead against no guidance</th>
          </tr></thead>
          <tbody>${conditions.map(c => html`<tr data-condition="${c.condition}">
            <th scope="row" class="font-normal"><span class="text-gray-200">${c.label || c.condition}</span><span class="block text-[10px] text-gray-500 font-mono">${c.condition}</span></th>
            <td class="num"><span class="font-mono">${num(c.n)}</span>${c.not_measured ? html`<span class="block text-[10px] text-amber-300">${plural(c.not_measured, 'run')} measured nothing</span>` : ''}</td>
            <td>${share(c.violation)}</td>
            <td>${share(c.completion)}</td>
            <td>${correctedCell(c)}</td>
            <td>${overheadCell(c)}</td>
          </tr>`)}</tbody>
        </table></div>` : notMeasured('The snapshot names no condition.');
      const facts = [
        ['Model', list(b.models)],
        ['Agent', (b.agent || 'not recorded') + (Array.isArray(b.agent_versions) && b.agent_versions.length ? ' ' + b.agent_versions.join(', ') : '')],
        ['Run on', list(b.dates)],
        ['Real-agent runs measured', num(b.valid_rows) + ' of ' + num(b.real_rows)]
      ];
      return card(title, 'The same Acme tasks under each condition, judged by checkers that do not import Threefold.', html`
        ${pilot}
        <blockquote class="border-l-2 border-purple-700 pl-4 text-sm text-gray-200 tf-break" data-proof="headline">${b.headline || 'No headline was computed.'}</blockquote>
        <p class="text-[11px] text-gray-500 mt-1">The headline sentence exactly as benchmark/report.py computed it from the rows.</p>
        <dl class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-4">${facts.map(([label, value]) => html`<div class="tf-card-quiet p-3 min-w-0"><dt class="tf-label">${label}</dt><dd class="text-xs text-gray-200 tf-break">${value}</dd></div>`)}</dl>
        ${table}
        ${provenance(b.source, b.snapshot_at)}`, 'min-w-0');
    }

    function ownUseCard(p) {
      const title = 'The owner\'s own use';
      const sub = 'Threefold governing the owner\'s real work, anonymised: aggregates only, never a project name, a path, a developer or a target.';
      if (!p || typeof p !== 'object') {
        return card(title, sub, notMeasured('This snapshot carries no totals from the owner\'s own work.',
          'They are read from the owner\'s private stack with the operator key, and only the totals are kept.'));
      }
      const tiles = [
        ['Days observed', num(p.days_observed), 'days_observed', typeof p.window_days === 'number' ? 'with a governed call, of the last ' + num(p.window_days) : 'with a governed call'],
        ['Calls governed', num(p.calls_governed), 'calls_governed', 'judged and recorded'],
        ['Would refuse', num(p.would_refuse), 'would_refuse', 'ran; a rule in Observe would have stopped them'],
        ['Reviewed', num(p.reviewed), 'reviewed', 'would-refuse calls the owner labelled'],
        ['False-alarm rate', pct(p.false_alarm_rate), 'false_alarm_rate', typeof p.false_alarm_rate === 'number' && typeof p.false_alarms === 'number' && typeof p.reviewed === 'number'
          ? num(p.false_alarms) + ' of ' + num(p.reviewed) + ' reviewed'
          : (typeof p.refused === 'number' && p.refused > 0 ? 'not given: calls were refused in this window, and these totals count their labels too' : 'not measured')],
        ['Projects', num(p.projects), 'projects', 'counted, never named'],
        ['Agents', num(p.agents), 'agents', 'counted, never named']
      ];
      return card(title, sub, html`
        <div class="grid grid-cols-2 sm:grid-cols-4 xl:grid-cols-7 gap-3">${tiles.map(([label, value, metric, note]) => html`<div class="tf-card-quiet tf-tile">
          <span class="tf-tile-label">${label}</span><span class="tf-tile-value" data-metric="${metric}">${value}</span><span class="tf-tile-sub">${note}</span>
        </div>`)}</div>
        ${p.self_correction ? html`<p class="text-xs text-gray-400 mt-3">Self-corrected: ${selfCorrectionWords(p.self_correction)}.</p>` : ''}
        ${provenance(p.source, p.snapshot_at)}`, 'min-w-0');
    }

    function evidenceItem(item) {
      if (!item || typeof item.path !== 'string') return '';
      const href = typeof item.href === 'string' && /^https:\/\//.test(item.href) ? item.href : '';
      return html`<li class="flex flex-wrap gap-x-2">${href
        ? html`<a class="tf-link font-mono text-xs tf-break" href="${href}" rel="noopener">${item.path}</a>`
        : html`<span class="font-mono text-xs text-gray-200 tf-break">${item.path}</span>`}<span class="text-xs text-gray-500">${item.label || ''}</span></li>`;
    }

    function methodCard(proof) {
      const b = proof.benchmark && typeof proof.benchmark === 'object' ? proof.benchmark : {};
      const items = [].concat(Array.isArray(b.evidence) ? b.evidence : [], Array.isArray(proof.method) ? proof.method : []);
      const linked = items.some(i => i && typeof i.href === 'string' && /^https:\/\//.test(i.href));
      const terms = [
        ['Violation landed', 'the benchmark\'s own checkers found a governed violation in the files the agent left behind.'],
        ['Tests passed', 'the task\'s acceptance tests, restored from the template first, all passed.'],
        ['Self-corrected, in the benchmark', 'a run refused at least once that still finished with its tests passing and no violation.'],
        ['Self-corrected, on the dashboard', 'a refusal of a hook or CI call to a file followed, within the next ten calls of the same session, by a call to the same file that was not refused. A refused command is left out, and a command is never taken as the correction, because the ledger keeps only the program a command ran. Calls recorded at the same instant are not ordered against each other, so a tie can only lengthen the count of calls it took.'],
        ['Overhead', 'the mean turns, seconds and cost of a run under a condition, over the same means with no guidance.'],
        ['Reviewed and false-alarm rate', 'the would-refuse calls the owner labelled, and the share of them labelled false alarm. The rate is given only for a window in which nothing was refused: the totals count false alarms on refused calls as well, and reviewed calls on would-refuse calls only.']
      ];
      return card('How this was measured', 'The definitions behind every figure above, and the files that hold the evidence.', html`
        <dl class="space-y-2">${terms.map(([term, text]) => html`<div class="text-xs"><dt class="inline font-semibold text-gray-200">${term}:</dt> <dd class="inline text-gray-400">${text}</dd></div>`)}</dl>
        <div class="mt-4 pt-3 border-t border-gray-800">
          <p class="tf-label">Evidence</p>
          ${items.length ? html`<ul class="space-y-1.5" data-proof="evidence">${items.map(evidenceItem)}</ul>` : notMeasured('The snapshot names no evidence file.')}
          ${items.length && !linked ? html`<p class="text-[11px] text-gray-500 mt-2">Each is a file in the Threefold repository, at the path shown.</p>` : ''}
          <p class="text-[11px] text-gray-500 mt-2">The live figures on this stack are read from <a class="tf-link" href="${T.specHref('GET', '/api/overview')}">GET /api/overview</a>, and this snapshot from <a class="tf-link" href="${T.specHref('GET', '/proof.json')}">GET /proof.json</a>.</p>
        </div>`, 'min-w-0');
    }

    function viewProof(ctx) {
      ctx.render(loadingView('Proof', PROOF_SUB, ['table', 'table']));
      return T.api('/proof.json').then(body => {
        if (!ctx.alive()) return;
        const proof = body && typeof body === 'object' ? body : {};
        const written = typeof proof.generated_at === 'string' && proof.generated_at
          ? html`Snapshot written ${when(proof.generated_at)}` : 'The snapshot does not record when it was written';
        const by = typeof proof.generated_by === 'string' && proof.generated_by ? html` by <span class="font-mono">${proof.generated_by}</span>` : '';
        ctx.render(html`${pageTitle('Proof', PROOF_SUB)}
          <p class="text-[11px] text-gray-500 -mt-3 mb-4" data-proof="generated">${written}${by}. It changes only when a new one is deployed.</p>
          <div class="space-y-4">
            ${benchmarkCards(proof)}
            ${ownUseCard(proof.private)}
            ${methodCard(proof)}
          </div>`);
      }, err => {
        if (!ctx.alive()) return;
        if (err && err.kind === 'not_found') {
          ctx.render(html`${pageTitle('Proof', PROOF_SUB)}<div class="tf-card p-6 md:p-8 space-y-3" data-state="empty">
            <h2 class="text-lg font-semibold text-white">Not measured yet</h2>
            <p class="text-sm text-gray-400 max-w-2xl">This stack has no proof snapshot deployed, so this page shows nothing rather than something invented.</p>
            <p class="text-xs text-gray-500 max-w-2xl">A snapshot is written by <span class="font-mono">scripts/build_proof.py</span> from the benchmark's result rows and, when the owner adds them, the totals of the owner's own use.</p>
            <div class="flex flex-wrap gap-2"><a class="tf-btn" href="#/overview">The overview</a><a class="tf-btn" href="#/try">Try it in a minute</a></div>
          </div>`);
          return;
        }
        ctx.render(html`${pageTitle('Proof', PROOF_SUB)}${failure(err, 'the proof snapshot')}`);
      });
    }

    // ------------------------------------------------------------- start

    // What the page tests drive: the router and the current screen's actions.
    const Dash = window.Dash = {
      route, go, parseHash, resolve, safeNext, ROUTES,
      act: (name, attrs) => {
        const fn = current.actions[name] || GLOBAL_ACTIONS[name];
        if (!fn) throw new Error('No action ' + name + ' on this screen');
        const el = {
          checked: !!(attrs && attrs.checked),
          getAttribute: n => (attrs && Object.prototype.hasOwnProperty.call(attrs, n) ? attrs[n] : null),
          hasAttribute: n => !!(attrs && Object.prototype.hasOwnProperty.call(attrs, n))
        };
        return fn(el, { preventDefault() {}, target: el });
      }
    };

    route();
  </script>
</body>
</html>

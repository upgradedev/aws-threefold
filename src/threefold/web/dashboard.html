      if (f.review === 'correct') parts.push('marked correct');
      if (f.review === 'false_alarm') parts.push('marked false alarm');
      if (f.project) parts.push('in ' + T.projectNameText(f.project));
      if (f.rule) parts.push('under ' + f.rule);
      if (f.agent) parts.push('from ' + agentLabel(f.agent));
      if (f.session) parts.push('in session ' + f.session);
      parts.push(f.day ? 'on ' + shortDay(f.day) : 'in ' + windowWords(f.days));
      return parts.join(' ');
    }

    function viewCalls(ctx) {
      const f = readCallFilters(ctx.params);
      const state = { items: [], cursor: null, loadingMore: false, scanned: 0 };
      const sub = describeFilters(f) + '.';
      ctx.render(html`${crumbs([{ label: 'Overview', href: '#/overview' }, { label: 'Calls' }])}${loadingView('Calls', sub, ['table'])}`);

      // A day is filtered here, over rows the route returns newest first, so a
      // day-filtered read asks for the largest page the contract allows (200)
      // and gets four times as far back for the same five requests.
      const PAGE = f.day ? 200 : 50;

      function apiQuery(cursor) {
        return '/api/decisions' + query({
          days: f.days, project: f.project, rule: f.rule,
          kind: f.kind === 'all' ? '' : f.kind, review: f.review === 'any' ? '' : f.review,
          agent: f.agent, session: f.session, limit: PAGE, cursor
        });
      }

      // A day filter is applied here, over the rows the window returns: the
      // ledger's read takes a number of days, not a date. Pages of newer rows are
      // read through until that day's rows begin, a few pages at most.
      function onDay(row) { return !f.day || String(row.timestamp || '').slice(0, 10) === f.day; }
      function pastDay(rows) { return f.day && rows.some(r => String(r.timestamp || '').slice(0, 10) < f.day); }

      function read(cursor, pagesLeft) {
        return T.api(apiQuery(cursor)).then(body => {
          const rows = (body && Array.isArray(body.items)) ? body.items : [];
          const next = body && body.next_cursor ? body.next_cursor : null;
          state.scanned += rows.length;
          const kept = rows.filter(onDay);
          if (f.day && !kept.length && next && !pastDay(rows) && pagesLeft > 0) {
            return read(next, pagesLeft - 1);
          }
          return { rows: kept, next: pastDay(rows) ? null : next };
        });
      }

      function load() {
        return read(null, 4).then(({ rows, next }) => {
          if (!ctx.alive()) return;
          state.items = rows;
          state.cursor = next;
          draw();
        }, err => {
          if (ctx.alive()) ctx.render(html`${crumbs([{ label: 'Overview', href: '#/overview' }, { label: 'Calls' }])}${pageTitle('Calls', sub)}${filterBar(f)}${failure(err, 'the calls')}`);
        });
      }

      function draw() {
        const chips = activeChips(f);
        ctx.render(html`${crumbs([{ label: 'Overview', href: '#/overview' }, { label: 'Calls' }])}
          ${pageTitle('Calls', sub)}
          ${outcomeTabs(f)}
          ${filterBar(f)}
          ${chips}
          <p id="calls-error" class="text-xs text-rose-300 mb-2" role="alert"></p>
          ${state.items.length
            ? card(html`<span data-metric="rows">${num(state.items.length)}</span> ${state.items.length === 1 ? 'call' : 'calls'} shown${state.cursor ? ', more beyond' : ''}`, f.day ? 'Filtered to ' + shortDay(f.day) + ' in this page.' : 'Newest first. Open a call for everything the ledger holds about it.', callsList(state.items, { project: !f.project }))
            : state.cursor
              // Nothing matched, and the ledger still holds older rows: the read
              // stopped on its page budget before it got that far. Saying "none
              // in the ledger" here would deny rows a bar on the overview counts.
              ? html`<div class="tf-card p-6 space-y-2" data-state="not-reached">
                  <h2 class="text-sm font-semibold text-white">Not reached yet</h2>
                  <p class="text-xs text-gray-400">${describeFilters(f)}: ${state.scanned
                    // Rows counted here are rows this screen read and filtered
                    // itself, which is the day filter. When the route did the
                    // filtering it returns the matches only, so there is no
                    // count to give and none is claimed.
                    ? html`none among the <span data-metric="scanned">${num(state.scanned)}</span> newest ${state.scanned === 1 ? 'row' : 'rows'} read so far, and the ledger holds older ones.`
                    : 'none in the rows read so far, and the ledger holds older ones.'} Load more below to keep reading back.</p>
                  ${widenLinks(f)}
                </div>`
              : html`<div class="tf-card p-6 space-y-2" data-state="empty">
                  <h2 class="text-sm font-semibold text-white">No call matches</h2>
                  <p class="text-xs text-gray-400">${describeFilters(f)}: none in the ledger. ${f.days < 30 || f.day ? 'Widen the window, or ' : ''}remove a filter above.</p>
                  ${widenLinks(f)}
                </div>`}
          ${state.cursor ? html`<div class="mt-4"><button type="button" class="tf-btn" data-action="more" ${state.loadingMore ? raw('disabled') : ''}>${state.loadingMore ? 'Loading…' : 'Load more'}</button></div>` : ''}`);
      }

      ctx.actions({
        more: () => {
          if (!state.cursor || state.loadingMore) return;
          state.loadingMore = true;
          draw();
          return read(state.cursor, 4).then(({ rows, next }) => {
            if (!ctx.alive()) return;
            state.loadingMore = false;
            state.items = state.items.concat(rows);
            state.cursor = next;
            draw();
          }, err => {
            if (!ctx.alive()) return;
            state.loadingMore = false;
            draw();
            const el = document.getElementById('calls-error');
            if (el) el.textContent = 'More could not be read: ' + err.message + '.';
          });
        },
        filter: el => {
          const val = id => { const node = document.getElementById(id); return node && typeof node.value === 'string' ? node.value.trim() : ''; };
          const next = {
            kind: val('f-kind') || f.kind, review: val('f-review') || f.review,
            project: val('f-project'), rule: val('f-rule'), agent: val('f-agent'),
            session: val('f-session'), days: val('f-days') || f.days
          };
          go(callsHref(cleanFilters(Object.assign({}, next, { day: '' }))));
        }
      });
      return load();
    }

    function cleanFilters(f) {
      return {
        kind: f.kind === 'all' ? '' : f.kind, review: f.review === 'any' ? '' : f.review,
        project: f.project, rule: f.rule, agent: f.agent, session: f.session, days: f.days, day: f.day
      };
    }

    // The ways out of a calls screen that shows nothing, offered by both cards
    // so neither can drift from the other: each link is here only when it
    // changes the filters, so no button leads back to the page it is on.
    function widenLinks(f) {
      return html`<div class="flex flex-wrap gap-2">${f.day
        ? html`<a class="tf-btn tf-btn-sm" href="${callsHref(Object.assign({}, cleanFilters(f), { day: '' }))}">Drop the day filter</a>` : ''}${f.days < 30
        ? html`<a class="tf-btn tf-btn-sm" href="${callsHref(Object.assign({}, cleanFilters(f), { days: 30, day: '' }))}">Show 30 days</a>` : ''}<a class="tf-btn tf-btn-sm" href="#/calls">Clear every filter</a></div>`;
    }

    // The outcome, one click away, and the only place it is chosen. The one on
    // screen is not a link: a way out never leads back to the page it is on.
    const KIND_ICONS = { refused: 'stop', observed: 'eye', approved: 'check' };
    function outcomeTabs(f) {
      return html`<nav class="tf-segmented mb-3" aria-label="Outcome">${KINDS.map(k => {
        const label = html`${KIND_ICONS[k.value] ? T.icon(KIND_ICONS[k.value], 14) : ''}${k.label}`;
        return k.value === f.kind
          ? html`<span aria-current="true" class="inline-flex items-center gap-1.5">${label}</span>`
          : html`<a class="inline-flex items-center gap-1.5" href="${callsHref(cleanFilters(Object.assign({}, f, { kind: k.value })))}">${label}</a>`;
      })}</nav>`;
    }

    function filterBar(f) {
      const agents = Object.keys(AGENT_LABELS).filter(a => a !== 'unknown');
      return html`<form class="tf-card p-4 mb-3" data-submit="filter" aria-label="Filter the calls">
        <input type="hidden" id="f-kind" value="${f.kind}" />
        <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-3">
          <label class="block"><span class="tf-label">Review</span>
            <select id="f-review" class="tf-select w-full" data-change="filter">${REVIEW_FILTERS.map(r => html`<option value="${r.value}" ${r.value === f.review ? raw('selected') : ''}>${r.label}</option>`)}</select></label>
          <label class="block"><span class="tf-label">Window</span>
            <select id="f-days" class="tf-select w-full" data-change="filter">${DAY_CHOICES.concat(DAY_CHOICES.some(c => c.days === f.days) ? [] : [{ days: f.days, label: f.days + ' d' }]).map(c => html`<option value="${c.days}" ${c.days === f.days ? raw('selected') : ''}>${windowWords(c.days)}</option>`)}</select></label>
          <label class="block"><span class="tf-label">Agent</span>
            <select id="f-agent" class="tf-select w-full" data-change="filter"><option value="">Any agent</option>${agents.map(a => html`<option value="${a}" ${a === f.agent ? raw('selected') : ''}>${agentLabel(a)}</option>`)}</select></label>
          <label class="block"><span class="tf-label">Project</span>
            <input id="f-project" class="tf-input w-full font-mono" value="${f.project}" placeholder="Acme-…" autocomplete="off" spellcheck="false" /></label>
          <label class="block"><span class="tf-label">Rule</span>
            <input id="f-rule" class="tf-input w-full font-mono" value="${f.rule}" placeholder="rule id or gate" autocomplete="off" spellcheck="false" /></label>
          <label class="block"><span class="tf-label">Session</span>
            <input id="f-session" class="tf-input w-full font-mono" value="${f.session}" placeholder="session id" autocomplete="off" spellcheck="false" /></label>
        </div>
        <div class="mt-3 flex flex-wrap gap-2">
          <button type="submit" class="tf-btn tf-btn-primary tf-btn-sm">Apply</button>
          <a href="#/calls" class="tf-btn tf-btn-quiet tf-btn-sm">Clear</a>
        </div>
      </form>`;
    }

    // The filters in force, each a chip that removes it. The outcome is not
    // among them: the tabs above the form show it and change it.
    function activeChips(f) {
      const all = cleanFilters(f);
      const labels = {
        review: v => ({ unreviewed: 'Unreviewed', correct: 'Correct', false_alarm: 'False alarm' }[v]),
        project: v => T.projectNameText(v), rule: v => 'rule ' + v, agent: v => agentLabel(v), session: v => 'session ' + v, day: v => shortDay(v)
      };
      // A chip's own text may carry the reader's own name as markup; an
      // aria-label is an attribute and cannot, so it takes the plain form above.
      const shown = { project: v => T.projectName(v) };
      const chips = Object.keys(labels).filter(k => all[k]).map(k => {
        const without = Object.assign({}, all);
        without[k] = '';
        return html`<a href="${callsHref(without)}" class="tf-chip tf-chip-purple" aria-label="Remove the filter ${labels[k](all[k])}"><span class="tf-break">${(shown[k] || labels[k])(all[k])}</span><span aria-hidden="true">✕</span></a>`;
      });
      return chips.length ? html`<div class="flex flex-wrap gap-1.5 mb-3">${chips}</div>` : '';
    }

    // --------------------------------------------------------------- call

    const FIELD_ORDER = [
      ['timestamp', 'When'], ['status', 'Verdict'], ['rule_key', 'Rule key'], ['rule', 'Gate'], ['reason', 'Reason'],
      ['observed_rules', 'Observing rules'], ['observed_reason', 'What the observing rule found'], ['observed_target', 'File the rule watched'],
      ['target', 'Target'], ['project_name', 'Project'], ['stage', 'Stage'], ['hook_mode', 'Hook mode'],
      ['agent', 'Agent'], ['origin', 'Origin'], ['dry_run', 'Dry run'], ['tool_name', 'Tool'], ['action_type', 'Action'],
      ['session_id', 'Session'], ['developer_id', 'Developer (hash)'], ['cost_usd', 'Session cost so far'],
      ['review', 'Review'], ['reviewed_at', 'Reviewed at'], ['review_note', 'Review note'], ['category_label', 'Category'],
      ['suggested_fix_kind', 'Suggested fix'], ['suggested_fix_validated', 'Fix checked by Threefold'],
      ['verdict_id', 'Verdict id']
    ];

    // The two fields a ledger row keeps of a suggested fix. A row without one
    // does not list them at all, rather than listing two dashes.
    const FIX_FIELDS = { suggested_fix_kind: true, suggested_fix_validated: true };
    const FIX_KINDS = {
      layering: 'Move the import out of the domain',
      credential: 'Read the credential from the environment',
      protected_path: 'The governed way to change a protected path',
      unreadable_write: 'A write the rule can read',
      loop: 'Stop repeating the call',
      budget: 'Within the budget',
      halted_session: 'How the halted session resumes',
      destructive_command: 'Instead of the destructive command'
    };
    // Own keys only: a kind the service spells "constructor" is a word, not the Object function.
    function fixKindLabel(kind, fallback) {
      return Object.prototype.hasOwnProperty.call(FIX_KINDS, kind) ? FIX_KINDS[kind] : fallback;
    }

    // A suggested fix, as the response to a call carries it. Every value is the
    // service's and goes through html``; the proposed files are shown as code,
    // and "checked" is claimed only when the service says the gates passed them.
    function fixPanel(fix) {
      if (!fix || typeof fix !== 'object' || typeof fix.summary !== 'string') return '';
      const checked = fix.validated === true;
      const steps = Array.isArray(fix.steps) ? fix.steps.filter(s => typeof s === 'string') : [];
      const writes = Array.isArray(fix.writes) ? fix.writes.filter(w => w && typeof w.path === 'string' && typeof w.content === 'string') : [];
      return html`<div class="rounded-xl bg-gray-950 border ${checked ? 'border-emerald-900/60' : 'border-gray-800'} p-3 space-y-3 text-xs" data-fix="${checked ? 'checked' : 'unchecked'}">
        <div class="flex flex-wrap items-center gap-2">
          <p class="tf-label !mb-0">Suggested fix</p>
          ${typeof fix.kind === 'string' ? html`<span class="tf-chip tf-chip-gray">${fixKindLabel(fix.kind, fix.kind)}</span>` : ''}
          ${checked ? html`<span class="tf-chip tf-chip-emerald">Checked by Threefold: passes the same gates</span>` : ''}
        </div>
        <p class="text-gray-200 tf-break">${fix.summary}</p>
        ${steps.length ? html`<ol class="list-decimal pl-5 space-y-1 text-gray-300">${steps.map(s => html`<li class="tf-break">${s}</li>`)}</ol>` : ''}
        ${writes.map(w => html`<div class="space-y-1">
          <p class="font-mono text-gray-400 tf-break">${w.path}${w.new_file === true ? ' · a new file: if it exists, add to it' : ''}${w.partial === true ? ' · add this with an Edit where the command put it' : ''}${typeof w.old_string === 'string' ? ' · an Edit: in place of the text you replaced' : ''}</p>
          <pre class="tf-pre !pr-3"><code>${w.content}</code></pre>
        </div>`)}
        <p class="text-[11px] text-gray-500">A starting point, never applied automatically.</p>
      </div>`;
    }

    function fieldValue(key, value) {
      if (value === null || value === undefined || value === '') return html`<span class="text-gray-600">—</span>`;
      if (key === 'suggested_fix_kind') return html`${value} <span class="text-gray-500">(${fixKindLabel(value, 'a fix')})</span>`;
      if (key === 'suggested_fix_validated') return value === true ? 'yes: every proposed write passed the same gates' : 'no: not validated by the gates';
      if (key === 'timestamp' || key === 'reviewed_at') return html`${dateTime(value)} <span class="text-gray-500">(${timeAgo(value)})</span>`;
      if (key === 'cost_usd') return T.usd(Number(value));
      // The alias the ledger holds, and the reader's own name for it beside it.
      // The field is a record of what was stored, so the alias stays first.
      if (key === 'project_name') return T.projectName(value);
      if (key === 'agent') return agentLabel(value);
      if (key === 'dry_run') return value ? 'yes' : 'no';
      if (Array.isArray(value)) return value.length ? value.join(', ') : html`<span class="text-gray-600">—</span>`;
      if (typeof value === 'object') return JSON.stringify(value);
      return String(value);
    }

    function viewCall(ctx) {
      const stamp = ctx.params.timestamp || '';
      const verdict = ctx.params.verdict_id || '';
      const crumb = crumbs([{ label: 'Overview', href: '#/overview' }, { label: 'Calls', href: '#/calls' }, { label: verdict || 'Call' }]);
      if (!stamp || !verdict) {
        ctx.render(html`${crumb}${pageTitle('Which call?', 'A call is opened from a list, which names its time and verdict id.')}<a class="tf-btn tf-btn-primary" href="#/calls">Open the calls</a>`);
        return;
      }
      ctx.render(html`${crumb}${loadingView('Call', 'Reading the decision…', ['hero', 'table'])}`);
      const state = { data: null };

      function load() {
        return T.api('/api/decision' + query({ timestamp: stamp, verdict_id: verdict })).then(body => {
          if (!ctx.alive()) return;
          state.data = body || {};
          draw();
        }, err => {
          if (!ctx.alive()) return;
          if (err && err.kind === 'not_found') {
            ctx.render(html`${crumb}${pageTitle('This call is not in the ledger', null)}${emptyNote('No decision was recorded with this time and verdict id. It may be older than the ledger keeps, or the link was cut short.', html`<a class="tf-link" href="#/calls">Back to the calls</a>`)}`);
            return;
          }
          ctx.render(html`${crumb}${pageTitle('Call', null)}${failure(err, 'this call')}`);
        });
      }

      // What an operator reads first: what the agent tried, what Threefold
      // said, which rule decided, and the fix it was given, as one card. The
      // full record follows it, field by field.
      const HEADLINES = {
        refused: 'Refused before it ran',
        observed: 'It ran, and a rule in Observe would have refused it',
        approved: 'Approved: nothing flagged it'
      };
      const SAID = {
        refused: 'The call was stopped before it ran, and the agent was told why.',
        observed: 'Recorded, not refused: the rule that flagged it is observing. A label decides whether it should enforce.',
        approved: 'Every gate passed it, and it ran.'
      };

      function draw() {
        const row = state.data.decision || {};
        const session = state.data.session || null;
        const rule = state.data.rule || null;
        const outcome = outcomeOf(row);
        const hasFix = typeof row.suggested_fix_kind === 'string' && row.suggested_fix_kind !== '';
        const known = {};
        FIELD_ORDER.forEach(([key]) => { known[key] = true; });
        const rows = FIELD_ORDER.filter(([key]) => hasFix || !FIX_FIELDS[key]).map(([key, label]) => [key, label, row[key]])
          .concat(Object.keys(row).filter(k => !known[k]).sort().map(k => [k, k, row[k]]));
        const key = ruleKeyOf(row);

        const incident = html`<article class="tf-ops-incident" data-outcome="${outcome}" aria-labelledby="incident-title">
          <div class="flex flex-wrap items-start justify-between gap-3">
            <div class="min-w-0">
              <span class="tf-ops-att-kicker">${outcome === 'approved' ? 'A call' : 'An incident'} · ${dateTime(row.timestamp)}</span>
              <h2 id="incident-title" class="tf-ops-hero-title">${HEADLINES[outcome]}</h2>
            </div>
            ${outcomeChip(row)}
          </div>
          <ol class="tf-ops-flow tf-ops-flow-${hasFix ? 'four' : 'three'}">
            <li>
              <span class="tf-ops-flow-q">${T.icon('terminal', 14)}What the agent tried</span>
              <span class="tf-ops-flow-a"><code>${row.tool_name || 'a call'}</code> <code class="text-gray-400">${targetOf(row)}</code></span>
              <span class="tf-ops-flow-sub">${agentLabel(row.agent)}${row.origin ? ' through its ' + row.origin : ''}${row.action_type ? ' · ' + row.action_type : ''}${row.project_name ? html` · in <span class="font-mono">${T.projectName(row.project_name)}</span>` : ''}</span>
            </li>
            <li>
              <span class="tf-ops-flow-q">${T.icon('shield', 14)}What Threefold said</span>
              <span class="tf-ops-flow-a">${reasonOf(row) || OUTCOMES[outcome].label}</span>
              <span class="tf-ops-flow-sub">${SAID[outcome]}</span>
            </li>
            <li>
              <span class="tf-ops-flow-q">${T.icon('layers', 14)}The rule</span>
              <span class="tf-ops-flow-a">${outcome === 'approved' ? 'None: nothing flagged this call' : html`<code>${key}</code>`}</span>
              <span class="tf-ops-flow-sub">${outcome === 'approved' ? '' : rule ? (rule.description || 'A layering rule of this project') : (GATE_KEYS[key] || 'A built-in gate')}${row.stage ? ' · project stage ' + row.stage : ''}</span>
            </li>
            ${hasFix ? html`<li>
              <span class="tf-ops-flow-q">${T.icon('sparkles', 14)}Suggested fix</span>
              <span class="tf-ops-flow-a">${fixKindLabel(row.suggested_fix_kind, row.suggested_fix_kind)}</span>
              <span class="flex flex-wrap gap-1">${row.suggested_fix_validated === true ? html`<span class="tf-chip tf-chip-emerald">${T.icon('check', 13)}Checked by Threefold: passes the same gates</span>` : html`<span class="tf-chip tf-chip-gray">Not validated</span>`}</span>
              <span class="tf-ops-flow-sub">The fix went back with the verdict, to the agent or the page that sent the call. The ledger keeps its kind and whether the gates validated it, never its files or its steps: those were the caller's own source.</span>
            </li>` : ''}
          </ol>
          <p class="tf-ops-facts">
            <span>When <b>${timeAgo(row.timestamp)}</b></span>
            ${row.session_id ? html`<span>Session <b class="font-mono">${row.session_id}</b></span>` : ''}
            ${row.hook_mode ? html`<span>Hook mode <b>${row.hook_mode}</b></span>` : ''}
            ${row.developer_id ? html`<span>Developer <b class="font-mono">${row.developer_id}</b></span>` : ''}
            <span>Verdict <b class="font-mono">${row.verdict_id || verdict}</b></span>
          </p>
        </article>`;

        const fields = html`<dl class="grid grid-cols-1 sm:grid-cols-[12rem_1fr] gap-x-4 text-xs">${rows.map(([k, label, value]) => html`
          <dt class="text-gray-500 pt-2 sm:py-2 sm:border-b border-gray-800/60">${label}</dt>
          <dd class="font-mono text-gray-200 pb-2 sm:py-2 border-b border-gray-800/60 tf-break">${fieldValue(k, value)}</dd>`)}</dl>
          <p class="text-[11px] text-gray-500 mt-3">The arguments of a call are never stored: this is the whole record, enough to know what was decided and why, and not enough to rebuild what was written.</p>`;

        const ruleBody = rule
          ? html`<div class="space-y-3 text-xs">
              <p class="font-mono text-white">${rule.id || key}</p>
              ${rule.description ? html`<p class="text-gray-300">${rule.description}</p>` : ''}
              <p><span class="tf-chip ${rule.mode === 'observe' ? 'tf-chip-amber' : 'tf-chip-purple'}">${rule.mode || 'enforce'}</span></p>
              ${[['Applies to files matching', rule.when_path_matches], ['May not import', rule.forbid_imports], ['May import anyway', rule.allow_imports]].map(([label, list]) =>
                Array.isArray(list) && list.length ? html`<div><p class="tf-label">${label}</p><div class="flex flex-wrap gap-1">${list.map(v => html`<span class="tf-chip tf-chip-gray font-mono">${v}</span>`)}</div></div>` : '')}
              <a class="tf-link" href="${T.pageHref('rules.html' + query({ project: T.PROJECT_PATTERN.test(row.project_name || '') ? row.project_name : '' }))}">Read or try this project's rules</a>
            </div>`
          : html`<p class="text-xs text-gray-300"><span class="font-mono text-white">${key}</span> — ${GATE_KEYS[key] || 'a built-in gate'}.</p>
              <p class="text-[11px] text-gray-500 mt-2">A gate is part of the service, not a layering rule a project writes, so it has no definition to show.</p>`;

        const sessionBody = session
          ? html`<dl class="grid grid-cols-2 gap-2 text-xs">
              <dt class="text-gray-500">Session</dt><dd class="font-mono text-gray-200 tf-break">${session.session_id}</dd>
              <dt class="text-gray-500">Calls</dt><dd class="font-mono text-gray-200">${num(session.calls)}</dd>
              <dt class="text-gray-500">Cost</dt><dd class="font-mono text-gray-200">${T.usd(Number(session.cost_usd))}</dd>
              <dt class="text-gray-500">State</dt><dd>${session.is_tripped ? html`<span class="tf-chip tf-chip-rose">${T.icon('stop', 13)}halted</span>` : html`<span class="tf-chip tf-chip-emerald">${T.icon('check', 13)}running</span>`}</dd>
            </dl>
            <div class="flex flex-wrap gap-2 mt-3">
              <a class="tf-btn tf-btn-sm" href="${T.pageHref('sessions.html' + query({ session: session.session_id }))}">Open in Sessions</a>
              <a class="tf-btn tf-btn-quiet tf-btn-sm" href="${callsHref({ session: session.session_id, days: 30 })}">Every call in this session</a>
            </div>`
          : emptyNote('The service has no session record for this call.');

        const reviewBody = outcome === 'observed'
          ? html`<div class="space-y-3">
              <p class="text-xs text-gray-300">Now: ${reviewChip(row.review)}${row.review_note ? html` <span class="text-gray-400">“${row.review_note}”</span>` : ''}</p>
              <input id="call-note" type="text" maxlength="200" class="tf-input w-full" placeholder="Optional note (200 characters)" value="${row.review_note || ''}" />
              <div class="flex flex-wrap gap-2">
                <button type="button" class="tf-btn tf-btn-good tf-btn-sm" data-action="call-label" data-label="correct">${T.icon('check', 14)}Correct</button>
                <button type="button" class="tf-btn tf-btn-danger tf-btn-sm" data-action="call-label" data-label="false_alarm">False alarm</button>
                ${row.review ? html`<button type="button" class="tf-btn tf-btn-quiet tf-btn-sm" data-action="call-label" data-label="clear">Clear the label</button>` : ''}
              </div>
              <p id="call-label-said" class="text-xs" role="status"></p>
            </div>`
          : '';

        ctx.render(html`${crumb}
          ${pageTitle(html`<span class="font-mono">${row.tool_name || 'Call'}</span> <span class="font-mono text-gray-400 text-base md:text-lg tf-break">${targetOf(row)}</span>`,
            null,
            html`<a class="tf-btn tf-btn-quiet tf-btn-sm" href="${T.specHref('get', '/api/decision')}">GET /api/decision in the API document</a>`)}
          <div class="space-y-4">
            ${incident}
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
              <div class="lg:col-span-2 space-y-4 min-w-0">
                ${reviewBody ? card('Was the rule right?', 'A rule in Observe flagged this call. Label it, and the rule\'s readiness follows.', reviewBody) : ''}
                ${card('The decision', 'Every field the ledger keeps for this call.', fields, 'min-w-0')}
              </div>
              <div class="space-y-4 min-w-0">
                ${card('The rule', outcome === 'approved' ? 'Nothing flagged this call.' : 'What decided.', ruleBody)}
                ${card('The session', null, sessionBody)}
                ${row.project_name && T.PROJECT_PATTERN.test(row.project_name) ? html`<a class="tf-card tf-card-link block p-4 text-xs text-gray-300" href="${projectHref(row.project_name)}">Open <span class="font-mono text-white">${T.projectName(row.project_name)}</span>: its stage and readiness ${raw(T.ICONS.arrow)}</a>` : ''}
              </div>
            </div>
          </div>`);
      }

      ctx.actions({
        'call-label': el => {
          const row = state.data.decision || {};
          const labelValue = el.getAttribute('data-label');
          const noteEl = document.getElementById('call-note');
          const note = noteEl && typeof noteEl.value === 'string' ? noteEl.value.trim().slice(0, 200) : '';
          const said = document.getElementById('call-label-said');
          const item = Object.assign({ timestamp: row.timestamp, verdict_id: row.verdict_id, label: labelValue }, note && labelValue !== 'clear' ? { note } : {});
          if (said) { said.className = 'text-xs text-gray-400'; said.textContent = 'Saving…'; }
          return T.api('/api/projects/' + encodeURIComponent(row.project_name || '') + '/reviews', { method: 'POST', body: { items: [item] } }).then(answer => {
            if (!ctx.alive()) return;
            const skipped = answer && Array.isArray(answer.skipped) ? answer.skipped : [];
            if (skipped.length) {
              if (said) { said.className = 'text-xs text-rose-300'; said.textContent = 'Not labelled: ' + (skipped[0].reason || 'skipped') + '.'; }
              return;
            }
            row.review = labelValue === 'clear' ? null : labelValue;
            row.review_note = labelValue === 'clear' ? '' : note;
            draw();
            toast(labelValue === 'clear' ? 'Label cleared.' : 'Marked ' + (labelValue === 'correct' ? 'correct' : 'false alarm') + '.');
          }, err => {
            if (!ctx.alive() || !said) return;
            said.className = 'text-xs text-rose-300';
            said.textContent = T.isAuthError(err) ? 'Labelling needs the operator. Sign in with python threefold.py open.' : 'Not saved: ' + err.message + '.';
          });
        }
      });
      return load();
    }

    // ------------------------------------------------------------ connect

    const OS_TABS = [
      { os: 'powershell', label: 'Windows · PowerShell', command: 'PowerShell connect command' },
      { os: 'posix', label: 'macOS / Linux', command: 'macOS and Linux connect command' }
    ];

    // The wait for the first call: a calm radar, one ring a beat. The markup is
    // static, so nothing here depends on the animation, which stops under
    // prefers-reduced-motion.
    const RADAR = html`<div class="tf-ops-radar" aria-hidden="true"><span class="tf-ops-radar-ring"></span><span class="tf-ops-radar-ring"></span><span class="tf-ops-radar-ring"></span><span class="tf-ops-radar-grid"></span><span class="tf-ops-radar-sweep"></span><span class="tf-ops-radar-core"></span></div>`;

    function viewConnect(ctx) {
      const state = {
        name: T.PROJECT_PATTERN.test(ctx.params.project || '') ? ctx.params.project : 'Acme-Billing',
        os: /Win/i.test((window.navigator && (window.navigator.userAgent || window.navigator.platform)) || '') ? 'powershell' : 'posix',
        sha: null, shaError: null, waiting: false, found: null, before: null, pollError: null, startedAt: Date.now(), timer: null
      };

      function nameOk() { return T.PROJECT_PATTERN.test(state.name); }

      // Both commands are on the page, one tab each; the shared layer's tabs
      // switch between them from a click or the arrow keys.
      function commandTabs() {
        const cmd = connectCommands(state.name);
        return html`<div class="tf-tabs" role="tablist" aria-label="Operating system" data-tf-tabs>
            ${OS_TABS.map(t => html`<button type="button" role="tab" class="tf-tab" id="os-tab-${t.os}" aria-controls="os-panel-${t.os}" aria-selected="${state.os === t.os ? 'true' : 'false'}" tabindex="${state.os === t.os ? '0' : '-1'}" data-action="os" data-os="${t.os}">${T.icon(t.os === 'powershell' ? 'terminal' : 'command', 15)}${t.label}</button>`)}
          </div>
          ${OS_TABS.map(t => html`<div class="tf-tabpanel" role="tabpanel" id="os-panel-${t.os}" aria-labelledby="os-tab-${t.os}"${state.os === t.os ? '' : raw(' hidden')}>${T.commandBlock(t.os === 'powershell' ? cmd.powershell : cmd.posix, t.command)}</div>`)}`;
      }

      function stepState(n) {
        const ok = nameOk();
        if (n === 1) return ok ? 'done' : 'current';
        // The command is the reader's to run, so step 2 stays current until the
        // first call lands; then every step is done at once.
        if (n === 2) return !ok ? 'todo' : (state.found ? 'done' : 'current');
        return state.found ? 'done' : 'todo';
      }

      function draw() {
        const ok = nameOk();
        const steps = ['Name the project', 'Run one command', 'See the first call'];
        ctx.render(html`<div class="max-w-3xl tf-ops-connect">${pageTitle('Connect a repository', 'One command installs the hook for the agents on the machine and starts the project in Observe, so nothing is refused while you watch what would be.', html`<a class="tf-btn tf-btn-quiet tf-btn-sm" href="${T.pageHref('connect.html')}">Every detail, by hand</a>`)}
          <ol class="tf-ops-steps" aria-label="Where you are">${steps.map((label, i) => {
            const s = stepState(i + 1);
            return html`<li data-state="${s}"${s === 'current' ? raw(' aria-current="step"') : ''}><span class="tf-step-num" data-state="${s}">${s === 'done' ? T.icon('check', 13) : i + 1}</span>${label}</li>`;
          })}</ol>
          <ol class="space-y-4" aria-label="Connect in three steps">
            <li class="tf-card p-5 tf-step" aria-current="${stepState(1) === 'current' ? 'step' : 'false'}">
              <span class="tf-step-num" data-state="${stepState(1)}">1</span>
              <div class="flex-1 min-w-0 space-y-2">
                <h2 class="text-sm font-semibold text-white">Name the project</h2>
                <p class="text-xs text-gray-400">This name is all that identifies the repository to the stack, so use an alias, never the real name. It starts with <span class="font-mono">Acme-</span>, then up to 40 letters, digits or dashes.</p>
                <label class="block max-w-sm"><span class="sr-only">Project name</span>
                  <input id="connect-name" type="text" class="tf-input w-full font-mono" value="${state.name}" maxlength="45" autocomplete="off" spellcheck="false" aria-describedby="connect-name-problem" /></label>
                <p id="connect-name-problem" class="text-[11px] ${ok ? 'text-gray-500' : 'text-rose-300'}" role="${ok ? 'note' : 'alert'}">${ok ? 'A name outside this pattern would be counted as unlabelled.' : 'That name will be stored as unlabelled. Use Acme- and letters, digits or dashes.'}</p>
              </div>
            </li>
            <li class="tf-card p-5 tf-step">
              <span class="tf-step-num" data-state="${stepState(2)}">2</span>
              <div class="flex-1 min-w-0 space-y-3">
                <h2 class="text-sm font-semibold text-white">Run one command at the root of the repository</h2>
                ${ok ? html`<div id="connect-command" class="space-y-3">${commandTabs()}</div>`
                  : html`<p class="text-xs text-rose-300">Fix the name above and the command appears here.</p>`}
                <p class="text-[11px] text-gray-400">It downloads one standard-library Python file from this stack, installs the hook for Claude Code, Codex and Antigravity where they are installed, keeps its files out of git, and finishes by sending one harmless call and opening this project here.</p>
                <details class="tf-disclosure text-[11px] text-gray-400">
                  <summary>${T.icon('shield', 16)}For the careful: check the file before you run it</summary>
                  <div class="tf-disclosure-body">
                    <p>Download it first with the part of the command before the <span class="font-mono">;</span> or <span class="font-mono">&amp;&amp;</span>, then compare its SHA-256 with the one this stack publishes in <a class="tf-link" href="${T.STACK_URL}dist/manifest.json">dist/manifest.json</a>:</p>
                    ${state.sha ? html`<p class="font-mono text-gray-200 tf-break" data-sha>${state.sha}</p>`
                      : html`<p class="text-amber-300">${state.shaError ? 'The manifest could not be read (' + state.shaError + '), so no checksum is shown.' : 'Reading the manifest…'}</p>`}
                    <p>PowerShell: <span class="font-mono text-gray-300">(Get-FileHash threefold.py -Algorithm SHA256).Hash</span> · macOS/Linux: <span class="font-mono text-gray-300">shasum -a 256 threefold.py</span>. Upper or lower case does not matter.</p>
                    <p>You can also <a class="tf-link" href="${T.STACK_URL}install.py">read install.py</a> in the browser; it is served as text.</p>
                  </div>
                </details>
              </div>
            </li>
            <li class="tf-card p-5 tf-step">
              <span class="tf-step-num" data-state="${stepState(3)}">3</span>
              <div class="flex-1 min-w-0 space-y-3" id="connect-wait">${waitPanel()}</div>
            </li>
          </ol></div>`);
      }

      function waitPanel() {
        if (!nameOk()) return html`<h2 class="text-sm font-semibold text-white">See the first call</h2><p class="text-xs text-gray-500">Once the name is right.</p>`;
        if (state.found) {
          const row = state.found;
          return html`<div class="tf-ops-arrived" role="status">
              <span class="tf-ops-arrived-mark" aria-hidden="true">${T.icon('check', 22)}</span>
              <div class="min-w-0 space-y-1">
                <h2 class="text-base font-semibold text-white">Connected</h2>
                <p class="text-sm text-emerald-200"><strong class="text-white">${agentLabel(row.agent)}</strong> reached the stack from <span class="font-mono">${T.projectName(state.name)}</span> ${timeAgo(row.timestamp)}.</p>
                <p class="text-[11px] text-gray-300"><span class="font-mono">${row.tool_name}</span> ${targetOf(row)} · ${OUTCOMES[outcomeOf(row)].label.toLowerCase()} · hook mode ${row.hook_mode || 'unknown'}${row.stage ? ' · stage ' + row.stage : ''}</p>
              </div>
            </div>
            <div class="tf-callout tf-callout-warn">${T.icon('eye', 18)}<div class="tf-callout-body">
              <p class="tf-callout-title">You are in Observe</p>
              <p>What the hooks in this repository send is judged and recorded, and not refused. A call carrying a credential is still refused on the machine and never sent, and a call the hook holds back is neither sent nor recorded. Keep working as usual. What the rules would have refused shows up for review; when a rule's record reads right, promote the project and that rule starts refusing.</p>
            </div></div>
            <div class="flex flex-wrap gap-2">
              <a class="tf-btn tf-btn-primary" href="${projectHref(state.name)}">Open ${T.projectName(state.name)}${T.icon('arrowright', 14)}</a>
              <a class="tf-btn" href="#/review">The review queue</a>
              <a class="tf-btn tf-btn-quiet" href="#/overview">Overview</a>
            </div>`;
        }
        if (state.pollError && T.isAuthError(state.pollError)) {
          return html`<h2 class="text-sm font-semibold text-white">See the first call</h2>${T.signedOutHtml(state.pollError, 'watching for the first call')}`;
        }
        return html`<div class="tf-ops-wait">
            ${RADAR}
            <div>
              <h2 class="text-sm font-semibold text-white">Waiting for the first call</h2>
              <p class="text-xs text-gray-300" role="status">${state.waiting ? html`Watching for a call from <span class="font-mono text-white">${T.projectName(state.name)}</span>, every 3 seconds while this tab is open.` : 'Paused while this tab is hidden.'}</p>
              ${state.before ? html`<p class="text-[11px] text-gray-500">${T.projectName(state.name)} has sent calls before (the last ${timeAgo(state.before.timestamp)}), so this waits for a new one.</p>` : ''}
              ${state.pollError ? html`<p class="text-[11px] text-rose-300">The last check failed: ${state.pollError.message}. Still trying.</p>` : ''}
              <p class="text-[11px] text-gray-500">Nothing arriving? The command prints whether its test call was recorded. <a class="tf-link" href="${T.pageHref('connect.html')}">The connect page</a> covers each agent's details.</p>
            </div>
          </div>`;
      }

      // Redrawn only when what it says changes, so a copy button inside it is
      // not reset every three seconds, and the radar keeps its beat.
      let lastWait = '';
      function redrawWait() {
        const el = document.getElementById('connect-wait');
        if (!el) { draw(); return; }
        const next = waitPanel();
        if (String(next) === lastWait && el.innerHTML) return;
        lastWait = String(next);
        setHtml(el, next);
      }

      function poll() {
        if (!ctx.alive() || state.found || !nameOk()) return;
        if (document.visibilityState === 'hidden') { state.waiting = false; redrawWait(); return; }
        state.waiting = true;
        const asked = state.name;
        return T.api('/api/decisions' + query({ project: asked, limit: 1 })).then(body => {
          if (!ctx.alive() || asked !== state.name) return;
          state.pollError = null;
          const row = body && Array.isArray(body.items) ? body.items[0] : null;
          if (row) {
            const at = Date.parse(row.timestamp);
            if (!isNaN(at) && at < state.startedAt - 5000) {
              state.before = row;
            } else {
              state.found = row;
              stop();
              draw();
              const mark = document.getElementById('view');
              if (mark && typeof mark.querySelector === 'function') T.pulse(mark.querySelector('.tf-ops-arrived-mark'), 'ok');
              announce('Connected: ' + agentLabel(row.agent) + ' reached the stack.');
              return;
            }
          }
          redrawWait();
        }, err => {
          if (!ctx.alive()) return;
          state.pollError = err;
          redrawWait();
        });
      }

      function start() {
        stop();
        state.timer = setInterval(poll, 3000);
        poll();
      }
      function stop() { if (state.timer) { clearInterval(state.timer); state.timer = null; } }

      const onVisible = () => { if (document.visibilityState === 'visible' && !state.found) poll(); };
      document.addEventListener('visibilitychange', onVisible);
      ctx.onLeave(() => {
        stop();
        if (typeof document.removeEventListener === 'function') document.removeEventListener('visibilitychange', onVisible);
      });

      // The checksum is for the careful reader; a stack that does not publish
      // the manifest yet leaves it out and says so.
      T.api('/dist/manifest.json').then(body => {
        if (!ctx.alive()) return;
        state.sha = body && typeof body.installer_sha256 === 'string' ? body.installer_sha256 : null;
        if (!state.sha) state.shaError = 'no installer_sha256 in it';
        if (!state.found) draw();
      }, err => {
        if (!ctx.alive()) return;
        state.shaError = err.status ? 'HTTP ' + err.status : 'unreachable';
        if (!state.found) draw();
      });

      ctx.actions({
        // The shared layer has already switched the tab and its panel; this
        // remembers the choice for the next redraw.
        os: el => { state.os = el.getAttribute('data-os') === 'powershell' ? 'powershell' : 'posix'; }
      });
      // Typing changes the name; the command and the watch follow it.
      const onInput = event => {
        const target = event && event.target;
        if (!target || target.id !== 'connect-name') return;
        state.name = String(target.value || '').trim();
        state.found = null;
        state.before = null;
        state.startedAt = Date.now();
        const ok = nameOk();
        const problem = document.getElementById('connect-name-problem');
        if (problem) {
          problem.className = 'text-[11px] ' + (ok ? 'text-gray-500' : 'text-rose-300');
          problem.textContent = ok ? 'A name outside this pattern would be counted as unlabelled.' : 'That name will be stored as unlabelled. Use Acme- and letters, digits or dashes.';
        }
        const commandEl = document.getElementById('connect-command');
        if (commandEl && ok) {
          setHtml(commandEl, commandTabs());
        } else if (ok !== !!commandEl) {
          draw();
          const input = document.getElementById('connect-name');
          if (input && typeof input.focus === 'function') { try { input.focus(); } catch (err) { /* courtesy */ } }
        }
        redrawWait();
        if (ok) start(); else stop();
      };
      document.addEventListener('input', onInput);
      ctx.onLeave(() => { if (typeof document.removeEventListener === 'function') document.removeEventListener('input', onInput); });
      // The switch in the navigation redraws this screen from its own state,
      // rather than routing to it again, so a half-typed name is not lost.
      ctx.onLeave(T.onLocalNamesChange(() => { if (ctx.alive()) draw(); }));
      draw();
      if (nameOk()) start();
      Dash.connect = { state, poll, setName: value => onInput({ target: { id: 'connect-name', value } }) };
    }

    // ------------------------------------------------------------- signin

    // Where a sign-in may send the reader: a route of this page, and nothing
    // that could leave it.
    function safeNext(next) {
      const text = String(next || '');
      if (!/^\/[A-Za-z0-9\-._~%/?=&]*$/.test(text) || text.indexOf('//') !== -1) return '/overview';
      const parsed = parseHash('#' + text);
      const found = resolve(parsed.path);
      if (!found || found.route.path === '/signin') return '/overview';
      return text;
    }

    // What signing in keeps and what it never does, said where the reader
    // decides whether to trust it. Each is what the code does: the command
    // sends the key to the stack in a header to ask for the link, the page
    // trades the link for a session and removes a key pasted here earlier,
    // and an unused link signs in whoever opens it first.
    const SIGNIN_PROMISES = [
      ['lock', 'No password', 'Nothing to type or remember here: the command on your machine does the asking.'],
      ['key', 'No key in the browser', 'The command sends the key to the stack, never to this page. This browser keeps only a session, which ends on its own.'],
      ['clock', 'A link works once', 'Whoever opens it first is signed in, so treat it like the key. Once used, or after a short while, it opens nothing.']
    ];

    function signinFrame(title, sub, body) {
      return html`<div class="tf-ops-signin">
        <div class="tf-ops-signin-card space-y-6">
          <div class="text-center space-y-3">
            <span class="tf-ops-mark" aria-hidden="true">${T.icon('shield', 26)}</span>
            <h1 id="view-title" tabindex="-1" class="text-2xl md:text-3xl font-semibold tracking-tight text-white outline-none">${title}</h1>
            ${sub ? html`<p class="text-sm text-gray-300 max-w-xl mx-auto">${sub}</p>` : ''}
          </div>
          ${body}
        </div>
      </div>`;
    }

    function viewSignin(ctx) {
      const code = (ctx.params.code || '').trim();
      const next = safeNext(ctx.params.next);
      // The code leaves the address bar before anything else happens, so it is
      // not in the history, a screenshot or a shared link. It is kept in memory
      // for this one attempt and a retry.
      if (code && history && typeof history.replaceState === 'function') {
        try { history.replaceState(null, '', location.pathname + location.search + '#/signin' + (next !== '/overview' ? query({ next }) : '')); } catch (err) { /* the code still works */ }
      }
      if (!code) {
        const signedIn = T.readSession();
        ctx.render(signinFrame('Sign in from your terminal', 'The operator signs in from the command line. There is no password here, and the key never goes into the browser.', html`
          ${signedIn ? html`<div class="tf-callout tf-callout-ok" role="status">${T.icon('check', 18)}<div class="tf-callout-body"><p>This browser is signed in${signedIn.endsAt ? ' until ' + T.clockTime(signedIn.endsAt) : ''}. <a class="tf-link" href="#/overview">Go to the overview</a></p></div></div>` : ''}
          <div class="space-y-3">
            <p class="text-xs font-semibold text-gray-200">On the machine that holds the operator key, in the folder where you ran connect:</p>
            ${T.commandBlock('python threefold.py open', 'Sign-in command')}
            <p class="text-xs text-gray-400">It asks the stack for a one-time link and opens it in this browser.</p>
          </div>
          <ul class="tf-ops-promise">${SIGNIN_PROMISES.map(([icon, head, words]) => html`<li>${T.icon(icon, 16)}<b>${head}</b><span>${words}</span></li>`)}</ul>
          <p class="text-[11px] text-gray-500 text-center">No <span class="font-mono">threefold.py</span> yet? <a class="tf-link" href="#/connect">Connect a repository</a> first. On the public demo, reading needs no sign-in at all.</p>`));
        return;
      }

      function attempt() {
        ctx.render(signinFrame('Signing you in…', 'Trading the one-time link for a sign-in session. This takes a moment.', html`<div class="space-y-3" aria-busy="true"><div class="tf-skeleton h-4 w-2/3 mx-auto"></div><div class="tf-skeleton h-4 w-1/2 mx-auto"></div></div>`));
        return T.api('/api/auth/sessions', { method: 'POST', body: { code } }).then(body => {
          if (!body || typeof body.token !== 'string' || !body.token) {
            // The stack took the link and gave no session back, so the link
            // is spent: a retry would only be refused. A fresh one is the way.
            if (ctx.alive()) ctx.render(signinFrame('The sign-in could not be completed', 'The stack took the link but answered without a session, so this browser is not signed in.', freshLink(html`<p class="tf-ops-signin-why">The link is spent now. Ask for a fresh one on the machine that holds the operator key:</p>`)));
            return;
          }
          // The code is spent the moment the stack answers, so the session is
          // kept even if the reader has moved on meanwhile.
          const kept = T.writeSession(body.token, body.expires_at);
          const forgotKey = T.forgetOperatorKey();
          T.announceAuth('signin');
          if (!ctx.alive()) return;
          const nextHash = '#' + next;
          try { history.replaceState(null, '', location.pathname + location.search + nextHash); } catch (err) { /* navigate below */ }
          toast('Signed in' + (kept ? '' : ' for this tab only: this browser blocks site storage') + (forgotKey ? '. The operator key pasted earlier was removed from this browser.' : '.'));
          if (location.hash !== nextHash) location.hash = nextHash; else route();
        }, err => {
          if (!ctx.alive()) return;
          if (err.status === 401) {
            ctx.render(signinFrame('This sign-in link has already been used, or has expired', 'A link works once and only for a short while, so it cannot be opened again or shared.', html`
              <div class="space-y-3" role="alert" data-state="signin-refused">
                <p class="text-xs text-gray-300">Ask for a fresh one on the machine that holds the operator key:</p>
                ${T.commandBlock('python threefold.py open', 'Sign-in command')}
                <p class="text-[11px] text-gray-500">If you opened this link twice, the first tab may already be signed in.</p>
              </div>`));
            return;
          }
          // The stack did not answer, or answered with an error of its own:
          // the link may not have been spent, so trying it again comes first.
          ctx.render(signinFrame('The sign-in did not complete', html`${trimStop(err && err.message ? err.message : 'The stack did not answer')}. Nothing was kept in this browser.`, freshLink(html`
            <div class="flex flex-wrap justify-center gap-2"><button type="button" class="tf-btn tf-btn-primary" data-action="signin-retry">${T.icon('refresh', 16)}Try the link again</button></div>
            <p class="tf-ops-signin-why">If it keeps failing, ask for a fresh link on the machine that holds the operator key:</p>`)));
        });
      }

      // A failed sign-in, in the same card as the rest: what to do next, and
      // the command that asks for a fresh link.
      function freshLink(lead) {
        return html`<div class="space-y-3" role="alert" data-state="signin-failed">
          ${lead}
          ${T.commandBlock('python threefold.py open', 'Sign-in command')}
          <p class="text-[11px] text-gray-500 text-center"><a class="tf-link" href="#/overview">Go to the overview</a>. On the public demo, reading needs no sign-in at all.</p>
        </div>`;
      }
      ctx.actions({ 'signin-retry': () => attempt() });
      return attempt();
    }

    // ---------------------------------------------------------------- try

    const TRY_STORAGE = 'threefold-try';
    const TRY_STEPS = ['Make a sandbox', 'See what would be refused', 'Label each call', 'Promote', 'Send it again'];

    function viewTry(ctx) {
      const state = {
        step: 1, project: '', seeded: null, readiness: null, observed: [], labels: {}, selected: null,
        result: null, replay: null, error: null, busy: false, who: null
      };
      try {
        const saved = JSON.parse(localStorage.getItem(TRY_STORAGE) || 'null');
        if (saved && /^Acme-Sandbox-[0-9a-f]{8}$/.test(saved.project || '') && Date.now() - (saved.at || 0) < 20 * 3600 * 1000) state.resume = saved.project;
      } catch (err) { /* nothing to resume */ }

      function remember() {
        try { localStorage.setItem(TRY_STORAGE, JSON.stringify({ project: state.project, at: Date.now() })); } catch (err) { /* resuming is a convenience */ }
      }

      function stepper() {
        return html`<ol class="flex flex-wrap gap-x-4 gap-y-2 mb-5" aria-label="Walkthrough steps">
          ${TRY_STEPS.map((label, i) => {
            const n = i + 1;
            const s = n < state.step ? 'done' : n === state.step ? 'current' : 'todo';
            return html`<li class="flex items-center gap-2 text-xs ${s === 'current' ? 'text-white' : 'text-gray-500'}" aria-current="${s === 'current' ? 'step' : 'false'}">
              <span class="tf-step-num" data-state="${s}">${s === 'done' ? '✓' : n}</span>${label}</li>`;
          })}
        </ol>`;
      }

      function frame(body) {
        ctx.render(html`${pageTitle('Try the two-stage rollout', 'About a minute, on the public demo: a sandbox project, the calls its rules would have refused, your review, a promotion, and the same kind of call refused for real.')}
          ${stepper()}
          <div class="max-w-3xl space-y-4">
            ${state.error ? html`<div class="tf-card p-4 border-rose-900/60 text-xs text-rose-300" role="alert">${state.error}</div>` : ''}
            ${body}
          </div>`);
      }

      function stepCard(title, text, content, action) {
        return html`<section class="tf-card p-5 space-y-4" aria-labelledby="try-step-title">
          <div class="space-y-1">
            <h2 id="try-step-title" class="text-base font-semibold text-white">${title}</h2>
            <p class="text-xs text-gray-400">${text}</p>
          </div>
          ${content || ''}
          ${action || ''}
        </section>`;
      }

      function primary(action, label) {
        return html`<button type="button" class="tf-btn tf-btn-primary" data-action="${action}" ${state.busy ? raw('disabled') : ''}>${state.busy ? 'Working…' : label}</button>`;
      }

      function draw() {
        if (state.who && state.who.reads_public === false) {
          frame(stepCard('The walkthrough runs on the public demo', 'This is a private stack, where only the operator can make projects. Connect a real repository instead: it starts in Observe, so nothing is refused while you watch.', null,
            html`<a class="tf-btn tf-btn-primary" href="#/connect">Connect a repository</a>`));
          return;
        }
        if (state.step === 1) {
          frame(stepCard('1 · Make a sandbox project',
            'The stack creates a project of your own, in Observe, and sends about a dozen synthetic tool calls from Claude Code, Codex and Antigravity through the real evaluator. Its stage expires within a day, and the project then drops out of the overview and the project list; the calls and the labels stay in the public call lists for 30 days.',
            state.resume ? html`<p class="text-xs text-gray-400">You started one earlier: <span class="font-mono text-gray-200">${state.resume}</span>. <button type="button" class="tf-link" data-action="try-resume">Continue with it</button> or make a new one.</p>` : '',
            primary('try-create', 'Make my sandbox')));
          return;
        }
        if (state.step === 2) {
          frame(stepCard('2 · See what the rules would have refused',
            html`<span class="font-mono text-gray-200">${state.project}</span> ${state.seeded !== null ? html`received ${plural(state.seeded, 'call')}` : 'is ready'}. Everything was judged, and nothing was refused: the project is in Observe.`,
            null, primary('try-show', 'Show me')));
          return;
        }
        if (state.step === 3) {
          const total = state.observed.length;
          const labelled = state.observed.filter(r => state.labels[r.verdict_id]).length;
          frame(stepCard('3 · Label each call',
            'These calls ran, and a rule in Observe would have refused each one. Mark it Correct if the rule was right, or False alarm if the call should run. One of them is a false alarm: spot it.',
            total ? html`<p class="text-xs text-gray-400" role="status">${labelled} of ${total} labelled</p>
              <ul class="space-y-2">${state.observed.map(row => {
                const l = state.labels[row.verdict_id];
                return html`<li class="tf-card-quiet p-3 space-y-2">
                  <div class="flex flex-wrap items-center gap-2"><span class="tf-chip tf-chip-amber font-mono">${ruleKeyOf(row)}</span><span class="text-[11px] text-gray-500">${agentLabel(row.agent)}</span></div>
                  <p class="text-xs"><span class="font-mono text-gray-200">${row.tool_name}</span> <span class="font-mono text-gray-400 tf-break">${targetOf(row)}</span></p>
                  <p class="text-[11px] text-gray-400 tf-break">${reasonOf(row)}</p>
                  <div class="flex flex-wrap items-center gap-2">
                    <button type="button" class="tf-btn tf-btn-good tf-btn-sm" data-action="try-label" data-verdict="${row.verdict_id}" data-label="correct" aria-pressed="${l === 'correct' ? 'true' : 'false'}">Correct</button>
                    <button type="button" class="tf-btn tf-btn-danger tf-btn-sm" data-action="try-label" data-verdict="${row.verdict_id}" data-label="false_alarm" aria-pressed="${l === 'false_alarm' ? 'true' : 'false'}">False alarm</button>
                    ${l ? reviewChip(l) : ''}
                  </div>
                </li>`;
              })}</ul>`
              : emptyNote('No call in the sandbox was flagged by an observing rule, so there is nothing to label. Promote anyway to see a rule refuse.'),
            labelled === total ? primary('try-readiness', 'See what that did') : html`<p class="text-[11px] text-gray-500">Label every call to continue.</p>`));
          return;
        }
        if (state.step === 4) {
          const rules = (state.readiness && state.readiness.rules) || [];
          const noisy = rules.filter(r => r.state === 'noisy').length;
          frame(stepCard('4 · Promote to Enforce',
            'Each rule now reads its state from your labels. Ready and Quiet rules are checked. ' + (noisy
              ? (noisy === 1 ? 'The rule with a false alarm is Noisy and stays' : 'The rules with false alarms are Noisy and stay') + ' in Observe, where it records and refuses nothing.'
              : 'No rule is Noisy: you marked every flag correct. An unchecked rule keeps observing.'),
            html`<ul class="space-y-2">${rules.map(r => html`<li>
              <label class="flex items-start gap-3 tf-card-quiet p-3 cursor-pointer">
                <input type="checkbox" class="mt-0.5 accent-purple-500" data-change="try-toggle" data-rule="${r.rule_key}" ${state.selected.has(r.rule_key) ? raw('checked') : ''} />
                <span class="min-w-0 flex-1"><span class="flex flex-wrap items-center gap-2"><span class="font-mono text-xs text-white">${r.rule_key}</span>${stateChip(r.state)}</span>
                <span class="block text-[11px] text-gray-400 mt-1">${r.recommendation || (STATES[r.state] || {}).says || ''}</span></span>
              </label></li>`)}</ul>`,
            primary('try-promote', 'Promote with ' + plural(rules.filter(r => state.selected.has(r.rule_key)).length, 'rule'))));
          return;
        }
        if (state.step === 5) {
          const plan = state.replay;
          frame(stepCard('5 · Send the same kind of call again',
            'As a hook would: origin hook, agent Claude Code, to your sandbox, now in Enforce. This time the rule in force refuses it, and Amazon Bedrock explains why.',
            plan ? html`<div class="tf-card-quiet p-3 text-xs space-y-1"><p><span class="font-mono text-gray-200">${plan.tool_name}</span> <span class="font-mono text-gray-400 tf-break">${plan.arguments.file_path}</span></p><pre class="tf-pre !pr-3">${plan.arguments.content}</pre><p class="text-[11px] text-gray-500">Built from a call you marked correct under <span class="font-mono">${plan.rule}</span>.</p></div>` : '',
            primary('try-send', 'Send it')));
          return;
        }
        const r = state.result || {};
        const refused = r.status && r.status !== 'APPROVED';
        const source = r.explanation_source === 'bedrock' ? 'Amazon Bedrock' : r.explanation_source === 'deterministic_fallback' ? 'Deterministic explanation: the model was asked and did not answer' : 'Deterministic explanation';
        frame(html`<section class="tf-card p-5 space-y-4 ${refused ? 'border-rose-900/60' : 'border-amber-900/60'}" aria-labelledby="try-step-title">
          <h2 id="try-step-title" class="text-base font-semibold text-white">${refused ? 'Refused, before it ran' : 'The service answered ' + (r.status || 'without a verdict')}</h2>
          <div class="flex flex-wrap gap-2"><span class="tf-chip ${refused ? 'tf-chip-rose' : 'tf-chip-emerald'} font-mono">${r.status || '—'}</span>${r.project_stage ? html`<span class="tf-chip tf-chip-purple">stage ${r.project_stage}</span>` : ''}</div>
          <p class="text-xs text-gray-300 tf-break">${r.reason || ''}</p>
          ${r.bedrock_explanation ? html`<div class="rounded-xl bg-purple-950/30 border border-purple-900/50 p-3 text-xs text-purple-100"><p class="tf-label !text-purple-300">${source}</p><p class="tf-break">${r.bedrock_explanation}</p></div>` : ''}
          ${fixPanel(r.suggested_fix)}
          <p class="text-xs text-gray-400">${refused
            ? 'The same kind of call that ran in Observe is refused in Enforce' + (state.observing && state.observing.length ? ', while ' + state.observing.join(', ') + (state.observing.length === 1 ? ' keeps' : ' keep') + ' watching without refusing' : '') + '. That is the whole rollout: watch, label, promote, and back to Observe in one click if it bites wrong.'
            : 'This call was not refused. The rule it was built from may not be in force, or the sandbox rules differ; the project page shows each rule\'s mode.'}</p>
          <div class="flex flex-wrap gap-2">
            <a class="tf-btn tf-btn-primary" href="${projectHref(state.project)}">Open ${state.project}</a>
            <a class="tf-btn" href="#/connect">Connect your own repository</a>
            <button type="button" class="tf-btn tf-btn-quiet" data-action="try-restart">Start again</button>
          </div>
        </section>`);
      }

      function fail(err, doing) {
        state.busy = false;
        state.error = T.isAuthError(err)
          ? (doing === 'create' ? 'This stack does not let visitors make a sandbox (HTTP ' + err.status + '). The walkthrough runs on the public demo.' : 'The stack refused (HTTP ' + err.status + '): a sandbox is open to anyone only on the public demo.')
          : 'That did not work: ' + err.message + '. Try again.';
        draw();
      }

      function loadSandbox() {
        const p = state.project;
        return Promise.all([
          T.api('/api/projects/' + encodeURIComponent(p) + query({ days: 1 })),
          T.api('/api/decisions' + query({ project: p, kind: 'observed', days: 1, limit: 50 }))
        ]).then(([detail, list]) => {
          state.readiness = (detail && detail.readiness) || { rules: [] };
          state.observed = list && Array.isArray(list.items) ? list.items : [];
          state.labels = {};
          state.observed.forEach(r => { if (r.review === 'correct' || r.review === 'false_alarm') state.labels[r.verdict_id] = r.review; });
        });
      }

      // The ledger keeps no arguments, so the call is rebuilt: the file the
      // rule watched, and an import the rule forbids, written the way that
      // file's language writes one.
      function importLine(path, name) {
        const ext = (String(path).match(/\.([A-Za-z0-9]+)$/) || [])[1] || '';
        const lower = ext.toLowerCase();
        if (lower === 'java' || lower === 'kt' || lower === 'scala') return 'import ' + name + ';\n';
        if (lower === 'cs') return 'using ' + name + ';\n';
        if (['ts', 'tsx', 'js', 'jsx', 'mjs', 'cjs'].indexOf(lower) !== -1) return "import client from '" + name + "';\n";
        if (lower === 'go') return 'import "' + name + '"\n';
        return 'import ' + name + '\n';
      }

      function planReplay(enforce) {
        const candidates = state.observed.filter(r => state.labels[r.verdict_id] === 'correct' && enforce.indexOf(ruleKeyOf(r)) !== -1);
        const row = candidates[0] || state.observed.find(r => enforce.indexOf(ruleKeyOf(r)) !== -1) || null;
        if (!row) return Promise.resolve(null);
        const key = ruleKeyOf(row);
        const path = targetOf(row) || 'src/domain/acme_order.py';
        const fromDecision = T.api('/api/decision' + query({ timestamp: row.timestamp, verdict_id: row.verdict_id })).then(d => d && d.rule, () => null);
        return fromDecision.then(rule => rule || T.api('/rules' + query({ project: state.project })).then(set => {
          return (set && Array.isArray(set.rules) ? set.rules : []).find(r => r.id === key) || null;
        }, () => null)).then(rule => {
          let content = '# Acme sandbox\n';
          if (rule && Array.isArray(rule.forbid_imports) && rule.forbid_imports.length) {
            const plain = rule.forbid_imports.find(n => typeof n === 'string' && !/[*]/.test(n)) ||
              String(rule.forbid_imports[0]).replace(/\*+\.?/g, '').replace(/^\.+|\.+$/g, '') || 'boto3';
            content = importLine(path, plain);
          }
          return { rule: key, tool_name: 'Write', action_type: 'FILE_WRITE', arguments: { file_path: path, content } };
        });
      }

      ctx.actions({
        'try-create': () => {
          state.busy = true; state.error = null; draw();
          return T.api('/api/sandbox', { method: 'POST', body: {} }).then(body => {
            if (!ctx.alive()) return;
            state.busy = false;
            state.project = body && body.project ? String(body.project) : '';
            state.seeded = body && typeof body.calls_seeded === 'number' ? body.calls_seeded : null;
            if (!/^Acme-Sandbox-[0-9a-f]{8}$/.test(state.project)) { fail({ message: 'the stack returned no sandbox name', kind: 'http' }, 'create'); return; }
            remember();
            state.step = 2;
            draw();
          }, err => { if (ctx.alive()) fail(err, 'create'); });
        },
        'try-resume': () => {
          state.project = state.resume; state.step = 2; state.error = null; draw();
        },
        'try-show': () => {
          state.busy = true; state.error = null; draw();
          return loadSandbox().then(() => {
            if (!ctx.alive()) return;
            state.busy = false; state.step = 3; draw();
          }, err => { if (ctx.alive()) fail(err, 'show'); });
        },
        'try-label': el => {
          const verdict = el.getAttribute('data-verdict');
          const value = el.getAttribute('data-label');
          const row = state.observed.find(r => r.verdict_id === verdict);
          if (!row) return;
          const before = state.labels[verdict];
          state.labels[verdict] = value;
          state.error = null;
          draw();
          return T.api('/api/projects/' + encodeURIComponent(state.project) + '/reviews', {
            method: 'POST', body: { items: [{ timestamp: row.timestamp, verdict_id: row.verdict_id, label: value }] }
          }).then(answer => {
            if (!ctx.alive()) return;
            const skipped = answer && Array.isArray(answer.skipped) ? answer.skipped : [];
            if (skipped.length) {
              if (before) state.labels[verdict] = before; else delete state.labels[verdict];
              state.error = 'That label was not saved: ' + (skipped[0].reason || 'skipped') + '.';
              draw();
            }
          }, err => {
            if (!ctx.alive()) return;
            if (before) state.labels[verdict] = before; else delete state.labels[verdict];
            fail(err, 'label');
          });
        },
        'try-readiness': () => {
          state.busy = true; state.error = null; draw();
          return T.api('/api/projects/' + encodeURIComponent(state.project) + query({ days: 1 })).then(detail => {
            if (!ctx.alive()) return;
            state.busy = false;
            state.readiness = (detail && detail.readiness) || { rules: [] };
            state.selected = new Set((state.readiness.rules || []).filter(r => r.state === 'ready' || r.state === 'quiet').map(r => r.rule_key));
            state.step = 4;
            draw();
          }, err => { if (ctx.alive()) fail(err, 'readiness'); });
        },
        'try-toggle': el => {
          const key = el.getAttribute('data-rule');
          if (el.checked) state.selected.add(key); else state.selected.delete(key);
          draw();
        },
        'try-promote': () => {
          const all = ((state.readiness && state.readiness.rules) || []).map(r => r.rule_key);
          const enforce = all.filter(key => state.selected.has(key));
          state.observing = all.filter(key => !state.selected.has(key));
          state.busy = true; state.error = null; draw();
          return T.api('/api/projects/' + encodeURIComponent(state.project) + '/promote', { method: 'POST', body: { enforce } })
            .then(() => planReplay(enforce))
            .then(plan => {
              if (!ctx.alive()) return;
              state.busy = false;
              state.replay = plan || { rule: enforce[0] || '', tool_name: 'Write', action_type: 'FILE_WRITE', arguments: { file_path: 'src/domain/acme_order.py', content: 'import boto3\n' } };
              state.step = 5;
              draw();
            }, err => { if (ctx.alive()) fail(err, 'promote'); });
        },
        'try-send': () => {
          const plan = state.replay;
          state.busy = true; state.error = null; draw();
          // The contract asks for a hook's call that still carries the model's
          // sentence, so the visitor reads why it was refused. Never a sim-
          // session: those always enforce whatever the project's stage, so the
          // refusal would prove nothing about the promotion the visitor just made.
          return T.api('/evaluate-tool-call', {
            method: 'POST',
            body: {
              session_id: T.newSessionId('try-'),
              project_name: state.project,
              developer: 'anonymous',
              developer_id: 'anonymous',
              tool_name: plan.tool_name,
              action_type: plan.action_type,
              arguments: plan.arguments,
              agent: 'claude-code',
              origin: 'hook',
              explain: true,
              hook_mode: 'managed'
            }
          }).then(body => {
            if (!ctx.alive()) return;
            state.busy = false;
            state.result = body || {};
            state.step = 6;
            draw();
          }, err => { if (ctx.alive()) fail(err, 'send'); });
        },
        'try-restart': () => {
          try { localStorage.removeItem(TRY_STORAGE); } catch (err) { /* nothing stored */ }
          Object.assign(state, { step: 1, project: '', seeded: null, readiness: null, observed: [], labels: {}, selected: null, result: null, replay: null, error: null, busy: false, resume: null });
          draw();
        }
      });

      draw();
      T.whoami().then(who => {
        if (!ctx.alive()) return;
        state.who = who;
        if (who && who.reads_public === false) draw();
      });
      Dash.tryState = state;
    }

    // ------------------------------------------------------------- proof

    // The proof page: the snapshot scripts/build_proof.py wrote, shown as it
    // was written. Every figure names its source and when it was taken, and a
    // section the snapshot does not carry reads "not measured yet", never a
    // zero. Nothing here computes a figure of its own.
    const PROOF_SUB = 'What Threefold has been measured to do, and how. Every figure names where it came from and when it was taken.';

    function notMeasured(what, next) {
      return html`<div class="rounded-xl border border-dashed border-gray-800 p-4 space-y-1" data-state="empty">
        <p class="text-sm font-semibold text-gray-200">Not measured yet</p>
        <p class="text-xs text-gray-400">${what}</p>
        ${next ? html`<p class="text-xs text-gray-500">${next}</p>` : ''}
      </div>`;
    }

    function when(value) {
      return typeof value === 'string' && value ? html`<time datetime="${value}">${value}</time>` : 'not recorded';
    }

    function provenance(source, snapshot) {
      return html`<p class="text-[11px] text-gray-500 mt-4 pt-3 border-t border-gray-800" data-proof="provenance">
        Source: <span class="text-gray-400">${source || 'not recorded'}</span> · Snapshot taken: <span class="text-gray-400">${when(snapshot)}</span>
      </p>`;
    }

    // A rate as k of n, or what stands in for one when nothing was measured.
    function share(stat) {
      if (!stat || typeof stat.n !== 'number' || stat.n <= 0) return html`<span class="text-gray-500">not measured</span>`;
      const interval = typeof stat.ci_low === 'number' && typeof stat.ci_high === 'number'
        ? html`<span class="block text-[10px] text-gray-500">95% CI ${pct(stat.ci_low)}–${pct(stat.ci_high)}</span>` : '';
      return html`<span class="font-mono">${pct(stat.rate)}</span> <span class="text-gray-500">(${num(stat.k)}/${num(stat.n)})</span>${interval}`;
    }

    function ratio(value) {
      return typeof value === 'number' && isFinite(value) ? value.toFixed(2) + '×' : '—';
    }

    function overheadCell(condition) {
      if (condition.condition === 'none') return html`<span class="text-gray-500">the baseline</span>`;
      const o = condition.overhead;
      if (!o || ['turns', 'seconds', 'cost'].every(k => typeof o[k] !== 'number')) return html`<span class="text-gray-500">not measured</span>`;
      return html`<span class="font-mono text-[11px]">turns ${ratio(o.turns)} · time ${ratio(o.seconds)} · cost ${ratio(o.cost)}</span>`;
    }

    function correctedCell(condition) {
      const sc = condition.self_correction || {};
      if (typeof condition.n !== 'number' || condition.n <= 0) return html`<span class="text-gray-500">not measured</span>`;
      if (!sc.refused_runs) return html`<span class="text-gray-500">no run was refused</span>`;
      return html`<span class="font-mono">${pct(sc.rate)}</span> <span class="text-gray-500">(${num(sc.self_corrected)}/${num(sc.refused_runs)} refused runs)</span>`;
    }

    // Every series side by side: one row per run of the matrix, never pooled,
    // because two models or two task families answer different questions.
    function seriesComparison(list) {
      const cell = (b, name, field) => {
        const c = (Array.isArray(b.conditions) ? b.conditions : []).find(x => x && x.condition === name);
        return c && c[field] ? share(c[field]) : html`<span class="text-gray-500">not measured</span>`;
      };
      return card('The benchmark, every series', 'Violation landed per condition, and whether the tests still passed with Threefold enforcing. Each row is one run of the matrix.', html`
        <div class="tf-scroll-x"><table class="tf-table" data-proof="series">
          <thead><tr>
            <th scope="col">Series</th><th scope="col">No guidance</th><th scope="col">Rules in CLAUDE.md or AGENTS.md</th>
            <th scope="col">Threefold enforcing</th><th scope="col">Tests passed, Threefold</th>
          </tr></thead>
          <tbody>${list.map(b => html`<tr data-series="${b.family || 'standard'}">
            <th scope="row" class="font-normal text-gray-200 min-w-[13rem]">${b.label || (Array.isArray(b.models) ? b.models.join(', ') : 'series')}</th>
            <td>${cell(b, 'none', 'violation')}</td>
            <td>${cell(b, 'prompt', 'violation')}</td>
            <td>${cell(b, 'threefold', 'violation')}</td>
            <td>${cell(b, 'threefold', 'completion')}</td>
          </tr>`)}</tbody>
        </table></div>
        <p class="text-[11px] text-gray-500 mt-2">In the pressure series the developer's own prompt asks for the forbidden shortcut. Where Threefold's tests-passed rate is lower, the agent stopped and reported rather than land the violation.</p>`, 'min-w-0');
    }

    // The proof's lead: how often a governed violation landed, per series and
    // condition, every series on the same 0 to 100% scale. One small chart a
    // series, never pooled, with each bar named where it is drawn; the table
    // after it holds every figure with its interval. A pilot series is left
    // out: it proves the harness, not a rate.
    const CONDITION_ORDER = ['none', 'prompt', 'threefold'];
    const CONDITION_COLORS = { threefold: T.CATEGORICAL[0], prompt: T.CATEGORICAL[1], none: T.CATEGORICAL[2] };
    // The chart names a condition by what it is for every agent: the rules go
    // to CLAUDE.md for Claude Code and to AGENTS.md for Codex, so one name
    // taken from one series would be wrong for the other. Each series' own
    // card below keeps the snapshot's words.
    const CONDITION_NAMES = { none: 'No guidance', prompt: 'Rules in CLAUDE.md or AGENTS.md', threefold: 'Threefold enforcing' };
    function conditionName(c, name) { return CONDITION_NAMES[name] || (c && c.label) || name; }

    function conditionOf(b, name) {

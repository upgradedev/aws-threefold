Outputs:
  DistributionDomainName:
    Description: The distribution's host name. The site is https://<this>/.
    Value: !GetAtt Distribution.DomainName
  DistributionId:
    Description: The distribution publish_web.py invalidates after every upload.
    Value: !Ref Distribution
  WebBucketName:
    Description: The private bucket publish_web.py uploads the pages to.
    Value: !Ref WebBucket
  WebAclArn:
    Description: The web ACL attached to the distribution.
    Value: !GetAtt WebAcl.Arn
  SiteUrl:
    Description: The public URL of the site, with the trailing slash.
    Value: !Sub 'https://${Distribution.DomainName}/'
  LogBucketName:
    Condition: LogsOn
    Description: Where CloudFront writes its standard access logs.
    Value: !Ref LogBucket

            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ViewerHostFunction.FunctionMetadata.FunctionARN
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          # Every JSON document is the function's: /sessions.json, /insights.json,
          # /openapi.json and /docs/openapi.json. The function serves the OpenAPI
          # document deployed with its code, so swagger.html reads that one rather
          # than a copy published beside it, and the bucket holds no JSON (the
          # contract's assets are .js, .css and .svg; /assets/* above comes first
          # regardless). One pattern for four routes keeps room under the quota.
          - PathPattern: /*.json
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad

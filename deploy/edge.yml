AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Threefold edge - one CloudFront distribution in front of the existing stack:
  the pages from a private S3 bucket behind origin access control, every API
  path to the existing HTTP API, security headers on every response, and an
  AWS WAF web ACL. Deployed in us-east-1, the only region a CloudFront web ACL
  can live in.

# Why a second template rather than more resources in template.yml: the API
# stack lives in eu-west-1, and a web ACL with CLOUDFRONT scope can only be
# created in us-east-1. A stack cannot create resources in another region, so
# the edge is its own stack, in us-east-1, pointed at the API by its domain
# name. Deleting it leaves the API and its public URL exactly as they were.

Parameters:
  ApiDomainName:
    Type: String
    AllowedPattern: '^[a-z0-9]+\.execute-api\.[a-z0-9-]+\.amazonaws\.com$'
    ConstraintDescription: >-
      The host name of an API Gateway endpoint, for example
      abc123def4.execute-api.eu-west-1.amazonaws.com, with no scheme and no path.
    Description: >-
      The existing HTTP API's own host name, from the ApiEndpoint output of the
      API stack with the scheme and the stage removed. It has no default so an
      edge can never be deployed in front of the wrong API by omission.

  ApiStagePath:
    Type: String
    Default: /prod
    AllowedPattern: '^/[A-Za-z0-9_-]+$'
    Description: >-
      The API Gateway stage, as the origin path CloudFront prefixes to every API
      request. The function strips the stage before routing, so /api/overview at
      the edge reaches the same route as /prod/api/overview on the API's own URL.
      A request that already carries the stage (/prod/...) is passed through to
      the API unprefixed, so a URL copied from the API with only its host changed
      still works.

  EdgeOriginSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    MaxLength: 256
    AllowedPattern: '^[A-Za-z0-9_-]+$'
    ConstraintDescription: >-
      at least 32 URL-safe characters (letters, digits, '-' and '_'), such as
      the output of Python's secrets.token_urlsafe(48)
    Description: >-
      The value the edge sends to the API in the X-Threefold-Edge origin
      header, and the same value as the API stack's EdgeOriginSecret. The
      function believes the viewer's address and host name only on a request
      that carries it, because the API's own URL stays public and any caller
      can send those headers. It has no default, so an edge never deploys
      without one. NoEcho keeps it out of describe-stacks; the distribution's
      own configuration still holds it, readable by anyone in the account
      allowed cloudfront:GetDistributionConfig.

  RateLimitPerFiveMinutes:
    Type: Number
    Default: 1000
    MinValue: 100
    MaxValue: 2000000000
    Description: >-
      Requests one IP address may send in any five minutes before the web ACL
      answers 429. The hook sends one request per tool call; the default was
      chosen, not measured, as about three requests a second sustained. It is
      counted per address, so a team behind one NAT shares it, and an IPv6
      client can spread its calls over the addresses of its prefix.

  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Description: >-
      Which edge locations serve the site. PriceClass_100 (North America and
      Europe) is the cheapest and covers where the API itself runs.

  AccessLogs:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      Whether CloudFront writes standard access logs to a separate bucket, kept
      for 30 days. They cost only their storage and are the record of who
      reached the site, which the WAF metrics alone do not give.

Rules:
  # A web ACL for CloudFront is refused in any other region, but only after
  # the bucket and the policies have been created. Asserting the region first
  # fails the deploy before anything exists.
  CloudFrontScopeLivesInUsEast1:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', us-east-1]
        AssertDescription: >-
          Deploy this template in us-east-1: a WAF web ACL with CLOUDFRONT scope
          cannot be created anywhere else.

Conditions:
  LogsOn: !Equals [!Ref AccessLogs, 'true']

Resources:
  # --- the pages ------------------------------------------------------------------

  # Private: nothing in this bucket is reachable except through the distribution.
  # There is no website configuration, no public ACL and no public policy; the
  # only reader the policy names is this one distribution, signed with origin
  # access control. It is retained on stack deletion because a versioned bucket
  # with objects cannot be deleted by CloudFormation, and a failed delete would
  # leave the whole edge half torn down.
  WebBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # Every publish overwrites the pages in place. Versioning keeps the page a
      # visitor saw yesterday, so a bad publish is undone by restoring a version
      # rather than by rebuilding it, and the lifecycle rule stops the old
      # versions from accumulating forever.
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireReplacedPages
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # GetObject only, for this distribution only. Without s3:ListBucket a
          # missing page answers 403 rather than 404, which is deliberate: the
          # alternative, a distribution-wide custom error page, would also replace
          # the API's own RFC 7807 problem documents, which are 403s and 404s too.
          - Sid: CloudFrontReadsThroughOriginAccessControl
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: DenyAnythingButTls
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt WebBucket.Arn
              - !Sub '${WebBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # Origin access control, not the legacy origin access identity: it signs every
  # request with SigV4, works with SSE-KMS should the bucket ever move to it, and
  # the bucket policy can name the one distribution allowed to read rather than a
  # principal any distribution in the account could be given.
  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-web'
        Description: Signs the distribution's reads from the pages bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # --- access logs (optional) -------------------------------------------------------

  # Standard logging writes through an ACL grant to the log delivery account, so
  # this bucket, unlike the pages bucket, keeps ACLs enabled with the bucket owner
  # preferred as the owner of what is written. That is why the logs have a bucket
  # of their own: the pages bucket stays ACL-free.
  LogBucket:
    Type: AWS::S3::Bucket
    Condition: LogsOn
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAccessLogs
            Status: Enabled
            ExpirationInDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  LogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: LogsOn
    Properties:
      Bucket: !Ref LogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyAnythingButTls
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt LogBucket.Arn
              - !Sub '${LogBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # --- caching ----------------------------------------------------------------------

  # Pages change with every publish and name no content hash, so the edge keeps
  # them briefly. publish_web.py also invalidates on every publish; the short TTL
  # is what bounds staleness if an invalidation is ever skipped.
  PageCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-pages'
        Comment: Pages, a minute at the edge, invalidated on every publish.
        MinTTL: 0
        DefaultTTL: 60
        MaxTTL: 300
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  # Scripts, styles and images are kept for up to a year at the edge. Every
  # publish invalidates them, and the Cache-Control publish_web.py sets keeps the
  # browser's own copy short, because the file names carry no content hash.
  AssetCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-assets'
        Comment: Assets, up to a year at the edge, invalidated on every publish.
        MinTTL: 0
        DefaultTTL: 86400
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  # --- response headers ---------------------------------------------------------------

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security-headers'
        Comment: HSTS, nosniff, no framing, no referrer, and a CSP the pages satisfy.
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: false
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          # Nothing this service answers reads the Referer, so none is sent: a
          # page URL can carry a session id or a project name in its query.
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
          # The narrowest policy the current pages run under, read off the pages:
          # - script-src: the pages' own inline scripts and inline onclick
          #   handlers ('unsafe-inline'; hashes cannot cover handlers without
          #   'unsafe-hashes' and would break on every edit of a page), the
          #   Tailwind Play CDN at the exact version the pages pin, and Swagger UI
          #   at the exact version swagger.html pins. No 'unsafe-eval'.
          # - style-src: inline style blocks and the style elements the Tailwind
          #   Play CDN writes at runtime ('unsafe-inline'), the Google Fonts
          #   stylesheet the pages @import, and Swagger UI's stylesheet.
          # - font-src: the font files that stylesheet points at.
          # - img-src: data: URIs, which Swagger UI's stylesheet uses for icons.
          # - connect-src: this origin, where every page's fetch goes once the
          #   base path is empty, and the API's own URL, which is the server
          #   swagger.html's "Try it out" sends to. A sidecar URL typed into a
          #   page's API field that is neither is refused by the browser, on
          #   purpose: that page may hold the operator key.
          # - everything else, including framing, plugins, <base> and form
          #   submission, is refused.
          ContentSecurityPolicy:
            ContentSecurityPolicy: !Sub >-
              default-src 'none';
              script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com/3.4.17 https://unpkg.com/swagger-ui-dist@5.33.0/;
              style-src 'self' 'unsafe-inline' https://fonts.googleapis.com/css2 https://unpkg.com/swagger-ui-dist@5.33.0/;
              font-src https://fonts.gstatic.com/s/;
              img-src 'self' data:;
              connect-src 'self' https://${ApiDomainName};
              base-uri 'none';
              form-action 'none';
              frame-ancestors 'none';
              object-src 'none'
            Override: true

  # --- the firewall -------------------------------------------------------------------

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${AWS::StackName}-web-acl'
      Description: Threefold edge - reputation, rate, and managed rule groups.
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      # The rate limit answers with a problem document, as the function does, so
      # a page's error handler has a title and a detail to show rather than an
      # empty body. WAF sets the Content-Type from ContentType (application/json;
      # it refuses a content-type among the custom headers), and it cannot fill
      # in the request's path, so the document has no "instance". The managed
      # groups' blocks keep WAF's own bare 403: a group takes a custom response
      # only through an override of each of its rules by name, which a rule AWS
      # adds to the group later would silently miss.
      CustomResponseBodies:
        RateLimited:
          ContentType: APPLICATION_JSON
          Content: >-
            {"type": "urn:threefold:error:edge-rate-limit-exceeded",
            "title": "Too Many Requests",
            "status": 429,
            "detail": "This address sent more requests in five minutes than the edge accepts from one address. Retry after the number of seconds in Retry-After.",
            "error": "This address sent more requests in five minutes than the edge accepts from one address. Retry after the number of seconds in Retry-After."}
      # Metric names carry the stack name, so a second edge in the account (one in
      # front of the private stack, say) reports under its own names instead of
      # adding into this one's.
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${AWS::StackName}-web-acl'
      Rules:
        - Name: AmazonIpReputationList
          Priority: 0
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub '${AWS::StackName}-ip-reputation'

        # 429, not the default 403. The hook reads every other 4xx as the service
        # refusing the call, and for a 401 or 403 adds that the developer should
        # check THREEFOLD_API_KEY, while it reads 429 as "could not be judged": the
        # call then goes to the agent's own permissions, or is refused where
        # THREEFOLD_FAIL_CLOSED=1. A limit is a capacity signal, and should read as
        # one, not as a refusal with a hint about the key.
        - Name: RateLimitPerIp
          Priority: 1
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
                CustomResponseBodyKey: RateLimited
                ResponseHeaders:
                  - Name: retry-after
                    Value: '300'
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimitPerFiveMinutes
              EvaluationWindowSec: 300
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub '${AWS::StackName}-rate-limit'

        # The body rules count rather than block. Every POST body this service
        # receives is an agent's tool call or a rule under test, and carrying
        # source code is its job: a Write of an HTML page holds <script>, a Java
        # class can name java.lang.Runtime, a command can hold ../ or a URL with an
        # IP address, and a file over 8 KB is ordinary. A block answers 403, which
        # the hook reads as the service refusing the call, so these rules would
        # refuse legitimate writes with a reason about the API key. The function
        # parses the body as JSON and never renders or runs it, caps it at 1 MB
        # itself, and judging its content is the gate's work, not the firewall's.
        # The rules still count, so their metrics and samples show what they saw,
        # and every other rule on headers, the URI and the query string still
        # blocks, with one exception below.
        #
        # RestrictedExtensions_URIPATH also counts. It refuses paths ending in
        # extensions "unsafe to read or run", a list AWS does not publish, and it
        # exists for configuration files a server exposes by accident. This service
        # hands out Python files and a zip on purpose: /install.py, the hook at
        # /hooks/threefold_hook.py and /claude_code_hook.py, and the bundle under
        # /dist/. Were .py or .zip on that list, the one-command install would
        # answer 403 at the edge with no error anywhere in either stack. Counting
        # it everywhere gives up little: any other path reaches either the bucket,
        # which holds only the published pages, or a function that answers only
        # its own routes.
        - Name: CommonRuleSet
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              RuleActionOverrides:
                - Name: SizeRestrictions_BODY
                  ActionToUse:
                    Count: {}
                - Name: CrossSiteScripting_BODY
                  ActionToUse:
                    Count: {}
                - Name: GenericLFI_BODY
                  ActionToUse:
                    Count: {}
                - Name: GenericRFI_BODY
                  ActionToUse:
                    Count: {}
                - Name: EC2MetaDataSSRF_BODY
                  ActionToUse:
                    Count: {}
                - Name: RestrictedExtensions_URIPATH
                  ActionToUse:
                    Count: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub '${AWS::StackName}-common'

        - Name: KnownBadInputsRuleSet
          Priority: 3
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
              RuleActionOverrides:
                - Name: JavaDeserializationRCE_BODY
                  ActionToUse:
                    Count: {}
                - Name: Log4JRCE_BODY
                  ActionToUse:
                    Count: {}
                - Name: ReactJSRCE_BODY
                  ActionToUse:
                    Count: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub '${AWS::StackName}-known-bad-inputs'

  # --- the viewer's host name ----------------------------------------------------------

  # The origin request replaces Host with the API's own name, which API Gateway
  # needs to route the request, so the function would otherwise never learn the
  # name the viewer used. This copies it into X-Threefold-Viewer-Host, which the
  # function writes into /install.py, the manifest and sign-in links in place of
  # its own address. The function believes it only alongside the edge secret.
  # Host is read-only in a viewer request, but readable; the new header's name
  # is on neither the disallowed nor the read-only list of the CloudFront
  # developer guide's "Restrictions on all edge functions", and starts with no
  # prefix reserved there (X-Amz-Cf-, X-Edge-). A viewer who sends the header
  # themselves has it replaced, or removed when there is no Host to copy, so
  # only this function's value reaches the API. Plain text rather than !Sub, so
  # nothing in the code is taken for a CloudFormation variable.
  ViewerHostFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-viewer-host'
      AutoPublish: true
      FunctionConfig:
        Comment: Copies the viewer's Host into X-Threefold-Viewer-Host for the API.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
            var request = event.request;
            var host = request.headers.host;
            if (host && host.value) {
                request.headers['x-threefold-viewer-host'] = { value: host.value };
            } else {
                delete request.headers['x-threefold-viewer-host'];
            }
            return request;
        }

  # --- the distribution -----------------------------------------------------------------

  # One origin for the pages and the API twice. The default behavior serves the
  # bucket, so a path nobody listed never reaches the function; every path the
  # function answers is listed below, each under CachingDisabled with every
  # viewer header except Host (API Gateway answers only to its own Host, and the
  # function reads Authorization, X-API-Key and the query string). No custom
  # error responses: they apply to every origin, and would replace the API's
  # problem documents with a page.
  #
  # Path shapes. CloudFront normalizes a path before it matches a behavior,
  # collapsing repeated slashes and resolving dot segments, and then sends the
  # raw path on, which the function collapses the same way. So //status (a
  # base URL ending in "/" plus "/status") matches /status here and reaches the
  # function as /prod//status. A trailing slash is not normalized, so the
  # routes without a file extension are written as prefixes (/status*,
  # /evaluate-tool-call*): the function strips the slash, and the edge has to
  # route what the function accepts. And a URL that keeps the API's documented
  # /prod/ and swaps only the host, the likeliest way anyone points a hook at
  # this edge, is sent whole to the second API origin, which has no origin
  # path, so /prod/evaluate-tool-call reaches the function as it does on the
  # API's own URL, pages under /prod/ included.
  #
  # What still falls through: a POST to any other path lands on the bucket's
  # GET-only default, and CloudFront answers it 403. The hook reads a 403 as the
  # service refusing the call and tells the developer to check their API key,
  # so a hook pointed at a path this edge does not route refuses every tool
  # call, with or without THREEFOLD_FAIL_CLOSED. Point hooks at the SiteUrl
  # output or at <SiteUrl>prod/, the two forms routed here.
  #
  # Who is calling. Behind the edge the function sees a CloudFront server as the
  # caller and the API's own name as the host, which broke two things: the
  # function's per-address rate limit (2 a second, a burst of 60 per container)
  # put every viewer of one edge server in one bucket, so one busy client got
  # everyone's hook calls answered 429 and left unjudged; and /install.py, the
  # manifest and sign-in links named the API's URL, so a hook installed from the
  # edge talked to the API directly, past this web ACL. Three things fix it:
  # - Both API origins send X-Threefold-Edge with EdgeOriginSecret, the same
  #   value as the API stack's parameter of that name. The CloudFront developer
  #   guide ("Add custom headers to origin requests") says that when the viewer
  #   request already holds a header of that name, CloudFront overwrites its
  #   value, so a viewer cannot present a secret of their own through the edge,
  #   and without the secret a caller of the API's public URL cannot either.
  # - CloudFront-Viewer-Address carries the viewer's address and port. The
  #   managed AllViewerExceptHostHeader policy forwards it: its page ("Use
  #   managed origin request policies") says the policy adds "all device type
  #   and viewer location headers", and "Add CloudFront request headers" lists
  #   CloudFront-Viewer-Address under "Viewer location headers". A custom policy
  #   could not do better: "all viewer headers" there includes Host, which API
  #   Gateway refuses, and an include-list would have to name every header the
  #   routes read, a miss being silent.
  # - ViewerHostFunction, on every API behavior, copies the viewer's Host into
  #   X-Threefold-Viewer-Host before the origin request policy applies, so the
  #   same policy forwards it as a viewer header. The bucket's behaviors do not
  #   run it: S3 reads no header of ours, and each run is billed.
  # The function believes the viewer's address and host only on a request that
  # carries the secret, so the API's own URL keeps working exactly as before.
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Threefold - pages from S3, API paths to the HTTP API
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        DefaultRootObject: index.html
        WebACLId: !GetAtt WebAcl.Arn
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        Logging: !If
          - LogsOn
          - Bucket: !GetAtt LogBucket.DomainName
            Prefix: cloudfront/
            IncludeCookies: false
          - !Ref AWS::NoValue
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          # The API at its root: CloudFront prefixes the stage, so /status at the
          # edge is /prod/status at the API.
          - Id: api
            DomainName: !Ref ApiDomainName
            OriginPath: !Ref ApiStagePath
            OriginCustomHeaders:
              - HeaderName: X-Threefold-Edge
                HeaderValue: !Ref EdgeOriginSecret
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              HTTPSPort: 443
              OriginSSLProtocols:
                - TLSv1.2
              OriginReadTimeout: 30
              OriginKeepaliveTimeout: 5
          # The same API with no origin path, for requests that already carry
          # the stage: /prod/status at the edge is /prod/status at the API. It
          # sends the secret too, or a hook pointed at <SiteUrl>prod/ would be
          # counted as the edge server rather than as itself.
          - Id: api-stage
            DomainName: !Ref ApiDomainName
            OriginCustomHeaders:
              - HeaderName: X-Threefold-Edge
                HeaderValue: !Ref EdgeOriginSecret
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              HTTPSPort: 443
              OriginSSLProtocols:
                - TLSv1.2
              OriginReadTimeout: 30
              OriginKeepaliveTimeout: 5
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref PageCachePolicy
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
        # CloudFront matches these in order and takes the first. The API paths
        # use https-only rather than a redirect, because a redirected POST arrives
        # as a GET in most clients and the call would silently not be judged.
        # 4135ea2d-... is the managed CachingDisabled cache policy and
        # b689b0a8-... the managed AllViewerExceptHostHeader origin request policy.
        # Every API behavior runs ViewerHostFunction on the viewer request.
        # 21 behaviors and the default: the tests hold the list to 25 in all.
        CacheBehaviors:
          - PathPattern: /assets/*
            TargetOriginId: web
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref AssetCachePolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          # First among the API behaviors, so that /*.json below never takes a
          # staged path such as /prod/openapi.json and prefixes the stage twice.
          - PathPattern: !Sub '${ApiStagePath}/*'

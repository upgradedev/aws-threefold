name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Gate, tests, template
    runs-on: ubuntu-latest
    env:
      # Keeps the suite off the network. Without it the repository and Bedrock
      # clients would pick up whatever credentials the runner has and the tests
      # would pass or fail for reasons unrelated to the change.
      THREEFOLD_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov bandit

      - name: Threefold governance gate on its own source
        # The product, run against the repository that ships it. Its negative
        # controls live in tests/security/test_the_gate_still_bites.py, so a gate
        # that has been quietened rather than fixed fails the suite below.
        run: python scripts/pre-commit-gate.py --scan-dir src/

      - name: Static analysis
        run: bandit -r src/ -ll -ii

      - name: Tests
        run: python -m pytest tests -v --cov=src/threefold --cov-report=term-missing

      - name: Validate the CloudFormation template
        run: |
          pip install aws-sam-cli
          sam validate --template deploy/template.yml --lint

name: Threefold CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    name: Hermetic Tests, Clean-Room & Pre-Commit Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov bandit

      - name: Run Threefold Pre-Commit Security Gate
        run: |
          python scripts/pre-commit-gate.py --scan-dir src/

      - name: Security & Clean-Room Invariant Scan
        run: |
          bandit -r src/ -ll -ii
          python -m pytest tests/security -v

      - name: Execute Full Test Pyramid
        run: |
          python -m pytest tests -v --cov=src/threefold --cov-report=term-missing

      - name: Validate AWS SAM Template
        run: |
          pip install aws-sam-cli
          sam validate --template deploy/template.yml --lint
